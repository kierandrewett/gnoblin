name: Nightly

# Builds the nightly channel of the package repositories from main, once a day, when main has moved since the channel
# was last built. The packages come from the release pipeline (release.yml with nightly: true), so a nightly goes through
# the same legs as a release: prefix build, pkgsmith packages, package suite and graphical VM test for every target and
# architecture, then the release gate. Its repository stage signs and publishes the nightly channel from the gate's
# publish set, and its issues job raises, updates and closes the issues of failing releases (not a dry run). A nightly
# never creates a GitHub release and never touches the stable channel.
# design/package-repositories.md has the version rules (0.1.13~nightly.<date>.<count>.g<commit>).

on:
  schedule:
    # 02:17 UTC, off the hour so it does not queue with every other scheduled job on GitHub.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the published nightly was built from this commit.
        type: boolean
        default: false
      restore_run:
        description: >-
          Repairs a published nightly manifest that lists files the host lost. The id of an earlier run (a number)
          whose repository artifact (repository-gnoblin-nightly-*) has the files. A lost file is restored from it only
          when its sha256 equals the manifest's; a file that is not restorable still fails the run. Forces a build. Use
          once, then leave empty.
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    # Skips the hour-long build when nothing changed. A repository without a published nightly yet builds. Without a
    # publication destination (REPO_DESTINATION) there is nothing to publish to, so the scheduled run does nothing; a
    # manual run still builds, to try the pipeline.
    if: ${{ vars.REPO_DESTINATION != '' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the published nightly
        id: check
        env:
          REPO_URL: ${{ vars.REPO_URL || 'https://repo.gnoblin.org' }}
          FORCE: ${{ inputs.force }}
          RESTORE_RUN: ${{ inputs.restore_run }}
        run: |
          if [ "$FORCE" = true ] || [ -n "$RESTORE_RUN" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/pkgrepo needs-build --project gnoblin --channel nightly --url "$REPO_URL" \
            --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  nightly:
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    uses: ./.github/workflows/release.yml
    with:
      nightly: true
      restore_run: ${{ inputs.restore_run }}
    # The release workflow asks for write access in its publish job, which a nightly never runs, and in its issues
    # job, which a nightly runs. A called workflow cannot ask for more than its caller grants, so the caller grants
    # the same.
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
      actions: read # the repository stage downloads the artifact of restore_run
    secrets: inherit
