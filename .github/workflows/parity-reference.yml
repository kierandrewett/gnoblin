name: Parity reference

# The parity scenarios (tests/parity/scenarios) against the Rust candidate, against stock Mutter 51 on its headless
# backend and against the legacy C Gnoblin on its patched Mutter, with one expectation per step. `rust.yml` runs the same
# scenarios without the reference rows, which it skips for want of a launcher; this job builds both references and
# requires every `mutter51` and `mutter-gnoblin` row to have run, so a difference between the compositors is a red job
# and the report is kept as an artifact. The legacy tree is `main` at the commit pinned below (the Rust branch dropped
# starter files the patched Mutter still installs, so it cannot build the legacy product). The pin keeps a run
# comparable with the stored reports; move it on purpose and store a new report with the move.
# design/rust-compositor.md, "The parity harness".

on:
  push:
    paths:
      - "crates/gnoblin-parity/**"
      - "crates/gnoblin-wayland/**"
      - "crates/gnoblin-compositor/**"
      - "crates/gnoblin-backend/**"
      - "tests/parity/**"
      - "scripts/parity-mutter51"
      - "scripts/parity-mutter-gnoblin"
      - "scripts/parity-gnoblinctl"
      - "scripts/parity-launcher-lib.sh"
      - "scripts/parity-proc-shim.c"
      - "scripts/parity-reference.sh"
      - "scripts/ci-install-system-libraries.sh"
      - "Cargo.lock"
      - ".github/workflows/parity-reference.yml"
  pull_request:
    paths:
      - "crates/gnoblin-parity/**"
      - "crates/gnoblin-wayland/**"
      - "crates/gnoblin-compositor/**"
      - "crates/gnoblin-backend/**"
      - "tests/parity/**"
      - "scripts/parity-mutter51"
      - "scripts/parity-mutter-gnoblin"
      - "scripts/parity-gnoblinctl"
      - "scripts/parity-launcher-lib.sh"
      - "scripts/parity-proc-shim.c"
      - "scripts/parity-reference.sh"
      - "scripts/ci-install-system-libraries.sh"
      - "Cargo.lock"
      - ".github/workflows/parity-reference.yml"
  schedule:
    - cron: "42 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  parity:
    name: Scenarios on the candidate, Mutter 51 and the legacy Gnoblin
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 150
    steps:
      - name: Install checkout and cache tools
        run: dnf -y install git tar zstd gzip
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install the build dependencies
        run: scripts/parity-reference.sh deps
      # Mutter 51.0 takes most of the job to build and changes only when the tag or the build recipe does.
      - name: Restore the Mutter build
        uses: actions/cache@v4
        with:
          path: /opt/mutter51
          key: mutter51-${{ hashFiles('scripts/parity-reference.sh') }}
      - name: Build Mutter 51
        run: scripts/parity-reference.sh mutter
      # The legacy product is built from `main` at the pinned commit (the one the stored contract recording and
      # reports were made from), with its pinned Mutter and its patch series, as a release of it is.
      - name: Check out the legacy Gnoblin
        id: legacy
        uses: actions/checkout@v4
        with:
          ref: 5bb523e9c84c99002306c7f666b5d55316fea7b2
          path: legacy-src
          submodules: recursive
          fetch-depth: 1
      - name: Restore the legacy Gnoblin build
        uses: actions/cache@v4
        with:
          path: /opt/gnoblin
          key: gnoblin-legacy-${{ steps.legacy.outputs.commit }}-${{ hashFiles('scripts/parity-reference.sh') }}
      - name: Build the legacy Gnoblin
        env:
          GNOBLIN_PARITY_GNOBLIN_SOURCE: ${{ github.workspace }}/legacy-src
        run: scripts/parity-reference.sh gnoblin
      - name: Run the scenarios against all three
        run: scripts/parity-reference.sh run parity-report.txt
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.txt
          if-no-files-found: ignore
