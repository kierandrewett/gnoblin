name: Rust workspace

on:
  push:
    paths:
      - "crates/**"
      - "extensions/**"
      - "xtask/**"
      - "data/**"
      - "examples/**"
      - "docs/**"
      - "design/docs-parity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "deny.toml"
      - ".cargo/**"
      - "tests/parity/**"
      - "tests/modular/**"
      - "scripts/ci-install-system-libraries.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "extensions/**"
      - "xtask/**"
      - "data/**"
      - "examples/**"
      - "docs/**"
      - "design/docs-parity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "deny.toml"
      - ".cargo/**"
      - "tests/parity/**"
      - "tests/modular/**"
      - "scripts/ci-install-system-libraries.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: Build, lint, test, dependency rules, duplicate types, documented names, licences
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      # A bare ubuntu-latest runner has none of the system libraries the crates link or probe (libudev, libinput, libseat,
      # libpipewire and others), so the build fails without this step. The list lives in the script and nowhere else.
      - name: Install Node.js for JavaScript checks
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      # rust-toolchain.toml selects the compiler and installs rustfmt and
      # clippy, so every runner builds with the same toolchain as a developer.
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the workspace gate
        run: just workspace-ci
      # The binary links `libgnoblin-core.so.1` and the install tree has a layout (design/modular-framework.md section 11):
      # NEEDED once, the core's SONAME and exports, the run path that finds the core with no LD_LIBRARY_PATH, a shell that
      # needs the core only, the links, header and pkg-config file. The workspace gate above built the debug tree this reuses.
      - name: Check the core link and the install layout
        run: just dist-check

  # The XR extension is a workspace of its own (`extensions/gnoblin-xr`, own lockfile), so the job above does not
  # build, lint, test or check its licences. `just ci` runs both gates. Its `wayland-sys` probes `libwayland` with
  # pkg-config, so it installs the same list as the jobs around it.
  extensions:
    name: Extension workspace format, lint, test, licences
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the extension workspace gate
        run: just ext-ci

  # The PipeWire export (`gnoblin-pipewire-export`) and the capture end-to-end tests start a private `pipewire` daemon
  # in a runtime directory of their own, link a producer to a consumer the way a session manager would, and read the
  # frames that arrive (design/pipewire-capture-spike.md). The workspace job runs them too, among everything else; this
  # job runs only them, so a PipeWire failure is named by the job and shows within minutes. They fail, never skip,
  # when the daemon is missing.
  pipewire:
    name: PipeWire export against a private daemon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # The libraries the crates link and the `pipewire` daemon, from the one list.
      - name: Install system libraries
        run: |
          scripts/ci-install-system-libraries.sh
          pipewire --version
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the private-daemon tests
        run: just pipewire-test

  # The minimum supported Rust version (`rust-version` in Cargo.toml), checked with
  # the exact pinned dependencies. The version here must equal `msrv_toolchain` in
  # the justfile.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Rust links the system libraries `scripts/ci-install-system-libraries.sh` installs; a bare runner has none of them.
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check the workspace with the minimum supported toolchain
        run: just msrv

  # Phase 1 acceptance of the modular framework (design/modular-framework.md, M1.8, M2.11): the core builds with no std code and
  # its no-provider behaviour holds. The stock providers are std's, registered through `provider_register`; this job builds the
  # compositor and the core library, fails if a std crate is in their dependency tree, and runs the suites of a session with no
  # provider (`NullWm`, and `no-ui` for a portal request).
  core-only:
    name: Core without the std providers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # The libraries the crates link and the `pipewire` daemon, from the one list.
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Build the core with no std crate and test a session with no provider
        run: just core-only

  # The ABI contract (design/modular-framework.md 5.8, M8.3): `abi.lock` of the core and of std against their declarations, and the
  # golden shells of example 12 (`tests/modular/golden`) against their recorded hashes and dynamic facts. The workspace gate runs it
  # too; this job is the one that names it, and it starts after a few minutes of xtask compile instead of the whole workspace.
  abi:
    name: ABI lock and golden shells
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Check the ABI locks and the golden shells
        run: just abi-check

  # The modular framework's sessions (M8.1 to M8.4): the shipped binary on a headless backend with shells of every language, the 18
  # examples of design/modular-framework.md section 12 run for real (`just modular` lists the suites), the duplicate-core and
  # retired-library checks, the golden shells of example 12 run unchanged on libraries of the next ABI minor and refused by a core of
  # another major, and the lifetime tests of the core and std crates. It stages the core and std libraries first (the binary finds them
  # through its run path).
  modular:
    name: Modular framework sessions and the ABI upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the modular sessions
        run: just modular

  # Which system packages the -sys crates need, against the CI install list (`cargo xtask native-libs`). The workspace gate runs it too;
  # this job names it and fails after an xtask compile instead of the whole workspace.
  native-libs:
    name: Native libraries named by the CI install list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Check the system packages of the -sys crates
        run: just native-libs

  # The SDK generator against the schema catalog and the ABI crates (`cargo xtask gen-sdks --check`): it renders twice to the same bytes, the
  # Python it writes compiles, and the public surface and the C ABI match their locks. Nothing generated is committed; a build renders it.
  gen-sdks:
    name: SDK generator is sound
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Check the generated SDKs
        run: just gen-sdks-check
