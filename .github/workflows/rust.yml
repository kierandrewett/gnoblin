name: Rust workspace

on:
  push:
    paths:
      - "crates/**"
      - "extensions/**"
      - "xtask/**"
      - "data/js/**"
      - "docs/**"
      - "design/docs-parity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "deny.toml"
      - ".cargo/**"
      - "tests/parity/**"
      - "scripts/ci-install-system-libraries.sh"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "extensions/**"
      - "xtask/**"
      - "data/js/**"
      - "docs/**"
      - "design/docs-parity/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "justfile"
      - "deny.toml"
      - ".cargo/**"
      - "tests/parity/**"
      - "scripts/ci-install-system-libraries.sh"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  workspace:
    name: Build, lint, test, dependency rules, duplicate types, documented names, licences
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      # A bare ubuntu-latest runner has none of the system libraries the crates link or probe (libudev, libinput, libseat,
      # libpipewire and others), so the build fails without this step. The list lives in the script and nowhere else.
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      # rust-toolchain.toml selects the compiler and installs rustfmt and
      # clippy, so every runner builds with the same toolchain as a developer.
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the workspace gate
        run: just workspace-ci

  # The XR extension is a workspace of its own (`extensions/gnoblin-xr`, own lockfile), so the job above does not
  # build, lint, test or check its licences. `just ci` runs both gates. Its `wayland-sys` probes `libwayland` with
  # pkg-config, so it installs the same list as the jobs around it.
  extensions:
    name: Extension workspace format, lint, test, licences
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the extension workspace gate
        run: just ext-ci

  # The PipeWire export (`gnoblin-pipewire-export`) and the capture end-to-end tests start a private `pipewire` daemon
  # in a runtime directory of their own, link a producer to a consumer the way a session manager would, and read the
  # frames that arrive (design/pipewire-capture-spike.md). The workspace job runs them too, among everything else; this
  # job runs only them, so a PipeWire failure is named by the job and shows within minutes. They fail, never skip,
  # when the daemon is missing.
  pipewire:
    name: PipeWire export against a private daemon
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # The libraries the crates link and the `pipewire` daemon, from the one list.
      - name: Install system libraries
        run: |
          scripts/ci-install-system-libraries.sh
          pipewire --version
      - name: Show the pinned toolchain
        run: rustup show active-toolchain
      - name: Run the private-daemon tests
        run: just pipewire-test

  # The minimum supported Rust version (`rust-version` in Cargo.toml), checked with
  # the exact pinned dependencies. The version here must equal `msrv_toolchain` in
  # the justfile.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tree without submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      # Rust links the system libraries `scripts/ci-install-system-libraries.sh` installs; a bare runner has none of them.
      - name: Install system libraries
        run: scripts/ci-install-system-libraries.sh
      - name: Install the minimum supported toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check the workspace with the minimum supported toolchain
        run: just msrv
