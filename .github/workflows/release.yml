name: Release

# Stages (design/release-pipeline.md has the reasoning):
#   1. source      builds the source bundle once and uploads it as an artifact
#   2. packages    builds the bundle into a prefix on Fedora, writes the rpm, deb, Arch and tar packages from it with
#                  pkgsmith, and installs them on clean Fedora, openSUSE, Arch and Debian systems (packages.yml)
#   3. publish     attaches every asset to one release, checksums and attests them, and makes the release public
#   4. repository  builds the signed RPM, APT and pacman repository from the packages of stage 2 and uploads it
#
# Only a release tag publishes. A push to main, a pull request that changes the pipeline, and a manual run without a
# tag run stages 1 and 2 as a dry run and publish nothing. The assets stay as workflow artifacts for 30 days.

on:
  push:
    branches:
      - main
    paths:
      - ".github/release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/packages.yml"
      - ".github/workflows/package-repository.yml"
      - ".github/actions/**"
      - "pkgsmith/**"
      - "scripts/apply-nightly-version.py"
      - "scripts/build-packages.sh"
      - "scripts/build-prefix.sh"
      - "scripts/build-release-assets.sh"
      - "scripts/check-package-install.sh"
      - "scripts/check-release-tag.sh"
      - "scripts/install-fedora-build-deps.sh"
      - "scripts/install-pkgsmith.sh"
      - "scripts/make-tarball.sh"
      - "scripts/pkgrepo/**"
      - "scripts/pkgsmith.ref"
      - "scripts/publish-github-release.sh"
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "patches/**"
      - "subprojects/**"
    tags:
      - "gnoblin-v*"
  pull_request:
    paths:
      - ".github/release.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/packages.yml"
      - ".github/workflows/package-repository.yml"
      - ".github/actions/**"
      - "pkgsmith/**"
      - "scripts/apply-nightly-version.py"
      - "scripts/build-packages.sh"
      - "scripts/build-prefix.sh"
      - "scripts/build-release-assets.sh"
      - "scripts/check-package-install.sh"
      - "scripts/check-release-tag.sh"
      - "scripts/install-fedora-build-deps.sh"
      - "scripts/install-pkgsmith.sh"
      - "scripts/make-tarball.sh"
      - "scripts/pkgrepo/**"
      - "scripts/pkgsmith.ref"
      - "scripts/publish-github-release.sh"
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "patches/**"
      - "subprojects/**"
  workflow_call:
    inputs:
      nightly:
        description: Build the nightly channel. The version becomes a pre-release of the next release, the GitHub release is skipped, and the repository stage publishes the nightly channel.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, or to repair while it is a draft. Leave empty for a dry run.
        required: false
        type: string
      dry_run:
        description: Build and test every package and install gate, and publish nothing. Leave the tag empty.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One run per release tag at a time. The publish job checks whether the release is a draft, then uploads, then makes it
# public. Two runs for the same tag could interleave, so the second waits for the first. A pull request run replaces
# the previous run for the same pull request. Runs for other refs, such as a dry run on a branch, do not wait.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  source:
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
      ref: ${{ steps.meta.outputs.ref }}
      commit: ${{ steps.meta.outputs.commit }}
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 30
    env:
      GIT_COMMITTER_NAME: Gnoblin release automation
      GIT_COMMITTER_EMAIL: release@gnoblin.local
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install release tools
        run: dnf -y install cmake gh git meson patch tar xz
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Name this build
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$INPUT_DRY_RUN" = true ] && [ -n "$INPUT_TAG" ]; then
            echo "A dry run builds the selected ref. Leave the tag empty." >&2
            exit 1
          fi
          if [ "$INPUT_DRY_RUN" = true ] || [ "$EVENT_NAME" = pull_request ]; then
            release_tag="commit-${GITHUB_SHA:0:12}"
            is_release=false
          elif [ -n "$INPUT_TAG" ]; then
            release_tag="$INPUT_TAG"
            is_release=true
          elif [[ "$GITHUB_REF" == refs/tags/gnoblin-v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            is_release=true
          else
            # A push to main builds and tests everything and publishes nothing. Only a release tag publishes.
            release_tag="commit-${GITHUB_SHA:0:12}"
            is_release=false
          fi
          printf 'release_tag=%s\nis_release=%s\nref=%s\ncommit=%s\n' "$release_tag" "$is_release" \
            "${INPUT_TAG:-$GITHUB_REF}" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set checkout ownership
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Stop early if the release is already public
        # Publishing refuses to change a public release. Saying so here saves the hour that the package jobs take.
        if: steps.meta.outputs.is_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          state="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$RELEASE_TAG\") | .isDraft")"
          if [ "$state" = false ]; then
            echo "$RELEASE_TAG is already published. To repair it, turn it back into a draft first:" >&2
            echo "  gh release edit $RELEASE_TAG --draft" >&2
            exit 1
          fi
      - name: Fetch pinned sources, retrying GNOME GitLab errors
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/checkout-submodules-with-retry.sh
      - name: Fetch upstream release tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'
      - name: Validate release tag
        if: steps.meta.outputs.is_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          ./scripts/check-release-tag.sh "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Give the checkout a nightly version
        # The nightly channel needs versions that sort between the last release and the next one (0.1.13~nightly...).
        # The version goes into the source bundle of this throw-away checkout and is committed there, because the bundle
        # archives HEAD. pkgsmith spells it for each package format. scripts/pkgrepo works out the number.
        id: nightly
        if: inputs.nightly
        run: |
          version="$(python3 scripts/pkgrepo version --git . --tag-prefix gnoblin-v \
            --tree-version "$(python3 scripts/gnoblin-version.py get version)" --format semver)"
          python3 scripts/apply-nightly-version.py "$version"
          git -c user.name="$GIT_COMMITTER_NAME" -c user.email="$GIT_COMMITTER_EMAIL" \
            commit --all --message "Nightly version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the source bundle
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          IS_RELEASE: ${{ steps.meta.outputs.is_release }}
        run: |
          tag_arguments=()
          if [ "$IS_RELEASE" = true ]; then tag_arguments=(--release-tag "$RELEASE_TAG"); fi
          ./build.sh package --output "$RUNNER_TEMP/gnoblin-release" "${tag_arguments[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: gnoblin-${{ steps.meta.outputs.release_tag }}
          path: ${{ runner.temp }}/gnoblin-release/*
          if-no-files-found: error
          retention-days: 30

  packages:
    needs: source
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.source.outputs.ref }}
      release_tag: ${{ needs.source.outputs.release_tag }}

  publish:
    # Runs only for a release tag, and only when every package job and install gate passed. A failed gate leaves no
    # release behind. The run keeps the built assets as artifacts, so the fix needs a new run, not a rebuild by hand.
    if: needs.source.outputs.is_release == 'true'
    needs: [source, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: gnoblin-${{ needs.source.outputs.release_tag }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-${{ needs.source.outputs.release_tag }}-*
          path: release-assets
          merge-multiple: true
      - name: Give the Arch packages names that GitHub keeps
        # The epoch makes an Arch file name hold a colon (gnoblin-1:0.1.13-1-x86_64.pkg.tar.zst). GitHub turns it into a
        # dot when it stores an asset, which would no longer match SHA256SUMS. pacman reads the name from the package.
        run: |
          cd release-assets
          for file in *:*; do
            [ -e "$file" ] || continue
            mv -- "$file" "${file//:/.}"
          done
      - name: Checksum every release asset
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
            LC_ALL=C sort | xargs sha256sum > SHA256SUMS
      - name: Attest build provenance
        # Lets a user check that an asset came from this workflow: gh attestation verify FILE --repo OWNER/REPO
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - name: Write the release notes header
        run: |
          version="${RELEASE_TAG#gnoblin-v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Gnoblin $version targets GNOME $(python3 scripts/gnoblin-version.py get gnomeVersion).

          ## Install

          - Fedora 45: use the signed repository (docs/package-repositories.md), or download the \`fc45\` RPMs and run \`dnf install ./gnoblin-*.fc45.*.rpm\`.
          - openSUSE Tumbleweed: use the signed repository, or install the \`tumbleweed\` RPMs with \`zypper install\`.
          - Arch Linux: use the signed repository, or download the packages and run \`pacman -U\`.
          - Debian testing: use the signed repository, or download the \`.deb\` files and run \`apt install ./gnoblin_*.deb\`.
          - Alpine edge: download the \`.apk\` files and run \`apk add --allow-untrusted ./gnoblin-*.apk\`.
          - Any other glibc system: the \`.tar.xz\` packages hold the same files. Extract one with \`tar -C / -xf\` as root.
          - Other systems: build the source bundle with \`make\`.

          Instructions: https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs/installation.md

          ## Verify the download

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify FILE --repo $GITHUB_REPOSITORY
          \`\`\`
          EOF
      - name: Publish the release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish-github-release.sh "$RELEASE_TAG" release-assets "$RUNNER_TEMP/release-notes.md"

  repository:
    # The signed package repository. A release tag publishes the stable channel and the nightly run the nightly channel.
    # Any other run builds and verifies the tree with a throw-away key, so a change that breaks it is seen before a tag.
    needs: [source, packages, publish]
    if: >-
      ${{ !cancelled() && needs.source.result == 'success' && needs.packages.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    uses: ./.github/workflows/package-repository.yml
    with:
      channel: ${{ inputs.nightly && 'nightly' || 'stable' }}
      ref: ${{ needs.source.outputs.ref }}
      release_tag: ${{ needs.source.outputs.release_tag }}
      source_commit: ${{ needs.source.outputs.commit }}
      publish: ${{ needs.source.outputs.is_release == 'true' || inputs.nightly == true }}
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      REPO_RSYNC_KEY: ${{ secrets.REPO_RSYNC_KEY }}
      REPO_RSYNC_KNOWN_HOSTS: ${{ secrets.REPO_RSYNC_KNOWN_HOSTS }}
      REPO_PAGES_TOKEN: ${{ secrets.REPO_PAGES_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
