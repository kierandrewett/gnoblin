name: Release

on:
  push:
    tags:
      - "gnoblin-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or repair
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  source-packages:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GIT_COMMITTER_NAME: Gnoblin release automation
      GIT_COMMITTER_EMAIL: release@gnoblin.local
    steps:
      - name: Install release tools
        run: dnf -y install adwaita-cursor-theme git hyprcursor inkscape meson patch rpm-build rpmdevtools tar xz
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Set checkout ownership
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Fetch upstream release tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'
      - name: Validate release tag
        run: |
          ./scripts/check-release-tag.sh "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Build release assets
        run: ./scripts/build-release-assets.sh "$RUNNER_TEMP/gnoblin-release" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: gnoblin-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/gnoblin-release/*
          if-no-files-found: error
          retention-days: 30

  debian-packages:
    uses: ./.github/workflows/deb.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      release_build: true

  opensuse-package:
    uses: ./.github/workflows/opensuse-rpm.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  nixos-release:
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  arch-package:
    needs: [source-packages, debian-packages]
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install stock GNOME and package build requirements
        run: |
          pacman -Syu --noconfirm --needed \
            adwaita-cursors base-devel brightnessctl cmake desktop-file-utils egl-wayland \
            evolution-data-server gettext git glib2-devel gobject-introspection \
            gjs gnome-session gnome-settings-daemon gnome-shell gtk4 hyprcursor \
            inkscape libadwaita libdisplay-info libei libinput libxkbcommon \
            libxkbfile libxres lua meson ninja patchelf pipewire pkgconf playerctl \
            python python-docutils python-packaging sassc sysprof wayland wireplumber \
            xdg-desktop-portal-gnome xorg-xwayland
          pacman -Q gnome-shell mutter > /tmp/stock-gnome-packages
          pacman -Qo /usr/bin/gnome-shell > /tmp/stock-gnome-shell-owner
          pacman -Qo /usr/bin/mutter > /tmp/stock-mutter-owner
      - uses: actions/download-artifact@v4
        with:
          name: gnoblin-${{ env.RELEASE_TAG }}
          path: release-assets
      - name: Build the release Arch package from its local source asset
        run: |
          source_archive="$(find release-assets -maxdepth 1 -name 'gnoblin-*-arch-source.tar.xz' -print -quit)"
          pkgbuild="$(find release-assets -maxdepth 1 -name 'gnoblin-*.PKGBUILD' -print -quit)"
          test -n "$source_archive"
          test -n "$pkgbuild"
          mkdir -p build
          cp "$source_archive" build/
          cp "$pkgbuild" build/PKGBUILD
          # The released recipe has a remote source URL. This gate changes only
          # that URL fragment so makepkg consumes the just-built local asset;
          # the filename and checked SHA-256 remain unchanged.
          sed -i -E 's#::https://github.com/kierandrewett/gnoblin/releases/download/gnoblin-v\$pkgver/[^\"]+##' build/PKGBUILD
          useradd -m builder
          chown -R builder:builder build
          runuser -u builder -- bash -lc 'cd "$1" && makepkg --noconfirm --cleanbuild' bash "$GITHUB_WORKSPACE/build"
      - name: Install beside stock GNOME, then remove Gnoblin
        run: |
          package="$(find build -maxdepth 1 -name 'gnoblin-*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          pacman -Q gnoblin
          test -x /usr/lib/gnoblin/bin/gnome-shell
          test -x /usr/lib/gnoblin/bin/gnoblin-session
          test -x /usr/bin/gnoblinctl
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          test -f /usr/share/gnome-session/sessions/gnoblin.session
          cmp /tmp/stock-gnome-packages <(pacman -Q gnome-shell mutter)
          cmp /tmp/stock-gnome-shell-owner <(pacman -Qo /usr/bin/gnome-shell)
          cmp /tmp/stock-mutter-owner <(pacman -Qo /usr/bin/mutter)
          pacman -R --noconfirm gnoblin
          ! pacman -Q gnoblin
          cmp /tmp/stock-gnome-packages <(pacman -Q gnome-shell mutter)
          cmp /tmp/stock-gnome-shell-owner <(pacman -Qo /usr/bin/gnome-shell)
          cmp /tmp/stock-mutter-owner <(pacman -Qo /usr/bin/mutter)
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package-${{ env.RELEASE_TAG }}
          path: build/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
      - name: Remove package cache
        if: always()
        run: pacman -Scc --noconfirm

  github-release:
    needs:
      - source-packages
      - debian-packages
      - arch-package
      - opensuse-package
      - nixos-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gnoblin-${{ env.RELEASE_TAG }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: debian-package-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: arch-package-${{ env.RELEASE_TAG }}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: opensuse-tumbleweed-rpms
          path: opensuse-rpms
          merge-multiple: true
      - name: Flatten openSUSE RPM assets
        run: |
          mkdir -p release-assets
          mapfile -d '' rpms < <(
            find opensuse-rpms -type f -name '*.rpm' \
              ! -name '*-debuginfo-*' ! -name '*-debugsource-*' -print0
          )
          (("${#rpms[@]}" > 0))
          for rpm in "${rpms[@]}"; do
            cp -- "$rpm" "release-assets/opensuse-$(basename "$rpm")"
          done
      - name: Checksum all release assets
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
            LC_ALL=C sort | xargs sha256sum > SHA256SUMS
      - name: Publish or repair GitHub release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft \
              --title "Gnoblin ${RELEASE_TAG#gnoblin-v}"
          fi

  apt-repository:
    needs: github-release
    uses: ./.github/workflows/apt-repository.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  copr-repository:
    needs: github-release
    uses: ./.github/workflows/copr.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}

  publish-release:
    needs: [apt-repository, copr-repository]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Publish after distro repositories are updated
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
