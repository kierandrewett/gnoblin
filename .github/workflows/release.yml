name: Release

on:
  push:
    tags:
      - "gnoblin-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or repair
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  source-packages:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GIT_COMMITTER_NAME: Gnoblin release automation
      GIT_COMMITTER_EMAIL: release@gnoblin.local
    steps:
      - name: Install release tools
        run: dnf -y install adwaita-cursor-theme git hyprcursor inkscape meson patch rpm-build rpmdevtools tar xz
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive
      - name: Set checkout ownership
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Fetch upstream release tags
        run: git submodule foreach --recursive 'git fetch --force --tags origin'
      - name: Validate release tag
        run: |
          ./scripts/check-release-tag.sh "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - name: Build release assets
        run: ./scripts/build-release-assets.sh "$RUNNER_TEMP/gnoblin-release" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: gnoblin-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/gnoblin-release/*
          if-no-files-found: error
          retention-days: 30

  debian-packages:
    uses: ./.github/workflows/deb.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  github-release:
    needs: [source-packages, debian-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gnoblin-${{ env.RELEASE_TAG }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: release-assets
          merge-multiple: true
      - name: Checksum all release assets
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' |
            LC_ALL=C sort | xargs sha256sum > SHA256SUMS
      - name: Publish or repair GitHub release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Gnoblin $(./scripts/gnoblin-version.py get version) (GNOME $(./scripts/gnoblin-version.py get gnomeVersion))"
          fi

  apt-repository:
    needs: github-release
    uses: ./.github/workflows/apt-repository.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  copr-repository:
    needs: github-release
    uses: ./.github/workflows/copr.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
