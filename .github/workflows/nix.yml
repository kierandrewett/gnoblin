name: Nix compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  # GNOME's private runtime build is long. Keep the pinned package evidence
  # alive while newer commits queue, instead of cancelling it mid-build.
  cancel-in-progress: false

jobs:
  evaluate-target-channels:
    name: Evaluate NixOS ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [nixos_25_05, nixos_25_11, nixos_26_05, nixos_unstable]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Evaluate package and dependency requirements
        run: |
          nix eval --json ".#lib.nixChannelEvaluations.x86_64-linux.${{ matrix.channel }}" > "$RUNNER_TEMP/channel.json"
          jq -e '.buildBlockers | type == "array"' "$RUNNER_TEMP/channel.json"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: cachix/install-nix-action@v31
      - name: Check packages available from compatible pinned channels
        run: nix flake check -L
