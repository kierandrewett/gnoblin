name: Nix source of truth

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  # GNOME's private runtime build is long. Keep the pinned package evidence
  # alive while newer commits queue, instead of cancelling it mid-build.
  cancel-in-progress: false

jobs:
  evaluate-target-channels:
    name: Evaluate NixOS ${{ matrix.channel.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel:
          - attribute: nixos_25_05
            release: "25.05"
            package_evaluates: "false"
            module_evaluates: "false"
            evaluation_blocker: '"missing-libglycin"'
            build_blockers: '["missing-libglycin","glib-below-2.86","gjs-below-1.85.90","wayland-below-1.26","wayland-protocols-below-1.48","libinput-below-1.30"]'
          - attribute: nixos_25_11
            release: "25.11"
            package_evaluates: "true"
            module_evaluates: "true"
            evaluation_blocker: "null"
            build_blockers: '["wayland-below-1.26","wayland-protocols-below-1.48","libinput-below-1.30"]'
          - attribute: nixos_26_05
            release: "26.05"
            package_evaluates: "true"
            module_evaluates: "true"
            evaluation_blocker: "null"
            build_blockers: '["wayland-below-1.26"]'
          - attribute: nixos_unstable
            release: unstable
            package_evaluates: "true"
            module_evaluates: "true"
            evaluation_blocker: "null"
            build_blockers: "[]"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Validate recorded package, module, and host-floor status
        run: |
          package_status="$(nix eval --json ".#lib.nixChannelEvaluations.x86_64-linux.${{ matrix.channel.attribute }}.package.evaluates")"
          module_status="$(nix eval --json ".#lib.nixChannelEvaluations.x86_64-linux.${{ matrix.channel.attribute }}.module.evaluates")"
          evaluation_blocker="$(nix eval --json ".#lib.nixChannelEvaluations.x86_64-linux.${{ matrix.channel.attribute }}.evaluationBlocker")"
          build_blockers="$(nix eval --json ".#lib.nixChannelEvaluations.x86_64-linux.${{ matrix.channel.attribute }}.buildBlockers")"
          test "$package_status" = "${{ matrix.channel.package_evaluates }}"
          test "$module_status" = "${{ matrix.channel.module_evaluates }}"
          test "$evaluation_blocker" = '${{ matrix.channel.evaluation_blocker }}'
          test "$build_blockers" = '${{ matrix.channel.build_blockers }}'
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check generated native package adapters
        run: ./scripts/sync-package-manifest.py check
      - name: Build and test the Nix package and module
        run: nix flake check -L
