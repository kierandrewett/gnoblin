name: Package repository

# Builds the signed RPM, APT, pacman and Alpine repository of one Gnoblin channel from the packages the release pipeline
# built, checks it the way a client would, and uploads it. The release workflow calls this after its package jobs: the
# stable channel after a release tag publishes, the nightly channel from nightly.yml. design/package-repositories.md has
# the layout, the version rules and the key handling.
#
# Without the signing key (a fork, a pull request, a run before the key exists) the tree is built and verified with a
# throw-away key, kept as a workflow artifact, and not uploaded. Publication needs all of:
#   secret   REPO_GPG_PRIVATE_KEY          the ASCII-armoured private key of the repository
#   secret   REPO_GPG_PASSPHRASE           its passphrase, when it has one
#   secret   REPO_APK_PRIVATE_KEY          the PEM RSA private key, without a passphrase, that signs the Alpine index. Without
#                                          it a publication leaves the Alpine packages out, and a run that publishes
#                                          nothing signs them with a throw-away key
#   variable REPO_BACKEND                  rsync, s3 or pages
#   variable REPO_DESTINATION              user@host:/srv/repo, s3://bucket/prefix, or the Git URL of the Pages repository
#   variable REPO_URL                      the public base URL, https://repo.gnoblin.org by default
# and, per back end, the secrets REPO_RSYNC_KEY and REPO_RSYNC_KNOWN_HOSTS, or AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY (variable AWS_ENDPOINT_URL for R2 or MinIO), or REPO_PAGES_TOKEN.

on:
  workflow_call:
    inputs:
      channel:
        description: stable or nightly
        type: string
        required: true
      ref:
        description: Branch, tag or commit that holds the repository tool
        type: string
        required: true
      release_tag:
        description: Release tag, or commit-<sha> for a dry run. Names the package artifacts of the release workflow.
        type: string
        required: true
      source_commit:
        description: The commit the packages were built from; recorded in the manifest and compared by the nightly check
        type: string
        required: true
      publish:
        description: Upload the tree after it verifies. Nothing is uploaded without the secrets and variables above.
        type: boolean
        default: false
    secrets:
      REPO_GPG_PRIVATE_KEY:
        required: false
      REPO_GPG_PASSPHRASE:
        required: false
      REPO_APK_PRIVATE_KEY:
        required: false
      REPO_RSYNC_KEY:
        required: false
      REPO_RSYNC_KNOWN_HOSTS:
        required: false
      REPO_PAGES_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

# One publication per channel at a time: the job pulls the published channel, merges and uploads, so two runs at once
# could drop each other's packages.
concurrency:
  group: package-repository-gnoblin-${{ inputs.channel }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repository:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    env:
      PROJECT: gnoblin
      CHANNEL: ${{ inputs.channel }}
      # The Debian suite the deb packages are for. The prefix needs glibc 2.43, glib 2.86, GTK 4.20 and the other
      # libraries of design/package-repositories.md, which Debian testing has. scripts/check-package-install.sh
      # installs them there.
      DEB_SUITE: forky
      REPO_URL: ${{ vars.REPO_URL || 'https://repo.gnoblin.org' }}
    steps:
      - name: Install Git for the checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install the repository tools
        run: ./scripts/pkgrepo/container/install-tools.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-${{ inputs.release_tag }}-*
          path: raw
      - name: Arrange the packages by distribution
        run: |
          mkdir -p packages/arch packages/opensuse/tumbleweed "packages/deb/$DEB_SUITE"
          # Each architecture is an artifact of its own (raw/packages-<tag>-amd64/), and the files that do not depend on
          # the architecture are in both. They are copied one at a time, because one cp with the same name twice stops.
          # One build of each package serves two RPM trees. The Fedora files carry the release in their release tag
          # (.fc45), so the release is not written down twice. openSUSE Tumbleweed has no number.
          mapfile -t fedora < <(find raw -type f -name '*.fc[0-9]*.rpm' ! -name '*.src.rpm')
          test "${#fedora[@]}" -gt 0
          fedora_release="$(rpm -qp --nosignature --queryformat '%{RELEASE}\n' "${fedora[0]}" | sed -n 's/.*\.fc\([0-9][0-9]*\)$/\1/p')"
          test -n "$fedora_release"
          mkdir -p "packages/fedora/$fedora_release"
          for file in "${fedora[@]}"; do cp -f -- "$file" "packages/fedora/$fedora_release/"; done
          find raw -type f -name '*.tumbleweed.*.rpm' -exec cp -f -t packages/opensuse/tumbleweed {} \;
          find raw -type f -name '*.deb' -exec cp -f -t "packages/deb/$DEB_SUITE" {} \;
          find raw -type f -name '*.pkg.tar.zst' -exec cp -f -t packages/arch {} \;
          find packages -type f | sort
      - name: Signing key
        id: key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_APK_PRIVATE_KEY: ${{ secrets.REPO_APK_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          if [ -n "$REPO_GPG_PRIVATE_KEY" ]; then
            python3 scripts/pkgrepo key-import --gnupg-home "$GNUPGHOME"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::REPO_GPG_PRIVATE_KEY is not set. The tree is signed with a throw-away key and is not published."
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --pinentry-mode loopback --passphrase '' \
              --quick-generate-key 'throw-away repository check <noreply@example.invalid>' rsa3072 sign 1d
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          # Alpine's apk checks an RSA signature of the index against a public key, not GnuPG's. A publication carries the
          # Alpine packages only when that key is the real one: a throw-away key would make every run a new key to trust.
          if [ -n "$REPO_APK_PRIVATE_KEY" ]; then
            echo "apk=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$REPO_GPG_PRIVATE_KEY" ]; then
            echo "::notice::REPO_APK_PRIVATE_KEY is not set. The Alpine packages are left out of this repository."
            echo "apk=false" >> "$GITHUB_OUTPUT"
          else
            openssl genrsa -out "$RUNNER_TEMP/apk-throwaway.pem" 3072
            echo "REPO_APK_KEY_FILE=$RUNNER_TEMP/apk-throwaway.pem" >> "$GITHUB_ENV"
            echo "apk=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Arrange the Alpine packages
        if: steps.key.outputs.apk == 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # The packages of one architecture have the same file names as those of the other, so the architecture is the
          # artifact they came from. The builds are for Alpine edge.
          for pair in amd64:x86_64 arm64:aarch64; do
            directory="packages/alpine/edge/${pair#*:}"
            mkdir -p "$directory"
            find "raw/packages-$RELEASE_TAG-${pair%%:*}" -type f -name '*.apk' -exec cp -f -t "$directory" {} \;
            test -n "$(ls -A "$directory")"
          done
          find packages/alpine -type f | sort
      - name: Pull the published channel
        env:
          PUBLISH: ${{ inputs.publish }}
          KEY_IS_REAL: ${{ steps.key.outputs.real }}
          BACKEND: ${{ vars.REPO_BACKEND }}
          DESTINATION: ${{ vars.REPO_DESTINATION }}
        run: |
          # A run that publishes must reach the published channel: building without its packages and uploading
          # would remove them. A run that publishes nothing may build without them when the host is not there yet.
          unreachable=()
          if [ "$PUBLISH" != true ] || [ "$KEY_IS_REAL" != true ] || [ -z "$BACKEND" ] || [ -z "$DESTINATION" ]; then
            unreachable=(--allow-unreachable)
          fi
          python3 scripts/pkgrepo pull --project "$PROJECT" --channel "$CHANNEL" --url "$REPO_URL" \
            --output existing --allow-missing "${unreachable[@]}"
      - name: Build and verify the signed tree
        env:
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          REPO_APK_PRIVATE_KEY: ${{ secrets.REPO_APK_PRIVATE_KEY }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # The key of the Alpine index is in the secret, or in a file when the run uses a throw-away key.
          apk_key=()
          if [ -n "${REPO_APK_KEY_FILE:-}" ]; then apk_key=(--apk-key "$REPO_APK_KEY_FILE"); fi
          # A dry run uploads nothing, so a release that is already published must not stop it. Only a run that
          # publishes keeps the rule that stable files are never replaced.
          replace=()
          if [ "$PUBLISH" != true ]; then replace=(--replace-stable); fi
          python3 scripts/pkgrepo build --project "$PROJECT" --channel "$CHANNEL" --packages packages \
            --output tree --existing existing --gnupg-home "$GNUPGHOME" --base-url "$REPO_URL" \
            --source-commit "$SOURCE_COMMIT" --source-ref "$GITHUB_REF_NAME" "${apk_key[@]}" "${replace[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: repository-${{ env.PROJECT }}-${{ inputs.channel }}-${{ inputs.release_tag }}
          path: tree
          retention-days: 14
          if-no-files-found: error
      - name: Publish
        if: inputs.publish && steps.key.outputs.real == 'true' && vars.REPO_BACKEND != '' && vars.REPO_DESTINATION != ''
        env:
          BACKEND: ${{ vars.REPO_BACKEND }}
          DESTINATION: ${{ vars.REPO_DESTINATION }}
          REPO_RSYNC_KEY: ${{ secrets.REPO_RSYNC_KEY }}
          REPO_RSYNC_KNOWN_HOSTS: ${{ secrets.REPO_RSYNC_KNOWN_HOSTS }}
          REPO_PAGES_TOKEN: ${{ secrets.REPO_PAGES_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
          # The first nightly publish uploaded the large Arch package and then failed on its small .sig with
          # SignatureDoesNotMatch, on aws-cli 2.23.6. Since 2.23 the CLI adds a CRC32 trailer checksum to uploads, which
          # S3-compatible stores such as R2 are known to reject. "when_required" turns that off.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 scripts/pkgrepo publish --project "$PROJECT" --channel "$CHANNEL" --tree tree --backend "$BACKEND" \
            --destination "$DESTINATION" --previous existing --apply
      - name: Say why nothing was published
        if: inputs.publish && !(steps.key.outputs.real == 'true' && vars.REPO_BACKEND != '' && vars.REPO_DESTINATION != '')
        run: echo "::notice::Not published. Set REPO_GPG_PRIVATE_KEY, REPO_BACKEND and REPO_DESTINATION (see the header of this workflow)."
