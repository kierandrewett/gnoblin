name: Gnoblin compositor fuzz

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      trace_first_critical:
        description: Stop in GDB before a zero-refcount GVariant unref (diagnostic run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lifecycle-fuzz:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 120
    outputs:
      failed_seeds: ${{ steps.lifecycle-fuzz.outputs.failed_seeds }}
    steps:
      - name: Install checkout and session tools
        run: dnf -y install git dbus-daemon

      - name: Install GDB for a critical backtrace
        if: ${{ inputs.trace_first_critical }}
        run: dnf -y install gdb

      - name: Checkout Gnoblin and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start test system D-Bus
        run: ./tests/start-system-bus.sh

      - name: Build a private Gnoblin prefix
        run: |
          source scripts/build-deps.sh
          source /etc/os-release
          install_build_dependencies "$(build_distro_family "$ID" "${ID_LIKE:-}")" true false
          useradd --create-home builder
          builder_uid="$(id -u builder)"
          install -d -o builder -g builder -m 700 "/run/user/$builder_uid"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            ./build.sh

      - name: Test Lua runtime GVariant ownership
        run: ./tests/test-config.sh

      - name: Verify lifecycle session runtime
        run: |
          command -v dbus-run-session
          test -x "$GITHUB_WORKSPACE/install/bin/gnome-shell"

      - name: Verify Gnoblin JavaScript resources
        run: python3 tests/gnome-shell-overlay-resources.test.py

      - name: Run deterministic plan checks
        run: runuser -u builder -- python3 tests/window-lifecycle-fuzz.test.py

      - name: Test Lua shell event registration
        run: |
          runuser -u builder -- env \
            GNOBLIN_PREFIX="$GITHUB_WORKSPACE/install" \
            GNOBLIN_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -c 'cd "$GNOBLIN_WORKSPACE"; source src/tools/gnoblin-env.sh; gnoblin_env_apply "$GNOBLIN_PREFIX"; gjs -m tests/lua-event-filter-test.js'

      - name: Run varied seeded lifecycle sessions
        id: lifecycle-fuzz
        run: |
          builder_uid="$(id -u builder)"
          artifact_root="$RUNNER_TEMP/lifecycle-fuzz"
          install -d -o builder -g builder -m 700 "$artifact_root"
          seeds=(1738 99173 4294967 20260924)
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            seeds+=(51 1701 884422 314159265)
          fi
          if [[ "${{ inputs.trace_first_critical }}" == "true" ]]; then
            seeds=(1738)
          fi
          failed_seeds=()
          for seed in "${seeds[@]}"; do
            artifact_dir="$artifact_root/seed-$seed"
            install -d -o builder -g builder -m 700 "$artifact_dir"
            extra_monitor=()
            if ((seed % 2 == 0)); then
              extra_monitor=(EXTRA_MONITOR=1024x768)
            fi
            echo "== lifecycle seed $seed =="
            debug_env=()
            if [[ "${{ inputs.trace_first_critical }}" == "true" && "$seed" == "1738" ]]; then
              debug_env+=(GNOBLIN_TEST_GDB_CRITICALS=1)
            fi
            if ! runuser -u builder -- env \
              "${debug_env[@]}" \
              XDG_RUNTIME_DIR="/run/user/$builder_uid" \
              "${extra_monitor[@]}" \
              GNOBLIN_PREFIX="$GITHUB_WORKSPACE/install" \
              python3 tests/window-lifecycle-fuzz.py \
                --seed "$seed" --steps 250 --timeout 900 \
                --artifact-dir "$artifact_dir"; then
              failed_seeds+=("$seed")
            fi
          done
          failed_seed_output="$(IFS=,; echo "${failed_seeds[*]}")"
          printf 'failed_seeds=%s\n' "$failed_seed_output" >> "$GITHUB_OUTPUT"
          if ((${#failed_seeds[@]} > 0)); then
            exit 1
          fi

      - name: Keep fuzz plans, logs and crash reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnoblin-lifecycle-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-fuzz/
          if-no-files-found: warn
          retention-days: 30

  report-lifecycle-fuzz:
    needs: lifecycle-fuzz
    concurrency:
      group: gnoblin-fuzz-issue-report-${{ github.repository }}
      cancel-in-progress: false
    if: >-
      always() && needs.lifecycle-fuzz.result == 'failure' &&
      needs.lifecycle-fuzz.outputs.failed_seeds != '' &&
      github.event_name != 'pull_request' &&
      github.repository == 'kierandrewett/gnoblin'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout fuzzer source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download fuzz artifacts
        uses: actions/download-artifact@v4
        with:
          name: gnoblin-lifecycle-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-fuzz/

      - name: Install Beads CLI and report each failing seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SEEDS: ${{ needs.lifecycle-fuzz.outputs.failed_seeds }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          install_root="$RUNNER_TEMP/beads-install"
          install -d "$install_root"
          curl -fsSL -o "$install_root/beads_1.2.2_linux_amd64.tar.gz" \
            https://github.com/steveyegge/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz
          curl -fsSL -o "$install_root/checksums.txt" \
            https://github.com/steveyegge/beads/releases/download/v1.2.2/checksums.txt
          grep '  beads_1.2.2_linux_amd64.tar.gz$' "$install_root/checksums.txt" > "$install_root/checksum.txt"
          (cd "$install_root" && sha256sum --check checksum.txt)
          tar -xzf "$install_root/beads_1.2.2_linux_amd64.tar.gz" -C "$install_root" bd
          install -m 0755 "$install_root/bd" "$RUNNER_TEMP/bd"
          export PATH="$RUNNER_TEMP:$PATH"

          export GITHUB_REPOSITORY=kierandrewett/gnoblin
          export BEADS_DIR="$RUNNER_TEMP/gnoblin-beads/.beads"
          cd "$RUNNER_TEMP"
          bd init --prefix gnoblin --non-interactive --skip-hooks --skip-agents

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          IFS=, read -r -a failed_seeds <<< "$FAILED_SEEDS"
          diagnostic_sections=""
          for seed in "${failed_seeds[@]}"; do
            failure_file="$RUNNER_TEMP/lifecycle-fuzz/seed-$seed/failure.json"
            seed_diagnostics="No fatal diagnostic lines were captured."
            if [[ -f "$failure_file" ]]; then
              captured="$(jq -r '(.diagnostics[]? // empty), (.client_failure.error? // empty)' "$failure_file")"
              if [[ -n "$captured" ]]; then
                seed_diagnostics="$captured"
              fi
            fi
            diagnostic_sections+=$'\n\n'
            diagnostic_sections+="Seed $seed:"$'\n'"$seed_diagnostics"
          done

          issue_title="[Gnoblin fuzz] Lifecycle fuzz run failure"
          existing_url="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$issue_title\"" --json url --jq '.[0].url // empty')"
          run_note="$(cat <<EOF
          Seeded lifecycle fuzzing failed for seeds: $FAILED_SEEDS.

          Run: $run_url
          Commit: $GITHUB_SHA
          Artifact: gnoblin-lifecycle-fuzz-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT
          EOF
          )"
          run_note+=$'\n\nFailure diagnostics:'"$diagnostic_sections"

          if [[ -n "$existing_url" ]]; then
            gh issue comment "$existing_url" --body "$run_note"
            bd github pull "$existing_url"
            exit 0
          fi

          issue_body="$(cat <<EOF
          Automated seeded lifecycle fuzzing failed. The run evidence may indicate a Gnoblin defect, a test-harness bug, or a CI/environment failure; inspect the diagnostics and artifacts before classifying it.

          - Failed seeds: $FAILED_SEEDS
          - Commit: $GITHUB_SHA
          - Workflow run: $run_url
          - Artifact: gnoblin-lifecycle-fuzz-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT

          Download the artifact and replay with: python3 tests/window-lifecycle-fuzz.py --replay repro.json

          Failure diagnostics:$diagnostic_sections
          EOF
          )"
          bead_id="$(bd create --silent --title "$issue_title" --type bug --priority 1 --description "$issue_body")"
          echo "Created Beads issue $bead_id for fuzz seeds $FAILED_SEEDS"
          bd github push "$bead_id"
