name: Infrastructure
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan. Off by default, so a manual run only shows the plan.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gnoblin-infra
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

  terraform:
    # The infra environment holds the Cloudflare token and only branch main can use it, so pull requests stop at check.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: terraform init -input=false
        working-directory: infra/terraform
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"
        working-directory: infra/terraform
      # A push applies only when the repository variable INFRA_AUTO_APPLY is "true". A manual run applies only when asked.
      - name: Apply
        if: ${{ (github.event_name == 'push' && vars.INFRA_AUTO_APPLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: terraform apply -input=false -no-color tfplan
        working-directory: infra/terraform

  repo-index:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: yarn install --immutable
        working-directory: infra/repo-index
      - name: Deploy the repository index Worker
        if: ${{ (github.event_name == 'push' && vars.INFRA_AUTO_APPLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: yarn cf deploy
        working-directory: infra/repo-index
      - name: Dry run
        if: ${{ !((github.event_name == 'push' && vars.INFRA_AUTO_APPLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply)) }}
        run: yarn cf deploy --dry-run
        working-directory: infra/repo-index
