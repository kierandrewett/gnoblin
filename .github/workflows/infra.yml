name: Infrastructure
on:
  pull_request:
    paths:
      - "infra/**"
      - "docs/**"
      - "scripts/docs-vitepress-postbuild.mjs"
      - "scripts/prepare-apt-pages.py"
      - "design/package-targets.json"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "docs/**"
      - "scripts/docs-vitepress-postbuild.mjs"
      - "scripts/prepare-apt-pages.py"
      - "design/package-targets.json"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan. Off by default, so a manual run only shows the plan.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gnoblin-infra
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - name: Build the repository index Worker
        working-directory: infra/repo-index
        run: |
          yarn install --immutable
          yarn typecheck
          yarn build
      - name: Build the website
        working-directory: infra/website
        run: |
          npm ci
          npm run docs:build
      - name: Include the published APT archive
        run: |
          git fetch origin gh-pages
          git archive origin/gh-pages apt | tar -x -C infra/website/.vitepress/dist
          test -s infra/website/.vitepress/dist/apt/gnoblin-archive-keyring.asc
          python3 scripts/prepare-apt-pages.py \
            --archive infra/website/.vitepress/dist/apt \
            --output infra/website/.vitepress/dist/_redirects
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            infra/repo-index/dist
            infra/website/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: infra
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

  terraform:
    # The infra environment holds the Cloudflare token and only branch main can use it, so pull requests stop at check.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_BACKEND_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_BACKEND_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: infra
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: terraform init -input=false
        working-directory: infra/terraform
      - name: Plan
        # pipefail makes a failed plan fail the step. Without it, tee hides the exit code.
        shell: bash -eo pipefail {0}
        run: terraform plan -input=false -no-color -out=tfplan | tee "$GITHUB_STEP_SUMMARY"
        working-directory: infra/terraform
      # A push applies only when the repository variable INFRA_AUTO_APPLY is "true". A manual run applies only when asked.
      - name: Apply
        if: ${{ (github.event_name == 'push' && vars.INFRA_AUTO_APPLY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: terraform apply -input=false -no-color tfplan
        working-directory: infra/terraform
