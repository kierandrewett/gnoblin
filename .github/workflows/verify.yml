name: Verify installation guide

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "patches/**"
      - "subprojects/**"
      - "scripts/**"
      - "tests/**"
      - "pkgsmith/**"
      - "flake.nix"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "patches/**"
      - "subprojects/**"
      - "scripts/**"
      - "tests/**"
      - "pkgsmith/**"
      - "flake.nix"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  targets:
    # The systems to check, from scripts/targets.json and the release data of endoflife.date (scripts/supported-targets.py).
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.targets.outputs.compile }}
      source_image: ${{ steps.targets.outputs.source_image }}
    steps:
      - uses: actions/checkout@v4
      - name: List the targets
        id: targets
        run: python3 scripts/supported-targets.py --github-output "$GITHUB_OUTPUT"

  source-tarball-and-verify:
    needs: targets
    runs-on: ubuntu-latest
    # The system that builds the source bundle of a release, and the shared prefix of its packages.
    container: ${{ needs.targets.outputs.source_image }}
    timeout-minutes: 90
    steps:
      - name: Install checkout tools
        run: dnf -y install git python3
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set container checkout ownership
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch compositor and portal source trees
        run: ./scripts/checkout-submodules-with-retry.sh subprojects/mutter subprojects/xdg-desktop-portal-gnome subprojects/imgui
      - name: Check the patch series and the contract tests
        run: |
          python3 scripts/manage-patches.py check
          python3 tests/patch-series.test.py
          python3 tests/native-socket-text-snap-api.test.py
          python3 tests/hyprcursor-session-predicate.test.py
          python3 tests/session-lock-api.test.py
          python3 tests/focus-policy-contract.test.py
          python3 tests/check-build-deps.test.py
          python3 tests/test_generate_mutter_keybinding_catalog.py
      - name: Build the release source tarball
        env:
          GIT_COMMITTER_NAME: Gnoblin CI
          GIT_COMMITTER_EMAIL: ci@gnoblin.local
        run: |
          # Build requirements come from scripts/install-fedora-build-deps.sh, the list that the package build uses. The
          # tarball build below uses the system Lua, as a user's build does.
          ./scripts/install-fedora-build-deps.sh --with-test-tools
          git -C subprojects/mutter fetch --force --tags origin
          git -C subprojects/xdg-desktop-portal-gnome fetch --force --tags origin
          source_dir="$RUNNER_TEMP/gnoblin-source-assets"
          ./build.sh package --output "$source_dir"
          mapfile -t bundles < <(find "$source_dir" -maxdepth 1 -type f -name 'gnoblin-*-source.tar.xz')
          test "${#bundles[@]}" -eq 1
          tree_root="$RUNNER_TEMP/gnoblin-source-build"
          mkdir -p "$tree_root"
          tar -xf "${bundles[0]}" -C "$tree_root"
          mapfile -t trees < <(find "$tree_root" -mindepth 1 -maxdepth 1 -type d)
          test "${#trees[@]}" -eq 1
          printf 'GNOBLIN_TARBALL_TREE=%s\n' "${trees[0]}" >> "$GITHUB_ENV"
          useradd -m builder
          chown -R builder "${trees[0]}"
          runuser -u builder -- "${trees[0]}/build.sh"
      - name: Verify the standalone native runtime
        run: |
          runuser -u builder -- cmake --build "$GNOBLIN_TARBALL_TREE/build/ninja" \
            --target gnoblin-tests --parallel 2
          runuser -u builder -- ctest --test-dir "$GNOBLIN_TARBALL_TREE/build/ninja" \
            --output-on-failure \
            --tests-regex '^(native-touchpad-router|runtime-protocol|runtime-spawn|runtime-cache|lua-pattern)$'
      - name: Verify the documented installation output
        run: |
          set -x
          test -x "$GNOBLIN_TARBALL_TREE/install/bin/gnoblin"
          test -x "$GNOBLIN_TARBALL_TREE/install/libexec/xdg-desktop-portal-gnoblin"
          "$GNOBLIN_TARBALL_TREE/install/bin/gnoblin" --version | grep -E "^Commit +$GITHUB_SHA"
          "$GNOBLIN_TARBALL_TREE/install/bin/gnoblin" --version --json |
            python3 -c 'import json, sys; v = json.load(sys.stdin); assert v["gitSha"] == sys.argv[1]; assert v["gitRemote"]; assert v["version"] == sys.argv[2]; assert v["gnomeVersion"] == sys.argv[3]; assert all(v["components"].get(name) for name in ("mutter", "xdg-desktop-portal-gnome")); assert "gnome-shell" not in v["components"]' \
              "$GITHUB_SHA" "$(python3 scripts/gnoblin-version.py get version)" "$(python3 scripts/gnoblin-version.py get gnomeVersion)"
          test -f "$GNOBLIN_TARBALL_TREE/install/share/wayland-sessions/gnoblin.desktop"
          test -f "$GNOBLIN_TARBALL_TREE/install/lib/systemd/user/gnoblin-session.target"
          test ! -e "$GNOBLIN_TARBALL_TREE/install/bin/gnome-shell"
          test ! -e "$GNOBLIN_TARBALL_TREE/install/libexec/gnoblin-runtime"
      - name: Check Gnoblin's portal backend, which the default build includes
        run: |
          test -x "$GNOBLIN_TARBALL_TREE/install/libexec/xdg-desktop-portal-gnoblin"
          ! readelf -d "$GNOBLIN_TARBALL_TREE/install/libexec/xdg-desktop-portal-gnoblin" | grep -Eq 'libgnome-(bg|desktop)'
      - name: Verify the source install and package isolation
        run: |
          python3 tests/package-isolation.test.py
          mapfile -t changed_files < <(git diff --name-only)
          unexpected_files=()
          for path in "${changed_files[@]}"; do
            [[ "$path" == subprojects/* ]] || unexpected_files+=("$path")
          done
          if ((${#unexpected_files[@]})); then
            git diff --exit-code -- "${unexpected_files[@]}"
          fi

  # The release gate and the package suite tested on themselves: the gate on made-up runs (tests/packages/selftest),
  # the static layer and its negative tests on a small package set that the pinned pkgsmith writes, the stage records
  # and the issue logic of the release (tests/pipeline), and the parts of the graphical harness that need no guest.
  # No network, no container.
  package-suite-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore the pkgsmith build
        uses: actions/cache@v4
        with:
          path: ~/.cache/gnoblin/pkgsmith
          key: pkgsmith-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/pkgsmith.ref') }}
      - name: Build pkgsmith and install the tools of the static layer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm cpio desktop-file-utils libglib2.0-bin zstd binutils
          scripts/install-pkgsmith.sh
      - name: Run the self test
        run: python3 tests/packages/selftest/selftest.py -v
      - name: Run the tests of the stage records, the issue logic, the graphical harness and the image signature check
        run: |
          python3 tests/pipeline/stages.test.py -v
          python3 tests/pipeline/issues.test.py -v
          python3 tests/graphical/harness.test.py -v
          python3 tests/graphical/arch-arm-image.test.py -v

  # The oldest listed release of every family that has a native build. The job compiles the compositor and the portal
  # backend against the libraries of that release, so a patch that needs a newer library fails here. It does not start a
  # session. A release that is experimental may fail without failing the run.
  compile:
    name: compile (${{ matrix.target.name }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.compile) }}
    runs-on: ${{ matrix.target.runner }}
    continue-on-error: ${{ matrix.target.experimental }}
    container: ${{ matrix.target.prefix_image }}
    timeout-minutes: 60
    steps:
      - name: Install checkout tools
        # sh, because the image may have no bash yet: an Alpine bootstrap installs it.
        shell: sh
        env:
          BOOTSTRAP: ${{ matrix.target.bootstrap }}
        run: eval "$BOOTSTRAP"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set container checkout ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch compositor and portal source trees
        run: ./scripts/checkout-submodules-with-retry.sh subprojects/mutter subprojects/xdg-desktop-portal-gnome subprojects/imgui
      - name: Install build dependencies
        env:
          DEPS_SCRIPT: ${{ matrix.target.deps_script }}
        run: ./scripts/"$DEPS_SCRIPT" --with-test-tools
      - name: Build the compositor and the portal backend
        env:
          GIT_COMMITTER_NAME: Gnoblin CI
          GIT_COMMITTER_EMAIL: ci@gnoblin.local
        run: |
          git -C subprojects/mutter fetch --force --tags origin
          git -C subprojects/xdg-desktop-portal-gnome fetch --force --tags origin
          ./build.sh --jobs "$(nproc)"
          test -x install/bin/gnoblin
          test -x install/libexec/xdg-desktop-portal-gnoblin
