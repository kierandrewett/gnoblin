name: Verify installation guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  source-tarball-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 90
    steps:
      - name: Install checkout tools
        run: dnf -y install git python3
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set container checkout ownership
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch compositor and portal source trees
        run: git submodule update --init --recursive subprojects/mutter subprojects/xdg-desktop-portal-gnome subprojects/imgui
      - name: Check native package definitions
        run: |
          python3 scripts/sync-package-manifest.py check
          python3 scripts/manage-patches.py check
          python3 tests/native-socket-text-snap-api.test.py
          python3 tests/hyprcursor-session-predicate.test.py
          python3 tests/session-lock-api.test.py
          python3 tests/focus-policy-contract.test.py
          python3 tests/check-build-deps.test.py
          python3 tests/test_generate_mutter_keybinding_catalog.py
      - name: Build the release source tarball
        env:
          GIT_COMMITTER_NAME: Gnoblin CI
          GIT_COMMITTER_EMAIL: ci@gnoblin.local
        run: |
          dnf -y install dnf-plugins-core cmake ninja-build lua-devel glib2-devel \
            json-glib-devel desktop-file-utils python3 rpm-build util-linux-user
          dnf -y builddep packaging/rpm/gnoblin.spec
          git -C subprojects/mutter fetch --force --tags origin
          git -C subprojects/xdg-desktop-portal-gnome fetch --force --tags origin
          source_dir="$RUNNER_TEMP/gnoblin-source-assets"
          ./scripts/build-release-assets.sh "$source_dir" "" --source-only
          mapfile -t bundles < <(find "$source_dir" -maxdepth 1 -type f -name 'gnoblin-*-source.tar.xz')
          test "${#bundles[@]}" -eq 1
          tree_root="$RUNNER_TEMP/gnoblin-source-build"
          mkdir -p "$tree_root"
          tar -xf "${bundles[0]}" -C "$tree_root"
          mapfile -t trees < <(find "$tree_root" -mindepth 1 -maxdepth 1 -type d)
          test "${#trees[@]}" -eq 1
          printf 'GNOBLIN_TARBALL_TREE=%s\n' "${trees[0]}" >> "$GITHUB_ENV"
          useradd -m builder
          chown -R builder "${trees[0]}"
          runuser -u builder -- "${trees[0]}/build.sh"
      - name: Verify the standalone native runtime
        run: |
          runuser -u builder -- cmake --build "$GNOBLIN_TARBALL_TREE/build/ninja" \
            --target native-touchpad-router-test runtime-protocol-test runtime-spawn-test runtime-cache-test lua-pattern-test \
            --parallel 2
          runuser -u builder -- ctest --test-dir "$GNOBLIN_TARBALL_TREE/build/ninja" \
            --output-on-failure \
            --tests-regex '^(native-touchpad-router|runtime-protocol|runtime-spawn|runtime-cache|lua-pattern)$'
      - name: Verify the documented installation output
        run: |
          test -x "$GNOBLIN_TARBALL_TREE/install/bin/gnoblin"
          test ! -x "$GNOBLIN_TARBALL_TREE/install/libexec/xdg-desktop-portal-gnoblin"
          "$GNOBLIN_TARBALL_TREE/install/bin/gnoblin" --version | grep -F "Git commit: $GITHUB_SHA"
          "$GNOBLIN_TARBALL_TREE/install/bin/gnoblin" --version --json |
            python3 -c 'import json, sys; v = json.load(sys.stdin); assert v["gitSha"] == sys.argv[1]; assert v["gitRemote"]; assert v["version"] == sys.argv[2]; assert v["gnomeVersion"] == sys.argv[3]; assert all(v["components"].get(name) for name in ("mutter", "xdg-desktop-portal-gnome")); assert "gnome-shell" not in v["components"]' \
              "$GITHUB_SHA" "$(python3 scripts/gnoblin-version.py get version)" "$(python3 scripts/gnoblin-version.py get gnomeVersion)"
          test -f "$GNOBLIN_TARBALL_TREE/install/share/wayland-sessions/gnoblin.desktop"
          test -f "$GNOBLIN_TARBALL_TREE/install/lib/systemd/user/gnoblin-session.target"
          test ! -e "$GNOBLIN_TARBALL_TREE/install/bin/gnome-shell"
          test ! -e "$GNOBLIN_TARBALL_TREE/install/libexec/gnoblin-runtime"
      - name: Build Gnoblin's optional portal backend
        run: |
          dnf -y builddep packaging/rpm/gnoblin-portal.spec
          runuser -u builder -- "$GNOBLIN_TARBALL_TREE/build.sh" --with-portal
          test -x "$GNOBLIN_TARBALL_TREE/install/libexec/xdg-desktop-portal-gnoblin"
          ! readelf -d "$GNOBLIN_TARBALL_TREE/install/libexec/xdg-desktop-portal-gnoblin" | grep -Eq 'libgnome-(bg|desktop)'
      - name: Verify installer and package isolation
        run: |
          bash -n scripts/install-system.sh
          python3 tests/package-isolation.test.py
          mapfile -t changed_files < <(git diff --name-only)
          unexpected_files=()
          for path in "${changed_files[@]}"; do
            [[ "$path" == subprojects/* ]] || unexpected_files+=("$path")
          done
          if ((${#unexpected_files[@]})); then
            git diff --exit-code -- "${unexpected_files[@]}"
          fi
  copr-install:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 20
    steps:
      - name: Install documented Fedora packages without stock GNOME
        run: |
          dnf -y install dnf-plugins-core
          dnf -y copr enable kierandrewett/gnoblin
          dnf -y --setopt=install_weak_deps=False install --refresh gnoblin
          rpm -q gnoblin
          ! rpm -q gnoblin-portal
          test -f /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          grep -Fxq 'default=gnoblin;*;' /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          test "$(rpm -qf --qf '%{NAME}' /usr/share/xdg-desktop-portal/gnoblin-portals.conf)" = gnoblin
          dnf -y install gnoblin-portal
          rpm -q gnoblin-portal
          rpm -q --whatprovides "gnoblin-session = $(rpm -q --qf '%{VERSION}' gnoblin)"
          test "$(rpm -qf --qf '%{NAME}' /usr/share/xdg-desktop-portal/gnoblin-portals.conf)" = gnoblin
          test -f /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          grep -q 'org.freedesktop.impl.portal.FileChooser;' /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          grep -q 'org.freedesktop.impl.portal.Inhibit;' /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          ! rpm -q xdg-desktop-portal-gtk >/dev/null 2>&1
          for package in gnome-desktop3 gnome-desktop4 gtk3; do
            ! rpm -q "$package" >/dev/null 2>&1
          done
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          grep -q '^Exec=/usr/lib/gnoblin/bin/gnoblin$' /usr/share/wayland-sessions/gnoblin.desktop
          test -f /usr/lib/systemd/user/gnoblin-session.target
          test -f /usr/lib/systemd/user/gnoblin-idle.service
          test -x /usr/lib/gnoblin/bin/gnoblin
          for stock_package in gnome-shell mutter gnome-session gnome-settings-daemon gdm; do
            ! rpm -q "$stock_package" >/dev/null 2>&1
          done
      - name: Install stock GNOME beside Gnoblin
        run: |
          dnf -y install gnome-shell mutter gnome-session gdm
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/stock-gnome-packages
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/stock-gnome-owners
          test -x /usr/bin/gnome-shell
          test -x /usr/bin/mutter
      - name: Remove Gnoblin and verify stock GNOME remains installed
        run: |
          dnf -y remove gnoblin
          mapfile -t gnoblin_packages < <(rpm -qa 'gnoblin*')
          if ((${#gnoblin_packages[@]})); then
            dnf -y remove "${gnoblin_packages[@]}"
          fi
          ! test -e /usr/lib/systemd/user/gnoblin-session.target
          ! test -e /usr/lib/systemd/user/gnoblin-idle.service
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/gnome-packages-after-removal
          diff -u /tmp/stock-gnome-packages /tmp/gnome-packages-after-removal
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/gnome-owners-after-removal
          diff -u /tmp/stock-gnome-owners /tmp/gnome-owners-after-removal
          test -x /usr/bin/gnome-shell
          test -x /usr/bin/mutter
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 180
    steps:
      - name: Install stock GNOME and package build requirements
        run: |
          pacman -Syu --noconfirm --needed \
            accountsservice adwaita-cursors base-devel cmake desktop-file-utils egl-wayland \
            gcr-4 gettext git glib2-devel gnome-desktop-4 gobject-introspection \
            gnome-shell gtk4 \
            libadwaita libcanberra libdisplay-info libei libibus libinput libnm libxml2 libxkbcommon xkeyboard-config \
            libxkbfile libxres lua meson ninja patchelf pipewire pkgconf polkit \
            python python-docutils python-packaging sassc startup-notification \
            wayland wayland-protocols wireplumber \
            xdg-desktop-portal-gnome xorg-xwayland
          pacman -Q gnome-shell mutter > /tmp/stock-gnome-packages
          pacman -Qo /usr/bin/gnome-shell > /tmp/stock-gnome-shell-owner
          pacman -Qo /usr/bin/mutter > /tmp/stock-mutter-owner
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Set container checkout ownership
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch compositor and portal source trees
        run: git submodule update --init --recursive subprojects/mutter subprojects/xdg-desktop-portal-gnome subprojects/imgui
      - name: Build a source bundle from this checked-out revision
        env:
          GIT_COMMITTER_NAME: Gnoblin Package Builder
          GIT_COMMITTER_EMAIL: package-builder@gnoblin.local
        run: |
          git -C subprojects/mutter fetch --force --tags origin
          git -C subprojects/xdg-desktop-portal-gnome fetch --force --tags origin
          source_dir="$RUNNER_TEMP/gnoblin-arch-source"
          package_dir="$RUNNER_TEMP/gnoblin-arch-package"
          portal_package_dir="$RUNNER_TEMP/gnoblin-arch-portal-package"
          mkdir -p "$source_dir" "$package_dir" "$portal_package_dir"
          ./scripts/make-tarball.sh mutter "$source_dir"
          ./scripts/make-tarball.sh xdg-desktop-portal-gnome "$source_dir"
          ./scripts/make-gsettings-desktop-schemas-tarball.sh "$source_dir"
          version="$(./scripts/gnoblin-version.py get version)"
          gnome_version="$(./scripts/gnoblin-version.py get gnomeVersion)"
          schemas_version="$(./scripts/gnome-versions.py get gsettings-desktop-schemas version)"
          source_bundle="$package_dir/gnoblin-$version-gnome-$gnome_version-source.tar.xz"
          ./scripts/build-source-bundle.sh \
            "$source_bundle" "$version" \
            "$source_dir/mutter-$gnome_version.tar.xz" \
            "$source_dir/xdg-desktop-portal-gnome-$gnome_version.tar.xz" \
            "$source_dir/gsettings-desktop-schemas-$schemas_version.tar.xz"
          source_sha256="$(sha256sum "$source_bundle" | awk '{print $1}')"
          python3 scripts/sync-package-manifest.py arch-release \
            --output "$package_dir/PKGBUILD" \
            --source-sha256 "$source_sha256"
          # The generated recipe normally downloads a release asset. In this
          # verification job, change only that URL fragment to use the bundle
          # created from the checked-out revision. Its name and SHA-256 remain
          # exactly those generated above.
          sed -i -E 's#::https://github.com/kierandrewett/gnoblin/releases/download/gnoblin-v\$pkgver/[^\"]+##' "$package_dir/PKGBUILD"
          portal_source="$source_dir/xdg-desktop-portal-gnome-$gnome_version.tar.xz"
          portal_sha256="$(sha256sum "$portal_source" | awk '{print $1}')"
          python3 scripts/sync-package-manifest.py arch-portal-release \
            --output "$portal_package_dir/PKGBUILD" \
            --source-sha256 "$portal_sha256"
          cp "$portal_source" "$portal_package_dir/"
          sed -i -E 's#::https://github.com/kierandrewett/gnoblin/releases/download/[^/]+/[^\"]+##' "$portal_package_dir/PKGBUILD"
      - name: Build the checked-out Arch package
        run: |
          package_dir="$RUNNER_TEMP/gnoblin-arch-package"
          useradd -m builder
          chown -R builder:builder "$package_dir"
          runuser -u builder -- bash -lc 'cd "$1" && makepkg --noconfirm --cleanbuild' bash "$package_dir"
          portal_package_dir="$RUNNER_TEMP/gnoblin-arch-portal-package"
          chown -R builder:builder "$portal_package_dir"
          runuser -u builder -- bash -lc 'cd "$1" && makepkg --noconfirm --cleanbuild' bash "$portal_package_dir"
      - name: Install beside stock GNOME, then remove Gnoblin
        run: |
          package="$(find "$RUNNER_TEMP/gnoblin-arch-package" -maxdepth 1 -name 'gnoblin-[0-9]*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          pacman -Q gnoblin
          ! pacman -Q gnoblin-portal >/dev/null 2>&1
          test -f /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          grep -Fxq 'default=gnoblin;*;' /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          test "$(pacman -Qqo /usr/share/xdg-desktop-portal/gnoblin-portals.conf)" = gnoblin
          portal_package="$(find "$RUNNER_TEMP/gnoblin-arch-portal-package" -maxdepth 1 -name 'gnoblin-portal-[0-9]*.pkg.tar.zst' -print -quit)"
          test -n "$portal_package"
          pacman -U --noconfirm "$portal_package"
          pacman -Q gnoblin-portal
          test -x /usr/lib/gnoblin/bin/gnoblin
          test -x /usr/bin/gnoblinctl
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          grep -q '^Exec=/usr/lib/gnoblin/bin/gnoblin$' /usr/share/wayland-sessions/gnoblin.desktop
          test -f /usr/lib/systemd/user/gnoblin-session.target
          test -f /usr/lib/systemd/user/gnoblin-idle.service
          test "$(pacman -Qqo /usr/share/xdg-desktop-portal/gnoblin-portals.conf)" = gnoblin
          test -f /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          cmp /tmp/stock-gnome-packages <(pacman -Q gnome-shell mutter)
          cmp /tmp/stock-gnome-shell-owner <(pacman -Qo /usr/bin/gnome-shell)
          cmp /tmp/stock-mutter-owner <(pacman -Qo /usr/bin/mutter)
          pacman -R --noconfirm gnoblin-portal gnoblin
          ! pacman -Q gnoblin
          ! test -e /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          ! test -e /usr/lib/systemd/user/gnoblin-session.target
          ! test -e /usr/lib/systemd/user/gnoblin-idle.service
          cmp /tmp/stock-gnome-packages <(pacman -Q gnome-shell mutter)
          cmp /tmp/stock-gnome-shell-owner <(pacman -Qo /usr/bin/gnome-shell)
          cmp /tmp/stock-mutter-owner <(pacman -Qo /usr/bin/mutter)
      - name: Remove package cache
        if: always()
        run: pacman -Scc --noconfirm
