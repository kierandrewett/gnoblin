name: Verify installation guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checkout-and-verify:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 90
    steps:
      - name: Install checkout and packaging tools
        run: dnf -y install dnf-plugins-core git just meson ninja-build python3 rpm-build rpmdevtools
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set container checkout ownership and build identity
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global user.name 'Gnoblin CI'
          git config --global user.email 'gnoblin-ci@users.noreply.github.com'
      - name: Initialise the source tree
        run: just init
      - name: Install source-build dependencies
        run: |
          dnf -y copr enable kierandrewett/gnoblin
          dnf -y builddep packaging/rpm/mutter.spec packaging/rpm/gnome-shell.spec
      - name: Build the documented local installation
        run: GNOBLIN_PREFIX="$PWD/install" just build-local
      - name: Verify the documented installation output
        run: |
          test -x install/bin/gnoblin-session
          test -x install/bin/gnoblin-shell-service
          test -x install/bin/gnome-shell
          test -f install/share/wayland-sessions/gnoblin.desktop
          test -f install/share/gnome-session/sessions/gnoblin.session
      - name: Verify installer and package isolation
        run: |
          bash -n scripts/install-system.sh
          python3 tests/package-isolation.test.py
          git diff --exit-code -- . ':!subprojects'
  copr-install:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 20
    steps:
      - name: Install documented Fedora packages
        run: |
          dnf -y install dnf-plugins-core
          dnf -y copr enable kierandrewett/gnoblin
          dnf -y install --refresh gnoblin-mutter gnoblin-shell gnoblin-session
          rpm -q gnoblin-mutter gnoblin-shell gnoblin-session
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          test -x /usr/lib/gnoblin/bin/gnoblin-session
  arch-source:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 90
    steps:
      - name: Install checkout tools
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: Set container checkout ownership and build identity
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global user.name 'Gnoblin CI'
          git config --global user.email 'gnoblin-ci@users.noreply.github.com'
      - name: Install documented Arch dependencies
        run: bash scripts/install-arch-build-deps.sh --noconfirm
      - name: Initialize and build the documented source installation
        run: |
          just init
          GNOBLIN_PREFIX="$PWD/install" GNOBLIN_LIBDIR=lib just build-local
      - name: Verify local runtime and session
        run: |
          test -x install/bin/gnome-shell
          test -x install/bin/gnoblin-session
          test -f install/share/wayland-sessions/gnoblin.desktop
          test -f install/lib/libmutter-17.so
