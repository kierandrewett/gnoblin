name: Verify installation guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  checkout-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the current Fedora release and the two previous releases green.
        fedora: [43, 44, 45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 90
    steps:
      - name: Install checkout tools
        run: dnf -y install git
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set container checkout ownership
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build everything
        run: |
          source scripts/build-deps.sh
          source /etc/os-release
          install_build_dependencies "$(build_distro_family "$ID" "${ID_LIKE:-}")" true false
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- ./build.sh
      - name: Verify the documented installation output
        run: |
          test -x install/bin/gnoblin-session
          test -x install/bin/gnoblin-shell-service
          test -x install/bin/gnome-shell
          test -f install/share/wayland-sessions/gnoblin.desktop
          test -f install/share/gnome-session/sessions/gnoblin.session
      - name: Verify installer and package isolation
        run: |
          bash -n scripts/install-system.sh
          python3 tests/package-isolation.test.py
          mapfile -t changed_files < <(git diff --name-only)
          unexpected_files=()
          for path in "${changed_files[@]}"; do
            [[ "$path" == subprojects/* ]] || unexpected_files+=("$path")
          done
          if ((${#unexpected_files[@]})); then
            git diff --exit-code -- "${unexpected_files[@]}"
          fi
  copr-install:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 20
    steps:
      - name: Install stock GNOME and record its package ownership
        run: |
          dnf -y install gnome-shell mutter gnome-session gdm
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/stock-gnome-packages
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/stock-gnome-owners
          test -x /usr/bin/gnome-shell
          test -x /usr/bin/mutter
      - name: Install documented Fedora packages beside stock GNOME
        run: |
          dnf -y install dnf-plugins-core
          dnf -y copr enable kierandrewett/gnoblin
          dnf -y install --refresh gnoblin
          rpm -q gnoblin gnoblin-mutter gnoblin-shell gnoblin-session
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          test -x /usr/lib/gnoblin/bin/gnoblin-session
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/gnome-packages-with-gnoblin
          diff -u /tmp/stock-gnome-packages /tmp/gnome-packages-with-gnoblin
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/gnome-owners-with-gnoblin
          diff -u /tmp/stock-gnome-owners /tmp/gnome-owners-with-gnoblin
      - name: Remove Gnoblin and verify stock GNOME remains installed
        run: |
          dnf -y remove gnoblin
          mapfile -t gnoblin_packages < <(rpm -qa 'gnoblin*')
          if ((${#gnoblin_packages[@]})); then
            dnf -y remove "${gnoblin_packages[@]}"
          fi
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/gnome-packages-after-removal
          diff -u /tmp/stock-gnome-packages /tmp/gnome-packages-after-removal
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/gnome-owners-after-removal
          diff -u /tmp/stock-gnome-owners /tmp/gnome-owners-after-removal
          test -x /usr/bin/gnome-shell
          test -x /usr/bin/mutter
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 180
    steps:
      - name: Install stock GNOME and package build requirements
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel brightnessctl cmake desktop-file-utils egl-wayland \
            evolution-data-server gettext git glib2-devel gobject-introspection \
            gjs gnome-session gnome-settings-daemon gnome-shell gtk4 hyprcursor \
            libadwaita libdisplay-info libei libinput librsvg libxkbcommon \
            libxkbfile libxres lua meson ninja patchelf pipewire pkgconf playerctl \
            python python-docutils python-packaging sassc sysprof wayland wireplumber \
            xdg-desktop-portal-gnome xorg-xwayland
          pacman -Q gnome-shell mutter > /tmp/stock-gnome-packages
          pacman -Qo /usr/bin/gnome-shell > /tmp/stock-gnome-shell-owner
          pacman -Qo /usr/bin/mutter > /tmp/stock-mutter-owner
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set container checkout ownership
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build a source bundle from this checked-out revision
        env:
          GIT_COMMITTER_NAME: Gnoblin Package Builder
          GIT_COMMITTER_EMAIL: package-builder@gnoblin.local
        run: |
          git submodule foreach --recursive 'git fetch --force --tags origin'
          source_dir="$RUNNER_TEMP/gnoblin-arch-source"
          package_dir="$RUNNER_TEMP/gnoblin-arch-package"
          mkdir -p "$source_dir" "$package_dir"
          ./scripts/make-tarball.sh gsettings-desktop-schemas "$source_dir"
          ./scripts/make-tarball.sh mutter "$source_dir"
          ./scripts/make-tarball.sh gnome-shell "$source_dir"
          python3 scripts/build-adwaita-hyprcursor.py \
            --output "$source_dir/Adwaita-Hyprcursor" \
            --fallback /usr/share/icons/Adwaita
          tar -C "$source_dir" -cJf "$source_dir/Adwaita-Hyprcursor.tar.xz" Adwaita-Hyprcursor
          version="$(./scripts/gnoblin-version.py get version)"
          gnome_version="$(./scripts/gnoblin-version.py get gnomeVersion)"
          source_bundle="$package_dir/gnoblin-$version-gnome-$gnome_version-arch-source.tar.xz"
          ./packaging/arch/build-source-bundle.sh \
            "$source_bundle" "$version" \
            "$source_dir/gsettings-desktop-schemas-$gnome_version.tar.xz" \
            "$source_dir/mutter-$gnome_version.tar.xz" \
            "$source_dir/gnome-shell-$gnome_version.tar.xz" \
            "$source_dir/Adwaita-Hyprcursor.tar.xz"
          source_sha256="$(sha256sum "$source_bundle" | awk '{print $1}')"
          python3 scripts/sync-package-manifest.py arch-release \
            --output "$package_dir/PKGBUILD" \
            --source-sha256 "$source_sha256"
          # The generated recipe normally downloads a release asset. In this
          # verification job, change only that URL fragment to use the bundle
          # created from the checked-out revision. Its name and SHA-256 remain
          # exactly those generated above.
          sed -i -E 's#::https://github.com/kierandrewett/gnoblin/releases/download/gnoblin-v\$pkgver/[^\"]+##' "$package_dir/PKGBUILD"
      - name: Build the checked-out Arch package
        run: |
          package_dir="$RUNNER_TEMP/gnoblin-arch-package"
          useradd -m builder
          chown -R builder:builder "$package_dir"
          runuser -u builder -- bash -lc 'cd "$1" && makepkg --noconfirm --cleanbuild' bash "$package_dir"
      - name: Install beside stock GNOME, then remove Gnoblin
        run: |
          package="$(find "$RUNNER_TEMP/gnoblin-arch-package" -maxdepth 1 -name 'gnoblin-[0-9]*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          if bsdtar -tf "$package" | grep -Fq 'build-prefix/schemas/'; then
            echo "Arch package contains the temporary schema build prefix" >&2
            exit 1
          fi
          pacman -U --noconfirm "$package"
          pacman -Q gnoblin
          test -x /usr/lib/gnoblin/bin/gnome-shell
          test -x /usr/lib/gnoblin/bin/gnoblin-session
          test -x /usr/bin/gnoblinctl
          test -f /usr/lib/gnoblin/share/glib-2.0/schemas/org.gnome.desktop.interface.gschema.xml
          test -f /usr/lib/gnoblin/share/glib-2.0/schemas/gschemas.compiled
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          test -f /usr/share/gnome-session/sessions/gnoblin.session
          cmp /tmp/stock-gnome-packages <(pacman -Q gnome-shell mutter)
          cmp /tmp/stock-gnome-shell-owner <(pacman -Qo /usr/bin/gnome-shell)
          cmp /tmp/stock-mutter-owner <(pacman -Qo /usr/bin/mutter)
          pacman -R --noconfirm gnoblin
          ! pacman -Q gnoblin
          cmp /tmp/stock-gnome-packages <(pacman -Q gnome-shell mutter)
          cmp /tmp/stock-gnome-shell-owner <(pacman -Qo /usr/bin/gnome-shell)
          cmp /tmp/stock-mutter-owner <(pacman -Qo /usr/bin/mutter)
      - name: Remove package cache
        if: always()
        run: pacman -Scc --noconfirm

  distro-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:sid
            bootstrap: apt-get update && apt-get install -y git ca-certificates
          - image: ubuntu:26.04
            bootstrap: apt-get update && apt-get install -y git ca-certificates
          - image: registry.opensuse.org/opensuse/tumbleweed:latest
            bootstrap: zypper --non-interactive install git ca-certificates
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout tools
        run: ${{ matrix.bootstrap }}
      - uses: actions/checkout@v4
      - name: Install source-build dependencies
        run: |
          source scripts/build-deps.sh
          source /etc/os-release
          install_build_dependencies "$(build_distro_family "$ID" "${ID_LIKE:-}")" true false
      - name: Test dependency command planning
        run: |
          python3 tests/build-deps.test.py
          python3 tests/private-deps.test.py
