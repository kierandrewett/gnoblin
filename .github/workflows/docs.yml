name: Documentation
on:
  pull_request:
    paths:
      [
        "docs/**",
        "scripts/docs-vitepress-postbuild.mjs",
        "scripts/prepare-apt-pages.py",
        "package.json",
        "package-lock.json",
        ".github/workflows/docs.yml",
      ]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/docs-vitepress-postbuild.mjs", "package.json", "package-lock.json"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gnoblin-static-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/.vitepress/dist
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: docs/.vitepress/dist
      - name: Include the published APT archive
        run: |
          git fetch origin gh-pages
          mkdir -p docs/.vitepress/dist/apt
          git archive origin/gh-pages apt | tar -x -C docs/.vitepress/dist
          test -s docs/.vitepress/dist/apt/gnoblin-archive-keyring.asc
          python3 scripts/prepare-apt-pages.py \
            --archive docs/.vitepress/dist/apt \
            --output docs/.vitepress/dist/_redirects
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.140.0 pages deploy docs/.vitepress/dist --project-name=gnoblin-docs --branch=main
