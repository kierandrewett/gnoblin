name: Documentation
# Pull requests build the site to catch broken pages. The deploy is part of infra.yml.
on:
  pull_request:
    paths:
      - "docs/**"
      - "infra/website/**"
      - "scripts/docs-vitepress-postbuild.mjs"
      - ".github/workflows/docs.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/website/package-lock.json
      - run: npm ci
        working-directory: infra/website
      - run: npm run docs:build
        working-directory: infra/website
