name: Gnoblin Lua validation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "patches/**"
      - "subprojects/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/lua-runtime.yml"
  pull_request:
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build.sh"
      - "patches/**"
      - "subprojects/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/lua-runtime.yml"
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Fast configuration and console tests on two distributions.
  config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["fedora:45", "archlinux:base"]
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --needed --noconfirm git base-devel cmake ninja glib2-devel json-glib gsettings-desktop-schemas libxkbcommon lua
          else
            dnf -y install git gcc cmake ninja-build pkgconf-pkg-config glib2-devel json-glib-devel gsettings-desktop-schemas libxkbcommon-devel lua-devel
          fi
      - uses: actions/checkout@v4
      - name: Test configuration and console behavior
        run: bash tests/test-config.sh

  # Full build and the whole CTest suite on Fedora.
  native-runtime:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 120
    steps:
      - name: Install checkout and build tools
        run: dnf -y install git

      - name: Checkout Gnoblin
        uses: actions/checkout@v4

      - name: Fetch pinned sources, retrying GNOME GitLab errors
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/checkout-submodules-with-retry.sh

      - name: Install build dependencies
        run: |
          # Build requirements come from scripts/install-fedora-build-deps.sh, the list that the package build uses.
          dnf -y install git
          ./scripts/install-fedora-build-deps.sh --with-test-tools

      - name: Build all targets as an unprivileged user
        run: |
          useradd --create-home builder
          builder_uid="$(id -u builder)"
          install -d -o builder -g builder -m 700 "/run/user/$builder_uid"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            GNOBLIN_BUILD_JOBS="$(nproc)" \
            ./build.sh --target all

      - name: Verify standalone artifacts
        run: |
          test -x "$GITHUB_WORKSPACE/install/bin/gnoblin"
          test -x "$GITHUB_WORKSPACE/install/bin/gnoblinctl"
          test -x "$GITHUB_WORKSPACE/install/bin/gnoblin"
          test ! -e "$GITHUB_WORKSPACE/install/bin/gnoblin-mutter"
          test ! -e "$GITHUB_WORKSPACE/install/bin/gnome-shell"

      - name: Run native runtime and Lua API tests
        run: |
          builder_uid="$(id -u builder)"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            ctest --test-dir "$GITHUB_WORKSPACE/build/ninja" --output-on-failure
