name: Gnoblin Lua runtime validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 120
    steps:
      - name: Install checkout and build tools
        run: dnf -y install git

      - name: Checkout Gnoblin and pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          dnf -y install \
            git cmake ninja-build meson python3 gcc gcc-c++ make pkgconf-pkg-config \
            gettext gettext-devel sassc desktop-file-utils python3-docutils gnome-desktop4-devel \
            python3-packaging readline-devel iso-codes adwaita-cursor-theme util-linux-user \
            glib2-devel json-glib-devel libadwaita-devel expat-devel \
            mesa-libEGL-devel pam-devel lua-devel cvt xkeyboard-config-devel \
            xorg-x11-server-Xwayland \
            'pkgconfig(atk)' 'pkgconfig(cairo)' 'pkgconfig(colord)' \
            'pkgconfig(egl)' 'pkgconfig(fontconfig)' 'pkgconfig(fribidi)' \
            'pkgconfig(gbm)' 'pkgconfig(gio-unix-2.0)' 'pkgconfig(gl)' \
            'pkgconfig(glesv2)' 'pkgconfig(glib-2.0)' \
            'pkgconfig(gmodule-no-export-2.0)' 'pkgconfig(gobject-2.0)' \
            'pkgconfig(gobject-introspection-1.0)' \
            'pkgconfig(graphene-gobject-1.0)' \
            'pkgconfig(gsettings-desktop-schemas)' 'pkgconfig(gtk4)' \
            'pkgconfig(gtk4-unix-print)' 'pkgconfig(gudev-1.0)' \
            'pkgconfig(harfbuzz)' 'pkgconfig(lcms2)' \
            'pkgconfig(libadwaita-1)' 'pkgconfig(libcanberra)' \
            'pkgconfig(libdisplay-info)' 'pkgconfig(libdrm)' \
            'pkgconfig(libei-1.0)' 'pkgconfig(libeis-1.0)' \
            'pkgconfig(libinput)' 'pkgconfig(libpipewire-0.3)' \
            'pkgconfig(libstartup-notification-1.0)' 'pkgconfig(libudev)' \
            'pkgconfig(libwacom)' 'pkgconfig(pango)' 'pkgconfig(pangocairo)' \
            'pkgconfig(pixman-1)' 'pkgconfig(udev)' \
            'pkgconfig(wayland-client)' 'pkgconfig(wayland-cursor)' \
            'pkgconfig(wayland-egl)' 'pkgconfig(wayland-protocols)' \
            'pkgconfig(wayland-server)' 'pkgconfig(x11)' 'pkgconfig(x11-xcb)' \
            'pkgconfig(xau)' 'pkgconfig(xcb-res)' 'pkgconfig(xcomposite)' \
            'pkgconfig(xcursor)' 'pkgconfig(xdamage)' \
            'pkgconfig(xdg-desktop-portal)' 'pkgconfig(xext)' \
            'pkgconfig(xfixes)' 'pkgconfig(xi)' 'pkgconfig(xinerama)' \
            'pkgconfig(xkbcommon)' 'pkgconfig(xkbregistry)' \
            'pkgconfig(xkeyboard-config-2)' 'pkgconfig(xrandr)'

      - name: Build all targets as an unprivileged user
        run: |
          useradd --create-home builder
          builder_uid="$(id -u builder)"
          install -d -o builder -g builder -m 700 "/run/user/$builder_uid"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            GNOBLIN_BUILD_JOBS="$(nproc)" \
            ./build.sh --target all

      - name: Verify standalone artifacts
        run: |
          test -x "$GITHUB_WORKSPACE/install/bin/gnoblin"
          test -x "$GITHUB_WORKSPACE/install/bin/gnoblinctl"
          test -x "$GITHUB_WORKSPACE/install/bin/gnoblin-mutter"
          test ! -e "$GITHUB_WORKSPACE/install/bin/gnome-shell"

      - name: Run native runtime and Lua API tests
        run: |
          builder_uid="$(id -u builder)"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            ctest --test-dir "$GITHUB_WORKSPACE/build/ninja" --output-on-failure
