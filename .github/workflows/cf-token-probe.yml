name: Cloudflare token probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show what the Cloudflare token may do (permission names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          zone=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=gnoblin.org" | python3 -c 'import sys,json;r=json.load(sys.stdin)["result"];print(r[0]["id"] if r else "")')
          probe() { code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$2"); echo "$1: HTTP $code"; }
          echo "zone found: $([ -n "$zone" ] && echo yes || echo no)"
          probe "read zone" "/zones/$zone"
          probe "read dns records" "/zones/$zone/dns_records"
          probe "read r2 buckets" "/accounts/$ACCOUNT/r2/buckets"
          probe "read worker scripts" "/accounts/$ACCOUNT/workers/scripts"
          probe "read worker routes" "/zones/$zone/workers/routes"
          probe "read worker custom domains" "/accounts/$ACCOUNT/workers/domains"
          probe "read r2 custom domains" "/accounts/$ACCOUNT/r2/buckets/gnoblin-repo/domains/custom"
          probe "read pages projects" "/accounts/$ACCOUNT/pages/projects"
          probe "read account tokens" "/accounts/$ACCOUNT/tokens"
