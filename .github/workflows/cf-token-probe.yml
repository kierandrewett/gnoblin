name: Cloudflare token probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show what the Cloudflare token may do (permission names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "account var set: $([ -n "$ACCOUNT" ] && echo yes || echo no)"
          id=$(api /accounts/$ACCOUNT/tokens/verify | python3 -c 'import sys,json;j=json.load(sys.stdin);print(j["result"]["id"],j["result"]["status"])' 2>&1) || id=$(api /user/tokens/verify | python3 -c 'import sys,json;j=json.load(sys.stdin);print(j["result"]["id"],j["result"]["status"])')
          echo "verify: ${id#* } (id hidden)"
          tid=${id%% *}
          api /accounts/$ACCOUNT/tokens/$tid 2>/dev/null | python3 -c '
          import sys,json
          j=json.load(sys.stdin)["result"]
          for p in j["policies"]:
              print(p["effect"], ", ".join(g["name"] for g in p["permission_groups"]), "->", list(p["resources"].keys()))
          ' || echo "could not read policies"
