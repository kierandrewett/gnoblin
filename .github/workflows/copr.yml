name: COPR repository

on:
  workflow_call:
    inputs:
      tag:
        description: Published Gnoblin release tag to build in COPR
        required: true
        type: string
    secrets:
      COPR_CONFIG:
        description: copr-cli configuration for the Gnoblin publisher account
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published Gnoblin release tag to build in COPR
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: copr-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 90
    permissions:
      # The release assets remain draft until COPR and APT publication finish.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
    steps:
      - name: Install publication tools
        run: dnf -y install copr-cli gh git
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Configure the COPR publisher
        run: |
          test -n "$COPR_CONFIG"
          install -d -m 700 "$HOME/.config"
          printf '%s' "$COPR_CONFIG" > "$HOME/.config/copr"
          chmod 600 "$HOME/.config/copr"
          copr-cli whoami
      - name: Download and validate source RPMs
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.src.rpm' --dir release-assets
          shopt -s nullglob
          portal=(release-assets/gnoblin-portal-*.src.rpm)
          meta=(release-assets/gnoblin-[0-9]*.src.rpm)
          test "${#portal[@]}" -eq 1
          test "${#meta[@]}" -eq 1
          printf '%s\n' "${portal[@]}" "${meta[@]}"
      - name: Publish and verify the release in COPR
        run: |
          scripts/publish-copr.sh kierandrewett/gnoblin \
            release-assets/gnoblin-portal-*.src.rpm \
            release-assets/gnoblin-[0-9]*.src.rpm

  install-smoke:
    needs: publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        fedora: [45]
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 20
    steps:
      - name: Install the published release without stock GNOME
        run: |
          expected_version="${RELEASE_TAG#gnoblin-v}"
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          dnf -y install dnf-plugins-core
          dnf -y copr enable kierandrewett/gnoblin
          dnf -y --setopt=install_weak_deps=False install --refresh "gnoblin-$expected_version"
          installed_version="$(rpm -q --qf '%{VERSION}' gnoblin)"
          test "$installed_version" = "$expected_version"
          rpm -q gnoblin
          ! rpm -q gnoblin-portal
          test -f /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          grep -Fxq 'default=gnoblin;*;' /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          test "$(rpm -qf --qf '%{NAME}' /usr/share/xdg-desktop-portal/gnoblin-portals.conf)" = gnoblin
          dnf -y install gnoblin-portal
          rpm -q gnoblin-portal
          ! rpm -q gnoblin-gnome-integration
          test "$(rpm -qf --qf '%{NAME}' /usr/share/xdg-desktop-portal/gnoblin-portals.conf)" = gnoblin
          test -f /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          grep -q 'org.freedesktop.impl.portal.FileChooser;' /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          grep -q 'org.freedesktop.impl.portal.Inhibit;' /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          ! rpm -q xdg-desktop-portal-gtk >/dev/null 2>&1
          for package in gnome-desktop3 gnome-desktop4 gtk3; do
            ! rpm -q "$package" >/dev/null 2>&1
          done
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          grep -q '^Exec=/usr/lib/gnoblin/bin/gnoblin$' /usr/share/wayland-sessions/gnoblin.desktop
          for stock_package in gnome-shell mutter gnome-session gnome-settings-daemon gdm; do
            ! rpm -q "$stock_package" >/dev/null 2>&1
          done
          dnf -y install gnoblin-gnome-integration
          rpm -q gnoblin-gnome-integration gvfs gnome-keyring xdg-user-dirs
          for stock_package in gnome-shell mutter gnome-session gnome-settings-daemon gdm; do
            ! rpm -q "$stock_package" >/dev/null 2>&1
          done
      - name: Install stock GNOME beside Gnoblin
        run: |
          dnf -y install gnome-shell mutter gnome-session gdm
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/stock-gnome-packages
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/stock-gnome-owners
          test -x /usr/bin/gnome-shell
          test -x /usr/bin/mutter
      - name: Remove Gnoblin and verify stock GNOME remains installed
        run: |
          dnf -y remove gnoblin
          mapfile -t gnoblin_packages < <(rpm -qa 'gnoblin*')
          if ((${#gnoblin_packages[@]})); then
            dnf -y remove "${gnoblin_packages[@]}"
          fi
          rpm -q gnome-shell mutter gnome-session gdm > /tmp/gnome-packages-after-removal
          diff -u /tmp/stock-gnome-packages /tmp/gnome-packages-after-removal
          rpm -qf /usr/bin/gnome-shell /usr/bin/mutter > /tmp/gnome-owners-after-removal
          diff -u /tmp/stock-gnome-owners /tmp/gnome-owners-after-removal
          test -x /usr/bin/gnome-shell
          test -x /usr/bin/mutter
