name: Packaging target inventory

on:
  push:
    branches: [main]
    paths:
      - "design/package-targets.json"
      - "scripts/check-packaging-targets.py"
      - ".github/workflows/packaging-targets.yml"
  pull_request:
    paths:
      - "design/package-targets.json"
      - "scripts/check-packaging-targets.py"
      - ".github/workflows/packaging-targets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package target inventory
        run: python3 scripts/check-packaging-targets.py
