name: Debian and Ubuntu packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit SHA to build
        type: string
        default: main
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-probe:
    name: Measure older DEB target feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:11
            target: debian11
          - image: debian:12
            target: debian12
          - image: ubuntu:22.04
            target: ubuntu22.04
    container: ${{ matrix.image }}
    steps:
      - name: Pin the final Debian 11 package snapshot
        if: matrix.target == 'debian11'
        run: |
          rm -f /etc/apt/sources.list.d/*
          cat > /etc/apt/sources.list <<'EOF'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T235959Z bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T235959Z bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260831T235959Z bullseye-security main
          EOF
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record the stock host interface gap
        run: scripts/probe-deb-target.py --expect-blocked --output "build/deb-probes/${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-probe-${{ matrix.target }}
          path: build/deb-probes/${{ matrix.target }}.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:11
            target: debian11
            compatibility: true
          - image: debian:13
            target: debian13
            compatibility: false
          - image: debian:12
            target: debian12
            compatibility: true
          - image: ubuntu:24.04
            target: ubuntu24.04
            compatibility: false
          - image: ubuntu:22.04
            target: ubuntu22.04
            compatibility: true
          - image: ubuntu:26.04
            target: ubuntu26.04
            compatibility: false
    container: ${{ matrix.image }}
    steps:
      - name: Pin the final Debian 11 package snapshot
        if: matrix.target == 'debian11'
        run: |
          rm -f /etc/apt/sources.list.d/*
          cat > /etc/apt/sources.list <<'EOF'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T235959Z bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T235959Z bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260831T235959Z bullseye-security main
          EOF
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Prepare build container
        env:
          COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          if [[ "$COMPATIBILITY" == true ]]; then
            scripts/provision-deb-compat-container.sh
            mkdir -p build/compat-dependencies
            chown -R builder build/compat-dependencies
          else
            scripts/provision-deb-container.sh
          fi
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build private runtime and package
        env:
          PACKAGE_REF: ${{ inputs.ref || github.sha }}
          COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          revision=1
          if [[ "$PACKAGE_REF" == refs/tags/gnoblin-v* || "$PACKAGE_REF" == gnoblin-v* ]]; then
            revision="$(scripts/check-release-tag.sh "${PACKAGE_REF#refs/tags/}")"
          fi
          if [[ "$COMPATIBILITY" == true ]]; then
            runuser -u builder -- env PATH="/opt/gnoblin-compat-build-tools/bin:$PATH" \
              GNOBLIN_BUILD_JOBS=2 scripts/build-deb-compat-runtime.sh --revision "$revision"
          else
            runuser -u builder -- env PATH="/opt/gnoblin-build-tools/bin:$PATH" \
              GNOBLIN_BUILD_JOBS=2 scripts/build-deb.sh --revision "$revision"
          fi
      - name: Include dependency sources
        env:
          TARGET: ${{ matrix.target }}
          COMPATIBILITY: ${{ matrix.compatibility }}
        run: |
          if [[ "$COMPATIBILITY" == true ]]; then
            dependency_root=build/compat-dependencies
            mapfile -d '' cargo_sources < <(find "$dependency_root" -type d -path '*/cargo-home/registry/src' -print0)
            tar -cJf "dist/deb/gnoblin-$TARGET-dependency-sources.tar.xz" \
              -C "$dependency_root" downloads \
              -C "$GITHUB_WORKSPACE" build/compat-runtime-dependencies.json \
              build-dependencies.json packaging/deb/compat-bootstrap.json \
              packaging/deb/build-dependencies.json packaging/deb/patches "${cargo_sources[@]}"
          else
            mapfile -d '' cargo_sources < <(find build/dependencies -type d -path '*/cargo-home/registry/src' -print0)
            tar -cJf "dist/deb/gnoblin-$TARGET-dependency-sources.tar.xz" \
              -C build/dependencies downloads \
              -C "$GITHUB_WORKSPACE" build/deb-dependencies.json packaging/deb/patches "${cargo_sources[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package-${{ matrix.target }}
          path: dist/deb/*
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:11
            target: debian11
          - image: debian:13
            target: debian13
          - image: debian:12
            target: debian12
          - image: ubuntu:24.04
            target: ubuntu24.04
          - image: ubuntu:22.04
            target: ubuntu22.04
          - image: ubuntu:26.04
            target: ubuntu26.04
    container: ${{ matrix.image }}
    steps:
      - name: Pin the final Debian 11 package snapshot
        if: matrix.target == 'debian11'
        run: |
          rm -f /etc/apt/sources.list.d/*
          cat > /etc/apt/sources.list <<'EOF'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T235959Z bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260831T235959Z bullseye-updates main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260831T235959Z bullseye-security main
          EOF
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: debian-package-${{ matrix.target }}
          path: packages
      - name: Verify checksum, install, test and remove
        env:
          TARGET: ${{ matrix.target }}
        run: |
          (cd packages && sha256sum -c "gnoblin-$TARGET-amd64.deb.sha256")
          scripts/test-deb.sh "packages/gnoblin-$TARGET-amd64.deb"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deb-${{ matrix.target }}-test-logs
          path: /home/tester/.local/state/gnoblin/
