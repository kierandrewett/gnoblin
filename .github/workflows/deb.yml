name: Debian and Ubuntu packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      release_build:
        description: Skip long-running experimental builds for unsupported older distributions
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit SHA to build
        type: string
        default: main
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-probe:
    name: Measure older DEB target feasibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            target: debian12
          - image: ubuntu:22.04
            target: ubuntu22.04
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record current host dependency blockers
        run: scripts/probe-deb-target.py --expect-blocked --output "build/deb-probes/${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-probe-${{ matrix.target }}
          path: build/deb-probes/${{ matrix.target }}.json
          if-no-files-found: error

  compatibility-dependency-build:
    if: inputs.release_build != true
    name: Experimental GTK/GCR closure (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            target: debian12
          - image: ubuntu:22.04
            target: ubuntu22.04
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Prepare the isolated dependency builder
        run: |
          scripts/provision-deb-compat-container.sh
          mkdir -p build/compat-dependencies
          chown -R builder "$GITHUB_WORKSPACE"
          chown -R builder build/compat-dependencies
      - name: Verify the pinned build-only Rust toolchain
        run: |
          runuser -u builder -- env PATH="/opt/gnoblin-compat-build-tools/bin:$PATH" rustc --version
          runuser -u builder -- env PATH="/opt/gnoblin-compat-build-tools/bin:$PATH" cargo --version
      - name: Build the pinned private GTK/GCR closure
        run: |
          runuser -u builder -- env PATH="/opt/gnoblin-compat-build-tools/bin:$PATH" \
            python3 scripts/build-private-deps.py \
              --prefix /usr/lib/gnoblin/deps \
              --manifest packaging/deb/compat-bootstrap.json \
              --cache "$GITHUB_WORKSPACE/build/compat-dependencies" \
              --only gcr4 --jobs 2
          runuser -u builder -- env PKG_CONFIG_PATH=/usr/lib/gnoblin/deps/lib64/pkgconfig \
            pkg-config --modversion wayland-client gtk4 gcr-4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            target: debian13
          - image: ubuntu:24.04
            target: ubuntu24.04
          - image: ubuntu:26.04
            target: ubuntu26.04
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Prepare build container
        run: |
          scripts/provision-deb-container.sh
          chown -R builder "$GITHUB_WORKSPACE"
      - name: Build private runtime and package
        env:
          PACKAGE_REF: ${{ inputs.ref || github.sha }}
        run: |
          revision=1
          if [[ "$PACKAGE_REF" == refs/tags/gnoblin-v* || "$PACKAGE_REF" == gnoblin-v* ]]; then
            revision="$(scripts/check-release-tag.sh "${PACKAGE_REF#refs/tags/}")"
          fi
          runuser -u builder -- env PATH="/opt/gnoblin-build-tools/bin:$PATH" \
            GNOBLIN_BUILD_JOBS=2 scripts/build-deb.sh --revision "$revision"
      - name: Include dependency sources
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mapfile -d '' cargo_sources < <(find build/dependencies -type d -path '*/cargo-home/registry/src' -print0)
          tar -cJf "dist/deb/gnoblin-$TARGET-dependency-sources.tar.xz" \
            -C build/dependencies downloads \
            -C "$GITHUB_WORKSPACE" build/deb-dependencies.json packaging/deb/patches "${cargo_sources[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package-${{ matrix.target }}
          path: dist/deb/*
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            target: debian13
          - image: ubuntu:24.04
            target: ubuntu24.04
          - image: ubuntu:26.04
            target: ubuntu26.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: debian-package-${{ matrix.target }}
          path: packages
      - name: Verify checksum, install, test and remove
        env:
          TARGET: ${{ matrix.target }}
        run: |
          (cd packages && sha256sum -c "gnoblin-$TARGET-amd64.deb.sha256")
          scripts/test-deb.sh "packages/gnoblin-$TARGET-amd64.deb"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deb-${{ matrix.target }}-test-logs
          path: /home/tester/.local/state/gnoblin/
