name: openSUSE RPM adapter

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/opensuse-rpm.yml"
      - "packaging/opensuse/**"
      - "tests/opensuse-packaging.test.py"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        type: string
        required: true
      source_artifact:
        description: Release source artifact to package
        type: string
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tumbleweed-build:
    name: Tumbleweed RPM dependency chain
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: ${{ inputs.source_artifact == '' && 'recursive' || 'false' }}
      - name: Prepare Tumbleweed build container
        run: bash packaging/opensuse/prepare-tumbleweed-ci.sh git patch rpm-build tar xz python3
      - name: Trust the checked-out source tree in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Parse adapter boundaries
        run: python3 tests/opensuse-packaging.test.py
      - uses: actions/download-artifact@v4
        if: inputs.source_artifact != ''
        with:
          name: ${{ inputs.source_artifact }}
          path: release-assets
      - name: Extract the published source tarball
        if: inputs.source_artifact != ''
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          source_tarballs=(gnoblin-*-source.tar.xz)
          if [ "${#source_tarballs[@]}" -ne 1 ] || [ ! -f "${source_tarballs[0]}" ]; then
            echo "Expected exactly one complete Gnoblin source tarball" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/gnoblin-source-bundle"
          tar -xf "${source_tarballs[0]}" -C "$RUNNER_TEMP/gnoblin-source-bundle"
          mapfile -t bundle_roots < <(find "$RUNNER_TEMP/gnoblin-source-bundle" -mindepth 1 -maxdepth 1 -type d)
          test "${#bundle_roots[@]}" -eq 1
          gnoblin_version="${bundle_roots[0]##*/gnoblin-}"
          gnoblin_source="${bundle_roots[0]}/sources/gnoblin-${gnoblin_version}-source.tar.xz"
          install -m 0644 -- "release-assets/${source_tarballs[0]}" "$gnoblin_source"
          test -d "${bundle_roots[0]}/sources"
          printf '%s\n' "${bundle_roots[0]}/sources" > "$RUNNER_TEMP/gnoblin-source-directory"
      - name: Build private RPM chain
        env:
          GIT_COMMITTER_NAME: Gnoblin Package Builder
          GIT_COMMITTER_EMAIL: package-builder@gnoblin.local
        run: |
          if [ -f "$RUNNER_TEMP/gnoblin-source-directory" ]; then
            bash packaging/opensuse/build-chain.sh \
              "$RUNNER_TEMP/rpmbuild" "$(cat "$RUNNER_TEMP/gnoblin-source-directory")"
          else
            bash packaging/opensuse/build-chain.sh "$RUNNER_TEMP/rpmbuild"
          fi
      - name: Check RPM package isolation
        run: |
          mapfile -t rpms < <(
            find "$RUNNER_TEMP/rpmbuild/RPMS" -type f \( \
              -name 'gnoblin-mutter-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-devel-[0-9]*.rpm' -o \
              -name 'gnoblin-[0-9]*.rpm' \
            \) | sort
          )
          python3 scripts/check-rpm-isolation.py "${rpms[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: opensuse-tumbleweed-rpms
          path: ${{ runner.temp }}/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error
          retention-days: 30

  tumbleweed-coinstall:
    name: Tumbleweed GNOME coexistence and removal
    needs: tumbleweed-build
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Prepare Tumbleweed verification container
        run: bash packaging/opensuse/prepare-tumbleweed-ci.sh python3 rpm
      - uses: actions/download-artifact@v4
        with:
          name: opensuse-tumbleweed-rpms
          path: rpms
      - name: Install the private Gnoblin chain without stock GNOME
        run: |
          mapfile -t component_rpms < <(
            find rpms -type f \( \
              -name 'gnoblin-mutter-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-devel-[0-9]*.rpm' -o \
              -name 'gnoblin-portal-[0-9]*.rpm' -o \
              -name 'gnoblin-[0-9]*.rpm' \
            \) | sort
          )
          mapfile -t runtime_rpms < <(
            find rpms -type f \( \
              -name 'gnoblin-[0-9]*.rpm' -o \
              -name 'gnoblin-mutter-[0-9]*.rpm' \
            \) | sort
          )
          test "${#runtime_rpms[@]}" -eq 2
          integration_rpm="$(find rpms -type f -name 'gnoblin-gnome-integration-*.rpm' -print -quit)"
          test -n "$integration_rpm"
          python3 scripts/check-rpm-isolation.py "${component_rpms[@]}"
          zypper --non-interactive install --no-recommends --allow-unsigned-rpm "${runtime_rpms[@]}"
          rpm -q gnoblin gnoblin-mutter
          ! rpm -q gnoblin-portal
          ! rpm -q gnoblin-gnome-integration
          test ! -e /usr/share/xdg-desktop-portal/gnoblin-portals.conf
          portal_rpm="$(find rpms -type f -name 'gnoblin-portal-[0-9]*.rpm' -print -quit)"
          test -n "$portal_rpm"
          zypper --non-interactive install --no-recommends --allow-unsigned-rpm "$portal_rpm"
          rpm -q gnoblin-portal
          test -f /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          grep -q 'org.freedesktop.impl.portal.FileChooser;' /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          grep -q 'org.freedesktop.impl.portal.Inhibit;' /usr/share/xdg-desktop-portal/portals/gnoblin.portal
          ! rpm -q xdg-desktop-portal-gtk >/dev/null 2>&1
          test -f /usr/share/wayland-sessions/gnoblin.desktop
          grep -q '^Exec=/usr/lib/gnoblin/bin/gnoblin$' /usr/share/wayland-sessions/gnoblin.desktop
          test -f /usr/lib/systemd/user/gnoblin-session.target
          for stock_package in gdm gnome-session gnome-shell mutter gnome-settings-daemon xdg-desktop-portal-gnome; do
            ! rpm -q "$stock_package" >/dev/null 2>&1
          done
          zypper --non-interactive install --no-recommends --allow-unsigned-rpm "$integration_rpm"
          rpm -q gnoblin-gnome-integration gvfs gnome-keyring xdg-user-dirs
          for stock_package in gdm gnome-session gnome-shell mutter gnome-settings-daemon xdg-desktop-portal-gnome; do
            ! rpm -q "$stock_package" >/dev/null 2>&1
          done
      - name: Install stock GNOME beside Gnoblin
        run: |
          zypper --non-interactive install --no-recommends \
            gdm gnome-session gnome-shell mutter xdg-desktop-portal-gnome
          rpm -q gnome-session gnome-shell mutter
          rpm -V gnome-session gnome-shell mutter
      - name: Remove Gnoblin and reverify stock GNOME
        run: |
          zypper --non-interactive remove \
            gnoblin-gnome-integration gnoblin gnoblin-portal gnoblin-mutter
          ! test -e /usr/share/wayland-sessions/gnoblin.desktop
          ! test -e /usr/lib/systemd/user/gnoblin-session.target
          rpm -q gnome-session gnome-shell mutter
          rpm -V gnome-session gnome-shell mutter
