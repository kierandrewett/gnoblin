name: Gnoblin application E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/application-e2e.yml"
      - ".github/workflows/compositor-fuzz.yml"
      - "build.sh"
      - "patches/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "subprojects/mutter"
      - "subprojects/gnome-shell"
      - "subprojects/gnome-control-center"
      - "subprojects/xdg-desktop-portal-gnome"
  schedule:
    - cron: "18 3 * * 0"
  workflow_dispatch:
    inputs:
      full_sweep:
        description: Run all 40 shards (the complete 800-app catalog)
        type: boolean
        default: true
        required: true
      shard:
        description: Shard number 0-39 when full_sweep is false
        type: string
        default: "0"
        required: true
      trace_crash:
        description: Run the selected shard under GDB, record criticals and stop at fatal signals
        type: boolean
        default: false
        required: true
      app_ids:
        description: Optional comma-separated app IDs to isolate within the selected shard
        type: string
        default: ""
        required: false
      extra_monitor:
        description: Optional secondary monitor size, for example 1600x1000
        type: string
        default: ""
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-catalog:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 150
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - name: Install checkout tool
        run: dnf -y install git

      - name: Checkout Gnoblin and submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set container checkout ownership
        run: |
          chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch GNOME submodules with retry backoff
        run: scripts/checkout-submodules-with-retry.sh

      - name: Build Gnoblin and fetch Fedora software-store metadata
        run: |
          source scripts/build-deps.sh
          source /etc/os-release
          install_build_dependencies "$(build_distro_family "$ID" "${ID_LIKE:-}")" true false
          dnf -y install appstream-data
          useradd --create-home builder
          builder_uid="$(id -u builder)"
          install -d -o builder -g builder -m 700 "/run/user/$builder_uid"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            ./build.sh
          python3 tests/gnome-shell-overlay-resources.test.py
          python3 tests/e2e/app-window-selection.test.py
          python3 tests/e2e/app-failure-report.test.py
          mkdir -p e2e-ci-artifacts
          python3 tests/e2e/app-catalog.test.py
          python3 tests/e2e/app-catalog.py --output e2e-ci-artifacts/app-catalog.json
          # Keep executable modes and symlinks intact across artifact transfer.
          # Each app shard restores this tar before launching gnome-shell.
          tar -cf e2e-ci-artifacts/gnoblin-install-prefix.tar -C "$GITHUB_WORKSPACE" install

      - name: Select requested app shards
        id: matrix
        env:
          FULL_SWEEP: ${{ inputs.full_sweep || contains(github.event.pull_request.labels.*.name, 'gnoblin-full-e2e') }}
          REQUESTED_SHARD: ${{ inputs.shard }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          full_sweep = os.environ.get("FULL_SWEEP", "").lower() == "true"
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request" and not full_sweep:
              shards = [0]
          elif os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and os.environ["FULL_SWEEP"] != "true":
              shard = int(os.environ["REQUESTED_SHARD"])
              if not 0 <= shard < 40:
                  raise SystemExit("shard must be in the range 0..39")
              shards = [shard]
          else:
              shards = list(range(40))
          print("shards=" + json.dumps(shards))
          PY

      - name: Upload the build and live catalog
        uses: actions/upload-artifact@v4
        with:
          name: gnoblin-e2e-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-ci-artifacts/gnoblin-install-prefix.tar
            e2e-ci-artifacts/app-catalog.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  app-shard:
    needs: build-and-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.build-and-catalog.outputs.shards) }}
    steps:
      - name: Enable Flatpak user namespaces on the disposable runner
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Checkout test drivers
        uses: actions/checkout@v4

      - name: Download Gnoblin build and app catalog
        uses: actions/download-artifact@v4
        with:
          name: gnoblin-e2e-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          # The artifact's common root is e2e-ci-artifacts/; extract its files
          # back into that directory so the catalog and prefix paths line up.
          path: ${{ github.workspace }}/e2e-ci-artifacts

      - name: Run the real Fedora app shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TRACE_CRASH: ${{ inputs.trace_crash || false }}
          APP_IDS: ${{ inputs.app_ids }}
          GNOBLIN_E2E_EXTRA_MONITOR_OVERRIDE: ${{ inputs.extra_monitor }}
          GNOBLIN_E2E_FAILURE_POLICY: ${{ github.event_name == 'pull_request' && 'required' || 'strict' }}
          GNOBLIN_E2E_REQUIRED_APP_IDS: org.alacritty.Alacritty
          GNOBLIN_E2E_TEST_IBUS_DISCONNECT: ${{ (github.event_name == 'pull_request' || inputs.trace_crash) && '1' || '0' }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/e2e-shard-$SHARD_INDEX" \
            bash tests/e2e/run-app-shard-container.sh

      - name: Upload events, screenshots, install results and shell logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnoblin-app-e2e-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14

  report-app-failures:
    needs: [build-and-catalog, app-shard]
    if: >-
      always() && (needs.build-and-catalog.result == 'failure' || needs.app-shard.result == 'failure') &&
      github.event_name != 'pull_request' &&
      github.repository == 'kierandrewett/gnoblin'
    concurrency:
      group: gnoblin-app-e2e-issue-report-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the failure report builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download app shard reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gnoblin-app-e2e-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-app-failures

      - name: Install the pinned Beads CLI
        run: |
          install_root="$RUNNER_TEMP/beads-install"
          install -d "$install_root"
          curl -fsSL -o "$install_root/beads_1.2.2_linux_amd64.tar.gz" \
            https://github.com/steveyegge/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz
          curl -fsSL -o "$install_root/checksums.txt" \
            https://github.com/steveyegge/beads/releases/download/v1.2.2/checksums.txt
          grep '  beads_1.2.2_linux_amd64.tar.gz$' "$install_root/checksums.txt" > "$install_root/checksum.txt"
          (cd "$install_root" && sha256sum --check checksum.txt)
          tar -xzf "$install_root/beads_1.2.2_linux_amd64.tar.gz" -C "$install_root" bd
          install -m 0755 "$install_root/bd" "$RUNNER_TEMP/bd"

      - name: Create or update the Beads compatibility issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          export BEADS_DIR="$RUNNER_TEMP/gnoblin-beads/.beads"
          mkdir -p "$RUNNER_TEMP/gnoblin-beads"
          cd "$RUNNER_TEMP/gnoblin-beads" || exit
          bd init --prefix gnoblin --non-interactive --skip-hooks --skip-agents

          report="$RUNNER_TEMP/app-e2e-failure-report.md"
          python3 "$GITHUB_WORKSPACE/scripts/report-app-e2e-failures.py" \
            --artifact-root "$RUNNER_TEMP/e2e-app-failures" --output "$report"
          issue_title="$(sed -n 's/^# //p' "$report" | head -n 1)"
          existing_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$issue_title\"" --json number,url \
            --jq '.[0] | if . then "\(.number)\t\(.url)" else "" end')"
          existing_number="${existing_issue%%$'\t'*}"
          existing_url="${existing_issue#*$'\t'}"

          if [[ -n "$existing_number" ]]; then
            gh issue comment "$existing_url" --body-file "$report"
            gh issue edit "$existing_url" --body-file "$report"
            "$GITHUB_WORKSPACE/scripts/gnoblin-issues" pull "$existing_number"
            echo "Updated Beads/GitHub app compatibility issue: $existing_url"
            exit 0
          fi

          bead_id="$(bd create --silent --title "$issue_title" --type task --priority P2 --body-file "$report")"
          "$GITHUB_WORKSPACE/scripts/gnoblin-issues" push "$bead_id"
          echo "Created Beads/GitHub app compatibility issue: $bead_id"
