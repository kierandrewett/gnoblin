name: Gnoblin native session E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/application-e2e.yml"
      - "build.sh"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "patches/mutter/**"
      - "subprojects/mutter"
      - "subprojects/xdg-desktop-portal-gnome"
  push:
    branches: [main]
    paths:
      - ".github/workflows/application-e2e.yml"
      - "build.sh"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "patches/mutter/**"
      - "subprojects/mutter"
      - "subprojects/xdg-desktop-portal-gnome"
  schedule:
    - cron: "18 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native-session:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 180
    steps:
      - name: Install checkout tools
        run: dnf -y install git

      - name: Check out Gnoblin
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Mark the container checkout safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Fetch pinned compositor and portal sources
        run: git submodule update --init --recursive subprojects/mutter subprojects/xdg-desktop-portal-gnome

      - name: Prepare the Fedora build environment
        run: |
          dnf -y install dnf-plugins-core cmake ninja-build lua-devel glib2-devel \
            json-glib-devel desktop-file-utils gsettings-desktop-schemas \
            python3 weston dbus-daemon dbus-tools ibus flatpak grim util-linux-user
          dnf -y builddep --allowerasing packaging/rpm/mutter.spec packaging/rpm/gnoblin-portal.spec
          useradd --create-home builder
          builder_uid="$(id -u builder)"
          install -d -o builder -g builder -m 700 "/run/user/$builder_uid"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install Flatpak client fixture
        run: |
          flatpak remote-add --system --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --system --noninteractive --assumeyes \
            flathub org.gnome.TextEditor

      - name: Build Gnoblin with the nested-session viewer
        run: |
          builder_uid="$(id -u builder)"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="/run/user/$builder_uid" \
            GNOBLIN_DEVKIT=enabled \
            ./build.sh --jobs 2

      - name: Run native tests and a fresh nested session
        run: |
          set -euo pipefail
          builder_uid="$(id -u builder)"
          runtime_dir="/run/user/$builder_uid"
          socket_name=gnoblin-ci-host
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY="$socket_name" \
            weston --backend=headless --no-config --socket="$socket_name" --idle-time=0 \
            > "$GITHUB_WORKSPACE/build/logs/weston-host.log" 2>&1 &
          weston_pid=$!
          cleanup() {
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 300); do
            [[ -S "$runtime_dir/$socket_name" ]] && break
            kill -0 "$weston_pid" 2>/dev/null || {
              cat "$GITHUB_WORKSPACE/build/logs/weston-host.log" >&2
              exit 1
            }
            sleep 0.1
          done
          [[ -S "$runtime_dir/$socket_name" ]]

          runuser -u builder -- cmake --build "$GITHUB_WORKSPACE/build/ninja" \
            --target native-touchpad-router-test runtime-protocol-test runtime-spawn-test \
            autostart-protocol-test runtime-cache-test lua-pattern-test lua-config-test \
            lua-api-test glob-config-test gnoblinctl --parallel 2
          runuser -u builder -- ctest --test-dir "$GITHUB_WORKSPACE/build/ninja" --output-on-failure
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY="$socket_name" \
            GNOBLIN_PREFIX="$GITHUB_WORKSPACE/install" \
            bash tests/test-gnoblin-devkit.sh
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY="$socket_name" \
            GNOBLIN_PREFIX="$GITHUB_WORKSPACE/install" \
            GNOBLIN_ARTIFACT_DIR="$GITHUB_WORKSPACE/build/logs/flatpak-client" \
            python3 tests/test-flatpak-client-devkit.py
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY="$socket_name" \
            GNOBLIN_PREFIX="$GITHUB_WORKSPACE/install" \
            GNOBLINCTL="$GITHUB_WORKSPACE/install/bin/gnoblinctl" \
            python3 tests/window-lifecycle-fuzz.py \
              --seed 314159265 --steps 250 --max-windows 6 --timeout 600 \
              --artifact-dir "$GITHUB_WORKSPACE/build/logs/lifecycle-fuzz-seed-314159265"
          runuser -u builder -- env \
            XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY="$socket_name" \
            GNOBLIN_PREFIX="$GITHUB_WORKSPACE/install" \
            GNOBLIN_RUNTIME_BIN="$GITHUB_WORKSPACE/build/ninja/gnoblin" \
            bash tests/test-layer-latency.sh

      - name: Upload build and session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnoblin-native-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14
