[package]
name = "xr-session"
description = "The OpenXR session and frame loop for gnoblin-xr: a Runtime trait, the frame state machine, and an OpenXR-backed runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openxr = { version = "0.22", features = ["loaded"] }
xr-scene = { path = "../xr-scene" }

# The scripted `FakeRuntime` for the frame loop tests. Other crates that test a loop over
# `Runtime` enable it as a dev-dependency; it is not part of the shipped library.
[features]
testing = []

# Unsafe is needed only by the OpenXR shim (`openxr_runtime`), which calls the
# loader's unsafe entry points. The crate therefore drops the workspace table,
# which forbids unsafe, and restates the clippy levels with `unsafe_code = "deny"`
# (the rule in the root Cargo.toml, [workspace.lints]).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
