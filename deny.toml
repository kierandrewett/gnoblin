# cargo-deny policy for the Rust workspace.
#
# Gnoblin is GPL-2.0-or-later for the whole workspace (matching COPYING). A dependency is allowed only when its licence can
# be combined with that outbound licence; `just deny` runs this on every change.

# Gnoblin is a Linux desktop (Wayland, DRM, systemd, PipeWire) and its packages are built for x86_64 and aarch64 glibc. The crates that only
# build for Windows, macOS or Hermit (`windows-sys`, `windows-targets` and their `windows_*` target crates, `hermit-abi`) are never compiled
# into a Gnoblin binary, so the graph is the one of those two targets: a licence or a duplicate version of a crate no build links is not
# something a change can act on.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
# A pulled advisory release is a fixable supply-chain bug: fail the build.
yanked = "deny"
# Informational advisories have no fix and no action, so they do not gate CI: a
# *direct* dependency of this workspace that stops being maintained fails the build,
# and one further down the graph is reported and passes. `paste` is the case that
# makes the distinction matter: it is a compile-time macro crate that Smithay's Pixman
# renderer pulls in, every upstream alternative is a rename of the same code, and
# nothing this workspace writes can change it.
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members refer to each other by path without a version, which the
# wildcard rule would otherwise reject.
allow-wildcard-paths = true
deny = []
# A duplicate version is warned about, so every one that is left is recorded here with the crates that ask for each version and why no
# release makes them agree. Each entry skips the older version, and goes when its crate has a single version again (cargo-deny then warns
# that the skip matched nothing), so the list does not outlive its reasons. A `cargo update --dry-run` was read against every pair: the
# only duplicate a compatible release removes is `itertools` 0.14 (prost-build 0.14.6), which the lock now takes.
skip = [
    # Smithay's pinned revision (`allow-git` below) takes `drm` 0.14 and `pixman` 0.2. `drm` 0.15 exists, but no revision of Smithay we pin does.
    { crate = "rustix@0.38.44", reason = "drm 0.14.1 (smithay's pinned revision, through gbm 0.18) takes rustix ^0.38 beside the workspace's rustix 1" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38.44, above" },
    { crate = "linux-raw-sys@0.9.4", reason = "drm-sys 0.8.1 (drm-ffi 0.9.1, drm 0.14.1) takes linux-raw-sys ^0.9 beside rustix 1's 0.12" },
    { crate = "thiserror@1.0.69", reason = "pixman 0.2.1 (smithay's pixman renderer) takes thiserror ^1.0.50 beside the workspace's thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0.69, above" },
    # Build-time crates whose latest release asks for the older version.
    { crate = "hashbrown@0.15.5", reason = "petgraph 0.8.3, which prost-build 0.14 builds its message graph with, takes hashbrown ^0.15 beside indexmap's 0.17; petgraph 0.8.3 is its latest release" },
    { crate = "foldhash@0.1.5", reason = "hashbrown 0.15.5, above" },
    { crate = "itertools@0.13.0", reason = "bindgen 0.72.1 (libspa-sys and pipewire-sys 0.10.1, which ask for ^0.72) takes itertools <0.14 beside egui's and oxc's 0.15" },
    { crate = "shlex@1.3.0", reason = "bindgen 0.72.1, above, takes shlex ^1 beside cc 1.11's ^2" },
    { crate = "nom@7.1.3", reason = "cexpr 0.6.0 (bindgen 0.72.1, above) takes nom ^7 beside libspa 0.10.1's ^8" },
    { crate = "syn@2.0.119", reason = "proc-macro crates that still derive with syn 2 (bindgen, logos-codegen, miette-derive, prost-derive, thiserror-impl 1 and others) beside serde_derive, thiserror-impl 2 and others on syn 3" },
    # Libraries of the workspace's own dependencies whose latest release asks for the older version.
    { crate = "rustc-hash@1.1.0", reason = "naga 30.0.1 (naga 30.0.2 as well) takes rustc-hash ^1.1 beside the oxc crates' 2" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1, its latest release, takes miniz_oxide ^0.8 beside flate2's and oxc-browserslist's ^0.9" },
    { crate = "unicode-width@0.1.14", reason = "miette 7.6.0 (protox, at build time), its latest release, takes unicode-width ^0.1.11 beside textwrap's and codespan's 0.2" },
]
skip-tree = []

[licenses]
version = 2
# Allow only what can be combined with GPL-2.0-or-later:
#
# - permissive licences that impose no further condition on Gnoblin's own code:
#   0BSD, Apache-2.0 (and its LLVM exception), BSD-2-Clause, BSD-3-Clause,
#   BSL-1.0, ISC, MIT, MIT-0, Zlib;
# - public-domain dedications: CC0-1.0, Unlicense;
# - MPL-2.0, which is GPL-compatible through its secondary-licence clause;
# - Unicode-3.0, which every crate depending on unicode tables carries;
# - GPL-2.0-or-later and GPL-3.0-or-later, the outbound licence and the version
#   it may be upgraded to, plus their LGPL counterparts for libraries.
#
# Version-fixed copyleft licences (GPL-2.0-only, GPL-3.0-only, LGPL-2.1-only and
# friends) are deliberately absent: each one needs a case-by-case review before
# it can be combined with "or later" code, so a new one must be added on purpose
# rather than slipping in with a dependency bump.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# `cargo deny` reads crates, not data files. The one third-party asset a crate embeds is the font subset in
# `crates/gnoblin-paint/fonts/` (Droid Sans, Apache-2.0, on the list above); its notice lives beside it in that
# directory's README, since the repository keeps no separate third-party notices file.
# The allow-list is a policy for dependencies Gnoblin will have, not just the
# ones it has today, so an allowance no current dependency matches is expected
# and is not a warning.
unused-allowed-license = "allow"
# Per-crate exceptions, one reviewed entry each. A crate's licence is checked as
# a whole, so an exception names the crate and the licence terms it is allowed,
# and nothing else.
#
# sqlcipher-src: the SQLCipher amalgamation behind `rusqlite`'s bundled SQLCipher,
# which `gnoblin-keyring-store` uses for its database. Its expression is
# `MIT AND BSD-3-Clause AND blessing AND WTFPL`. `blessing` is the SQLite blessing
# (the dedication at the top of sqlcipher.c); `WTFPL` is the bundled libtomcrypt
# licence (sqlcipher/LICENSE-libtomcrypt). Both are permissive and place no
# obligation on Gnoblin's own code. Removal: drop when the keyring store no longer
# links SQLCipher.
[[licenses.exceptions]]
name = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

# epaint_default_fonts: the fonts egui bundles behind its `default_fonts` feature,
# used by the portal dialogs. Its expression is `(MIT OR Apache-2.0) AND OFL-1.1
# AND Ubuntu-font-1.0`; the font files ship with their own OFL.txt and UFL.txt.
# Removal: drop when egui no longer bundles these fonts.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[sources]
unknown-registry = "deny"
# Smithay is pinned to a git revision; whichever revision lands gets an
# entry here, so a dependency cannot silently start tracking a mutable branch.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git source the workspace allows, and the reason it is a git source
# rather than a registry release: the Smithay revision pinned in the root
# `Cargo.toml` is newer than 0.7.0 and carries protocols 0.7.0 does not. Adding a second entry here is a reviewable
# change to the pin policy, so a dependency cannot quietly start tracking a
# branch or someone else's fork.
allow-git = ["https://github.com/Smithay/smithay"]
