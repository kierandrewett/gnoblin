# cargo-deny policy for the Rust workspace.
#
# Gnoblin is GPL-2.0-or-later for the whole workspace (design/rust-compositor.md,
# D8, matching COPYING today). A dependency is allowed only when its licence can
# be combined with that outbound licence; `just deny` runs this on every change.
[advisories]
version = 2
# A pulled advisory release is a fixable supply-chain bug: fail the build.
yanked = "deny"
# Informational advisories have no fix and no action, so they do not gate CI: a
# *direct* dependency of this workspace that stops being maintained fails the build,
# and one further down the graph is reported and passes. `paste` is the case that
# makes the distinction matter: it is a compile-time macro crate that Smithay's Pixman
# renderer pulls in, every upstream alternative is a rename of the same code, and
# nothing this workspace writes can change it.
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members refer to each other by path without a version, which the
# wildcard rule would otherwise reject.
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[licenses]
version = 2
# Allow only what can be combined with GPL-2.0-or-later:
#
# - permissive licences that impose no further condition on Gnoblin's own code:
#   0BSD, Apache-2.0 (and its LLVM exception), BSD-2-Clause, BSD-3-Clause,
#   BSL-1.0, ISC, MIT, MIT-0, Zlib;
# - public-domain dedications: CC0-1.0, Unlicense;
# - MPL-2.0, which is GPL-compatible through its secondary-licence clause;
# - Unicode-3.0, which every crate depending on unicode tables carries;
# - GPL-2.0-or-later and GPL-3.0-or-later, the outbound licence and the version
#   it may be upgraded to, plus their LGPL counterparts for libraries.
#
# Version-fixed copyleft licences (GPL-2.0-only, GPL-3.0-only, LGPL-2.1-only and
# friends) are deliberately absent: each one needs a case-by-case review before
# it can be combined with "or later" code, so a new one must be added on purpose
# rather than slipping in with a dependency bump.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The allow-list is a policy for dependencies Gnoblin will have, not just the
# ones it has today, so an allowance no current dependency matches is expected
# and is not a warning.
unused-allowed-license = "allow"
# Per-crate exceptions, one reviewed entry each. A crate's licence is checked as
# a whole, so an exception names the crate and the licence terms it is allowed,
# and nothing else.
#
# sqlcipher-src: the SQLCipher amalgamation behind `rusqlite`'s bundled SQLCipher,
# which `gnoblin-keyring-store` uses for its database. Its expression is
# `MIT AND BSD-3-Clause AND blessing AND WTFPL`. `blessing` is the SQLite blessing
# (the dedication at the top of sqlcipher.c); `WTFPL` is the bundled libtomcrypt
# licence (sqlcipher/LICENSE-libtomcrypt). Both are permissive and place no
# obligation on Gnoblin's own code. Removal: drop when the keyring store no longer
# links SQLCipher.
[[licenses.exceptions]]
name = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

# epaint_default_fonts: the fonts egui bundles behind its `default_fonts` feature,
# used by the portal dialogs. Its expression is `(MIT OR Apache-2.0) AND OFL-1.1
# AND Ubuntu-font-1.0`; the font files ship with their own OFL.txt and UFL.txt.
# Removal: drop when egui no longer bundles these fonts.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[sources]
unknown-registry = "deny"
# Smithay is pinned to a git revision (D7); whichever revision lands gets an
# entry here, so a dependency cannot silently start tracking a mutable branch.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git source the workspace allows, and the reason it is a git source
# rather than a registry release: the Smithay revision pinned in the root
# `Cargo.toml` is newer than 0.7.0 and carries protocols 0.7.0 does not
# (design/rust-compositor.md, D7). Adding a second entry here is a reviewable
# change to the pin policy, so a dependency cannot quietly start tracking a
# branch or someone else's fork.
allow-git = ["https://github.com/Smithay/smithay"]
