[package]
name = "gnoblin-example-native-errors"
description = "Example 39: a native shell that reads the code and target of the errors a refused call gives: already_exists, not_found and a bad argument."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_errors"
crate-type = ["cdylib"]

# The shell depends on the core SDK and nothing else. A failed call gives a `Fail` that says why it failed (`code`) and which call it was
# (`target`); `?` turns it into the core's own error type, which keeps the words and not the code.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }

[lints]
workspace = true
