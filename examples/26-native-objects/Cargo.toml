[package]
name = "gnoblin-example-native-objects"
description = "Example 26: a native shell that makes a workspace, gives it layouts of the library and of its own, and moves a divider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_objects"
crate-type = ["cdylib"]

# The shell depends on the std SDK and the core SDK and nothing else. The typed classes it uses (`gnoblin_std::objects`) are written at
# build time from the library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }
gnoblin-std = { path = "../../crates/gnoblin-std" }

[lints]
workspace = true
