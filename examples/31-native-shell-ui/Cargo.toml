[package]
name = "gnoblin-example-native-shell-ui"
description = "Example 31: a native shell that starts the not-responding alert and the lock screen, and opens the launcher and flips the overview from chords."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_shell_ui"
crate-type = ["cdylib"]

# The shell depends on the std SDK and the core SDK and nothing else. The typed classes it uses (`gnoblin_std::objects`) are written at
# build time from the library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }
gnoblin-std = { path = "../../crates/gnoblin-std" }

[lints]
workspace = true
