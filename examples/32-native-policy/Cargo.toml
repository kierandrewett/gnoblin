[package]
name = "gnoblin-example-native-policy"
description = "Example 32: a native shell that starts the stock window policy of libgnoblin-std (focus, the requests of windows, the keyboard move and resize), refuses fullscreen requests with a listener of its own, and binds the move, resize and workspace slide gestures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_policy"
crate-type = ["cdylib"]

# The shell depends on the std SDK and the core SDK and nothing else. The typed classes it uses (`gnoblin_std::objects`) are written at
# build time from the library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }
gnoblin-std = { path = "../../crates/gnoblin-std" }

[lints]
workspace = true
