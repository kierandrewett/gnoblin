[package]
name = "gnoblin-example-native-scene"
description = "Example 24: a native shell that places a view and a camera in the scene of libgnoblin-std and reads their placement back."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_scene"
crate-type = ["cdylib"]

# The shell depends on the std SDK and the core SDK and nothing else. The typed classes it uses (at the root of `gnoblin_std`) are written at
# build time from the library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }
gnoblin-std = { path = "../../crates/gnoblin-std" }

[lints]
workspace = true
