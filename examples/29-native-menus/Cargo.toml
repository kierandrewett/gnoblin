[package]
name = "gnoblin-example-native-menus"
description = "Example 29: a native shell that starts the window menu with entries of its own, and says what the menu does."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_menus"
crate-type = ["cdylib"]

# The shell depends on the std SDK and the core SDK and nothing else. The typed classes it uses (at the root of `gnoblin_std`) are written at
# build time from the library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }
gnoblin-std = { path = "../../crates/gnoblin-std" }

[lints]
workspace = true
