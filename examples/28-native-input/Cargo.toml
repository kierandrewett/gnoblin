[package]
name = "gnoblin-example-native-input"
description = "Example 28: a native shell that binds key chords on the seat's input context of libgnoblin-core: shared claims, priority, decline, and a chord handed to the next generation across a reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_input"
crate-type = ["cdylib"]

# The shell depends on the core SDK and nothing else. The classes it uses (`gnoblin_core::objects`) are written at build time from the
# library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }

[lints]
workspace = true
