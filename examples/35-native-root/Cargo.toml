[package]
name = "gnoblin-example-native-root"
description = "Example 35: a native shell that uses the members of the gnoblin root object of libgnoblin-core: timers, the build identity, find, motion and the compositor's settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "native_root"
crate-type = ["cdylib"]

# The shell depends on the core SDK and nothing else. The classes it uses (at the root of `gnoblin_core`) are written at build time from the
# library's catalog and call the library through its object table.
[dependencies]
gnoblin-core = { path = "../../crates/gnoblin-core" }

[lints]
workspace = true
