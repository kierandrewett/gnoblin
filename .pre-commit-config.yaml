# Shared language checks match Bingux; Gnoblin also syncs issue tracking.
minimum_pre_commit_version: "4.6.2"
default_stages: [pre-commit]
exclude: '(^|/)(build|install|dist|target|node_modules|vendor|third_party)/|\.patch$|\.lock$'
repos:
  - repo: local
    hooks:
      - id: markdown-jev-review
        name: Gnoblin Markdown review (Jev)
        entry: python3 scripts/markdown-style.py review --fail-on-flags
        language: system
        types: [markdown]
        files: '^docs/.*\.md$'
        require_serial: true
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        types: [python]
        additional_dependencies: ["ruff==0.16.7"]
        require_serial: true
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --severity=warning
        language: python
        types: [shell]
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
        require_serial: true
      # typescript-eslint 8.72.2 supports typescript <6.1.0, so eslint gets 6.0.3 while scripts/js-typecheck.sh
      # type-checks with 7.0.2. The pins must match scripts/js-lint.sh, which refuses to run when they differ.
      - id: eslint
        name: eslint
        entry: eslint --no-warn-ignored
        language: node
        files: '\.(js|mjs|cjs|ts)$'
        additional_dependencies:
          [
            "prettier@3.9.6",
            "eslint@10.10.0",
            "typescript-eslint@8.72.2",
            "typescript@6.0.3",
            "@eslint/js@10.0.1",
            "eslint-plugin-svelte@3.23.1",
            "globals@17.13.0",
            "svelte@5.57.3",
          ]
        language_version: "22.16.0"
        require_serial: true
      - id: ruff-check
        name: ruff-check
        entry: ruff format --check
        language: python
        types: [python]
        additional_dependencies: ["ruff==0.16.7"]
        require_serial: true
      - id: shfmt-check
        name: shfmt-check
        entry: shfmt -i 4 -ci -d
        language: python
        types: [shell]
        additional_dependencies: ["shfmt-py==4.2.0"]
        require_serial: true
      - id: prettier-check
        name: prettier-check
        entry: prettier --check
        language: node
        files: '\.(mjs|cjs|js|json|ya?ml|md|scss|css|html|ts)$'
        additional_dependencies: ["prettier@3.9.6", "eslint@10.10.0"]
        language_version: "22.16.0"
        require_serial: true
      - id: rustfmt-check
        name: rustfmt-check
        entry: rustfmt --edition 2024 --config skip_children=true --check
        language: system
        types: [rust]
        require_serial: true
      - id: beads-github-sync
        name: Sync Beads with GitHub Issues
        entry: ./scripts/gnoblin-issues sync --prefer-newer
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: python
        types: [python]
        additional_dependencies: ["ruff==0.16.7"]
        stages: [manual]
        require_serial: true
      - id: shfmt-format
        name: shfmt-format
        entry: shfmt -i 4 -ci -w
        language: python
        types: [shell]
        additional_dependencies: ["shfmt-py==4.2.0"]
        stages: [manual]
        require_serial: true
      - id: prettier-format
        name: prettier-format
        entry: prettier --write
        language: node
        files: '\.(mjs|cjs|js|json|ya?ml|md|scss|css|html|ts)$'
        additional_dependencies: ["prettier@3.9.6", "eslint@10.10.0"]
        language_version: "22.16.0"
        stages: [manual]
        require_serial: true
      - id: rustfmt-format
        name: rustfmt-format
        entry: rustfmt --edition 2024 --config skip_children=true
        language: system
        types: [rust]
        stages: [manual]
        require_serial: true
