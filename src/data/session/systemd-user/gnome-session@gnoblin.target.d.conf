# Wire the gnoblin shell + settings-daemon backends into the gnoblin session.
#
# Modern systemd-managed gnome-session does NOT act on the .session file's
# RequiredComponents= line. A session's components are pulled in entirely
# through systemd: gnome-session@<session>.target takes its dependencies from a
# gnome-session@<session>.target.d/ drop-in. Stock GNOME's drop-in requires
# gnome-session-basic-services.target, which hardcodes
# `Requires=org.gnome.Shell.target` -- the STOCK shell -- so gnoblin cannot
# reuse it and wires its own shell target here instead.
#
# Without this file the gnoblin session reaches gnome-session@gnoblin.target
# with nothing beneath it: no compositor starts and login lands on a frozen
# black screen.
[Unit]
Requires=org.gnoblin.Shell.target
Wants=org.gnome.SettingsDaemon.A11ySettings.target
Wants=org.gnome.SettingsDaemon.Color.target
Wants=org.gnome.SettingsDaemon.Housekeeping.target
Wants=org.gnome.SettingsDaemon.Keyboard.target
Wants=org.gnome.SettingsDaemon.MediaKeys.target
Wants=org.gnome.SettingsDaemon.Power.target
Wants=org.gnome.SettingsDaemon.PrintNotifications.target
Wants=org.gnome.SettingsDaemon.Rfkill.target
Wants=org.gnome.SettingsDaemon.ScreensaverProxy.target
Wants=org.gnome.SettingsDaemon.Sharing.target
Wants=org.gnome.SettingsDaemon.Smartcard.target
Wants=org.gnome.SettingsDaemon.Sound.target
Wants=org.gnome.SettingsDaemon.UsbProtection.target
Wants=org.gnome.SettingsDaemon.Wacom.target
Wants=org.gnome.SettingsDaemon.XSettings.target
