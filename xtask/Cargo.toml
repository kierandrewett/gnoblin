[package]
name = "xtask"
description = "Workspace automation: dependency-rule checks over cargo metadata, and later code generation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The dependency rules read `cargo metadata` JSON. serde_json is the only
# dependency this crate needs and it is not linked into any shipped binary.
serde_json.workspace = true

[lints]
workspace = true
