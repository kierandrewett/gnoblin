[package]
name = "xtask"
description = "Workspace automation: dependency-rule checks over cargo metadata, and code generation from the object schema."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The dependency rules read `cargo metadata` JSON, and gen-proto reads the schema
# files. Neither dependency is linked into a shipped binary.
serde_json.workspace = true
gnoblin-schema = { path = "../crates/gnoblin-schema" }

[lints]
workspace = true
