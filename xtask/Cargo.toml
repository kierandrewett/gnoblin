[package]
name = "xtask"
description = "Workspace automation: dependency-rule checks over cargo metadata, and code generation from the object schema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The dependency rules read `cargo metadata` JSON, and gen-proto reads the schema
# files. Neither dependency is linked into a shipped binary.
serde_json.workspace = true
gnoblin-schema = { path = "../crates/gnoblin-schema" }
# `abi-check` and `abi-header` read the ABI crate's own declarations (layouts, constants, exports), so the lock and
# the C header are computed from what the compiler saw. `dist-check` and the dist tests also build its link stub.
gnoblin-core-abi = { path = "../crates/gnoblin-core-abi", features = ["build-support"] }
# The std library's ABI is read the same way: its lock, its header and its link stub (`gnoblin-std-abi`).
gnoblin-std-abi = { path = "../crates/gnoblin-std-abi", features = ["build-support"] }
# The generator of every language SDK: `dist` installs its editor files and `docs-parity` reads its TypeScript surface.
gnoblin-sdkgen = { path = "../crates/gnoblin-sdkgen" }
# The declarations a prefix installs (`share/gnoblin/types/`): the globals and the tsconfig, from the crate `gnoblinctl types init` writes them with.
gnoblin-js-types = { path = "../crates/gnoblin-js-types" }

# The duplicate-type report parses every crate's Rust source, so it needs the
# parser rather than a pattern match. These are build-tool dependencies only:
# nothing they produce is linked into a shipped binary, and each licence (MIT or
# Apache-2.0) is already on the allow-list in deny.toml.
syn = { version = "2.0.119", features = ["full"] }
quote = "1.0.47"
# `span-locations` is what gives a declaration its line number outside a proc
# macro, which is where this report runs.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
# The allow-list is TOML, like the rest of the repository's declarations.
serde.workspace = true
toml.workspace = true
# The install manifest records a sha256 for every file the install writes.
sha2.workspace = true
# `watch-shell` rebuilds a native shell with the shell host's build step and watches its source with the host's file watcher.
gnoblin-shell-host = { path = "../crates/gnoblin-shell-host" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
