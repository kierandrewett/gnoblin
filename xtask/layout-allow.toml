# Reviewed references for `cargo xtask layout`: files and directories that name a root `src/` or `patches/` path.
# Both trees were removed with the Mutter product (it lives on `main`), so each entry is either a crate-relative
# `src/` the scanner cannot tell from a root one, or a file that names a path of the legacy tree on purpose. Each entry
# covers a file or everything below a directory and carries its reason. A retired `src/data` reference is never
# allowed here, so it is absent by design.

[[allow]]
path = "design"
reason = "the design notes describe where the retired C tree and patch series lived, so they name src/ and patches/"

[[allow]]
path = "tests/parity/contracts"
reason = "the recorded contract names the legacy C sources (src/control/..., src/cli/...) each entry was read from"

[[allow]]
path = "tests/native-probe/libraries.toml"
reason = "an evidence string quotes the xkbcommon crate's own src/xkb/ffi.rs"

[[allow]]
path = "tests/pkgrepo/containers.sh"
reason = "a shell variable named src holds the checkout: $src/scripts/pkgrepo is not a root reference"

[[allow]]
path = "tests/wlcs/patches"
reason = "a patch header names wlcs's own src/in_process_server.cpp, in the upstream suite it patches"

[[allow]]
path = "crates/gnoblin/Cargo.toml"
reason = "crate-relative: path = \"src/main.rs\" is this crate's own binary, resolved from the crate directory"

[[allow]]
path = "crates/xdg-desktop-portal-gnoblin/Cargo.toml"
reason = "crate-relative: path = \"src/main.rs\" is this crate's own binary, resolved from the crate directory"

[[allow]]
path = "crates/gnoblin-client/Cargo.toml"
reason = "crate-relative: a comment naming this crate's own src/inherit.rs"

[[allow]]
path = "crates/gnoblin-config/Cargo.toml"
reason = "crate-relative: a comment naming this crate's own src/last_good.rs"

[[allow]]
path = "crates/gnoblin-schema/Cargo.toml"
reason = "crate-relative: a comment naming this crate's own src/parse.rs"

[[allow]]
path = "crates/gnoblinctl/build.rs"
reason = "crate-relative: the build script names src/generate.rs in this crate, run from the crate directory"

[[allow]]
path = "crates/gnoblin/tests/support/native_shell.rs"
reason = "crate-relative: the throwaway cargo project the hot-reload shell is rebuilt in has its own src/lib.rs, written there by the test"

[[allow]]
path = "crates/compat/gnoblin-compat-wayland-gtk-shell1/protocols/gtk-shell.xml"
reason = "the vendored protocol header records Mutter's src/wayland path it was copied from, not a path we read"


[[allow]]
path = "xtask/src/layout.rs"
reason = "the rule's own constants name the root prefixes it checks, and its tests feed it a root-relative path"