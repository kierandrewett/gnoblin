# The table of the Wayland protocol crates (design/protocol-crates.md): one row per crate under
# crates/protocols/. `cargo xtask protocol-crates` writes each crate's Cargo.toml and the aggregate
# crate (crates/protocols/all) from it, and `--check` fails when the tree and the table differ.
#
# A crate's name is `gnoblin-wayland-<name>` and its directory is `crates/protocols/<name>`. The name is
# the protocol's own, with underscores turned into hyphens and its version suffix kept. A crate
# that holds code two protocols share has `kind = "shared"` and a name that ends in `-shared`; a
# protocol crate lists the shared crates it uses in `needs`. `gnoblin-wayland-api` is a dependency of
# every crate and is not listed.
#
# `[dependencies]` is the one list of the manifest lines a row may name. A row names a line by its
# key in `deps` or `dev-deps`; the value here is the text on the right of the `=`.

[dependencies]
smithay = '{ workspace = true }'
gnoblin-types = '{ workspace = true }'
gnoblin-log = '{ path = "../../gnoblin-log" }'
getrandom = '{ workspace = true }'
gnoblin-input = '{ path = "../../gnoblin-input" }'
gnoblin-authority = '{ path = "../../gnoblin-authority" }'
gnoblin-render-frame = '{ path = "../../gnoblin-render-frame" }'
wayland-protocols-misc = '{ version = "0.3.12", features = ["server"] }'
wayland-protocols-plasma = '{ version = "0.3.12", features = ["server"] }'

