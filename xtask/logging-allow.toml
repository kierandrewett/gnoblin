# Reviewed exceptions for `cargo xtask logging`: library sources allowed to write to stdout or stderr
# directly. Each entry names a file or a directory (prefix match) and why it is not a log call.

[[allow]]
path = "crates/gnoblin-parity"
reason = "gnoblin-parity is a command-line tool: its stdout is the report it exists to print, and its stderr is its usage and error text"

[[allow]]
path = "crates/gnoblin-log/src/file.rs"
reason = "the stderr report of a failed log write: it names the failure once per run of failures, and it must not go through the log pipeline it is reporting on, since the same write would fail again"

[[allow]]
path = "crates/gnoblin-wlcs"
reason = "gnoblin-wlcs is a plugin the wlcs executable loads: its stderr is the only channel to the person running the suite, and it reports a session that did not start or a window it could not place, which no log sink is configured to show inside that process"

[[allow]]
path = "crates/gnoblin-testkit/src/backend_status.rs"
reason = "a test-support helper: a conformance row that cannot be measured on this machine (no GPU renderer) says so on the test's own stdout, which the test runner shows, so a skip is loud and never silent"

[[allow]]
path = "crates/gnoblin/src/main.rs"
reason = "the launcher's usage errors (a shell path that is not a file, or given to a role that serves none) are for the person at the terminal and are written before any role has installed a log"

[[allow]]
path = "crates/gnoblin-core-impl/src/role.rs"
reason = "the core's usage error for a command line it does not serve is for the person at the terminal and is written before the compositor's log is installed"

[[allow]]
path = "crates/gnoblin-core-impl/src/check_role.rs"
reason = "the dry run of a shell module answers on standard output: the verdict is the protocol `gnoblinctl check` reads, and the role installs no log of the session's"

[[allow]]
path = "crates/gnoblin-sdkgen/src/lib.rs"
reason = "`emit_for_build` is the body of a build script: the `cargo:` directives it prints on stdout are how a build script talks to cargo, and a failure's one line on stderr is what cargo shows. It runs before any log pipeline exists"

[[allow]]
path = "crates/gnoblin-render-frame/src/golden.rs"
reason = "the shared golden check of the renderer crates' tests: a renderer that cannot draw on this machine (no device) says so on the test's own stdout, which the test runner shows, so a skip is loud and never silent"

[[allow]]
path = "crates/gnoblin-render-vulkan/src/tests"
reason = "the Vulkan renderer's device tests live in files of a `tests` directory, which the checker does not recognise as test-only; a test that needs a Vulkan device or a udmabuf says so on the test's own stdout, which the test runner shows, so a skip is loud and never silent"
