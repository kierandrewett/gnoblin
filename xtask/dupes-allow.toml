# Duplicate-type exemptions for `cargo xtask dupes`.
#
# Every entry is a reviewed pair of declarations that share a name (or a shape)
# while naming genuinely different things. A migration target is deliberately
# absent: `Rect`, `Size`, `Point`, `Insets`, `Version`, `Tick`, `Revision` and the
# identity newtypes stay reported until the crate that defines them moves to
# `gnoblin-types`, because the report is what tracks that work.
#
# `kind` scopes an entry to one check; omit it to waive every check for the pair.

[[allow]]
left = "gnoblin-a11y::Effect"
right = "gnoblin-authority::Effect"
kind = "same-name"
reason = "each crate's effect enum is what its own state machine asks the caller to do; the name is shared, the meaning is not"

