<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <script>
            // Apply the stored appearance before the first paint so the page never flashes the other scheme.
            // Without a stored choice the page follows the system setting, and keeps following it.
            (function () {
                var root = document.documentElement;
                var query = window.matchMedia("(prefers-color-scheme: dark)");
                function stored() {
                    try {
                        var value = localStorage.getItem("gnoblin-scheme");
                        return value === "light" || value === "dark" ? value : null;
                    } catch (error) {
                        return null;
                    }
                }
                function apply() {
                    root.dataset.scheme = stored() || (query.matches ? "dark" : "light");
                }
                apply();
                query.addEventListener("change", apply);
            })();
        </script>
        <script>
            // The language of the examples, applied before the first paint like the scheme: `?lang=python` picks it
            // (and keeps it), otherwise the stored choice. src/lib/styles/content.css shows `data-lang` on <html>.
            (function () {
                var languages = ["typescript", "python", "rust"];
                var lang = null;
                try {
                    var asked = new URLSearchParams(location.search).get("lang");
                    if (languages.indexOf(asked) !== -1) {
                        lang = asked;
                        localStorage.setItem("gnoblin-language", asked);
                    } else {
                        var stored = localStorage.getItem("gnoblin-language");
                        if (languages.indexOf(stored) !== -1) lang = stored;
                    }
                } catch (error) {
                    // Storage is off: the choice in the address still applies.
                }
                if (lang) document.documentElement.dataset.lang = lang;
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
