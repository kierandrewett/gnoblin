<!-- Added to the head of every rustdoc page of the Rust SDK reference (scripts/reference.mjs passes it as --html-in-header). It puts a way
     to the other two languages and the docs at the top of the sidebar, as the Python reference's banner does. -->
<style>
    .gnoblin-reference {
        margin: 0 0 0.75rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.8125rem;
        line-height: 1.5;
        border-bottom: 1px solid var(--border-color);
    }
    .gnoblin-reference a {
        margin-right: 0.5rem;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const bar = document.createElement("p");
        bar.className = "gnoblin-reference";
        bar.innerHTML =
            '<a href="/docs/reference">API reference</a>: ' +
            '<a href="/reference/typescript/">TypeScript</a> ' +
            '<a href="/reference/python/">Python</a> Rust ' +
            '<a href="/docs/rust-shell">Rust shell guide</a>';
        const sidebar = document.querySelector("nav.sidebar");
        if (sidebar) sidebar.prepend(bar);
    });
</script>
