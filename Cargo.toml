# The Gnoblin Cargo workspace.
#
# Layout, crate ownership and the dependency rules enforced by `cargo xtask
# deps` come from design/rust-compositor.md ("Project structure" and
# "Dependency rules"). This manifest holds no code: it lists members, the shared
# package fields, the shared lint levels and the pinned versions that members
# inherit from `[workspace.dependencies]`.

[workspace]
resolver = "3"
members = [
    "crates/compat/gnoblin-compat-core",
    "crates/compat/gnoblin-compat-gnome-keyring-prompter",
    "crates/compat/gnoblin-compat-gnome-session-manager",
    "crates/compat/gnoblin-compat-gnome-shell-introspect",
    "crates/compat/gnoblin-compat-gnome-shell-screenshot",
    "crates/compat/gnoblin-compat-gtk-dconf-settings",
    "crates/compat/gnoblin-compat-gtk-shell1",
    "crates/compat/gnoblin-compat-mutter-clipboard",
    "crates/compat/gnoblin-compat-mutter-displayconfig",
    "crates/compat/gnoblin-compat-mutter-idlemonitor",
    "crates/compat/gnoblin-compat-mutter-inputcapture",
    "crates/compat/gnoblin-compat-mutter-inputmapping",
    "crates/compat/gnoblin-compat-mutter-remotedesktop",
    "crates/compat/gnoblin-compat-mutter-screencast",
    "crates/compat/gnoblin-compat-mutter-servicechannel",
    "crates/compat/gnoblin-compat-mutter-x11-interop",
    "crates/compat/gnoblin-compat-qt-portal-settings",
    "crates/compat/gnoblin-compat-x11-xsettings",
    "crates/gnoblin",
    "crates/gnoblin-a11y",
    "crates/gnoblin-authority",
    "crates/gnoblin-backend",
    "crates/gnoblin-capture",
    "crates/gnoblin-client",
    "crates/gnoblin-compositor",
    "crates/gnoblin-config",
    "crates/gnoblin-config-codegen",
    "crates/gnoblin-diag",
    "crates/gnoblin-input",
    "crates/gnoblin-lock",
    "crates/gnoblin-lua",
    "crates/gnoblin-model",
    "crates/gnoblin-output",
    "crates/gnoblin-parity",
    "crates/gnoblin-proto",
    "crates/gnoblin-render",
    "crates/gnoblin-schema",
    "crates/gnoblin-services",
    "crates/gnoblin-session",
    "crates/gnoblin-testkit",
    "crates/gnoblin-types",
    "crates/gnoblin-wasm",
    "crates/gnoblin-wayland",
    "crates/gnoblin-wm",
    "crates/gnoblin-xwayland",
    "crates/gnoblinctl",
    "crates/xdg-desktop-portal-gnoblin",
    "xtask",
]

[workspace.package]
# The rewrite ships as 0.2.0 and the IPC version is exactly the Gnoblin version,
# so candidate builds are `0.2.0-alpha.N` (design/rust-compositor.md,
# "Versioning"). xtask copies the released version from
# versions/gnoblin-version.json at release time; do not edit this by hand.
version = "0.2.0-alpha.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/kierandrewett/gnoblin"
# Workspace crates are built from the tree and packaged by the distribution
# packaging, never uploaded to crates.io.
publish = false
# `rust-version` is deliberately unset. The MSRV is the highest floor of the
# exact pinned dependencies, not a release number (design/rust-compositor.md,
# "Distribution and toolchain"), and no crate depends on anything yet. The
# rust-toolchain.toml pin covers development until that job exists.

# Lints every crate inherits with `[lints] workspace = true`.
#
# `unsafe_code = "forbid"` cannot be lifted anywhere inside a crate that inherits
# this table, which is the point: pure policy crates and the skeleton stay free
# of unsafe. A crate that must call C (libinput, libdrm, libseat, GBM) opts out by
# dropping `[lints] workspace = true` and declaring its own table that restates
# the clippy levels below with `unsafe_code = "deny"`; it then confines unsafe to
# named FFI shim modules that each open with `#[allow(unsafe_code)]` and a
# `// SAFETY:` comment. Adding such a crate is a reviewable change to this file
# and to the dependency rules in `xtask/src/deps.rs`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Versions every member shares, so a bump is one line per dependency instead of
# one line per crate. Members inherit these with `serde_json.workspace = true`.
#
# Every entry's licence is on the allow-list in deny.toml: prost, prost-build,
# prost-types and prost-reflect (Apache-2.0), protox and protox-parse (MIT or
# Apache-2.0), serde and serde_json (MIT or Apache-2.0), toml (MIT).
[workspace.dependencies]
# Protocol Buffers messages for the IPC (design/rust-compositor.md, D16).
prost = "0.14.4"
# `build.rs` in gnoblin-proto generates the `.proto` text from the schema and
# compiles it with the pure-Rust front end, so nothing generated is checked in and a
# build needs no protoc binary and no C++ toolchain.
prost-build = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"
# The schema file format (crates/gnoblin-schema/src/parse.rs says why TOML).
toml = "1.2.0"
# The Wayland compositor library the engine is built on (design/rust-compositor.md,
# D7). A git revision, not a crates.io release: 0.7.0 is from 2025-06-24 and lacks
# protocols the session needs (`ext-image-copy-capture-v1`), so the pin tracks
# master until a release carries them. Every member takes the same revision, and a
# bump is its own change with a full parity run.
#
# Revision: 65aa86fa5236e41775c313408102a5d5c2d1e2ca (2026-11-04, "input/tablet:
# Send the old focus its frame before proximity_in"). Reported version is 0.7.0,
# `rust-version` 1.87, so the toolchain pin builds it.
#
# `default-features = false` keeps the DRM, libinput, X11, winit and Xwayland
# backends out of the dependency graph until their crates ask for them: a member
# adds the features it needs on top of this entry. `renderer_pixman` is here and
# not in a member because D12's software path is the reference renderer: it links
# the system `pixman-1` and turns `#[cfg]`s on in Smithay's own modules, both of
# which must look the same for the whole workspace.
smithay = { git = "https://github.com/Smithay/smithay", rev = "65aa86fa5236e41775c313408102a5d5c2d1e2ca", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
# The Lua VM the script runtime embeds (design/rust-compositor.md, D10). Lua 5.5
# is vendored and compiled by the build so the runtime links one Lua version on
# every distribution target instead of whatever the distribution ships. Only
# `gnoblin-lua` may name it: the dependency rules forbid it in a foundation crate,
# because the configuration and model layers must work with no Lua at all.
mlua = { version = "0.12.2", features = ["lua55", "vendored"] }

# Command line parsing for `gnoblinctl`. Its command tree is generated from the
# object schema at build time, so it uses the builder API rather than derive: a
# generated tree cannot be a derive struct. Colour is off because `gnoblinctl`
# output is read by scripts as often as by people.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
# Shell completion scripts, rendered from the same clap tree so a completion can
# never offer a member the schema does not declare.
clap_complete = "4.6.9"

# The shared primitives: geometry, transform, scale, identities, ticks and error
# codes. Every crate that names a rectangle or an output uses this crate instead
# of declaring its own.
gnoblin-types = { path = "crates/gnoblin-types" }
# The WebAssembly runtime the module host embeds (design/rust-compositor.md, D6).
# The component model is the host API's shape: a WIT package generated from the
# schema, so a module links against the object model and a member that moved is a
# link error rather than a call that misbehaves.
#
# Default features are off because the default set pulls in the CLI, the compile
# cache, profiling, the async engine and the GC proposals, none of which the host
# uses, and every one of them is code that runs inside the compositor. What is
# left is the smallest set that compiles and runs a component: the core runtime,
# one compiler, and the component model. There is no WASI feature here and no
# `wasmtime-wasi` dependency anywhere in the tree, so a module that imports
# `wasi:*` has nothing to link against: filesystem, network and process access are
# denied by the absence of an implementation, not by a policy check that could be
# wrong (D6: "Isolation holds only if the host API is the module's only reach").
wasmtime = { version = "50.0.1", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
] }
