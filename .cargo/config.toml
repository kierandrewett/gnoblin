# `cargo xtask <subcommand>` runs the workspace automation crate in xtask/.
# CI and the justfile use this rather than `cargo run --package xtask --`, so the
# dependency-rule check has one spelling everywhere.
[alias]
xtask = "run --quiet --package xtask --"

[env]
# The hand-written stock JavaScript library of a source tree (`data/js`), for what runs from `target/`: the runtime, `gnoblinctl` and
# the tests read it as installed data, and a build tree has no prefix. The generated modules of both packages are not in that
# directory: `gnoblin-js` embeds them when it is built, so they need no stock directory. An environment that sets the variable
# keeps its own value.
GNOBLIN_JS_STOCK_DIR = { value = "data/js", relative = true }
