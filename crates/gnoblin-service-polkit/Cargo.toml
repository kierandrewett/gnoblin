[package]
name = "gnoblin-service-polkit"
description = "The polkit authentication agent: org.freedesktop.PolicyKit1.AuthenticationAgent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The request vocabulary the agent's answers travel in, and the tick a deadline is measured in.
gnoblin-model = { path = "../gnoblin-model" }
# The primitives the agent names: the owner of a request.
gnoblin-types = { path = "../gnoblin-types" }
# The shared agent machinery: the offerer, the slots and the provider the agent reaches the
# compositor through.
gnoblin-service-core = { path = "../gnoblin-service-core" }
# The D-Bus agent is an object on the system bus, served through zbus.
zbus.workspace = true
# A `BeginAuthentication` reply waits for the provider's answer, so the waiting handler holds a
# one-shot channel rather than a locked mutex.
futures-channel.workspace = true
# Every refusal, cancellation and registration is logged once, and never with the material of an
# answer.
gnoblin-log = { path = "../gnoblin-log" }

[dev-dependencies]
# The private bus the D-Bus tests start for themselves, shared with the other service crates.
gnoblin-service-testkit = { path = "../gnoblin-service-testkit" }
# The tests drive the agent's object through a real client connection and await its replies.
futures-lite.workspace = true

[lints]
workspace = true
