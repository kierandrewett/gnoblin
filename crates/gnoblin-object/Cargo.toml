[package]
name = "gnoblin-object"
description = "The object protocol of Gnoblin's libraries, written once: the value that crosses, its conversion to and from the C ABI's GnoblinValue, the server that gives a library classes from a catalog, and the client every SDK and script runtime calls it through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The value, the handles and the function table of the object protocol.
gnoblin-core-abi = { path = "../gnoblin-core-abi" }

# The conversion to and from the C ABI and the calls through its function table need `unsafe`, confined to the modules that say so.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
