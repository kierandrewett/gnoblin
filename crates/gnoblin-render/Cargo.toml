[package]
name = "gnoblin-render"
description = "Scene graph, effects, user shaders, animation and tween player, and damage."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Rectangles, points, the 3D-ready transform, vectors, the compositing scale,
# the output identity and the named `unsupported-3d` refusal are shared with
# every other crate.
gnoblin-types.workspace = true
# The engine's named logger (`gnoblin_log::logger!`); the cursor code that
# used to share it now lives in `gnoblin-cursor`.
gnoblin-log = { path = "../gnoblin-log" }

[lints]
workspace = true
