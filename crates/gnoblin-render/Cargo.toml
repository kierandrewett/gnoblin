[package]
name = "gnoblin-render"
description = "Scene graph, effects, user shaders, animation and tween player, and damage."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Rectangles, points, the 3D-ready transform, vectors, the compositing scale,
# the output identity and the named `unsupported-3d` refusal are shared with
# every other crate.
gnoblin-types.workspace = true
# Cursor providers (D20): Xcursor parsing, the SVG rasteriser (pure Rust; no
# text, no raster-image decoders, which cursors do not use), the zip container
# of compiled Hyprcursor themes, the `metadata.json` of `cursors_scalable`
# themes, and the tracing used for named provider failures.
xcursor = "0.3.11"
resvg = { version = "0.48.1", default-features = false }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2"] }
# PNG cursor frames: the decoder, with its default (zlib) features.
png = "0.18.1"
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true
