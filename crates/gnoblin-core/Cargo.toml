[package]
name = "gnoblin-core"
description = "The Rust SDK for Gnoblin shells: safe wrappers over the installed libgnoblin-core. It links the library and never contains a copy of it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Part of the Rust shell SDK on crates.io (the workspace's `publish = false` is for the rest).
publish = true
build = "build.rs"

[features]
# Test only: the SDK of a hypothetical ABI 1.1 (one more function in the table). See `gnoblin-core-abi`.
next-minor = ["gnoblin-core-abi/next-minor"]
# Test only: the SDK of a hypothetical ABI 2.0, to build a shell the 1.x core must refuse. See `gnoblin-core-abi`.
next-major = ["gnoblin-core-abi/next-major"]

[dependencies]
gnoblin-core-abi.workspace = true
# The client half of the object protocol, which the typed classes of `gnoblin.model` are written over.
gnoblin-object.workspace = true
gnoblin-macros.workspace = true

[build-dependencies]
# The link stub and the `panic = "abort"` check run in build.rs, so the helper code is a build dependency only.
gnoblin-core-abi = { workspace = true, features = ["build-support"] }
# The schema's names, the typed node classes and the error kinds are generated at build time and never committed.
gnoblin-sdkgen.workspace = true

# The workspace table forbids unsafe code; the SDK's FFI modules need it. Only the modules that open with
# `#![allow(unsafe_code)]` and a SAFETY note use it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
