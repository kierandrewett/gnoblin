# The `frame` module of `gnoblin.std`: the window frame, its outlets and parts, the stock titlebar and the decorations that give every
# window a frame.
#
# A frame is the surface round one window's content. The library makes one for each window while the decorations run (`decorations`), and
# calls the shell's `frame` callback with the window and its frame to fill it: a shell reads the outlets it wants (`frame.top`, `frame.overlay`)
# and adds canvases to them, or leaves the stock titlebar (`titlebar.fill`). The frame places its outlets from the window's size and its
# inset, and tells the window's layout how much room it takes.
#
# A shell passes a window to a member of `decorations` as the core's `Client`. The window a frame or a closure tells the shell of is named by
# its node number as text (`window_frame.client`), and the closures of this module are given a `frame_client`: what the window was when the
# closure was called.
namespace = "gnoblin.std"
version = "0.2.0"
local = true

# ---- enums ---------------------------------------------------------------------------------------------------------------------------

# Who draws what a frame holds: `server` for a window the shell frames (it has edges and an inset), `layers` for a window that draws its own
# frame or has none, which can still have an underlay and an overlay but no edge and no inset.
[[enum]]
name = "frame_kind"
since = "0.2.0"
values = ["server", "layers"]

# The four edges of a frame.
[[enum]]
name = "frame_side"
since = "0.2.0"
values = ["top", "right", "bottom", "left"]

# The four corners of a frame.
[[enum]]
name = "frame_corner"
since = "0.2.0"
values = ["top-left", "top-right", "bottom-left", "bottom-right"]

# Which side of the window's content a layer sits: `under` it or `over` it.
[[enum]]
name = "frame_layer"
since = "0.2.0"
values = ["under", "over"]

# The three window buttons.
[[enum]]
name = "window_button_name"
since = "0.2.0"
values = ["minimise", "maximise", "close"]

# The side or corner of the window a resize handle holds: it moves with the pointer, the opposite one stays.
[[enum]]
name = "resize_side"
since = "0.2.0"
values = ["top-left", "top-right", "bottom-left", "bottom-right", "left", "right", "top", "bottom"]

# The three clicks the seat gives an action to.
[[enum]]
name = "seat_gesture"
since = "0.2.0"
values = ["double_click", "middle_click", "right_click"]

# ---- callbacks -----------------------------------------------------------------------------------------------------------------------

# Fills a frame. It runs once for each window when its frame is made, and again when the window's `decoration` changes, with the window and
# its frame: read the outlets you want and put canvases in them. It answers `false` to give this window no frame at all; any other answer,
# or none, keeps it. A client-drawn frame (`frame.server` false) has only the underlay and the overlay.
[[callback]]
name = "frame_fill"
since = "0.2.0"
returns = "bool"

[[callback.param]]
name = "client"
type = "object:frame_client"

[[callback.param]]
name = "frame"
type = "object:window_frame"

# A question about a window: whether a rule applies, or an outlet is hidden for it.
[[callback]]
name = "frame_question"
since = "0.2.0"
returns = "bool"

[[callback.param]]
name = "client"
type = "object:frame_client"

# A colour that depends on the window: a focus ring that follows the focus.
[[callback]]
name = "frame_colour"
since = "0.2.0"
returns = "string"

[[callback.param]]
name = "client"
type = "object:frame_client"

# Work an outlet runs once a frame before it is placed: read the window into the outlet's own fields here.
[[callback]]
name = "frame_refresh"
since = "0.2.0"

# A shell operation a click on a frame asks for: the window menu, or putting the window under the others, or minimising it.
[[callback]]
name = "frame_action"
since = "0.2.0"

[[callback.param]]
name = "client"
type = "object:frame_client"

# Maximises the window (`on` true) or restores it, as the shell does it.
[[callback]]
name = "frame_maximise"
since = "0.2.0"

[[callback.param]]
name = "client"
type = "object:frame_client"

[[callback.param]]
name = "on"
type = "bool"

# A button went down on a frame, or came up.
[[callback]]
name = "frame_press"
since = "0.2.0"

[[callback.param]]
name = "client"
type = "object:frame_client"

[[callback.param]]
name = "event"
type = "object:frame_press_event"

