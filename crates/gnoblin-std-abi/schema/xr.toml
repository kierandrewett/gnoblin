kind = "record"

# The window's width in pixels.
[[object.property]]
name = "width"
type = "double"
since = "0.2.0"
unit = "px"

# The window's height in pixels.
[[object.property]]
name = "height"
type = "double"
since = "0.2.0"
unit = "px"

