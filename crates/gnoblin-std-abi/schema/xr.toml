[[object]]
name = "ring_pose"
since = "0.2.0"
kind = "record"

# Millimetres to the right.
[[object.property]]
name = "x"
type = "double"
since = "0.2.0"
unit = "mm"

# Millimetres up.
[[object.property]]
name = "y"
type = "double"
since = "0.2.0"
unit = "mm"

# Millimetres back: the panels in front are at negative z.
[[object.property]]
name = "z"
type = "double"
since = "0.2.0"
unit = "mm"

# The turn about y, in radians, that makes the panel face the viewer.
[[object.property]]
name = "yaw"
type = "double"
