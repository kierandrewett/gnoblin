# The `xr` module of `gnoblin.std`: what a shell sees of a headset, and the room of panels the library builds for it.
#
# The XR program (`gnoblin-xr`) is a separate process. What the shell sees of it is nodes of the tree: the seat named `xr`, which is the
# session, the camera named `head`, whose pose the program writes, and a `controller` node for each hand. While the seat exists the
# library has a session (`gnoblin.extensions.xr`): it builds a node named `room` under the tree's root with the `head` camera and one
# `view` for each window, places the views on a ring round the viewer, and runs the drags that move, resize, turn and scale a panel.
# When the seat goes the session ends and the room goes with it; the windows were never moved.
#
# Distances are millimetres in the tree (the room's unit) and metres where a script gives them (a layout's radius, a camera's near and
# far, a head panel's offset). Every pose is in the room's placement frame, y up, as a View's and a controller's are.
#
# A dialog is a window of its own. It gets a panel of its own, anchored to its parent's: placed in front of the parent's panel where the
# dialog sits on the parent window, turned and scaled as that panel is, and moved with it. The room never assumes a window lies inside
# another window's node.
namespace = "gnoblin.std"
version = "0.2.0"
local = true
title = "XR"

# Where an extension is in its life: `ready` while it serves a session, `unloaded` while it is absent.
[[enum]]
name = "extension_status"
since = "0.2.0"
values = [
    # The extension serves a session.
    "ready",
    # The extension is absent: there is no session.
    "unloaded",
]

# How the headset draws the panels of a room: as flat layers (`auto`, `layers`) or through the head camera as projection layers
# (`projection`, which gives every panel of the room the head camera as its `camera`).
[[enum]]
name = "xr_composition"
since = "0.2.0"
values = [
    # The panels are flat layers, as with `layers`.
    "auto",
    # Each panel is a flat layer.
    "layers",
    # Each panel is drawn through the head camera as a projection layer.
    "projection",
]

# Whether any controller of a session is tracked. The tree does not say whether the head is.
[[enum]]
name = "xr_tracking"
since = "0.2.0"
values = [
    # At least one controller is tracked.
    "tracked",
    # No controller is tracked.
    "untracked",
]

# What a panel that a move drags follows: the hand (`controller`, six degrees of freedom) or where the ray points (`ray`).
[[enum]]
name = "view_tracking"
since = "0.2.0"
values = [
    # The panel follows the hand, in six degrees of freedom.
    "controller",
    # The panel follows where the ray points.
    "ray",
]

# Whether a moved panel turns with the hand (`follow`) or keeps its own rotation (`keep`).
[[enum]]
name = "view_rotation"
since = "0.2.0"
values = [
    # The panel turns with the hand.
    "follow",
    # The panel keeps its own rotation.
    "keep",
]

# The corner a resize pulls: the one nearest where the ray struck (`quadrant`), or always one corner.
[[enum]]
name = "resize_corner"
since = "0.2.0"
values = [
    # The corner nearest where the ray struck.
    "quadrant",
    # Always the top left corner.
    "top-left",
    # Always the top right corner.
    "top-right",
    # Always the bottom left corner.
    "bottom-left",
    # Always the bottom right corner.
    "bottom-right",
]

# Whether a window gets a panel in the stock room. A secure window never does, whatever this answers. It runs once a frame, so a window
# comes in when it starts to answer true.
[[callback]]
name = "xr_accept"
since = "0.2.0"
returns = "bool"

# The window to decide for.
[[callback.param]]
name = "client"
type = "object:xr_client"

