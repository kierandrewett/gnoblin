[[object.method]]
name = "shadow_list"
since = "0.2.0"
returns = "object:shadow_list"

# The borders as a list to edit in place.
[[object.method]]
name = "border_list"
since = "0.2.0"
returns = "object:border_list"

# The filters of the window's own picture as a list to edit in place.
