# The `collection` module of `gnoblin.model`: live views of the compositor's windows and outputs.
#
# `client_collection` holds windows, `output_collection` outputs. The root of each is `gnoblin.clients` and `gnoblin.outputs`: made by the
# library, in the order the compositor made the objects. `where` narrows one to a live selection that follows its members, and a
# standalone `client_collection` (made with `create`) is a list a shell keeps by hand: `add`, `remove`, `clear` and `swap` change it.
#
# A listener hears what happens to a member as the member's own listeners do, and after them: the member's listeners first, then the
# collections that hold it (the root, then its selections in the order they were made, then the lists a shell keeps). Every call a
# listener makes comes from a later turn than the change that caused it, in this order. A listener that is added to `added` is told of
# the members that are already there, from the next turn, as if each had just been added.
namespace = "gnoblin.model"
version = "0.2.0"
local = true
title = "Collections"

