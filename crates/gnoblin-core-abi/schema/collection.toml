optional = true

# Adds a listener. It is told of the members at once as `client_collection_listener` says (from the next turn), and of every later
# change; adding one that is added already has no effect. A method the listener does not define is never called.
[[object.method]]
name = "add_listener"
since = "0.2.0"

# The listener to add or remove.
[[object.method.param]]
name = "listener"
type = "object:client_collection_listener"

# Removes a listener added with `add_listener`. One that is not added is ignored.
[[object.method]]
name = "remove_listener"
since = "0.2.0"

# The listener to add or remove.
[[object.method.param]]
name = "listener"
type = "object:client_collection_listener"

# Adds a member to a collection a shell keeps by hand. Refused on a root and on a selection.
[[object.method]]
name = "add"
since = "0.2.0"
raises = ["read_only"]

# The window.
[[object.method.param]]
name = "member"
type = "object:client"

# Removes a member and returns whether it was there. Refused on a root and on a selection.
[[object.method]]
name = "remove"
since = "0.2.0"
returns = "bool"
raises = ["read_only"]

# The window.
[[object.method.param]]
name = "member"
type = "object:client"

# Removes every member. Refused on a root and on a selection.
[[object.method]]
name = "clear"
since = "0.2.0"
raises = ["read_only"]

# Swaps two members in the order. Both must be in the collection. Refused on a root and on a selection.
[[object.method]]
name = "swap"
since = "0.2.0"
raises = ["read_only", "invalid_argument"]

# One of the two windows to swap.
[[object.method.param]]
name = "a"
type = "object:client"

# The other window to swap.
[[object.method.param]]
name = "b"
type = "object:client"

# A member joined the collection.
[[object.signal]]
name = "added"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# The collection the window joined.
[[object.signal.field]]
name = "collection"
type = "object:client_collection"

# A member left the collection.
[[object.signal]]
name = "removed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# The collection the window left.
[[object.signal.field]]
name = "collection"
type = "object:client_collection"

# The window title changed.
[[object.signal]]
name = "title_changed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# The new title.
[[object.signal.field]]
name = "title"
type = "string"

# The application id changed.
[[object.signal]]
name = "app_id_changed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# The new application id.
[[object.signal.field]]
name = "app_id"
type = "string"

# The compositor changed who draws the window's frame: `client`, `server` or `none` (see `client.decoration`).
[[object.signal]]
name = "decoration_changed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# Who draws the frame now: `client`, `server` or `none`.
[[object.signal.field]]
name = "decoration"
type = "string"

# The pointer crossed into the window. `event` is in the window's own coordinates.
[[object.signal]]
name = "pointer_enter"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# Where the pointer is in the window's own coordinates, and the button involved, or 0.
[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The pointer moved over the window.
[[object.signal]]
name = "pointer_motion"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# Where the pointer is in the window's own coordinates, and the button involved, or 0.
[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The pointer left the window.
[[object.signal]]
name = "pointer_leave"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# Where the pointer is in the window's own coordinates, and the button involved, or 0.
[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# A button went down on the window. The window's client hears it too.
[[object.signal]]
name = "pointer_press"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# Where the pointer is in the window's own coordinates, and the button involved, or 0.
[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# A button was released over the window.
[[object.signal]]
name = "pointer_release"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# Where the pointer is in the window's own coordinates, and the button involved, or 0.
[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# Keyboard focus entered or left the window.
[[object.signal]]
name = "focus_changed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# `true` when the window gained the keyboard focus, `false` when it lost it.
[[object.signal.field]]
name = "focused"
type = "bool"

# The window's geometry changed.
[[object.signal]]
name = "geometry_changed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# The window's new position and size, in logical pixels.
[[object.signal.field]]
name = "geometry"
type = "object:rect"

# The window closed. Its last values stay readable.
[[object.signal]]
name = "closed"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# The window completed its initial setup: told for a window that was there at the start of the shell, and for each one that
# arrives.
[[object.signal]]
name = "ready"
since = "0.2.0"

# The window.
[[object.signal.field]]
name = "client"
type = "object:client"

# A live, ordered collection of outputs. `gnoblin.outputs` is the root: every connected output, in the order the compositor made
# them.
[[object]]
name = "output_collection"
since = "0.2.0"
kind = "handle"

# The number of members.
[[object.property]]
name = "length"
type = "uint"
since = "0.2.0"
readonly = true

# What the collection holds: `Output`.
[[object.property]]
name = "kind"
type = "string"
since = "0.2.0"
readonly = true

# Whether the collection still exists. A root collection always does.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# Whether a shell may change the membership with `add`, `remove`, `clear` and `swap`. The roots and the selections made by `where`
# are not.
[[object.property]]
name = "mutable"
type = "bool"
since = "0.2.0"
readonly = true

# What a selection ranks by among the selections that style a window: higher wins. Zero for a collection that is not a selection.
[[object.property]]
name = "priority"
type = "double"
since = "0.2.0"
readonly = true

# For a selection made by `where`: the collection it was made from. None for a root collection.
[[object.property]]
name = "parent"
type = "object:output_collection"
since = "0.2.0"
readonly = true

# For a selection made by `where`: the query it was made with, without the terms of the collection it was made from. None for a
# root collection.
[[object.property]]
name = "query"
type = "object:output_query"
since = "0.2.0"
readonly = true

# The member at `index`, counted from the end when negative.
[[object.method]]
name = "at"
since = "0.2.0"
returns = "object:output"
optional = true

# The position of the member, from 0. A negative index counts from the end.
[[object.method.param]]
name = "index"
type = "int"

# The first member with this id.
[[object.method]]
name = "get"
since = "0.2.0"
export = { rust = "get_by_id" }
returns = "object:output"
optional = true

# The output id, as `output.id` reads it.
[[object.method.param]]
name = "id"
type = "string"

# Whether `member` is in the collection.
[[object.method]]
name = "contains"
since = "0.2.0"
returns = "bool"

# The output.
[[object.method.param]]
name = "member"
type = "object:output"

# Asks the compositor for an output with no display behind it. It is refused with `unsupported` until the compositor serves virtual
# outputs; the description (`virtual_output`) was checked when it was made.
[[object.method]]
name = "add"
since = "0.2.0"
raises = ["unsupported"]

# The description of the output to add.
[[object.method.param]]
name = "output"
type = "object:virtual_output"

# A snapshot of the members, in order: it does not follow later changes.
[[object.method]]
name = "to_list"
since = "0.2.0"
returns = "list<object:output>"

# A live selection that tracks the members matching `query`. Each field that is given must equal the member's, or for an `any_`
# field be one of its values. `priority` ranks the selection's style among others (a finite number, 0 by default).
[[object.method]]
name = "where"
since = "0.2.0"
returns = "object:output_collection"
raises = ["invalid_argument"]

# What the members must match.
[[object.method.param]]
name = "query"
type = "object:output_query"

# What the selection ranks by among the selections that style a window. A finite number; 0 when it is left out.
[[object.method.param]]
name = "priority"
type = "double"
optional = true

# Adds a listener. It is told of the members at once as `output_collection_listener` says (from the next turn), and of every later
# change; adding one that is added already has no effect. A method the listener does not define is never called.
[[object.method]]
name = "add_listener"
since = "0.2.0"

# The listener to add or remove.
[[object.method.param]]
name = "listener"
type = "object:output_collection_listener"

# Removes a listener added with `add_listener`. One that is not added is ignored.
[[object.method]]
name = "remove_listener"
since = "0.2.0"

# The listener to add or remove.
[[object.method.param]]
name = "listener"
type = "object:output_collection_listener"

# A member joined the collection.
[[object.signal]]
name = "added"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The collection the output joined.
[[object.signal.field]]
name = "collection"
type = "object:output_collection"

# A member left the collection.
[[object.signal]]
name = "removed"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The collection the output left.
[[object.signal.field]]
name = "collection"
type = "object:output_collection"

# An `apply` asked of this output was answered: `error` is empty when it took effect, else why it did not.
[[object.signal]]
name = "applied"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# Why the request did not take effect, or an empty string when it did.
[[object.signal.field]]
name = "error"
type = "string"

# The output appeared: it was plugged in while the shell ran, or made by the compositor.
[[object.signal]]
name = "connected"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The output is gone. Its last values stay readable and `alive` is false.
[[object.signal]]
name = "disconnected"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The output's mode (`WxH@Hz`) changed.
[[object.signal]]
name = "mode_changed"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The output's new mode, `WxH@Hz`.
[[object.signal.field]]
name = "mode"
type = "string"

# The output scale changed.
[[object.signal]]
name = "scale_changed"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The output's new scale.
[[object.signal.field]]
name = "scale"
type = "double"

# The output's place or size in the compositor's coordinates changed.
[[object.signal]]
name = "geometry_changed"
since = "0.2.0"

# The output.
[[object.signal.field]]
name = "output"
type = "object:output"

# The output's new place and size in the compositor's coordinates, in logical pixels.
[[object.signal.field]]
name = "geometry"
type = "object:rect"

