# A live, ordered collection of windows. `gnoblin.clients` is the root: every window the compositor manages, in the order it made
# them. `create` makes a list of your own; `where` makes a selection.
[[object]]
name = "client_collection"
since = "0.2.0"
kind = "handle"

# The number of members.
[[object.property]]
name = "length"
type = "uint"
since = "0.2.0"
readonly = true

# What the collection holds: `Client`.
[[object.property]]
name = "kind"
type = "string"
since = "0.2.0"
readonly = true

# Whether the collection still exists. A root collection always does.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# Whether a shell may change the membership with `add`, `remove`, `clear` and `swap`. The roots and the selections made by `where`
# are not.
[[object.property]]
name = "mutable"
type = "bool"
since = "0.2.0"
readonly = true

# The member with keyboard focus, or none: the first seat's focus, or the member whose `focused` is set when there is no seat.
[[object.property]]
name = "focused"
type = "object:client"
since = "0.2.0"
readonly = true

# What a selection ranks by among the selections that style a window: higher wins. Zero for a collection that is not a selection.
[[object.property]]
name = "priority"
type = "double"
since = "0.2.0"
readonly = true

# For a selection made by `where`: the collection it was made from. None for a root collection and a list.
[[object.property]]
name = "parent"
type = "object:client_collection"
since = "0.2.0"
readonly = true

# For a selection made by `where`: the query it was made with, without the terms of the collection it was made from. None for a
# root collection and a list.
[[object.property]]
name = "query"
type = "object:client_query"
since = "0.2.0"
readonly = true

# The member at `index`, counted from the end when negative.
[[object.method]]
name = "at"
since = "0.2.0"
returns = "object:client"
optional = true

# The position of the member, from 0. A negative index counts from the end.
[[object.method.param]]
name = "index"
type = "int"

# The first member with this id.
[[object.method]]
name = "get"
since = "0.2.0"
export = { rust = "get_by_id" }
returns = "object:client"
optional = true

