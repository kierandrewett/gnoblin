# A keyboard, also one with a pointing stick. Its repeat settings are those of every keyboard: the compositor reads them once for the kind. A
# write is checked at once and joins the `document` of the input manager. A setting that is not written reads none, and `reset` gives one back.
[[object]]
name = "keyboard"
since = "0.2.0"
kind = "handle"
base = "device"

# Key repeats for each second, from 0.1 to 1000, or none for the system's. The document holds the time between two repeats, in whole
# milliseconds, as `input.keyboard.repeat-interval`.
[[object.property]]
name = "repeat_rate"
type = "double"
since = "0.2.0"
optional = true

# Milliseconds a key is held before it repeats, a whole number from 1 to 10000, or none for the system's. The document holds it as
# `input.keyboard.delay`.
[[object.property]]
name = "repeat_delay"
type = "uint"
since = "0.2.0"
optional = true

# Takes the setting `name` (`repeat_rate` or `repeat_delay`) back to the system's. Refused for another name.
[[object.method]]
name = "reset"
since = "0.2.0"

[[object.method.param]]
name = "name"
type = "string"

# A mouse, a trackball or a pointing stick: any pointer that is not a touchpad. Its settings are those of every such pointer.
[[object]]
name = "mouse"
since = "0.2.0"
kind = "handle"
base = "device"

# Pointer speed from -1 (slowest) to 1, or none for the system's. The document holds it as `input.mouse.speed`.
[[object.property]]
name = "sensitivity"
type = "double"
since = "0.2.0"
optional = true

# The acceleration curve, or none for the system's. The document holds it as `input.mouse.accel-profile`.
[[object.property]]
name = "acceleration"
type = "enum:acceleration_profile"
since = "0.2.0"
optional = true

# Reverses the scroll direction, or none for the system's. The document holds it as `input.mouse.natural-scroll`.
[[object.property]]
name = "natural_scroll"
type = "bool"
since = "0.2.0"
optional = true

# Takes the setting `name` (`sensitivity`, `acceleration` or `natural_scroll`) back to the system's. Refused for another name.
[[object.method]]
name = "reset"
since = "0.2.0"

[[object.method.param]]
name = "name"
type = "string"

# A touchpad: a device that reports gestures. Its settings are those of every touchpad.
[[object]]
name = "touchpad"
since = "0.2.0"
kind = "handle"
base = "device"

# As `mouse.sensitivity`, for `input.touchpad.speed`.
[[object.property]]
name = "sensitivity"
type = "double"
since = "0.2.0"
optional = true

# As `mouse.acceleration`, for `input.touchpad.accel-profile`.
[[object.property]]
name = "acceleration"
type = "enum:acceleration_profile"
since = "0.2.0"
optional = true

# As `mouse.natural_scroll`, for `input.touchpad.natural-scroll`.
[[object.property]]
name = "natural_scroll"
type = "bool"
since = "0.2.0"
optional = true

# Makes a tap act as a click, or none for the system's. The document holds it as `input.touchpad.tap-to-click`.
[[object.property]]
name = "tap_to_click"
type = "bool"
since = "0.2.0"
optional = true

# Takes the setting `name` (`sensitivity`, `acceleration`, `natural_scroll` or `tap_to_click`) back to the system's. Refused for another name.
[[object.method]]
name = "reset"
since = "0.2.0"

[[object.method.param]]
name = "name"
type = "string"

# A touch screen. The compositor has no setting for one: its calibration belongs to the seat.
[[object]]
name = "touchscreen"
since = "0.2.0"
kind = "handle"
base = "device"

# A tool or a pad of a drawing tablet. The compositor keys tablet settings by vendor and product, which a device does not carry, so it has no
# setting.
[[object]]
name = "tablet"
since = "0.2.0"
kind = "handle"
base = "device"

# An input context: the bindings of a group of devices and the claims they make on the seat. The compositor reports one for each seat; a
# shell makes more with a name and adds them to `contexts`, and they hold the devices of the first seat. Context bindings apply to all the
# devices held. Pointer and keyboard focus stay the seat's.
[[object]]
name = "input_context"
since = "0.2.0"
kind = "handle"
ctor = ["name"]

# The name: a context's identity among the contexts. A seat's is the seat's name. One line of text.
[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
readonly = true

# The same as `name`.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"
readonly = true

# False once the context was removed from `contexts` or its seat went.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# The seat's node, or 0 while the context is in no list.
[[object.property]]
name = "seat"
type = "uint"
since = "0.2.0"
readonly = true

# Whether a shell made the context, as opposed to the compositor's seat.
[[object.property]]
name = "scripted"
type = "bool"
since = "0.2.0"
readonly = true

# The bindings added to the context itself.
[[object.property]]
name = "bindings"
type = "object:binding_collection"
since = "0.2.0"
readonly = true

# The devices the context holds. A context that is not in `contexts` holds none.
[[object.property]]
name = "devices"
type = "list<object:device>"
since = "0.2.0"
readonly = true

# The pointer in the compositor's logical space.
[[object.property]]
name = "pointer"
type = "object:input_point"
since = "0.2.0"
readonly = true

# The window with the keyboard focus, or none. It is read from the seat on each call.
[[object.property]]
name = "focused_client"
type = "object:client"
since = "0.2.0"
readonly = true

# The window management settings the seat publishes.
[[object.property]]
name = "settings"
type = "object:seat_settings"
since = "0.2.0"
readonly = true

# Whether the compositor plays its own animations on window nodes: the fade in when a window maps, the fade out when it closes, unmaps or hides,
# and the tween of a placement towards its value. True until a shell turns it off, which it does once, at startup, when it animates windows itself.
# It affects only the changes that start after the write. The compositor turns it on again when the shell lets go of the tree. Reduced motion
# still turns every animation off.
[[object.property]]
name = "builtin_motion"
type = "bool"
since = "0.2.0"

