# The `input` module of `gnoblin.model`: the input matcher. A shell binds a trigger (`Super+Return`, `Super+Shift+1`) on an input context, and the
# library claims the chord on the seat, shares one claim between the bindings of one trigger, and runs the right binding when the chord is
# pressed.
#
# One context exists for each seat the compositor reports, and a shell may add contexts of its own that hold the devices of the first seat. A
# binding belongs to a collection: the context's own, a device's, or a layout's. When a chord is pressed the candidates are the bindings that
# match it, in this order: the tier first (a device's binding, then a layout's, then the context's), then the higher priority, then the older
# binding. A binding that answers `false` declines, and the next candidate is tried; any other answer, or none, handles the press, and a throw
# counts as handled. Two bindings of one collection cannot share a trigger at one priority.
#
# A reload hands a chord from one generation to the next: the new generation's claims are kept while it is staged and go out when it takes over,
# behind the releases of the old one, so the compositor never holds a chord for nobody and never for both.
namespace = "gnoblin.model"
version = "0.2.0"
local = true

# Where a binding comes from. A device's binding runs before a layout's, and a layout's before the context's own.
[[enum]]
name = "binding_tier"
since = "0.2.0"
values = ["context", "layout", "device"]

# What a trigger names.
[[enum]]
name = "trigger_kind"
since = "0.2.0"
values = ["key", "pointer", "wheel", "gesture"]

# The step of a drag or a gesture that an event reports. A gesture's first step is `start`, as a drag's is.
[[enum]]
name = "binding_phase"
since = "0.2.0"
values = ["start", "update", "end", "cancel"]

# How a pointer or a touchpad moves the pointer: the compositor's own curve, no curve, or the curve that follows the speed.
[[enum]]
name = "acceleration_profile"
since = "0.2.0"
values = ["default", "flat", "adaptive"]

# A binding's function: it handles the press and answers `true`, or declines it with `false`, which gives the press to the next candidate.
[[callback]]
name = "key_action"
since = "0.2.0"
returns = "bool"

[[callback.param]]
name = "event"
type = "object:binding_event"

# Tells whether a binding or a layout applies to a window. With no window under the input the answer is asked about none, and a binding that
# has a scope does not match.
[[callback]]
name = "client_scope"
since = "0.2.0"
returns = "bool"

[[callback.param]]
name = "client"
type = "object:client"

# A point in the compositor's logical space.
[[object]]
name = "input_point"
since = "0.2.0"
kind = "record"

# Horizontal position in logical pixels.
[[object.property]]
name = "x"
type = "double"
since = "0.2.0"
default = 0.0

# Vertical position in logical pixels.
[[object.property]]
name = "y"
type = "double"
since = "0.2.0"
default = 0.0

# A trigger as the grammar reads it. `text` is the canonical spelling: modifiers in the order `Shift, Ctrl, Alt, Meta, Super, Hyper`, the key
# name in its canonical case, so two spellings of one trigger have one text (`Ctrl+Alt+Delete` and `control+alt+delete`).
[[object]]
name = "trigger"
since = "0.2.0"
kind = "record"

# The canonical spelling.
[[object.property]]
name = "text"
type = "string"
since = "0.2.0"

# Which input the trigger names.
[[object.property]]
name = "kind"
type = "enum:trigger_kind"
since = "0.2.0"

# The modifiers, in the canonical order, written `Shift`, `Ctrl`, `Alt`, `Meta`, `Super` and `Hyper`.
[[object.property]]
name = "modifiers"
type = "list<string>"
since = "0.2.0"

# A key's keysym name in its canonical case, or `Super` for a lone tap of it. Only for a key.
[[object.property]]
name = "key"
type = "string"
since = "0.2.0"
optional = true

# `MouseLeft`, `MouseMiddle` or `MouseRight`. Only for a pointer trigger.
[[object.property]]
name = "button"
type = "string"
since = "0.2.0"
optional = true

# `click` or `drag`. Only for a pointer trigger.
[[object.property]]
name = "action"
type = "string"
since = "0.2.0"
optional = true

# `up`, `down`, `left` or `right`. Only for a wheel trigger that names one.
[[object.property]]
name = "direction"
type = "string"
since = "0.2.0"
optional = true

# `swipe` or `pinch`. Only for a gesture trigger.
[[object.property]]
name = "gesture"
type = "string"
since = "0.2.0"
optional = true

# The finger count, 2 to 5. Only for a gesture trigger.
[[object.property]]
name = "fingers"
type = "uint"
since = "0.2.0"
optional = true

# The grammar of triggers, one implementation for every language. A trigger is the string a user writes for an input:
#
#     trigger  := key | pointer | wheel | gesture
#     key      := (modifier "+")* keyname        `Super+Shift+1`, `XF86AudioMute`; a lone `Super` is a tap
#     pointer  := (modifier "+")* button ["+" ("Drag" | "Click")]    `Super+MouseLeft+Drag`, `MouseMiddle`
#     wheel    := (modifier "+")* "Wheel" ["Up" | "Down" | "Left" | "Right"]
#     gesture  := ("Swipe" | "Pinch") fingers(2-5) [direction]       `Swipe3Left`, `Pinch4In`
#     modifier := Shift | Ctrl (Control, Primary) | Alt (Mod1) | Meta | Super (Logo) | Hyper
#
# Modifiers, button and action names are case-insensitive; key names are keysym names and keep their case, except that a single letter is the
# key and not a shifted letter. A key is never a character that depends on the layout: `Super+1` and `Super+Shift+1` are two triggers, and
# `Super+!` is refused (write `Super+Shift+1` or `Super+exclam`). A literal plus is `plus`. A refusal names the part that is wrong.
[[object]]
name = "triggers"
since = "0.2.0"

# Reads a trigger into its parts and canonical spelling. A spelling the grammar refuses is a type error that names the token. `what` names
# the thing that holds the trigger, for the message; it is `trigger` when left out.
[[object.method]]
name = "parse"
since = "0.2.0"
function = true
returns = "object:trigger"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "what"
type = "string"
optional = true

# Refuses a trigger the grammar does not accept, as `parse` does, and answers its canonical spelling.
[[object.method]]
name = "check"
since = "0.2.0"
function = true
returns = "string"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "what"
type = "string"
optional = true

# The compositor's own spelling of the chord or gesture a trigger asks the seat for (`<Shift><Super>1`, `swipe3`), or an empty text for a trigger
# the compositor has no claim for (a wheel). A drag and a click of one button share one claim.
[[object.method]]
name = "claim_text"
since = "0.2.0"
function = true
returns = "string"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "what"
type = "string"
optional = true

# What the library passes to a binding that handles a press.
[[object]]
name = "binding_event"
since = "0.2.0"
kind = "record"

# The context the input came to.
[[object.property]]
name = "context"
type = "object:input_context"
since = "0.2.0"

# The device the binding was made for, or none for a binding of every device.
[[object.property]]
name = "device"
type = "object:device"
since = "0.2.0"
optional = true

# The canonical trigger that matched.
[[object.property]]
name = "trigger"
type = "string"
since = "0.2.0"

# When the input happened, in milliseconds on the session's clock.
[[object.property]]
name = "timestamp"
type = "double"
since = "0.2.0"

# Seconds since the previous event of the input, at most 0.1, so a simulation that integrates it is not thrown by a stall. A press is the
# first of its input, and reads 0.
[[object.property]]
name = "delta_time"
type = "double"
since = "0.2.0"

# The modifiers of the trigger.
[[object.property]]
name = "modifiers"
type = "list<string>"
since = "0.2.0"

# The pointer in the compositor's logical space.
[[object.property]]
name = "position"
type = "object:input_point"
since = "0.2.0"

# The window with the keyboard focus, or none.
[[object.property]]
name = "client"
type = "object:client"
since = "0.2.0"
optional = true

# The pointer relative to the window's top-left corner. Only with a window.
[[object.property]]
name = "local_position"
type = "object:input_point"
since = "0.2.0"
optional = true

# The collection of the layout the binding came from. Only for a layout's binding.
[[object.property]]
name = "layout"
type = "object:binding_collection"
since = "0.2.0"
optional = true

# Which step of a drag or a gesture this event is. A key press and a click have none.
[[object.property]]
name = "phase"
type = "enum:binding_phase"
since = "0.2.0"
optional = true

# A drag: the number of the button that was pressed (1 left, 2 middle, 3 right). Only for a drag and a click of a pointer button.
[[object.property]]
name = "button"
type = "uint"
since = "0.2.0"
optional = true

# A drag: how far the pointer is from the place of the press. A gesture: how far the centre of the fingers went since the gesture began,
# in touchpad units. Only for a drag and a gesture.
[[object.property]]
name = "dx"
type = "double"
since = "0.2.0"
optional = true

# As `dx`, for the vertical way.
[[object.property]]
name = "dy"
type = "double"
since = "0.2.0"
optional = true

# A gesture: how many fingers touch the pad.
[[object.property]]
name = "fingers"
type = "uint"
since = "0.2.0"
optional = true

# A pinch: the size of the pinch compared with its start. 1 when the fingers have not moved apart or together.
[[object.property]]
name = "scale"
type = "double"
since = "0.2.0"
optional = true

# A gesture: the turn of the fingers since the gesture began, in radians.
[[object.property]]
name = "rotation"
type = "double"
since = "0.2.0"
optional = true

# A gesture: how far it has gone for the trigger, from 0 to 1. A trigger with a direction counts only that way. A swipe is whole at 400
# touchpad units, a pinch at a change of 0.5 in `scale`.
[[object.property]]
name = "progress"
type = "double"
since = "0.2.0"
optional = true

# A drag: the seat's `drag_constraint`, `work_area` or `minimum_strip`. It says how far a moved window may leave the screen.
[[object.property]]
name = "drag_constraint"
type = "string"
since = "0.2.0"
optional = true

# A drag: the seat's `edge_tiling`. True when a drop at the edge of the screen tiles the window.
[[object.property]]
name = "edge_tiling"
type = "bool"
since = "0.2.0"
optional = true

# What `bind` takes beside the trigger and the action.
[[object]]
name = "binding_options"
since = "0.2.0"
kind = "record"

# The binding's id, unique in its collection. Left out, it is `bind-N:` and the canonical trigger, with N counting from 1 in the generation.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"
optional = true

# Which of two bindings of one trigger in one tier runs first: the higher number. 0 when it is left out.
[[object.property]]
name = "priority"
type = "double"
since = "0.2.0"
optional = true

# Whether the matcher considers the binding. True when it is left out.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"
optional = true

# Only for a device's `bind`: true makes the device binding-only before the binding is made. False is refused, because it is not a way to
# say nothing.
[[object.property]]
name = "only"
type = "bool"
since = "0.2.0"
optional = true

# How far the pointer must go from the press before a drag starts, in logical pixels. 4 when it is left out. Only for a drag.
[[object.property]]
name = "threshold"
type = "double"
since = "0.2.0"
optional = true

# Handles the presses of a key chord. A shell implements it to give a binding a state of its own; `bind` takes a function for the plain case.
[[object]]
name = "key_binding"
since = "0.2.0"
kind = "interface"

# A press of the trigger. Answer `false` to decline, which gives the press to the next candidate; any other answer handles it.
[[object.method]]
name = "on_press"
since = "0.2.0"
returns = "bool"
required = true

[[object.method.param]]
name = "event"
type = "object:binding_event"

# Follows a pointer drag from its start to its end. A shell implements it to give a drag a state of its own; `bind` takes a function for the
# plain case, which is called for each step with `phase` set. The drag starts when the pointer has gone `threshold` pixels from the press. The
# candidates of a press are asked in the order of the tiers and priorities; the first that answers `true` to `on_start` has the drag, and one
# that answers `false` leaves it to the next. A binding that throws in `on_update` has lost the drag and is told `on_cancel`.
[[object]]
name = "pointer_drag_binding"
since = "0.2.0"
kind = "interface"

# The pointer has gone far enough. `position` is where the press was. Answer `false` to decline the drag.
[[object.method]]
name = "on_start"
since = "0.2.0"
returns = "bool"
required = true

[[object.method.param]]
name = "event"
type = "object:binding_event"

# The pointer moved. `position` is where it is, and `dx` and `dy` say how far it is from the press.
[[object.method]]
name = "on_update"
since = "0.2.0"

[[object.method.param]]
name = "event"
type = "object:binding_event"

# The button was let go.
[[object.method]]
name = "on_end"
since = "0.2.0"

[[object.method.param]]
name = "event"
type = "object:binding_event"

# The compositor ended the drag, the window under it closed, the binding was removed, or the shell was reloaded.
[[object.method]]
name = "on_cancel"
since = "0.2.0"

[[object.method.param]]
name = "event"
type = "object:binding_event"

# Follows a touchpad gesture from its start to its end. A trigger with a direction (`Swipe3Left`) waits until the fingers have gone far
# enough to have a direction: a swipe is 12 touchpad units, a pinch a change of 0.1 in `scale`. Only a gesture that went that way is
# offered to the binding. The first candidate that answers `true` to `on_begin` has the gesture, and one that answers `false` leaves it
# to the next.
[[object]]
name = "gesture_binding"
since = "0.2.0"
kind = "interface"

# The gesture is decided. Answer `false` to decline it.
[[object.method]]
name = "on_begin"
since = "0.2.0"
returns = "bool"
required = true

[[object.method.param]]
name = "event"
type = "object:binding_event"

# The fingers moved.
[[object.method]]
name = "on_update"
since = "0.2.0"

[[object.method.param]]
name = "event"
type = "object:binding_event"

# The fingers left the pad.
[[object.method]]
name = "on_end"
since = "0.2.0"

[[object.method.param]]
name = "event"
type = "object:binding_event"

# The compositor ended the gesture, the window under it closed, the binding was removed, or the shell was reloaded.
[[object.method]]
name = "on_cancel"
since = "0.2.0"

[[object.method.param]]
name = "event"
type = "object:binding_event"

# One binding of a collection. The library keeps it until it is unbound, so the shell may let go of the object.
[[object]]
name = "binding"
since = "0.2.0"
kind = "handle"

# Unique in the collection that holds the binding.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"
readonly = true

# The trigger as it was written. Writing another one moves the binding to it: it is refused, and the binding stays, when the text is not a
# trigger, when another binding of the collection has that trigger at this priority, or when the compositor refuses the claim.
[[object.property]]
name = "trigger"
type = "string"
since = "0.2.0"

# The grammar's reading of `trigger`.
[[object.property]]
name = "parsed"
type = "object:trigger"
since = "0.2.0"
readonly = true

# Which of two bindings of one trigger in one tier runs first: the higher number.
[[object.property]]
name = "priority"
type = "double"
since = "0.2.0"

# How far the pointer must go from the press before a drag starts, in logical pixels. It is read when a press happens. Only a drag uses it.
[[object.property]]
name = "threshold"
type = "double"
since = "0.2.0"

# Whether the matcher considers the binding.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"

# The tier of the collection that holds it.
[[object.property]]
name = "tier"
type = "enum:binding_tier"
since = "0.2.0"
readonly = true

# Asks which windows the binding applies to. It is called with the window that has the keyboard focus. A binding with a scope matches only
# when a window has the focus and the scope accepts it; with none it matches whatever has the focus.
[[object.property]]
name = "scope"
type = "callback:client_scope"
since = "0.2.0"

# Whether the binding is still in a collection.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# Takes the binding out of its collection. A binding that is in none is left alone.
[[object.method]]
name = "unbind"
since = "0.2.0"

# The bindings of one holder, by id, in the order they were added: a context's own, a device's, or a layout's. A shell makes one with no
# arguments to give a layout its bindings, and a context follows it with `attach_layout`.
[[object]]
name = "binding_collection"
since = "0.2.0"
kind = "handle"

# How many bindings the collection holds.
[[object.property]]
name = "length"
type = "uint"
since = "0.2.0"
readonly = true

# The tier its bindings have in the contexts that follow it: `device` for a device's, `layout` for one a shell made, `context` for a context's.
[[object.property]]
name = "tier"
type = "enum:binding_tier"
since = "0.2.0"
readonly = true

# The name of the context or the device that owns the collection, empty for a collection a shell made.
[[object.property]]
name = "owner"
type = "string"
since = "0.2.0"
readonly = true

# Binds `action` to `trigger` in the collection and answers the binding. A function that answers `false` declines the press. With no function
# the trigger is claimed and swallowed: the press reaches no client and nothing runs. A trigger the grammar refuses is a type error; one a
# binding of the collection already has at the same priority is refused as `already_exists`; one the compositor has no claim for (a wheel) is
# `unsupported`. A refusal leaves the collection as it was.
[[object.method]]
name = "bind"
since = "0.2.0"
returns = "object:binding"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "action"
type = "callback:key_action"
optional = true

[[object.method.param]]
name = "options"
type = "object:binding_options"
optional = true

# Binds an object the shell implements: its `on_press` runs when the chord is pressed. Otherwise as `bind`.
[[object.method]]
name = "bind_binding"
since = "0.2.0"
returns = "object:binding"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "handler"
type = "object:key_binding"

[[object.method.param]]
name = "options"
type = "object:binding_options"
optional = true

# Binds an object the shell implements to a drag: `trigger` must be a pointer drag such as `Super+MouseLeft+Drag`. Otherwise as `bind`.
[[object.method]]
name = "bind_drag"
since = "0.2.0"
returns = "object:binding"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "handler"
type = "object:pointer_drag_binding"

[[object.method.param]]
name = "options"
type = "object:binding_options"
optional = true

# Binds an object the shell implements to a touchpad gesture: `trigger` must be a gesture such as `Swipe3Left`. Otherwise as `bind`.
[[object.method]]
name = "bind_gesture"
since = "0.2.0"
returns = "object:binding"

[[object.method.param]]
name = "trigger"
type = "string"

[[object.method.param]]
name = "handler"
type = "object:gesture_binding"

[[object.method.param]]
name = "options"
type = "object:binding_options"
optional = true

# The binding with this id, or none.
[[object.method]]
name = "find"
since = "0.2.0"
optional = true
returns = "object:binding"

[[object.method.param]]
name = "id"
type = "string"

# Whether a binding has this id.
[[object.method]]
name = "has"
since = "0.2.0"
returns = "bool"

[[object.method.param]]
name = "id"
type = "string"

# Takes the binding with this id out. False when there is none.
[[object.method]]
name = "remove"
since = "0.2.0"
returns = "bool"

[[object.method.param]]
name = "id"
type = "string"

# Takes every binding out.
[[object.method]]
name = "clear"
since = "0.2.0"

# The bindings, in the order they were added.
[[object.method]]
name = "list"
since = "0.2.0"
returns = "list<object:binding>"

# A binding joined the collection.
[[object.signal]]
name = "added"
since = "0.2.0"

[[object.signal.field]]
name = "binding"
type = "object:binding"

# A binding left the collection.
[[object.signal]]
name = "removed"
since = "0.2.0"

[[object.signal.field]]
name = "binding"
type = "object:binding"

# What `describe_bindings` says of one registered binding.
[[object]]
name = "binding_info"
since = "0.2.0"
kind = "record"

# The name of the context that holds the binding.
[[object.property]]
name = "context"
type = "string"
since = "0.2.0"

# The binding's id.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"

# The trigger as it was written.
[[object.property]]
name = "trigger"
type = "string"
since = "0.2.0"

# Which input the trigger names.
[[object.property]]
name = "kind"
type = "enum:trigger_kind"
since = "0.2.0"

# Where the binding comes from.
[[object.property]]
name = "owner"
type = "enum:binding_tier"
since = "0.2.0"

# The collection's owner, for a binding of a layout: empty when the binding is not a layout's or the collection has none.
[[object.property]]
name = "layout"
type = "string"
since = "0.2.0"
optional = true

# The device's name, or none for a binding of every device.
[[object.property]]
name = "device"
type = "string"
since = "0.2.0"
optional = true

# The binding's priority.
[[object.property]]
name = "priority"
type = "double"
since = "0.2.0"

# Whether the binding is enabled.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"

# 1 is the binding a press of the trigger reaches first; a binding that declines hands the press to rank 2.
[[object.property]]
name = "rank"
type = "uint"
since = "0.2.0"

# A claim a context holds on its seat, and how many bindings stand on it.
[[object]]
name = "claim_info"
since = "0.2.0"
kind = "record"

# The claim's id, as the core allocated it.
[[object.property]]
name = "id"
type = "int"
since = "0.2.0"

# What it claims: `chord:` and the compositor's spelling of the chord, or `gesture:` and the kind and the finger count.
[[object.property]]
name = "trigger"
type = "string"
since = "0.2.0"

# The device the claim is for, or an empty text for every device.
[[object.property]]
name = "device"
type = "string"
since = "0.2.0"

# Whether the claim is for a pointer button.
[[object.property]]
name = "pointer"
type = "bool"
since = "0.2.0"

# How many bindings use the claim. The last one to go gives it up.
[[object.property]]
name = "refs"
type = "uint"
since = "0.2.0"

# The window management settings a seat publishes. A value is the schema's default until the compositor says otherwise.
[[object]]
name = "seat_settings"
since = "0.2.0"
kind = "record"

# Whether the compositor tiles windows at screen edges.
[[object.property]]
name = "edge_tiling"
type = "bool"
since = "0.2.0"

# `click`, `hover` or `hover-strict`.
[[object.property]]
name = "focus_mode"
type = "string"
since = "0.2.0"

# `allow` or `prevent`.
[[object.property]]
name = "focus_new_windows"
type = "string"
