# An input device of a seat. A context holds the devices of its seat, or the devices it was given.
[[object]]
name = "device"
export = { js = "InputDevice", py = "InputDevice", rust = "InputDevice" }
since = "0.2.0"
kind = "handle"

# The id the compositor gave the device.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"
readonly = true

# The name the device reports. The compositor matches it exactly against a claim for the device.
[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
readonly = true

# What it can do: `keyboard`, `pointer`, `touchpad`, `touch`, `tablet` and so on, as the compositor lists them.
[[object.property]]
name = "capabilities"
type = "list<string>"
since = "0.2.0"
readonly = true

# False once the device was unplugged.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# Whether the device is enabled. It always is: the compositor cannot disable one device, so writing false is refused as `unsupported` and
# true changes nothing. Use `binding_only` to keep a device's keys from clients.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"

# The context that holds the device. Writing another context of the same seat moves the device: its bindings, and the bindings that context made
# for all its devices, start matching its events, and the old context's stop. Its binding-only claim goes with it. It is refused for a context
# that is not in `contexts` and for one on another seat.
[[object.property]]
name = "context"
type = "object:input_context"
since = "0.2.0"

# The device's own bindings: they run before a layout's and the context's.
[[object.property]]
name = "bindings"
type = "object:binding_collection"
since = "0.2.0"
readonly = true

# Whether the device is binding-only: its keys reach no client and fire only the bindings made for it or for every device, and a chord no
# binding claims is dropped. Writing true or false makes or gives up the claim on the seat.
[[object.property]]
name = "binding_only"
type = "bool"
since = "0.2.0"

# Binds `action` to `trigger` for this device. As `binding_collection.bind` on its `bindings`.
