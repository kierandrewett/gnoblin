[[object.property]]
name = "launches"
type = "object:launches"
since = "0.2.0"
readonly = true

# The input contexts of the seats and the bindings on them (`input` module).
[[object.property]]
name = "input"
type = "object:input_manager"
since = "0.2.0"
readonly = true

# Policy over the compositor's consent, passphrase and authentication dialogs (`dialogs` module).
[[object.property]]
name = "dialogs"
type = "object:dialogs"
since = "0.2.0"
readonly = true

# The session's polkit authentications (`dialogs` module).
[[object.property]]
name = "authentication"
type = "object:authentication"
since = "0.2.0"
readonly = true

# The session lock as a lock screen reads it (`lock` module).
[[object.property]]
name = "lock"
type = "object:session_lock"
since = "0.2.0"
readonly = true

# The build identity: Gnoblin, GNOME, Mutter, the script engine and the control API, and the commit and build that made this one.
[[object.property]]
name = "version"
type = "object:build_version"
since = "0.2.0"
readonly = true

# The live windows that match `query`, in list order; every window when it is left out. For a test a table cannot say, take
# `clients.to_list()` and filter it in the shell's own language.
[[object.method]]
name = "find_clients"
since = "0.2.0"
returns = "list<object:client>"

[[object.method.param]]
name = "query"
type = "object:client_query"
optional = true

# The live outputs that match `query`, in list order; every output when it is left out.
[[object.method]]
name = "find_outputs"
since = "0.2.0"
returns = "list<object:output>"

[[object.method.param]]
name = "query"
type = "object:output_query"
optional = true

# Runs `run` once, `ms` milliseconds from now (0 to a day), from the first turn at or after its time. The timer can be cancelled.
# A throw is reported and never stops another timer.
[[object.method]]
name = "timer"
since = "0.2.0"
returns = "object:timer"

[[object.method.param]]
name = "ms"
type = "double"

[[object.method.param]]
name = "run"
type = "callback:timer_fn"

# The monotonic clock in milliseconds: only the difference between two readings is meaningful.
[[object.method]]
name = "now"
since = "0.2.0"
returns = "double"

# Starts a program: `process.spawn`. Returns its handle at once.
[[object.method]]
name = "spawn"
since = "0.2.0"
returns = "object:process"

[[object.method.param]]
name = "argv"
type = "list<string>"

[[object.method.param]]
name = "options"
type = "object:spawn_options"
optional = true

# Starts a command line under `/bin/sh -c`: `process.shell`.
[[object.method]]
name = "shell"
since = "0.2.0"
returns = "object:process"

[[object.method.param]]
name = "command"
type = "string"

[[object.method.param]]
name = "options"
type = "object:spawn_options"
optional = true

# A window appeared: told for every window that joins `clients`, and from the next turn for each one there already when a listener
# is added. The same as `clients.added`.
[[object.signal]]
name = "client_created"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "collection"
type = "object:client_collection"

# The same as `clients.title_changed`: the window title changed.
[[object.signal]]
name = "client_title_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "title"
type = "string"

# The same as `clients.app_id_changed`: the application id changed.
[[object.signal]]
name = "client_app_id_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "app_id"
type = "string"

# The same as `clients.decoration_changed`: the compositor changed who draws the window's frame: `client`, `server` or `none` (see
# `client.decoration`).
[[object.signal]]
name = "client_decoration_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "decoration"
type = "string"

# The same as `clients.pointer_enter`: the pointer crossed into the window. `event` is in the window's own coordinates.
[[object.signal]]
name = "client_pointer_enter"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The same as `clients.pointer_motion`: the pointer moved over the window.
[[object.signal]]
name = "client_pointer_motion"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The same as `clients.pointer_leave`: the pointer left the window.
[[object.signal]]
name = "client_pointer_leave"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The same as `clients.pointer_press`: a button went down on the window. The window's client hears it too.
[[object.signal]]
name = "client_pointer_press"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The same as `clients.pointer_release`: a button was released over the window.
[[object.signal]]
name = "client_pointer_release"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# The same as `clients.focus_changed`: keyboard focus entered or left the window.
[[object.signal]]
name = "client_focus_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "focused"
type = "bool"

# The same as `clients.geometry_changed`: the window's geometry changed.
[[object.signal]]
name = "client_geometry_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "geometry"
type = "object:rect"

# The same as `clients.closed`: the window closed. Its last values stay readable.
[[object.signal]]
name = "client_closed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

# The same as `clients.ready`: the window completed its initial setup: told for a window that was there at the start of the shell,
# and for each one that arrives.
[[object.signal]]
name = "client_ready"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

# An output joined `outputs`. The same as `outputs.added`.
[[object.signal]]
name = "output_added"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

[[object.signal.field]]
name = "collection"
type = "object:output_collection"

# An output left `outputs`. The same as `outputs.removed`.
[[object.signal]]
name = "output_removed"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

[[object.signal.field]]
name = "collection"
type = "object:output_collection"

# The same as `outputs.applied`: an `apply` asked of this output was answered: `error` is empty when it took effect, else why it
# did not.
[[object.signal]]
name = "output_applied"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

[[object.signal.field]]
name = "error"
type = "string"

# The same as `outputs.connected`: the output appeared: it was plugged in while the shell ran, or made by the compositor.
[[object.signal]]
name = "output_connected"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

# The same as `outputs.disconnected`: the output is gone. Its last values stay readable and `connected` is false.
[[object.signal]]
name = "output_disconnected"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

# The same as `outputs.mode_changed`: the output's mode (`WxH@Hz`) changed.
[[object.signal]]
name = "output_mode_changed"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

[[object.signal.field]]
name = "mode"
type = "string"

# The same as `outputs.scale_changed`: the output scale changed.
[[object.signal]]
name = "output_scale_changed"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

[[object.signal.field]]
name = "scale"
type = "double"

# The same as `outputs.geometry_changed`: the output's place or size in the compositor's coordinates changed.
[[object.signal]]
name = "output_geometry_changed"
since = "0.2.0"

[[object.signal.field]]
name = "output"
type = "object:output"

[[object.signal.field]]
name = "geometry"
type = "object:rect"

