# The pointer left the window.
[[object.signal]]
name = "pointer_leave"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# A button went down on the window. The window's client hears it too.
[[object.signal]]
name = "pointer_press"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# A button was released over the window.
[[object.signal]]
name = "pointer_release"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
type = "object:pointer_event"

# Keyboard focus entered or left the window.
[[object.signal]]
name = "focus_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "focused"
type = "bool"

# The window's geometry changed.
[[object.signal]]
name = "geometry_changed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "geometry"
type = "object:rect"

# The window closed. Its last values stay readable.
[[object.signal]]
name = "closed"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

# The window completed its initial setup: told for a window that was there at the start of the shell, and for each one that
# arrives.
[[object.signal]]
name = "ready"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

# A connected output, the compositor's `screen` node: a physical or virtual display with its place in the layout. It is made and
# destroyed by the compositor as displays come and go; a destroyed one keeps its last values and reads `alive` false.
[[object]]
name = "output"
since = "0.2.0"
kind = "handle"

# The compositor's label for this output: its node number.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"
readonly = true

# Whether the output is still connected.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# The name the compositor gives the output, which a workspace set's entry and `gnoblin.outputs.where` use.
[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
readonly = true

# The monitor's manufacturer, as it reports it.
[[object.property]]
name = "make"
type = "string"
since = "0.2.0"
readonly = true

# The monitor's model name, as it reports it.
[[object.property]]
name = "model"
type = "string"
since = "0.2.0"
readonly = true

# The connector the display is plugged into (`DP-1`): what an output profile matches and `mirror_of` names.
[[object.property]]
name = "connector"
type = "string"
since = "0.2.0"
readonly = true

# The monitor's EDID identity (`MAN:product:serial`), empty for a display that reports none.
[[object.property]]
name = "identity"
type = "string"
since = "0.2.0"
readonly = true

# The output this one shows an exact copy of, or none when it shows its own picture.
[[object.property]]
name = "mirror_of"
type = "object:output"
since = "0.2.0"
readonly = true

# The mode being driven, `WxH@Hz`.
[[object.property]]
name = "mode"
type = "string"
since = "0.2.0"
readonly = true

# The factor the output composes at: 2 is a HiDPI panel.
[[object.property]]
name = "scale"
type = "double"
since = "0.2.0"
readonly = true

# The output is composed at this multiple of its mode and shown at the mode. 1 is none.
[[object.property]]
name = "supersample"
type = "double"
since = "0.2.0"
readonly = true

# The size the output is composed at, `mode * supersample`, in pixels: the size of its screenshots.
[[object.property]]
name = "virtual_size"
type = "object:size"
since = "0.2.0"
readonly = true

# The scale clients are told: `scale * supersample`.
[[object.property]]
name = "effective_scale"
type = "double"
since = "0.2.0"
readonly = true

# The compositor's requested GPU memory for this output.
[[object.property]]
name = "gpu_memory"
type = "object:gpu_memory"
since = "0.2.0"
readonly = true

# The output's rotation and flip, in the compositor's names: `normal`, `90`, `180`, `270` or a `flipped` form.
[[object.property]]
name = "transform"
type = "string"
since = "0.2.0"
readonly = true

# Whether this is the primary output, the one the stock shell's bars are on.
[[object.property]]
name = "primary"
type = "bool"
since = "0.2.0"
readonly = true

# Whether the output is switched on.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"
readonly = true

# The output's left edge in the compositor's coordinates, in logical pixels.
[[object.property]]
name = "x"
type = "double"
since = "0.2.0"
readonly = true

# The output's top edge in the compositor's coordinates, in logical pixels.
[[object.property]]
name = "y"
type = "double"
since = "0.2.0"
readonly = true

# The output's width in logical pixels.
[[object.property]]
name = "width"
type = "double"
since = "0.2.0"
readonly = true

# The output's height in logical pixels.
[[object.property]]
name = "height"
type = "double"
since = "0.2.0"
readonly = true

# The whole output in the compositor's coordinates.
[[object.property]]
name = "bounds"
type = "object:rect"
since = "0.2.0"
readonly = true

# The reactive properties of the output.
[[object.property]]
name = "properties"
type = "object:property_bindings"
since = "0.2.0"
readonly = true

# Configures the display through the compositor's transactional output engine and keeps the result as this monitor's profile. A
# key left out keeps its value. The whole arrangement is checked before hardware is touched; if the backend then refuses a mode,
# the earlier changes are put back. A bad value is refused here, naming the key. The compositor answers a frame later and the
# returned operation settles with it: it succeeds, or fails with the compositor's own words and the code `denied`, `unsupported`
# or `not_found`.
[[object.method]]
name = "apply"
since = "0.2.0"
returns = "object:output_operation"

[[object.method.param]]
name = "config"
type = "object:output_config"

# Shows an exact copy of `source` (scaled to fit, letterboxed) on this display, or stops mirroring when none is given.
[[object.method]]
name = "mirror"
since = "0.2.0"
returns = "object:output_operation"

[[object.method.param]]
name = "source"
type = "object:output"
optional = true

# Adds a listener of this output. It is told of each event as `output_listener` says; adding one that is added already has no
# effect.
[[object.method]]
name = "add_listener"
since = "0.2.0"

[[object.method.param]]
name = "listener"
type = "object:output_listener"

# Removes a listener added with `add_listener`. One that is not added is ignored.
[[object.method]]
name = "remove_listener"
since = "0.2.0"

[[object.method.param]]
name = "listener"
type = "object:output_listener"

