# The `client` module of `gnoblin.model`: windows and outputs as objects, and the `gnoblin` service that holds the roots.
#
# A `client` is a toplevel window the compositor manages and an `output` a connected display. Both are made and ended by the compositor:
# a shell never creates one. An object that is gone keeps its last values readable (`alive` is false) and refuses a write.
namespace = "gnoblin.model"
version = "0.2.0"
local = true

# How the compositor answers a window's client when it asks to be told it may draw its next frame: `auto` after every frame that
# shows the window, `hold` never, `throttle` at most `frame_rate` times a second.
[[enum]]
name = "frame_policy"
since = "0.2.0"
values = ["auto", "hold", "throttle"]

# The transforms an output takes. `rotate-90`, `rotate-180` and `rotate-270` are the compositor's `90`, `180` and `270`.
[[enum]]
name = "output_transform"
since = "0.2.0"
values = ["normal", "rotate-90", "rotate-180", "rotate-270", "flipped", "flipped-90", "flipped-180", "flipped-270"]

# The compositor's requested GPU memory of an output, in bytes; client-owned buffers are not counted. The last four are the memory
# budget's numbers for the whole session, the same on every output.
[[object]]
name = "gpu_memory"
since = "0.2.0"
kind = "record"

# The output-sized target, and the copy a supersampled output averages down into.
[[object.property]]
name = "target"
type = "double"
since = "0.2.0"
default = 0.0

# The effect scratch targets.
[[object.property]]
name = "scratch"
type = "double"
since = "0.2.0"
default = 0.0

# The host-visible buffers a renderer keeps between frames.
[[object.property]]
name = "staging"
type = "double"
since = "0.2.0"
default = 0.0

# The pictures of the views drawn on the GPU.
[[object.property]]
name = "views"
type = "double"
since = "0.2.0"
default = 0.0

# The last presented frame the capture protocols copy from.
[[object.property]]
name = "capture"
type = "double"
since = "0.2.0"
default = 0.0

# The sum of the five before.
[[object.property]]
name = "total"
type = "double"
since = "0.2.0"
default = 0.0

# The bytes of every client's live buffers.
[[object.property]]
name = "clients"
type = "double"
since = "0.2.0"
default = 0.0

# The budget the compositor holds the clients, the renderers and capture to; zero when it is off.
[[object.property]]
name = "budget"
type = "double"
since = "0.2.0"
default = 0.0

# The requests refused for passing a bound since the session began.
[[object.property]]
name = "refused"
type = "double"
since = "0.2.0"
default = 0.0

# The bytes given back from caches to make room for a client's buffer.
[[object.property]]
name = "evicted"
type = "double"
since = "0.2.0"
default = 0.0

# What an output is told to do, as the argument of `output.apply`: a field left out keeps the output's value. The compositor
# applies it through its transactional engine and keeps it as the output's profile, so the same monitor on the same port gets it
# back after an unplug. `primary` is not a setting: the layout derives the primary output.
[[object]]
name = "output_config"
since = "0.2.0"
kind = "record"

# `WxH@Hz` such as `3440x1440@144`, or `preferred` to keep what the backend drives.
[[object.property]]
name = "mode"
type = "string"
since = "0.2.0"
optional = true

# From 0.5 to 4.
[[object.property]]
name = "scale"
type = "double"
since = "0.2.0"
optional = true

# Composes the output at this multiple of its mode and shows it at its mode, so the desktop keeps its logical size while
# screenshots have higher resolution. From 1 to 16; 1, 2 and 4 are recommended, and other values are accepted when `mode *
# supersample` is a whole size, with a notice.
[[object.property]]
name = "supersample"
type = "double"
since = "0.2.0"
optional = true

# Rotation and optional reflection.
[[object.property]]
name = "transform"
type = "enum:output_transform"
since = "0.2.0"
optional = true

# The output's top-left corner in the one desktop coordinate space, `x`. Left out, it follows the row. It needs `position_y` as
# well, and both are whole numbers.
[[object.property]]
name = "position_x"
type = "int"
since = "0.2.0"
optional = true

# The output's top-left corner in the one desktop coordinate space, `y`.
[[object.property]]
name = "position_y"
type = "int"
since = "0.2.0"
optional = true

# `false` switches the output off: it shows black and has no place in the desktop.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"
optional = true

# The connector this output shows an exact copy of, letterboxed to fit its own panel. An empty name stops mirroring.
[[object.property]]
name = "mirror_of"
type = "string"
since = "0.2.0"
optional = true

# A toplevel window the compositor manages. It is made and ended by the compositor; after it ends its last values stay readable
# and a write is refused.
[[object]]
name = "client"
since = "0.2.0"
kind = "handle"

# The window's stable id: the compositor's node number.
[[object.property]]
name = "id"
type = "string"
since = "0.2.0"
readonly = true

# Whether the compositor still manages this window.
[[object.property]]
name = "alive"
type = "bool"
since = "0.2.0"
readonly = true

# The application identifier the window reports.
[[object.property]]
name = "app_id"
type = "string"
since = "0.2.0"
readonly = true

# The current window title.
[[object.property]]
name = "title"
type = "string"
since = "0.2.0"
readonly = true

# Whether this window has keyboard focus.
[[object.property]]
name = "focused"
type = "bool"
since = "0.2.0"
readonly = true

# Whether the window covers its output. Writing asks the compositor to make it fullscreen or restore it.
[[object.property]]
name = "fullscreen"
type = "bool"
since = "0.2.0"

# Whether the window is kept out of screen captures.
[[object.property]]
name = "secure"
type = "bool"
since = "0.2.0"

# Whether the client has left a liveness ping unanswered too long. The compositor writes it and clears it on an answer.
[[object.property]]
name = "unresponsive"
type = "bool"
since = "0.2.0"
readonly = true

# Who draws the window's frame, as the compositor negotiated it: `server` when the shell's titlebar does, `client` when the client
# draws its own, `none` for a window nobody frames.
[[object.property]]
name = "decoration"
type = "string"
since = "0.2.0"
readonly = true

# What the client asked of `xdg-decoration`: `client`, `server`, or `unset`.
[[object.property]]
name = "decoration_wanted"
type = "string"
since = "0.2.0"
readonly = true

# How the compositor answers this window's client when it asks to draw its next frame. It takes effect only while a shell holds
# the tree, and the compositor sets every window back to `auto` when the shell lets go.
[[object.property]]
name = "frame_policy"
type = "enum:frame_policy"
since = "0.2.0"
default = "auto"

# The most frame callbacks a second a `throttle` window's client is answered, in hertz: above 0 and at most 1000. Read only while
# `frame_policy` is `throttle`.
[[object.property]]
name = "frame_rate"
type = "double"
since = "0.2.0"
default = 30.0

# Whether the compositor tells the shell when the window's pixels reach the screen: while it is true each frame that draws the
# window writes `presented`. False by default, because a window written every frame is a change in every batch.
[[object.property]]
name = "report_presented"
type = "bool"
since = "0.2.0"

# When the last frame that showed the window reached the screen, in milliseconds on the compositor's monotonic clock, or 0 until a
# frame was presented with `report_presented` true.
[[object.property]]
name = "presented"
type = "uint"
since = "0.2.0"
readonly = true

# Horizontal position in logical pixels.
[[object.property]]
name = "x"
type = "double"
since = "0.2.0"

# Vertical position in logical pixels.
[[object.property]]
name = "y"
type = "double"
since = "0.2.0"

# Width in logical pixels.
[[object.property]]
name = "width"
type = "double"
since = "0.2.0"

# Height in logical pixels.
[[object.property]]
name = "height"
type = "double"
since = "0.2.0"

# The layout geometry. Assigning writes all four values.
[[object.property]]
name = "bounds"
type = "object:rect"
since = "0.2.0"

# The size the compositor last published for the window: what the client committed, as against `width` and `height`, which are
# what the shell asked for.
[[object.property]]
name = "committed_size"
type = "object:size"
since = "0.2.0"
readonly = true

# Whether the window is maximised. Writing asks the compositor to maximise or restore it.
[[object.property]]
name = "maximised"
type = "bool"
since = "0.2.0"

# Whether the window is minimised. Writing asks the compositor to minimise or restore it.
[[object.property]]
name = "minimised"
type = "bool"
since = "0.2.0"

# Whether the window sits in a tiled layout, so its client drops the border and rounding it draws itself.
[[object.property]]
name = "tiled"
type = "bool"
since = "0.2.0"

# Whether the window is drawn and hit. A workspace that is not shown hides its windows.
[[object.property]]
name = "visible"
type = "bool"
since = "0.2.0"

# How opaque the window is drawn, from 0 to 1 (the compositor clamps it).
[[object.property]]
name = "opacity"
type = "double"
since = "0.2.0"

# The window's place in depth; negative is in front of the camera.
[[object.property]]
name = "z"
type = "double"
since = "0.2.0"

# Rotation about the x, y and z axes in radians.
[[object.property]]
name = "rotation"
type = "list<double>"
since = "0.2.0"

# Scale along the x, y and z axes. Assigning one number is not accepted here: give three.
[[object.property]]
name = "scale"
type = "list<double>"
since = "0.2.0"

# Where the window is: `x`, `y` and its depth `z`. Assigning writes the three.
[[object.property]]
name = "position"
type = "list<double>"
since = "0.2.0"

# The window this one is a dialog of (`xdg_toplevel.set_parent`), or none. A dialog is centred in its parent when it opens, moves
# with it, stays on its workspace and output, and is left out of the layout's tiling.
[[object.property]]
name = "parent_window"
type = "object:client"
since = "0.2.0"
readonly = true

# Whether the window opened on an activation token the session's launcher minted, so `focus.new_windows` treats it as launched.
[[object.property]]
name = "from_launcher"
type = "bool"
since = "0.2.0"
readonly = true

# The reactive properties of the window: `client.properties.bind_double('opacity', compute)` sets `opacity` now and again whenever
# a property the function read changes.
[[object.property]]
name = "properties"
type = "object:property_bindings"
since = "0.2.0"
readonly = true

# Asks the client to close. The client is `alive` until the compositor destroys the window.
[[object.method]]
name = "close"
since = "0.2.0"

# Gives the window the keyboard focus: a write of the seat's `focus`, which is how a shell hands it out.
[[object.method]]
name = "focus"
since = "0.2.0"

# Puts the window on top of every other window. A fullscreen sibling keeps the top.
[[object.method]]
name = "raise"
since = "0.2.0"

# Puts the window under every other window.
[[object.method]]
name = "lower"
since = "0.2.0"

# Kills the process that owns the window with SIGKILL: the not-responding alert's Force quit. The compositor refuses, and does
# nothing, when the owner is unknown, has gone, changed since the window mapped, or is the compositor itself or init.
[[object.method]]
name = "kill"
since = "0.2.0"

# Adds a listener of this window. It is told of each event as `client_listener` says; adding one that is added already has no
# effect.
[[object.method]]
name = "add_listener"
since = "0.2.0"

[[object.method.param]]
name = "listener"
type = "object:client_listener"

# Removes a listener added with `add_listener`. One that is not added is ignored.
[[object.method]]
name = "remove_listener"
since = "0.2.0"

[[object.method.param]]
name = "listener"
type = "object:client_listener"

# The window title changed.
[[object.signal]]
name = "title_changed"
since = "0.2.0"
export = { rust = "client_title_changed" }

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "title"
type = "string"

# The application id changed.
[[object.signal]]
name = "app_id_changed"
since = "0.2.0"
