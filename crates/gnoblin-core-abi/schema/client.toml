# The compositor changed who draws the window's frame: `client`, `server` or `none` (see `client.decoration`).
[[object.signal]]
name = "decoration_changed"
since = "0.2.0"
export = { rust = "client_decoration_changed" }

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "decoration"
type = "string"

# The pointer crossed into the window. `event` is in the window's own coordinates.
[[object.signal]]
name = "pointer_enter"
since = "0.2.0"

[[object.signal.field]]
name = "client"
type = "object:client"

[[object.signal.field]]
name = "event"
