# Which backend `xdg-desktop-portal` uses for each interface in a Gnoblin session.
#
# This is the file the frontend reads: it is installed as
# `/usr/share/xdg-desktop-portal/portals.conf`, and it is checked in here rather than
# generated so a routing change is a reviewable line (design/rust-compositor.md, D19 and
# "Portals").
#
# D19: Gnoblin serves the interfaces its `gnoblin.portal` lists. Core negotiates a UI provider
# per request, and when no provider claims it the built-in portal UI (egui) answers. So the
# routing has these groups:
#
# - compositor-bound: they need the compositor, so Gnoblin serves them;
# - portal-served: Gnoblin asks the user itself and serves them, with `gtk` and `kde` as
#   fallbacks when this backend does not list the interface or is not installed;
# - refused: Secret. It routes to `gnoblin` alone, so no keyring answers it (see the Secret
#   route below and design/keyring.md, "Apps reach gnome-keyring instead");
# - not served by Gnoblin: the rest. Gnoblin does not list them, so they route to a
#   fallback only, and the file says so rather than claiming them.
#
# A route is only taken when the backend's `gnoblin.portal` lists the interface in
# `Interfaces=`. The frontend skips a backend that does not list it and moves on to the next
# name, so a route written here before the backend implements the interface is safe: it
# changes nothing until `gnoblin.portal` is extended.
#
# `gnoblin` is this backend's routing id, from `gnoblin.portal`'s
# `DBusName=org.freedesktop.impl.portal.desktop.gnoblin`. `gtk` is
# `xdg-desktop-portal-gtk`, `kde` is `xdg-desktop-portal-kde`. The lists are ordered and the
# frontend takes the first installed backend that implements the interface, so every list
# ends with `*` (the first installed implementation in name order) rather than leaving an
# interface unserved when the preferred backend is not installed. Secret is the one exception:
# a `*` there would let any installed keyring answer it, so its list has no fallback.
#
# A user's own `~/.config/xdg-desktop-portal/portals.conf` or a per-backend override wins
# over this file; `gnoblin.configure.portals` in Lua is what writes that override.

[preferred]
# Anything this file does not name: any installed backend, chosen by name. A default of
# `gnoblin` alone would claim interfaces this backend does not implement, which the
# frontend reports as an interface with no implementation.
default=gnoblin;gtk;*

# --- compositor-bound: the compositor provides the capability ---------------------------

# Screen sharing. Reads frames and a cursor mode; the consent step is a `portal.ui` request.
org.freedesktop.impl.portal.ScreenCast=gnoblin;gtk;kde;*

# One frame or one colour. A screenshot is a capture, so it asks the same consent question.
org.freedesktop.impl.portal.Screenshot=gnoblin;gtk;kde;*

# Remote desktop: frames plus injected input, over EIS.
org.freedesktop.impl.portal.RemoteDesktop=gnoblin;gtk;kde;*

# Input capture for a remote-desktop client's barriers.
org.freedesktop.impl.portal.InputCapture=gnoblin;gtk;kde;*

# Global shortcuts. The shell's own editor is the user's choice, and the compositor owns the
# binding.
org.freedesktop.impl.portal.GlobalShortcuts=gnoblin;gtk;kde;*

# The clipboard's selection transfer.
org.freedesktop.impl.portal.Clipboard=gnoblin;gtk;kde;*

# The appearance values toolkits read (D15). It publishes what the compositor's `settings`
# object states, and nothing else.
org.freedesktop.impl.portal.Settings=gnoblin;gtk;kde;*

# Holding the session awake, and the monitor session that reports its state.
org.freedesktop.impl.portal.Inhibit=gnoblin;gtk;kde;*

# --- portal-served: Gnoblin draws the dialogue or reads the system service --------------

# The accessibility consent dialog (`Access.AccessDialog`). Gnoblin asks the question on the
# `portal.ui` provider or its built-in dialogue, and grants no capability.
org.freedesktop.impl.portal.Access=gnoblin;gtk;kde;*

# --- not served by Gnoblin: its `gnoblin.portal` does not list these ---------------------
#
# Gnoblin does not implement these yet, so the frontend skips the Gnoblin backend for them and
# uses the first installed fallback. They are routed past Gnoblin so this file does not claim
# a service the backend does not run. Adding one here is only correct together with the
# interface in `gnoblin.portal`.

org.freedesktop.impl.portal.Wallpaper=gtk;kde;*
org.freedesktop.impl.portal.Background=gtk;kde;*
org.freedesktop.impl.portal.FileChooser=gtk;kde;*
org.freedesktop.impl.portal.AppChooser=gtk;kde;*
org.freedesktop.impl.portal.Print=gtk;kde;*
org.freedesktop.impl.portal.Account=gtk;kde;*
org.freedesktop.impl.portal.Email=gtk;kde;*
org.freedesktop.impl.portal.Notification=gtk;kde;*
org.freedesktop.impl.portal.Lockdown=gtk;kde;*
org.freedesktop.impl.portal.DynamicLauncher=gtk;kde;*

# --- refused: no backend answers --------------------------------------------------------

# Secrets. This route names no fallback on purpose: `*` or `gtk` would let xdg-desktop-portal
# hand the request to gnome-keyring's `org.freedesktop.secrets`, the keyring this session
# replaces (design/keyring.md). `gnoblin.portal` does not list `Secret`, so the frontend finds
# no implementation and refuses the caller. Do not add a fallback here; see
# crates/xdg-desktop-portal-gnoblin/tests/portal_routing.rs.
org.freedesktop.impl.portal.Secret=gnoblin

# --- not served: a generic backend answers ----------------------------------------------

# Opening a URI or a file with the default application, and moving a file to the trash.
org.freedesktop.impl.portal.OpenURI=gtk;*
org.freedesktop.impl.portal.Trash=gtk;*
