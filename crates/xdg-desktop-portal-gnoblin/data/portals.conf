# Which backend `xdg-desktop-portal` uses for each interface in a Gnoblin session.
#
# This is the file the frontend reads: it is installed as
# `/usr/share/xdg-desktop-portal/portals.conf`, and it is checked in here rather than
# generated so a routing change is a reviewable line (design/rust-compositor.md, "Portals"
# and design/portal-extension.md)
#
# Two kinds of interface (design/rust-compositor.md, "Portals"):
#
# - compositor-bound: they need the compositor, so this backend serves them;
# - toolkit-bound: they draw a toolkit's own dialogue or read a desktop's own store, so a
#   generic backend serves them and Gnoblin does not implement them.
#
# `gnoblin` is this backend's routing id, from `gnoblin.portal`'s
# `DBusName=org.freedesktop.impl.portal.desktop.gnoblin`. `gtk` is
# `xdg-desktop-portal-gtk`, `kde` is `xdg-desktop-portal-kde`. The lists are ordered and the
# frontend takes the first installed backend that implements the interface, so every list
# ends with `*` (the first installed implementation in name order) rather than leaving an
# interface unserved when the preferred backend is not installed.
#
# A user's own `~/.config/xdg-desktop-portal/portals.conf` or a per-backend override wins
# over this file; `gnoblin.configure.portals` in Lua is what writes that override.

[preferred]
# Anything this file does not name: any installed backend, chosen by name. A default of
# `gnoblin` would claim interfaces this backend does not implement, which the frontend
# reports as an interface with no implementation.
default=gnoblin;gtk;*

# --- compositor-bound: this backend serves them -----------------------------------------

# Screen sharing. Reads frames and a cursor mode; the consent step is a `portal.ui` request.
org.freedesktop.impl.portal.ScreenCast=gnoblin;gtk;*

# One frame or one colour. A screenshot is a capture, so it asks the same consent question.
org.freedesktop.impl.portal.Screenshot=gnoblin;gtk;*

# Remote desktop: frames plus injected input, over EIS.
org.freedesktop.impl.portal.RemoteDesktop=gnoblin;gtk;*

# Input capture for a remote-desktop client's barriers.
org.freedesktop.impl.portal.InputCapture=gnoblin;gtk;*

# Global shortcuts. The shell's own editor is the user's choice, and the compositor owns the
# binding.
org.freedesktop.impl.portal.GlobalShortcuts=gnoblin;gtk;*

# The clipboard's selection transfer.
org.freedesktop.impl.portal.Clipboard=gnoblin;gtk;*

# The appearance values toolkits read (D15). This is the one interface here that is complete:
# it publishes what the compositor's `settings` object states, and nothing else.
org.freedesktop.impl.portal.Settings=gnoblin;gtk;*

# Holding the session awake, and the monitor session that reports its state.
org.freedesktop.impl.portal.Inhibit=gnoblin;gtk;*

# --- toolkit-bound: Gnoblin does not implement these -----------------------------------

# A toolkit's file dialogue. The GTK backend draws it; KDE's is the fallback for a
# KDE-oriented environment.
org.freedesktop.impl.portal.FileChooser=gtk;kde;*

# Choosing an application to open a file.
org.freedesktop.impl.portal.AppChooser=gtk;kde;*

# Printing: the dialogue and the CUPS job.
org.freedesktop.impl.portal.Print=gtk;kde;*

# The user's online accounts.
org.freedesktop.impl.portal.Account=gtk;kde;*

# Composing an email in the user's mail client.
org.freedesktop.impl.portal.Email=gtk;kde;*

# Sending a notification. The `notifications` slot is a shell's, so a generic backend answers
# here and a shell that wants its own notifications serves its own backend.
org.freedesktop.impl.portal.Notification=gtk;kde;*

# Setting the desktop background.
org.freedesktop.impl.portal.Wallpaper=gtk;kde;*

# The lock-down switches a managed system sets.
org.freedesktop.impl.portal.Lockdown=gtk;kde;*

# The dynamic launcher (a `.desktop` file created from an app).
org.freedesktop.impl.portal.DynamicLauncher=gnoblin;gtk;*
