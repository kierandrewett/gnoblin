# The members `gnoblin` has by hand, beside the generated object types.
#
# These are host-only: they never reach the schema, the IPC catalog, the CLI or the
# IPC docs. `build.rs` reads this file and derives the names an object type may not
# take (`lua_names.rs`), the LuaCATS stub text for these members, and `HOST_MEMBERS`,
# which `src/bindings.rs` checks its installers against at startup. The installers stay
# hand-written Rust: each declaration needs one, and each installer needs a declaration.
#
# A `table` member lists its children under `members`. Types are LuaCATS spellings.

[[member]]
name = "configure"
kind = "function"
doc = "Declare configuration. Validated immediately; every problem is raised."
params = [{ name = "settings", type = "table" }]

[[member]]
name = "window_rule"
kind = "function"
doc = "Append one window rule to the configured list. Load time only; later rules override the fields they set. Unknown keys and refused fields are raised by name."
params = [{ name = "rule", type = "table" }]

[[member]]
name = "load"
kind = "function"
doc = "Load configuration fragments matching a path or glob, relative to the calling file. Use `require` for a module that returns a value."
params = [{ name = "path_or_glob", type = "string" }]
returns = ["boolean"]

[[member]]
name = "on"
kind = "function"
doc = "Subscribe to a schema-declared signal by its `namespace.object.signal` name. The handler receives an event table; the returned subscription can be unsubscribed."
params = [{ name = "event", type = "string" }, { name = "callback", type = "fun(table)" }]
returns = ["gnoblin.Subscription"]

[[member]]
name = "once"
kind = "function"
doc = "Subscribe to a schema-declared signal once. The handler receives an event table."
params = [{ name = "event", type = "string" }, { name = "callback", type = "fun(table)" }]
returns = ["gnoblin.Subscription"]

[[member]]
name = "timers"
kind = "table"
doc = "Timers run on the caller's monotonic clock, measured in seconds."

[[member.members]]
name = "after"
kind = "function"
doc = "Run `callback` after `seconds` seconds; the returned timer can be cancelled."
params = [{ name = "seconds", type = "number" }, { name = "callback", type = "fun()" }]
returns = ["gnoblin.Timer"]

[[member.members]]
name = "now"
kind = "function"
doc = "The caller's monotonic clock in seconds."
returns = ["number"]

[[member]]
name = "version"
kind = "function"
doc = "The build identity: an immutable record of string fields `gnoblin`, `gnome`, `mutter`, `lua`, `api`, `git_remote`, `git_sha` and `build_id`. Missing values are `\"unknown\"`; remote credentials are removed. Read on each call."
returns = ["table"]

[[member]]
name = "process"
kind = "table"
doc = "Child processes the runtime starts. `spawn` returns a `Process` at once; its end arrives later, through `wait()` or `kill()` operations."

[[member.members]]
name = "spawn"
kind = "function"
doc = "Start the program named by the first string of `argv`, found on PATH, with the rest as arguments. Options are `cwd`, `env`, `stdin`, `stdout`, `stderr`, `output_limit` and `timeout`. A bad argv or option is raised by name."
params = [{ name = "argv", type = "string[]" }, { name = "options", type = "table|nil" }]
returns = ["gnoblin.Process"]

[[member.members]]
name = "list"
kind = "function"
doc = "Every process the runtime has started and not yet seen end, in id order."
returns = ["gnoblin.Process[]"]

[[member.members]]
name = "by_id"
kind = "function"
doc = "The process with this id, or nil when the id is unknown or the process was forgotten."
params = [{ name = "id", type = "integer" }]
returns = ["gnoblin.Process|nil"]

[[member]]
name = "windows"
kind = "table"
doc = "The live windows, as interned objects. Each answer is as of the last pump; a window that closes leaves every answer at the same time."

[[member.members]]
name = "list"
kind = "function"
doc = "Every live window, in identity order."
returns = ["gnoblin.window[]"]

[[member.members]]
name = "focused"
kind = "function"
doc = "The focused window, or nil when none has focus."
returns = ["gnoblin.window|nil"]

[[member.members]]
name = "by_id"
kind = "function"
doc = "The live window with this identity, or nil. A closed window has no answer here; a held object keeps `alive == false`."
params = [{ name = "id", type = "integer" }]
returns = ["gnoblin.window|nil"]

[[member]]
name = "outputs"
kind = "table"
doc = "The live outputs, as interned objects. Each answer is as of the last pump."

[[member.members]]
name = "list"
kind = "function"
doc = "Every live output, in identity order."
returns = ["gnoblin.output[]"]

[[member.members]]
name = "primary"
kind = "function"
doc = "The primary output, or nil when none is marked primary."
returns = ["gnoblin.output|nil"]

[[member.members]]
name = "by_id"
kind = "function"
doc = "The live output with this connector name, or nil. An output's identity is its connector name, not a number."
params = [{ name = "name", type = "string" }]
returns = ["gnoblin.output|nil"]

[[member]]
name = "workspaces"
kind = "table"
doc = "The live workspaces, as interned objects. Each answer is as of the last pump."

[[member.members]]
name = "list"
kind = "function"
doc = "Every live workspace, in identity order."
returns = ["gnoblin.workspace[]"]

[[member.members]]
name = "by_id"
kind = "function"
doc = "The live workspace with this identity, or nil."
params = [{ name = "id", type = "integer" }]
returns = ["gnoblin.workspace|nil"]

[[member]]
name = "find"
kind = "function"
doc = "The live objects of one kind that match a filter, as a Lua array in identity order. The kinds are `Window`, `Workspace` and `Output`. A table filter keeps the objects whose scalar fields equal every value given; a function filter keeps those it returns a truthy value for. An unknown kind or filter field is raised by name."
params = [{ name = "kind", type = "string" }, { name = "filter", type = "table|fun(object: table): boolean|nil" }]
returns = ["table"]

[[member]]
name = "status"
kind = "function"
object = "session"
doc = "The session's state as the mirror holds it: `state` (always `running`), `lock_available` and `revision`. `lock_state` is present only while `lock_available` is true. Read on each call, as of the last pump."
returns = ["table"]

[[member]]
name = "logout"
kind = "function"
object = "session"
doc = "End the session. The operation finishes with `{accepted = true}` once the compositor confirms the request; then the compositor exits with the logout code, the supervisor exits successfully and the session wrapper returns to the login manager. A socket caller may receive EOF while the session closes."
returns = ["gnoblin.Operation"]

[[member]]
name = "poweroff"
kind = "function"
object = "session"
doc = "Power the machine off. The operation finishes `done` once the init system accepts the request, or `failed` with the error that says why it refused. The shell asks the user first; this call does not prompt."
returns = ["gnoblin.Operation"]

[[member]]
name = "reboot"
kind = "function"
object = "session"
doc = "Reboot the machine. Same contract as `poweroff`: the operation finishes `done` or `failed`, and this call does not prompt."
returns = ["gnoblin.Operation"]

[[member]]
name = "suspend"
kind = "function"
object = "session"
doc = "Suspend the machine to RAM. Same contract as `poweroff`: the operation finishes `done` or `failed`, and this call does not prompt."
returns = ["gnoblin.Operation"]

[[member]]
name = "hibernate"
kind = "function"
object = "session"
doc = "Hibernate the machine to disk. Same contract as `poweroff`. The operation is refused `unsupported` when the machine reports it cannot hibernate."
returns = ["gnoblin.Operation"]
