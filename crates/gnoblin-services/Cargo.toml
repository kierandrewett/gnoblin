[package]
name = "gnoblin-services"
description = "D-Bus agents: polkit, GeoClue, prompter, PipeWire privacy, ScreenSaver, inhibit and idle."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The services role is an IPC client (design/rust-compositor.md, "Providers and
# slots"): it offers a request to the compositor and reads the one answer, so it
# names the client and never an engine crate.
gnoblin-client = { path = "../gnoblin-client" }
# The request vocabulary the answer travels in: `Answer`, `RequestOutcome`, the
# schema-addressed `Fields`, and the `Tick` a deadline is measured in.
gnoblin-model = { path = "../gnoblin-model" }
# The primitives the role loop names: the tick a deadline is measured in.
gnoblin-types = { path = "../gnoblin-types" }
# The version the handshake advertises is the schema's, and the wire crate is where both
# sides of a handshake read it from.
gnoblin-proto = { path = "../gnoblin-proto" }
# The polkit authentication agent is a D-Bus object on the system bus.
zbus.workspace = true
# One blocking wait per bus registration: the role has no async runtime of its own, and
# `zbus` runs its connection on its own thread.
futures-lite.workspace = true
# Every refusal, cancellation and registration is logged once, and never with the
# material of an answer.
tracing.workspace = true
# A `BeginAuthentication` reply waits for the provider's answer, so the waiting
# handler holds a one-shot channel rather than a locked mutex.
futures-channel.workspace = true

[dev-dependencies]
# The tests build the graph from the checked-in schema, so the slot property names
# this crate publishes are checked against the contract rather than a fixture.
gnoblin-schema = { path = "../gnoblin-schema" }
# The private bus the D-Bus tests start for themselves.
# The role test serves a real socketpair, so the shipped loop is exercised rather
# than a copy of it.
tempfile = "3.23.0"

[lints]
workspace = true
