[package]
name = "gnoblin"
description = "Session entry point: shell discovery and role dispatch for guardian, compositor, shell and services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gnoblin"
path = "src/main.rs"

[dependencies]
# The compositor is not a dependency of this binary: the composition root is `libgnoblin-core.so.1`, which this binary links
# through the stub of `build.rs` and enters through `gnoblin_main` (`design/modular-framework.md`, M2.10). What the binary
# keeps are the roles that are not the compositor's, the logging configuration they read and the IPC version `--version` prints.
gnoblin-config = { path = "../gnoblin-config" }
gnoblin-proto = { path = "../gnoblin-proto" }
# The guardian: the plan of children, the events it answers, the effects it returns and
# the supervisor that performs them. The guardian role is this crate's, because the
# process that starts the other processes is the one that names them.
gnoblin-session = { path = "../gnoblin-session" }
# The logging composition: the console and the log file sinks, for every role.
gnoblin-log = { path = "../gnoblin-log", features = ["init"] }
# The JavaScript runtime role: it locates and evaluates `shell.ts`, commits the document, runs the shell and serves
# `config.reload` itself. A role entry point and an IPC client; `gnoblin-js` brings in the JavaScript engine.
gnoblin-js = { path = "../gnoblin-js" }
# The services role: the D-Bus agents as their own process.
gnoblin-services = { path = "../gnoblin-services" }
# The compat wiring: which adapters exist and how each process serves them. The binary
# names this crate and no adapter; `xtask/src/deps.rs` enforces that.
gnoblin-compat-host = { path = "../compat/gnoblin-compat-host" }
# Which shell runs: the seven discovery tiers, `--list-shells` and the error text. The guardian resolves the shell with it
# before it starts anything.
gnoblin-shell-discovery = { path = "../gnoblin-shell-discovery" }
# The command line.
clap.workspace = true

[build-dependencies]
# `build.rs` links `libgnoblin-core.so.1` through the generated stub (`build_support`), so the binary records the library
# without Cargo building it first. A build dependency only: the one call the binary makes (`gnoblin_main`) is declared in
# `src/core_link.rs`.
gnoblin-core-abi = { path = "../gnoblin-core-abi", features = ["build-support"] }

# The launcher makes one `unsafe` call, into the core library (`src/core_link.rs`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
# The tests run the built binary, so the exit codes and the flags are the shipped
# ones rather than a function that happens to share their names.
tempfile = "3.23.0"
# The guardian tests ask the session what it serves through the real command line client,
# and read the version the compositor advertises from the crate that serves it.
gnoblinctl = { path = "../gnoblinctl" }
gnoblin-compositor = { path = "../gnoblin-compositor" }
# The in-process sessions run the stock window manager, which the core does not carry (a development edge only).
gnoblin-std-wm = { path = "../gnoblin-std-wm" }
gnoblin-std-portal = { path = "../gnoblin-std-portal" }
# A test kills a child the way a crash does, which is one signal to one process group; the authentication test plays
# the guardian, whose control socket is a SEQPACKET pair (`net`). The idle-turn benchmark of `tests/js_shell.rs` reads the
# thread's CPU clock, to tell the time a turn computes from the time it waits in a read (`time`).
rustix = { workspace = true, features = ["process", "net", "time"] }
# `tests/js_shell.rs` runs the JavaScript shell against a real compositor session: the compositor's crate may
# not name the shell (and the shell's crate may not name the compositor), so the test lives where both are
# allowed. It maps real windows with a Wayland client, reads the scene back as a tree observer, and reads what
# the shell logged.
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# `tests/native_shell.rs` types a chord into a real session through `zwp_virtual_keyboard_v1`, as an on-screen keyboard does: the
# spawned binary has no input tap to inject through.
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# `tests/modular/native_menus.rs` clicks in a real session through `zwlr_virtual_pointer_v1`: a client asks for its window menu with the serial of
# a button press, which only a pointer gives.
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
gnoblin-client = { path = "../gnoblin-client" }
gnoblin-proto = { path = "../gnoblin-proto" }
# `tests/js_shell.rs` moves a manual clock under the shell and reads its health: the host's supervisor types.
gnoblin-shell-host = { path = "../gnoblin-shell-host" }
# `tests/js_lock.rs` runs the shell over a link it wraps, to make the real compositor refuse one transaction.
gnoblin-tree-client.workspace = true
# `tests/js_runtime_role.rs` runs the JavaScript runtime role over a configuration directory of its own, which is a
# `SearchPaths`.
gnoblin-config = { path = "../gnoblin-config" }
gnoblin-log = { path = "../gnoblin-log", features = ["capture"] }
# `tests/js_shell.rs` decodes the paint lists the compositor holds and draws one, to read a pixel the shell's script
# painted.
gnoblin-paint = { path = "../gnoblin-paint" }
# The pointer drag test sends the input events a device would through the session's input tap, and names the type
# of the tap's events and the ids they carry.
gnoblin-backend = { path = "../gnoblin-backend" }
gnoblin-types = { path = "../gnoblin-types" }
# The lock tests give the session a scripted password check in place of PAM (`LockCheck`, `FakeAuthenticator`).
gnoblin-lock-auth = { path = "../gnoblin-lock-auth" }
gnoblin-wayland = { path = "../gnoblin-wayland" }
# The configuration and dialog tests read the document the compositor holds, ask it for a consent dialog the way
# the portal does (a request's options are the model's `Fields`) and refuse nothing a fake could answer.
gnoblin-model = { path = "../gnoblin-model" }
# The in-process JavaScript shell of `tests/js_shell.rs` runs over a core with the std library loaded, as the compositor runs it: the stock
# layouts of `gnoblin-std` are the library's (`tests/support/core_rig.rs`). A development edge is what `impl-sealed` allows.
gnoblin-core-impl = { path = "../gnoblin-core-impl" }
gnoblin-core-abi = { path = "../gnoblin-core-abi" }
gnoblin-std-impl = { path = "../gnoblin-std-impl" }
gnoblin-std-dyn = { path = "../gnoblin-std-dyn" }
gnoblin-runtime-js = { path = "../gnoblin-runtime-js" }
serde_json.workspace = true
