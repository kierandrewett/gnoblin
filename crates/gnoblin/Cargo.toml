[package]
name = "gnoblin"
description = "Session entry point: role dispatch for guardian, compositor, runtime and services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gnoblin"
path = "src/main.rs"

[dependencies]
# The composition root: the only crate that knows every subsystem. This binary hands
# it a configuration and stays out of the way; it must never learn a subsystem itself,
# because a binary that reached into an engine crate would be a second composition
# root.
gnoblin-compositor = { path = "../gnoblin-compositor" }
# The guardian: the plan of children, the events it answers, the effects it returns and
# the supervisor that performs them. The guardian role is this crate's, because the
# process that starts the other processes is the one that names them.
gnoblin-session = { path = "../gnoblin-session" }
# The logging composition: the console and the log file sinks, for every role.
gnoblin-log = { path = "../gnoblin-log", features = ["init"] }
# The Lua runtime role, selected by `GNOBLIN_SHELL_VM=lua` (or by an `init.lua` with no `init.ts`) for one more release:
# the Lua host as its own process (D1). A role entry point, not an engine: the binary hands it the inherited
# connection and stays out of the way.
gnoblin-lua = { path = "../gnoblin-lua" }
# The JavaScript runtime role, the default: it locates and evaluates `init.ts`, commits the document, runs the shell and
# serves `config.reload` itself. Like the Lua host it is a role entry point and an IPC client: it links no engine, and
# the binary is where the two roles meet.
gnoblin-js = { path = "../gnoblin-js" }
# The services role: the D-Bus agents as their own process.
gnoblin-services = { path = "../gnoblin-services" }
# The compat wiring: which adapters exist and how each process serves them. The binary
# names this crate and no adapter; `xtask/src/deps.rs` enforces that.
gnoblin-compat-host = { path = "../compat/gnoblin-compat-host" }
# The role flag. One flag with a documented default, and `--version`.
clap.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The tests run the built binary, so the exit codes and the flags are the shipped
# ones rather than a function that happens to share their names.
tempfile = "3.23.0"
# The guardian tests ask the session what it serves through the real command line client,
# and read the version the compositor advertises from the crate that serves it.
gnoblinctl = { path = "../gnoblinctl" }
gnoblin-compositor = { path = "../gnoblin-compositor" }
# A test kills a child the way a crash does, which is one signal to one process group; the authentication test plays
# the guardian, whose control socket is a SEQPACKET pair (`net`).
rustix = { workspace = true, features = ["process", "net"] }
# `tests/js_shell.rs` runs the JavaScript shell against a real compositor session: the compositor's crate may
# not name the shell (and the shell's crate may not name the compositor), so the test lives where both are
# allowed. It maps real windows with a Wayland client, reads the scene back as a tree observer, and reads what
# the shell logged.
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
gnoblin-client = { path = "../gnoblin-client" }
gnoblin-proto = { path = "../gnoblin-proto" }
# `tests/js_runtime_role.rs` runs the JavaScript runtime role over a configuration directory of its own, which is a
# `SearchPaths`.
gnoblin-config = { path = "../gnoblin-config" }
gnoblin-log = { path = "../gnoblin-log", features = ["capture"] }
# `tests/js_shell.rs` decodes the paint lists the compositor holds and draws one, to read a pixel the shell's script
# painted.
gnoblin-paint = { path = "../gnoblin-paint" }
# The pointer drag test sends the input events a device would through the session's input tap, and names the type
# of the tap's events and the ids they carry.
gnoblin-backend = { path = "../gnoblin-backend" }
gnoblin-types = { path = "../gnoblin-types" }
# The lock tests give the session a scripted password check in place of PAM (`LockCheck`, `FakeAuthenticator`).
gnoblin-lock-auth = { path = "../gnoblin-lock-auth" }
gnoblin-wayland = { path = "../gnoblin-wayland" }
# The configuration and dialog tests read the document the compositor holds, ask it for a consent dialog the way
# the portal does (a request's options are the model's `Fields`) and refuse nothing a fake could answer.
gnoblin-model = { path = "../gnoblin-model" }
serde_json.workspace = true
