[package]
name = "gnoblin-std"
description = "The Rust SDK for the optional Gnoblin desktop library: Client, Collection, Workspace, layouts and policies, as safe wrappers over the installed libgnoblin-std. It links the library and never contains a copy of it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Part of the Rust shell SDK on crates.io (the workspace's `publish = false` is for the rest).
publish = true
build = "build.rs"

[dependencies]
# The core SDK: `Gnoblin`, `Window`, `Node`, `Rect`. The std SDK builds on it and re-exports what a shell author needs of it.
gnoblin-core.workspace = true
gnoblin-core-abi.workspace = true
gnoblin-std-abi.workspace = true
# The client half of the object protocol, which the typed classes of `gnoblin.std` are written over.
gnoblin-object.workspace = true

[build-dependencies]
# The link stub runs in build.rs, so the helper code is a build dependency only.
gnoblin-std-abi = { workspace = true, features = ["build-support"] }
# The typed classes of `gnoblin.std` are generated at build time and never committed.
gnoblin-sdkgen.workspace = true

# The workspace table forbids unsafe code; the SDK's FFI modules need it. Only the modules that open with
# `#![allow(unsafe_code)]` and a SAFETY note use it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
