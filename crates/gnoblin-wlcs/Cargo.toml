[package]
name = "gnoblin-wlcs"
description = "The wlcs integration: a shared library that runs the Rust compositor headless for Canonical's Wayland Conformance Suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` is the artifact `wlcs` loads (`wlcs libgnoblin_wlcs.so`); `rlib` lets the crate's own tests and clippy
# use the safe harness. The wlcs C ABI is the one place this workspace is called through a function table, so the
# crate restates the workspace lint table with `unsafe_code = "deny"` and confines the exemption to `ffi.rs`, which
# opens with `#[allow(unsafe_code)]` and a `SAFETY:` comment per block. Nothing else may contain `unsafe`.
[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
# The session the conformance suite runs against: the same engine the compositor serves clients with.
gnoblin-wayland = { path = "../gnoblin-wayland" }
# The headless backend (one virtual output, the software renderer) and the input events a device injects.
gnoblin-backend = { path = "../gnoblin-backend" }
# Positions and output identities in the shared primitives.
gnoblin-types.workspace = true
# A private directory for the session's socket, so a run touches no shared one.
tempfile = "3.23.0"

[dev-dependencies]
# A real client that reads the registry, to prove the descriptor lists what the session advertises.
wayland-client.workspace = true
wayland-protocols = { version = "0.32.13", features = ["client"] }
