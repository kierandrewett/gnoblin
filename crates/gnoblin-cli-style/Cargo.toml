[package]
name = "gnoblin-cli-ui"
description = "The shared look of Gnoblin's command-line tools: colour, glyphs, tables and error blocks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Column widths of text as a terminal draws it: CJK and emoji take two columns,
# combining marks take none. Counting `chars()` would break every table with a
# wide cell.
unicode-width.workspace = true

[lints]
workspace = true
