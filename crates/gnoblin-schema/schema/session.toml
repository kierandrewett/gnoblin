# The `session` object: the small slice a shell needs to know the compositor is
# up, which version it speaks, and who provides each optional capability.
#
# Every member records `since`, the full Gnoblin version that added it. A client
# compares `since` with the compositor's version before it uses a member
# (design/rust-compositor.md, "Versioning").
namespace = "gnoblin"
version = "0.2.0"

[[object]]
name = "session"
since = "0.2.0"

# The namespace function `gnoblin.session.logout()`. It takes no arguments and returns an
# operation that finishes with `{accepted = true}` or a refusal. It is a method on the object
# all the same, so the wire needs no second route for it.
[[object.method]]
name = "logout"
since = "0.2.0"
function = true

# The namespace function `gnoblin.session.poweroff()`. It takes no arguments and returns an
# operation that finishes `done` once the init system accepts the request, or `failed` with the
# error that says why it refused. The shell asks the user; the verb does not prompt.
[[object.method]]
name = "poweroff"
since = "0.2.0"
function = true

# The namespace function `gnoblin.session.reboot()`. Same contract as `poweroff`.
[[object.method]]
name = "reboot"
since = "0.2.0"
function = true

# The namespace function `gnoblin.session.suspend()`. Same contract as `poweroff`.
[[object.method]]
name = "suspend"
since = "0.2.0"
function = true

# The namespace function `gnoblin.session.hibernate()`. Same contract as `poweroff`, and the
# operation is refused `unsupported` when the machine reports it cannot hibernate.
[[object.method]]
name = "hibernate"
since = "0.2.0"
function = true

# The IPC version the compositor serves, which is exactly the Gnoblin version.
[[object.property]]
name = "version"
type = "string"
since = "0.2.0"

# Sent once when the session can accept requests.
[[object.signal]]
name = "ready"
since = "0.2.0"

# An application rang the bell: `gtk_shell1.system_bell` or the display's own bell.
#
# A signal and not a property because there is no state to read afterwards: a reader
# reacts to the change. Whether the bell is visual, audible or both is configuration
# (`compositor.visual_bell`, `compositor.audible_bell`) and `gnoblin-a11y`'s decision,
# so the signal carries the count and nothing that would make the compositor's choice
# for it.
[[object.signal]]
name = "bell"
since = "0.2.0"

# How many times the bell has rung since the session started. A reader that missed one
# still sees that it happened, and a reader that compares against what it saw last knows
# how many it missed.
[[object.signal.field]]
name = "count"
type = "uint"
since = "0.2.0"

# The operator asked for the configuration to be reloaded (`gnoblinctl config reload`).
#
# The runtime role owns configuration, so it is the one that re-reads the document and
# answers. The compositor does not parse the document: it raises this signal and the
# runtime's `config.commit` or `config.reject` completes the request. `generation` counts
# the requests the compositor has forwarded, so a runtime that missed one still sees that
# it must reload.
[[object.signal]]
name = "reload_requested"
since = "0.2.0"

[[object.signal.field]]
name = "generation"
type = "uint"
since = "0.2.0"

# The provider of one slot, one property per slot ("Providers and slots").
#
# The value is `none`, `services` or `shell`. `none` means the slot has no
# provider at all, so a request for it fails closed with an error that names the
# slot: the alternative is a prompt that never appears and a caller that waits
# for its deadline. `services` is the services role's default provider and
# `shell` means a shell claimed the slot, so the shell draws the prompt and this
# connection does not.
#
# A slot is one property rather than a member of a list because the four slots
# are a closed set: a client reads the one property it cares about, a
# subscription sees a diff only for the slot that changed, and the schema's typing
# rules apply to the value. A property name cannot contain a dot, so a slot name
# from the plan becomes `slot_` plus the slot with its dot turned into an
# underscore.
[[object.property]]
name = "slot_auth_polkit"
type = "string"
since = "0.2.0"

# The passphrase and confirm prompt, answered by the shell over the request IPC. Defaults
# to `none`: a prompt with no provider fails closed rather than timing out.
[[object.property]]
name = "slot_prompt_secret"
type = "string"
since = "0.2.0"

# The `org.freedesktop.GeoClue2.Agent` provider.
[[object.property]]
name = "slot_location_agent"
type = "string"
since = "0.2.0"

# Idle watches and the ScreenSaver names.
[[object.property]]
name = "slot_idle_policy"
type = "string"
since = "0.2.0"

# The session's lock state: `unlocked`, `covering` (a cover is up or coming down),
# `locked`, or `failsafe` (the cover is up and no owner can proceed). It is the lock's
# state as the session announced it, so a reader that compares it with `lock_state_changed`
# sees the same states. Read it only while `lock_available` is true: before the first
# snapshot it holds `unlocked` only because the schema needs a value.
[[object.property]]
name = "lock_state"
type = "string"
since = "0.2.0"

# Whether the session has published a lock state yet. False until the first snapshot.
[[object.property]]
name = "lock_available"
type = "bool"
since = "0.2.0"

# How many lock state changes the session has published. A reader that compares it with
# the revision it last saw knows whether it missed one. Zero until the first snapshot.
[[object.property]]
name = "lock_revision"
type = "uint"
since = "0.2.0"

# The session's lock state changed. `state` is the new state's name and `revision` is the
# value `lock_revision` now holds, so a reader that missed one still sees the revision gap.
[[object.signal]]
name = "lock_state_changed"
since = "0.2.0"

[[object.signal.field]]
name = "state"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "revision"
type = "uint"
since = "0.2.0"

# A client asked for a member this compositor does not serve. Returned instead of
# silently ignoring the frame, so an old client reports what it needed.
[[error]]
name = "unknown-member"
since = "0.2.0"

# The init system refused the power request, or authorisation was denied.
[[error]]
name = "denied"
since = "0.2.0"

# The machine cannot carry out the power request, for example it cannot hibernate.
[[error]]
name = "unsupported"
since = "0.2.0"

# The init system is already running another power request.
[[error]]
name = "busy"
since = "0.2.0"

# No power backend is available in this session, for example the system bus is absent.
[[error]]
name = "unavailable"
since = "0.2.0"

# The init system did not answer in time.
[[error]]
name = "timed-out"
since = "0.2.0"

# The power request failed for a reason none of the other codes names.
[[error]]
name = "internal"
since = "0.2.0"
