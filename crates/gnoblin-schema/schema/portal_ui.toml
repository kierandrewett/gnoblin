# The portal UI: the request the services role sends to the built-in portal UI, and
# the outcome the UI answers with (design/rust-compositor.md, D19, "Schema additions").
#
# Two objects. `portal_ui` is the request, one method per interface kind, so each
# interface's payload is typed by its own parameters rather than one loose bag. The
# object model has no union, so the kind is the method name. `portal_outcome` is the
# answer: `handled`, `cancelled`, `declined` or `error`. The object model has no
# method results, so each outcome is its own method, sent back by the UI to services.
#
# Every request method carries `request_id` (unique per boot, assigned by services),
# `app_id` (set by services from compositor attribution, never from the request body)
# and `deadline_ms`. Bounded lists are parallel: `filter_names[i]` pairs with
# `filter_patterns[i]`, and `choice_ids[i]` with `choice_labels[i]`.
#
# The reply's bounds (a grant no wider than the request) are checked by
# `gnoblin-portal-ui`, which owns the typed payloads; this file only names the wire.
namespace = "gnoblin"
version = "0.2.0"

[[object]]
name = "portal_ui"
since = "0.2.0"

