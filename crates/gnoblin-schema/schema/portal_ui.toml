[[object.method.param]]
name = "request_id"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "reason"
type = "string"
since = "0.2.0"

# The UI confirms it did not act. Only a provider sends this, and the UI never does.
[[object.method]]
name = "declined"
since = "0.2.0"

[[object.method.param]]
name = "request_id"
type = "uint"
since = "0.2.0"

