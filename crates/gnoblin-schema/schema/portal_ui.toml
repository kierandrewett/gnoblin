name = "request_id"
type = "uint"
since = "0.2.0"

[[object]]
name = "portal_outcome"
since = "0.2.0"

# The request was handled. The result fields are the interface's, and any left
# unused stay empty or zero: `uris` (FileChooser), `choice` (AppChooser desktop id,
# Print printer, ScreenCast or RemoteDesktop source), `remember` (AppChooser only),
# `copies` and `pages` (Print), `flags` (granted capability bits), `cursor_mode`.
[[object.method]]
name = "handled"
since = "0.2.0"

[[object.method.param]]
name = "request_id"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "uris"
type = "list<string>"
since = "0.2.0"

[[object.method.param]]
name = "choice"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "remember"
type = "bool"
since = "0.2.0"

[[object.method.param]]
name = "copies"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "pages"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "flags"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "cursor_mode"
type = "uint"
since = "0.2.0"

# The user cancelled (`user`) or the UI could not show the dialog (`ui-failed`), or the
