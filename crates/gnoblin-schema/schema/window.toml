# The `window` object: the first slice of the window vocabulary. Properties feed
# property diffs; `focus` is a method; `closed` ends the object.
namespace = "gnoblin"
version = "0.2.0"

[[object]]
name = "window"
since = "0.2.0"

# The compositor's identity for the window, stable for its lifetime.
[[object.property]]
name = "id"
type = "uint"
since = "0.2.0"

# The title the client set. Not trustworthy for attribution: any client can pick
# one (design/rust-compositor.md, "Attribution is not authority").
[[object.property]]
name = "title"
type = "string"
since = "0.2.0"

# The Wayland app ID the client set.
[[object.property]]
name = "app_id"
type = "string"
since = "0.2.0"

[[object.property]]
name = "focused"
type = "bool"
since = "0.2.0"

# The frame rectangle in global logical coordinates: the left and top edges, then
# the extents. Four numbers rather than one rectangle because the schema declares
# no rectangle type yet, and a move changes x and y while a resize changes width
# and height, so each diff says which kind of change it was.
[[object.property]]
name = "x"
type = "int"
since = "0.2.0"

[[object.property]]
name = "y"
type = "int"
since = "0.2.0"

[[object.property]]
name = "width"
type = "uint"
since = "0.2.0"

[[object.property]]
name = "height"
type = "uint"
since = "0.2.0"

# The icon name the client set with `xdg-toplevel-icon-v1`; empty when none is set.
[[object.property]]
name = "icon"
type = "string"
since = "0.2.0"

# The tag the client set with `xdg-toplevel-tag-v1`; empty when none is set.
[[object.property]]
name = "tag"
type = "string"
since = "0.2.0"

# Whether the window is a modal dialog. A modal blocks its parent: focus on the parent is redirected to it.
[[object.property]]
name = "modal"
type = "bool"
since = "0.2.0"

# Ask the compositor to focus the window. Focus policy decides whether it does;
# the result arrives as a change to the `focused` property.
[[object.method]]
name = "focus"
since = "0.2.0"

# Focus a window a started program owns, once the session is quiet. The operation completes
# `done` when the window holds focus, and fails `denied`, `busy` or `not-found` otherwise.
[[object.method]]
name = "present"
since = "0.2.0"

# The window is gone. A client drops its view of the object on this signal.
[[object.signal]]
name = "closed"
since = "0.2.0"

# A managed window came into existence in the compositor. The handler sees the
# window's state at that moment.
[[object.signal]]
name = "created"
since = "0.2.0"

[[object.signal.field]]
name = "window"
type = "object:window"
since = "0.2.0"

# A property of the window other than `focused` changed. `changed` names the property,
# `window_id` is the compositor id, and the mirror already holds the new value when the
# handler runs. A focus flip raises `focused` or `unfocused` instead (derived_events.toml).
[[object.signal]]
name = "changed"
since = "0.2.0"

[[object.signal.field]]
name = "window_id"
type = "uint"
since = "0.2.0"

[[object.signal.field]]
name = "changed"
type = "list<string>"
since = "0.2.0"

[[object.signal.field]]
name = "window"
type = "object:window"
since = "0.2.0"

# Whether the window's client has missed its liveness ping for longer than the
# `window-management.check-alive-timeout` setting. Read-only: the compositor sets it.
[[object.property]]
name = "unresponsive"
type = "bool"
since = "0.2.0"

# Kill the process that owns the window with SIGKILL. The compositor refuses when the
# owning process is unknown, is the compositor itself or is init.
[[object.method]]
name = "kill"
since = "0.2.0"

# Ask the window's client to close. The client may refuse or ignore the request; the
# window goes away only when the client destroys it. Refused for an unknown window.
[[object.method]]
name = "close"
since = "0.2.0"

# Minimise (true) or restore (false) the window. Setting the state it already has is
# a no-op that still completes.
[[object.method]]
name = "set_minimized"
since = "0.2.0"

[[object.method.param]]
name = "value"
type = "bool"
since = "0.2.0"

# Maximise (true) or restore (false) the window.
[[object.method]]
name = "set_maximized"
since = "0.2.0"

[[object.method.param]]
name = "value"
type = "bool"
since = "0.2.0"

# Enter (true) or leave (false) fullscreen. Setting the state it already has is a no-op.
[[object.method]]
name = "set_fullscreen"
since = "0.2.0"

[[object.method.param]]
name = "value"
type = "bool"
since = "0.2.0"

# Move the window's top-left corner to `x`, `y` in global logical coordinates, keeping
# its size. The rectangle is constrained to the work area as a drag is. A fullscreen
# window is refused `not-floating`: its rectangle is its monitor.
[[object.method]]
name = "move"
since = "0.2.0"

[[object.method.param]]
name = "x"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "y"
type = "int"
since = "0.2.0"

# Resize the window to `width` by `height` logical pixels, keeping its position. An
# empty extent is raised to one pixel. A fullscreen window is refused `not-floating`.
[[object.method]]
name = "resize"
since = "0.2.0"

[[object.method.param]]
name = "width"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "height"
type = "uint"
since = "0.2.0"

# Set how opaque the window is drawn, from 0 (invisible) to 1 (as drawn). The value is the
# window's own visual, so the window rule's opacity and placement animations still apply. A
# value outside 0..1 is refused `out-of-range`. Completes `done` when applied.
[[object.method]]
name = "set_opacity"
since = "0.2.0"

[[object.method.param]]
name = "opacity"
type = "double"
since = "0.2.0"

# Scale the window about its centre, from 0.01 to 10 (1 is as drawn). A value outside that
# range is refused `out-of-range`. Completes `done` when applied.
[[object.method]]
name = "set_scale"
since = "0.2.0"

[[object.method.param]]
name = "scale"
type = "double"
since = "0.2.0"

# Shift the window's drawing by `x` and `y` pixels from where placement puts it, each within
# +-100000. A value outside that range is refused `out-of-range`. Completes `done` when applied.
[[object.method]]
name = "set_offset"
since = "0.2.0"

[[object.method.param]]
name = "x"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "y"
type = "double"
since = "0.2.0"

# Return the window's opacity, scale and offset to as drawn. Completes `done` when applied.
[[object.method]]
name = "reset_visuals"
since = "0.2.0"

# Move the window, and its transient children, to `workspace`. A transient window is
# refused `transient-follows-parent`: it shares its parent's workspace, so the parent
# moves it. Moving to the workspace it is on completes `done` and changes nothing.
[[object.method]]
name = "set_workspace"
since = "0.2.0"

[[object.method.param]]
name = "workspace"
type = "object:workspace"
since = "0.2.0"

# Move the window, and its transient children, to `output`, reshaping each into that
# output's work area. A fullscreen window is refused `not-floating`.
[[object.method]]
name = "set_output"
since = "0.2.0"

[[object.method.param]]
name = "output"
type = "object:output"
since = "0.2.0"

# The window's effects in paint order, first to last. Read-only: the compositor
# sets it as effects are added and removed. Each element is an `effect` object.
[[object.property]]
name = "effects"
type = "list<object:effect>"
since = "0.2.0"

# The process that owns the window's Wayland client, read from the client's
# socket credentials. 0 when the compositor cannot name it (an X11 window, or a
# client whose credentials are gone). Never derived from the app ID or title.
# Appended after `effects`: a property's field number is its position, so
# inserting it earlier would renumber every property after it.
[[object.property]]
name = "pid"
type = "uint"
since = "0.2.0"

# Add an effect to the top of the window's effects, after those already present.
# `kind` selects the effect: `blur`, `shadow` or `shader`. The other parameters
# are the `effect` object's properties for that kind; those a kind does not use
# are ignored. Unset parameters take their documented defaults.
#
# The reply is an operation. The new `effect` is announced as an addition to
# `effects`; the Lua side gets the handle by reading `window.effects` after the
# operation completes, the last element being the new effect. A rejected request
# fails the operation with `unknown-effect-kind` or `too-many-passes`.
[[object.method]]
name = "add_effect"
since = "0.2.0"

[[object.method.param]]
name = "kind"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "downscale"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "passes"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "algorithm"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "noise"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "brightness"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "contrast"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "saturation"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "tint"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "offset_x"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "offset_y"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "blur_radius"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "spread"
type = "double"
since = "0.2.0"

[[object.method.param]]
name = "colour"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "source"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "entry"
type = "string"
since = "0.2.0"

# The user or a client asked for this window's menu. `source` is `client`, `keyboard`
# or `extension`. `seat` is the seat that made the request, which is the seat a popup
# grab goes to. `x` and `y` are an anchor in output logical coordinates; a point has
# zero size. The compositor validates any client serial and never forwards it. Any
# extension may subscribe and show a menu.
[[object.signal]]
name = "menu_requested"
since = "0.2.0"

[[object.signal.field]]
name = "x"
type = "int"
since = "0.2.0"

[[object.signal.field]]
name = "y"
type = "int"
since = "0.2.0"

[[object.signal.field]]
name = "width"
type = "uint"
since = "0.2.0"

[[object.signal.field]]
name = "height"
type = "uint"
since = "0.2.0"

[[object.signal.field]]
name = "source"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "seat"
type = "string"
since = "0.2.0"

# Ask for this window's menu at the given anchor. The compositor emits
# `menu_requested` with `source = "extension"`, so a titlebar button or a script can
# ask without knowing which extension shows the menu.
[[object.method]]
name = "request_menu"
since = "0.2.0"

[[object.method.param]]
name = "x"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "y"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "width"
type = "uint"
since = "0.2.0"

[[object.method.param]]
name = "height"
type = "uint"
since = "0.2.0"

# The window's effects already use all `MAX_PASSES` (32) passes between them, so
# the requested effect was not added.
[[error]]
name = "too-many-passes"
since = "0.2.0"

# `kind` is not `blur`, `shadow` or `shader`, so no effect was added.
[[error]]
name = "unknown-effect-kind"
since = "0.2.0"

# The window is fullscreen, so a move, resize or output change has no free rectangle to act on.
[[error]]
name = "not-floating"
since = "0.2.0"

# The window is a transient, so it moves to another workspace only with its parent.
[[error]]
name = "transient-follows-parent"
since = "0.2.0"
