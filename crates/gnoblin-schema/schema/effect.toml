namespace = "gnoblin"
version = "0.2.0"

# The `effect` object: one window effect, of one of three kinds. The schema has no
# unions, so one object carries every kind's parameters as flat properties. A
# parameter the kind does not use is ignored and documented as such; the compositor
# validates `kind` and reports an unknown kind as an error when the effect is added.
#
# A window lists its effects in `window.effects`, in paint order, first to last.
# Each effect has a read-only `active` flag: an effect the active renderer cannot
# draw stays on the window with `active` false and a `reason`, and the window
# renders without it.
[[object]]
name = "effect"
since = "0.2.0"

# The kind of effect: `blur`, `shadow` or `shader`. Fixed when the effect is added.
# Read-only: the compositor sets it from the `add` request.
[[object.property]]
name = "kind"
type = "string"
since = "0.2.0"

# Whether the effect is applied. A disabled effect stays in the list and draws
# nothing. Settable: any kind.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"

# Whether the renderer draws this effect. False when the active renderer cannot draw
# it, or when its parameters are invalid; `reason` then says why. Read-only.
[[object.property]]
name = "active"
type = "bool"
since = "0.2.0"

# Why the effect is inactive, as a short sentence. Empty when `active` is true.
# Read-only.
[[object.property]]
name = "reason"
type = "string"
since = "0.2.0"

# Blur only. The backdrop is sampled at `1 / downscale` of full resolution before
# blurring: 1 is full resolution, 2 is half. Larger values are cheaper and blurrier.
# Default 2. Ignored by shadow and shader.
[[object.property]]
name = "downscale"
type = "uint"
since = "0.2.0"

# Blur only. The number of blur passes; the total across all of a window's effects
# is capped at `MAX_PASSES` (32). Default 3. Ignored by shadow and shader.
[[object.property]]
name = "passes"
type = "uint"
since = "0.2.0"

# Blur only. The blur kernel: `gaussian`, `kawase` or `box`. `kawase` is the default:
# the cheapest at a given radius. `gaussian` is the most accurate. Default `kawase`.
# Ignored by shadow and shader.
[[object.property]]
name = "algorithm"
type = "string"
since = "0.2.0"

# Blur only. Grain added after blurring, from 0.0 (none) to 1.0. Default 0.0. Ignored
# by shadow and shader.
[[object.property]]
name = "noise"
type = "double"
since = "0.2.0"

# Blur only. Brightness multiplier on the blurred backdrop; 1.0 leaves it unchanged.
# Default 1.0. Ignored by shadow and shader.
[[object.property]]
name = "brightness"
type = "double"
since = "0.2.0"

# Blur only. Contrast multiplier on the blurred backdrop; 1.0 leaves it unchanged.
# Default 1.0. Ignored by shadow and shader.
[[object.property]]
name = "contrast"
type = "double"
since = "0.2.0"

# Blur only. Saturation multiplier on the blurred backdrop; 1.0 leaves it unchanged.
# Default 1.0. Ignored by shadow and shader.
[[object.property]]
name = "saturation"
type = "double"
since = "0.2.0"

# Blur only. The tint colour as `#rrggbb` or `#rrggbbaa`; the empty string is no
# tint. Default empty. Ignored by shadow and shader.
[[object.property]]
name = "tint"
type = "string"
since = "0.2.0"

# Shadow only. Horizontal offset of the shadow in logical pixels; positive is right.
# Default 0.0. Ignored by blur and shader.
[[object.property]]
name = "offset_x"
type = "double"
since = "0.2.0"

# Shadow only. Vertical offset of the shadow in logical pixels; positive is down.
# Default 0.0. Ignored by blur and shader.
[[object.property]]
name = "offset_y"
type = "double"
since = "0.2.0"

# Shadow only. Blur radius of the shadow edge in logical pixels; 0.0 is a hard edge.
# Default 12.0. Ignored by blur and shader.
[[object.property]]
name = "blur_radius"
type = "double"
since = "0.2.0"

# Shadow only. How far the shadow grows beyond the window before blurring, in logical
# pixels; negative shrinks it. Default 0.0. Ignored by blur and shader.
[[object.property]]
name = "spread"
type = "double"
since = "0.2.0"

# Shadow only. The shadow colour as `#rrggbb` or `#rrggbbaa`. Default `#00000080`.
# Ignored by blur and shader.
[[object.property]]
name = "colour"
type = "string"
since = "0.2.0"

# Shader only. The name of the shader module to run, as the compositor knows it. An
# unknown name makes the effect inactive with a reason. Default empty, which is
# inactive. Ignored by blur and shadow.
[[object.property]]
name = "source"
type = "string"
since = "0.2.0"

# Shader only. The entry point in `source` to run. Default `main`. Ignored by blur and
# shadow. Shader uniforms are not part of this object: the schema has no key/value type.
[[object.property]]
name = "entry"
type = "string"
since = "0.2.0"

# Remove this effect from its window. Removing an effect already removed is a no-op.
[[object.method]]
name = "remove"
since = "0.2.0"

# The effect has been removed or its window closed; the object ends.
[[object.signal]]
name = "closed"
since = "0.2.0"
