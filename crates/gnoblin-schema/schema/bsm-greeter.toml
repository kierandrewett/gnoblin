# The greeter extension sketch: what bsm's login flow needs on the IPC.
#
# An extension ships its own schema in this format under its own namespace, and
# carries the version of the project that ships it (design/rust-compositor.md,
# "IPC extensions"). The compositor reads this file's envelope fields and forwards
# the payload without decoding it, so the extension's version is its own.
#
# This is a sketch of the first slice only: `auth_response` carries a secret
# field, which is what makes the `sensitive` envelope flag observable, and
# `provider-gone` is what a client sees while bsm's manager is not connected.
namespace = "bsm.greeter"
version = "0.2.0"

[[object]]
name = "greeter"
since = "0.2.0"

# Start authenticating a user. PAM, logind and session launch stay in bsm's
# manager: this asks, it does not grant.
[[object.method]]
name = "begin_auth"
since = "0.2.0"

[[object.method.param]]
name = "user"
type = "string"
since = "0.2.0"

# The answer to the current prompt.
[[object.method]]
name = "auth_response"
since = "0.2.0"

# A password or passphrase. The field is secret, so every frame that carries it is
# flagged sensitive and logs, the parity recorder and `gnoblinctl ipc dump` drop
# the payload without needing this schema.
[[object.method.param]]
name = "response"
type = "string"
since = "0.2.0"
secret = true

# Ask for power off, reboot or suspend. bsm decides whether to honour it.
[[object.method]]
name = "power"
since = "0.2.0"

[[object.method.param]]
name = "action"
type = "string"
since = "0.2.0"

# A prompt the greeter should show, for example "Password:".
[[object.signal]]
name = "prompt"
since = "0.2.0"

[[object.signal.field]]
name = "message"
type = "string"
since = "0.2.0"

# The extension has no provider: bsm's manager is not connected, so calls fail
# with this code until it reconnects.
[[error]]
name = "provider-gone"
since = "0.2.0"
