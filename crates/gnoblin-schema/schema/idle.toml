# The `idle` object: how long the session has been idle.
#
# `org.gnome.Mutter.IdleMonitor` is the first reader (design/rust-compositor.md,
# the redirect map's `IdleMonitor` row), and idle policy, the lock and the
# screensaver all read the same counter, so it is published once here rather than
# kept per consumer.
#
# It is its own object rather than a `session` property because a property is
# required at creation: adding one to `session` would make every creator of that
# object — the compositor's `SessionSync`, the services role's slot publisher and
# four test suites — fail until it published a value it does not own. A new object
# is additive, and a reader that finds no `idle` object fails closed instead of
# reporting zero idle time, which is the difference between "the user is active"
# and "nothing told me".
namespace = "gnoblin"
version = "0.2.0"

[[object]]
name = "idle"
since = "0.2.0"

# Milliseconds since the last input event. Monotonic while the user is away and
# zero immediately after an event, which is the value `IdleMonitor.GetIdletime`
# returns. It is a property, so a watcher learns a threshold was crossed from the
# diff rather than by polling.
[[object.property]]
name = "idle_ms"
type = "uint"
since = "0.2.0"

# How many holds keep the session awake: the Wayland `zwp_idle_inhibit_v1` surfaces
# plus the holders `inhibit` has recorded. While it is non-zero no idle notification
# fires, and an idle one is resumed. Read-only: the compositor sets it.
[[object.property]]
name = "inhibitors"
type = "uint"
since = "0.2.0"

# Hold the session awake under `holder`, a name the caller chooses and that is unique
# among its holders. Holding again under the same name changes nothing. The holders
# are capped; past the cap the operation fails with `too-many-inhibitors`.
[[object.method]]
name = "inhibit"
since = "0.2.0"

[[object.method.param]]
name = "holder"
type = "string"
since = "0.2.0"

# Release the hold `holder` names. A name that holds nothing is a no-op, and the
# operation is `done` either way.
[[object.method]]
name = "uninhibit"
since = "0.2.0"

[[object.method.param]]
name = "holder"
type = "string"
since = "0.2.0"

# The idle object already holds the most inhibitors it can. The new hold was not
# recorded, and the session may go idle as if the caller had not asked.
[[error]]
name = "too-many-inhibitors"
since = "0.2.0"

# The compositor is not serving its idle state, so the hold could not be recorded.
[[error]]
name = "idle-unavailable"
since = "0.2.0"
