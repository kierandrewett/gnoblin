# The `workspace` object: one workspace the window manager arranges. `id` is its identity,
# stable for its lifetime. Settable members are methods; `activate_set` is the one namespace
# function on it.
namespace = "gnoblin"
version = "0.2.0"

[[object]]
name = "workspace"
since = "0.2.0"

# The workspace's identity, stable for its lifetime.
[[object.property]]
name = "id"
type = "uint"
since = "0.2.0"

# The namespace function `gnoblin.workspaces.activate_set(name)`. It takes the name of a
# workspace set from the configuration and returns an operation that finishes `done` once
# the window manager shows that set's workspaces, including when the set is already live.
# It is refused `unknown-set` when the configuration defines no set of that name. It is a
# method on the object all the same, so the wire needs no second route for it.
[[object.method]]
name = "activate_set"
since = "0.2.0"
function = true

[[object.method.param]]
name = "name"
type = "string"
since = "0.2.0"

# A workspace set was made live: `set` is its name. Raised on every workspace the session
# holds, since each one is shown or hidden by the change.
[[object.signal]]
name = "set_activated"
since = "0.2.0"

[[object.signal.field]]
name = "set"
type = "string"
since = "0.2.0"


# A workspace was created. `workspace` is the new object; its `id` is already set when the
# handler runs.
[[object.signal]]
name = "created"
since = "0.2.0"

[[object.signal.field]]
name = "workspace"
type = "object:workspace"
since = "0.2.0"

# A workspace was removed. `workspace_id` is its identity and `last` is the object as
# it was when it went; the handler can still read it, and the object is gone after the
# handlers run.
[[object.signal]]
name = "removed"
since = "0.2.0"

[[object.signal.field]]
name = "workspace_id"
type = "uint"
since = "0.2.0"

[[object.signal.field]]
name = "last"
type = "object:workspace"
since = "0.2.0"

[[error]]
name = "refused"
since = "0.2.0"

[[error]]
name = "unknown-set"
since = "0.2.0"
