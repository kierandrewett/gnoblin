# The `workspace` object: one workspace the window manager arranges. Its `layout`
# is the layout the workspace runs, and the methods change it or ask the running
# layout for a command. Settable members are methods: the wire has no property
# write, so `set_layout` is the one write path and `layout` reads its result.
namespace = "gnoblin"
version = "0.2.0"

[[object]]
name = "workspace"
since = "0.2.0"

# The workspace's identity, stable for its lifetime.
[[object.property]]
name = "id"
type = "uint"
since = "0.2.0"

# The layout the workspace runs now: its own override when one was set, otherwise
# its output's default (`output.layout`), otherwise `floating`.
[[object.property]]
name = "layout"
type = "string"
since = "0.2.0"

# Set the workspace's own layout to a layout module, named by its reference: the root it
# resolves under (`shipped` or `user`), its module name, its source hash and its options.
# The hash pins the source, so an edit made after the configuration was checked is refused.
# The options are the canonical encoding of the reference's options (a version byte, then
# one tagged value; see `gnoblin-lua`'s `Data::encode`), and an empty value means none. The
# engine is replaced and its state is kept per layout reference. An unknown module fails
# with `unknown-layout`; the completion is the operation's one outcome.
[[object.method]]
name = "set_layout"
since = "0.2.0"

[[object.method.param]]
name = "root"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "module"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "hash"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "options"
type = "bytes"
since = "0.2.0"

# Send a command to the layout the workspace runs. The layout answers with the
# placements the command produces. `refused` means the layout does not know the
# command; `unknown-layout` means the workspace has no layout to ask.
[[object.method]]
name = "layout_command"
since = "0.2.0"

[[object.method.param]]
name = "name"
type = "string"
since = "0.2.0"

# The command's parameters as a JSON object, `{}` when it takes none.
[[object.method.param]]
name = "params"
type = "string"
since = "0.2.0"

# The namespace function `gnoblin.workspaces.activate_set(name)`. It takes the name of a
# workspace set from the configuration and returns an operation that finishes `done` once
# the window manager shows that set's workspaces, including when the set is already live.
# It is refused `unknown-set` when the configuration defines no set of that name. It is a
# method on the object all the same, so the wire needs no second route for it.
[[object.method]]
name = "activate_set"
since = "0.2.0"
function = true

[[object.method.param]]
name = "name"
type = "string"
since = "0.2.0"

# A workspace set was made live: `set` is its name. Raised on every workspace the session
# holds, since each one is shown or hidden by the change.
[[object.signal]]
name = "set_activated"
since = "0.2.0"

[[object.signal.field]]
name = "set"
type = "string"
since = "0.2.0"


# The workspace's layout changed: a new name was set, or its output's default moved.
[[object.signal]]
name = "layout_changed"
since = "0.2.0"

[[object.signal.field]]
name = "layout"
type = "string"
since = "0.2.0"

# A layout run failed, and the workspace runs floating until one succeeds. `reason`
# is one of `deadline`, `memory`, `error`, `refused-reply`, `vm-wedged`, `vm-down`,
# `missing-module`, `invalid-params`.
[[object.signal]]
name = "layout_failed"
since = "0.2.0"

[[object.signal.field]]
name = "layout"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "reason"
type = "string"
since = "0.2.0"

# A workspace was created. `workspace` is the new object; its `id` and `layout` are
# already set when the handler runs.
[[object.signal]]
name = "created"
since = "0.2.0"

[[object.signal.field]]
name = "workspace"
type = "object:workspace"
since = "0.2.0"

# A workspace was removed. `workspace_id` is its identity and `last` is the object as
# it was when it went; the handler can still read it, and the object is gone after the
# handlers run.
[[object.signal]]
name = "removed"
since = "0.2.0"

[[object.signal.field]]
name = "workspace_id"
type = "uint"
since = "0.2.0"

[[object.signal.field]]
name = "last"
type = "object:workspace"
since = "0.2.0"

[[error]]
name = "refused"
since = "0.2.0"

[[error]]
name = "unknown-layout"
since = "0.2.0"

[[error]]
name = "unknown-set"
since = "0.2.0"
