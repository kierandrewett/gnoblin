namespace = "tree"
version = "0.2.0"

# The `window` class: a toplevel (xdg-shell, X11, foreign toplevel), derived from `node`
# (design/node-core.md, section 2.4). It has every `node` property, then these.
[[object]]
name = "window"
since = "0.2.0"
base = "node"

# Written by the compositor from the xdg toplevel; the shell reads it and cannot set it.
[[object.property]]
name = "title"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Written by the compositor from the xdg toplevel; the shell reads it and cannot set it.
[[object.property]]
name = "app_id"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Written by the shell's focus policy.
[[object.property]]
name = "focused"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# A client or taskbar request the shell decides (see the `request` event). The shell writes the answer here, and the
# compositor turns `fullscreen`, `maximised` and `minimised` (with `width` and `height`) into the client's configure.
[[object.property]]
name = "fullscreen"
type = "bool"
since = "0.2.0"
default = false

[[object.property]]
name = "maximised"
type = "bool"
since = "0.2.0"
default = false

[[object.property]]
name = "minimised"
type = "bool"
since = "0.2.0"
default = false

# The workspace the window belongs to. Nil when it has none.
[[object.property]]
name = "workspace"
type = "object:workspace"
since = "0.2.0"

# Written by the shell: the window sits in a tiled layout. The client is sent all four tiled edge states
# (`xdg_toplevel` `tiled_left`, `tiled_right`, `tiled_top` and `tiled_bottom`) so it drops the border and rounding it
# draws for itself, and its configure carries the work area as its bounds.
[[object.property]]
name = "tiled"
type = "bool"
since = "0.2.0"
default = false

# Give the window keyboard focus. The shell's focus policy decides.
[[object.method]]
name = "focus"
since = "0.2.0"

# Ask the window's client to close. The client decides whether it exits; the window goes away when it destroys it.
[[object.method]]
name = "close"
since = "0.2.0"
