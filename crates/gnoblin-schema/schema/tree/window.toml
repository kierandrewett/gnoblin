namespace = "tree"
version = "0.2.0"

# The `window` class: a toplevel (xdg-shell, X11, foreign toplevel), derived from `node`
# (design/node-core.md, section 2.4). It has every `node` property, then these.
#
# A window's rectangle (`x`, `y`, `width`, `height`) is its window geometry, the part of its surface the user sees as
# the window: an xdg toplevel's `xdg_surface.set_window_geometry` rectangle, or the whole surface while the client set
# none, and the whole window for an X11 one. A client that draws a shadow, or a title bar of its own, outside its
# window geometry has that drawn but it is not the window: the node does not include it, and a node the shell sizes is
# sent to the client as the size of its window geometry (the `xdg_toplevel.configure` size), so a size written to
# `width` and `height` comes back unchanged. The surface's pixels outside the rectangle are drawn and are hit only
# where the client's input region says.
[[object]]
name = "window"
since = "0.2.0"
base = "node"

# Written by the compositor from the xdg toplevel; the shell reads it and cannot set it.
[[object.property]]
name = "title"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Written by the compositor from the xdg toplevel; the shell reads it and cannot set it.
[[object.property]]
name = "app_id"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Written by the shell's focus policy.
[[object.property]]
name = "focused"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# A client or taskbar request the shell decides (see the `request` event). The shell writes the answer here, and the
# compositor turns `fullscreen`, `maximised` and `minimised` (with `width` and `height`) into the client's configure.
[[object.property]]
name = "fullscreen"
type = "bool"
since = "0.2.0"
default = false

[[object.property]]
name = "maximised"
type = "bool"
since = "0.2.0"
default = false

[[object.property]]
name = "minimised"
type = "bool"
since = "0.2.0"
default = false

# The workspace the window belongs to. Nil when it has none.
[[object.property]]
name = "workspace"
type = "object:workspace"
since = "0.2.0"

# Written by the shell: the window sits in a tiled layout. The client is sent all four tiled edge states
# (`xdg_toplevel` `tiled_left`, `tiled_right`, `tiled_top` and `tiled_bottom`) so it drops the border and rounding it
# draws for itself, and its configure carries the work area as its bounds.
[[object.property]]
name = "tiled"
type = "bool"
since = "0.2.0"
default = false

# Whether the window's client has left a liveness ping unanswered for longer than `window-management.check-alive-timeout`
# (5000 ms by default; 0 turns the pings off, so no window is ever marked). The compositor writes it and clears it when
# the client answers. The stock shell's not-responding alert reads it. An X11 window is not pinged and is never marked.
[[object.property]]
name = "unresponsive"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# The window this one is a dialog of: set by the client with `xdg_toplevel.set_parent` or `xdg-foreign`, written by the
# compositor and null when the window has no parent or its parent is gone. The shell centres a dialog in its parent,
# moves the two together and keeps them on one output.
[[object.property]]
name = "parent_window"
type = "object:window"
since = "0.2.0"
readonly = true

# Whether the window opened on an activation token that the session's launcher minted. The compositor sets it when the
# window redeems a `xdg_activation_v1` token that a privileged or trusted connection (the launcher or the shell as a
# Wayland client) asked for, so the shell's `focus-new-windows` policy can tell a launched window from one the client
# opened itself. A program started with `gnoblin.spawn` is not marked: the shell's spawner does not mint a token.
[[object.property]]
name = "from_launcher"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# Give the window keyboard focus. The shell's focus policy decides.
[[object.method]]
name = "focus"
since = "0.2.0"

# Ask the window's client to close. The client decides whether it exits; the window goes away when it destroys it.
[[object.method]]
name = "close"
since = "0.2.0"

# Kill the process that owns the window with SIGKILL: the stock alert's Force quit. The compositor refuses (and does
# nothing) when the owning process is unknown, has disconnected or changed since the window mapped, or is the
# compositor itself or init, exactly as `gnoblin.window.kill` does. Only the connection that holds the tree makes
# calls on its nodes, and only the session owner's connection holds it.
[[object.method]]
name = "kill"
since = "0.2.0"

# Who draws the window's frame, as the compositor negotiated it: `client` (the client draws its own title bar and
# borders, as a GTK or Qt window does with `xdg-decoration` client-side, or with no decoration protocol at all), `server`
# (the shell draws the frame: the compositor told the client server-side, or the window is an X11 one with no frame of
# its own) or `none` (an X11 window while no shell declares decorations). The compositor writes it and the shell reads
# it, and the stock shell gives a `Titlebar` only to a `server` window. It is `client` until the compositor says
# otherwise, and it follows the seat's `decorations_available`: a window that asked for server-side is told client-side
# while no shell draws decorations.
[[object.property]]
name = "decoration"
type = "string"
since = "0.2.0"
default = "client"
readonly = true

# What the window's client asked for with `xdg-decoration`: `client`, `server`, or `unset` (it never bound the protocol,
# asked for no preference, or is an X11 window). Written by the compositor, read-only to the shell.
[[object.property]]
name = "decoration_wanted"
type = "string"
since = "0.2.0"
default = "unset"
readonly = true
