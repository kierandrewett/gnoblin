namespace = "tree"
version = "0.2.0"

# The `window` class: a toplevel (xdg-shell, X11, foreign toplevel), derived from `node`. It has every `node`
# property, then these.
#
# A window's rectangle (`x`, `y`, `width`, `height`) is its window geometry, the part of its surface the user sees as
# the window: an xdg toplevel's `xdg_surface.set_window_geometry` rectangle, or the whole surface while the client set
# none, and the whole window for an X11 one. A client that draws a shadow, or a title bar of its own, outside its
# window geometry has that drawn but it is not the window: the node does not include it, and a node the shell sizes is
# sent to the client as the size of its window geometry (the `xdg_toplevel.configure` size), so a size written to
# `width` and `height` comes back unchanged. The surface's pixels outside the rectangle are drawn and are hit only
# where the client's input region says.
[[object]]
name = "window"
since = "0.2.0"
base = "node"

# Written by the compositor from the xdg toplevel; the shell reads it and cannot set it.
[[object.property]]
name = "title"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Written by the compositor from the xdg toplevel; the shell reads it and cannot set it.
[[object.property]]
name = "app_id"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Written by the shell's focus policy.
[[object.property]]
name = "focused"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# A client or taskbar request the shell decides (see the `request` event). The shell writes the answer here, and the
# compositor turns `fullscreen`, `maximised` and `minimised` (with `width` and `height`) into the client's configure.
[[object.property]]
name = "fullscreen"
type = "bool"
since = "0.2.0"
default = false

[[object.property]]
name = "maximised"
type = "bool"
since = "0.2.0"
default = false

[[object.property]]
name = "minimised"
type = "bool"
since = "0.2.0"
default = false

# Written by the shell: the window sits in a tiled layout. The client is sent all four tiled edge states
# (`xdg_toplevel` `tiled_left`, `tiled_right`, `tiled_top` and `tiled_bottom`) so it drops the border and rounding it
# draws for itself, and its configure carries the work area as its bounds.
[[object.property]]
name = "tiled"
type = "bool"
since = "0.2.0"
default = false

# Whether the window's client has left a liveness ping unanswered for longer than `window-management.check-alive-timeout`
# (5000 ms by default; 0 turns the pings off, so no window is ever marked). The compositor writes it and clears it when
# the client answers. The stock shell's not-responding alert reads it. An X11 window is not pinged and is never marked.
[[object.property]]
name = "unresponsive"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# The window this one is a dialog of: set by the client with `xdg_toplevel.set_parent` or `xdg-foreign`, written by the
# compositor and null when the window has no parent or its parent is gone. The shell centres a dialog in its parent,
# moves the two together and keeps them on one output.
[[object.property]]
name = "parent_window"
type = "object:window"
since = "0.2.0"
readonly = true

# Whether the window opened on an activation token that the session's launcher minted. The compositor sets it when the
# window redeems a `xdg_activation_v1` token that a privileged or trusted connection (the launcher or the shell as a
# Wayland client) asked for, so the shell's `focus-new-windows` policy can tell a launched window from one the client
# opened itself. A program started with `gnoblin.spawn` is not marked: the shell's spawner does not mint a token.
[[object.property]]
name = "from_launcher"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# Give the window keyboard focus. The shell's focus policy decides.
[[object.method]]
name = "focus"
since = "0.2.0"

# Ask the window's client to close. The client decides whether it exits; the window goes away when it destroys it.
[[object.method]]
name = "close"
since = "0.2.0"

# Kill the process that owns the window with SIGKILL: the stock alert's Force quit. The compositor refuses (and does
# nothing) when the owning process is unknown, has disconnected or changed since the window mapped, or is the
# compositor itself or init, exactly as `gnoblin.window.kill` does. Only the connection that holds the tree makes
# calls on its nodes, and only the session owner's connection holds it.
[[object.method]]
name = "kill"
since = "0.2.0"

# Who draws the window's frame, as the compositor negotiated it: `client` (the client draws its own title bar and
# borders, as a GTK or Qt window does with `xdg-decoration` client-side, or with no decoration protocol at all), `server`
# (the shell draws the frame: the compositor told the client server-side, or the window is an X11 one with no frame of
# its own) or `none` (an X11 window while no shell declares decorations). The compositor writes it and the shell reads
# it, and the stock shell gives a `Titlebar` only to a `server` window. It is `client` until the compositor says
# otherwise, and it follows the seat's `decorations_available`: a window that asked for server-side is told client-side
# while no shell draws decorations.
[[object.property]]
name = "decoration"
type = "string"
since = "0.2.0"
default = "client"
readonly = true

# What the window's client asked for with `xdg-decoration`: `client`, `server`, or `unset` (it never bound the protocol,
# asked for no preference, or is an X11 window). Written by the compositor, read-only to the shell.
[[object.property]]
name = "decoration_wanted"
type = "string"
since = "0.2.0"
default = "unset"
readonly = true

# The DBus service name of the window's application menu, as its client set it with `org_kde_kwin_appmenu.set_address`:
# the name of a bus connection that exports a `com.canonical.dbusmenu` object on the session bus. Empty while the client
# set none, or released its appmenu object (it went away, or no longer has a menu). A shell that draws a global menu
# connects to `appmenu_service` at `appmenu_path` and shows what the object exports; the two are written together, so a
# change is one batch. Written by the compositor, read-only to the shell.
[[object.property]]
name = "appmenu_service"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# The DBus object path of the window's application menu, which goes with `appmenu_service`. Empty while the window has no
# menu. Written by the compositor, read-only to the shell.
[[object.property]]
name = "appmenu_path"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# How the compositor paces the window's client: `auto` (the default), `hold` or `throttle`. A window's client draws its
# next frame when the compositor answers the `wl_surface.frame` callback it asked for, so the callback is the pace.
# `auto` answers it after every frame the compositor draws that shows the window. `hold` answers it never: the client is
# left waiting and draws nothing new, which is what a shell wants for a window it does not show (another workspace, a
# minimised window). `throttle` answers it at most `frame_rate` times a second. A held or throttled window keeps its last
# picture and is drawn as before. Changing the policy back to `auto` answers the callbacks the client is waiting on at
# the next frame. Any other text is refused `bad-value`. It takes effect only while a shell holds the tree: with no
# shell every window is `auto`, and the compositor sets the policy of every window back to `auto` when the shell that
# wrote it lets go of the tree, so a window can never stay held with nobody to release it.
[[object.property]]
name = "frame_policy"
type = "string"
since = "0.2.0"
default = "auto"

# The most frame callbacks a second a `throttle` window's client is answered, in hertz. Read only while `frame_policy` is
# `throttle`. A value that is not above 0 and at most 1000 is refused `out-of-range`. The compositor sets it back to 30
# when it releases the window's policy.
[[object.property]]
name = "frame_rate"
type = "double"
since = "0.2.0"
default = 30.0

# Whether the compositor tells the shell when the window's pixels reach the screen: while it is true each frame that
# draws the window writes `presented`. It is false by default, because a window written every frame is a change in every
# batch. The compositor sets it back to false when it releases the window's policy.
[[object.property]]
name = "report_presented"
type = "bool"
since = "0.2.0"
default = false

# The time the last frame that showed the window reached the screen, in milliseconds on the compositor's monotonic clock
# (`CLOCK_MONOTONIC`, the clock `wp_presentation` names, so a shell compares it with its own `clock_gettime`). 0 until a
# frame was presented with `report_presented` true. It is the same instant the window's client was told in its
# `wp_presentation` feedback. The compositor writes it and the shell reads it.
[[object.property]]
name = "presented"
type = "uint"
since = "0.2.0"
default = 0
readonly = true
