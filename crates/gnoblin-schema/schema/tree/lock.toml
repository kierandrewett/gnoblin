namespace = "tree"
version = "0.2.0"

# The `lock` class: the session lock. While `engaged`, the compositor draws only `lock` and routes input only to it (design/node-core.md, section 2.4).
[[object]]
name = "lock"
since = "0.2.0"
base = "node"

# `not-locked`, `pending`, or `locked`.
[[object.property]]
name = "state"
type = "string"
since = "0.2.0"
default = "not-locked"
readonly = true

# Check the password `text` against the session user. The compositor answers with `token`:
# `result` `ok` on accept; `error` `denied`, `rate-limited` (`result` is the retry-after in ms),
# `not-locked`, `busy`, or `failed: <reason>`. The password never enters a batch.
[[object.method]]
name = "authenticate"
since = "0.2.0"
