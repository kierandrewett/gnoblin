namespace = "tree"
version = "0.2.0"

# The `screen` class: an output, derived from `view` (design/node-core.md, section 2.4). Created and destroyed by the compositor.
[[object]]
name = "screen"
since = "0.2.0"
base = "view"

[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
readonly = true

[[object.property]]
name = "make"
type = "string"
since = "0.2.0"
default = ""
readonly = true

[[object.property]]
name = "model"
type = "string"
since = "0.2.0"
default = ""
readonly = true

[[object.property]]
name = "screen_x"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "screen_y"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "screen_width"
type = "double"
since = "0.2.0"
readonly = true

[[object.property]]
name = "screen_height"
type = "double"
since = "0.2.0"
readonly = true

# The factor the output composes at: 2 is a HiDPI panel. The compositor publishes it with the mode. It is not `scale`,
# which the `node` base already holds as the three-axis scale of the node's own picture.
[[object.property]]
name = "output_scale"
type = "double"
since = "0.2.0"
default = 1.0
readonly = true

# Set with `apply`. The compositor draws only `normal`: a rotation or reflection is refused by `apply`.
[[object.property]]
name = "transform"
type = "string"
since = "0.2.0"
default = "normal"
readonly = true

[[object.property]]
name = "primary"
type = "bool"
since = "0.2.0"
default = false

# Whether the output is on. Set with `apply`; an output that is off shows black and has no place in the desktop.
[[object.property]]
name = "enabled"
type = "bool"
since = "0.2.0"
default = true
readonly = true

# `WxH@Hz`.
[[object.property]]
name = "mode"
type = "string"
since = "0.2.0"
readonly = true

# The connector the backend knows the output by (`DP-1`, `eDP-1`, `Virtual-1`). `name` is the node's own label.
[[object.property]]
name = "connector"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# The monitor's EDID identity (`MAN:product:serial`), empty for an output that reports none. A saved profile is keyed by
# the connector and this, so the same panel gets its arrangement back on the same port.
[[object.property]]
name = "identity"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# The connector this output shows an exact copy of, or empty. A mirrored output has no place of its own in the desktop:
# its `x`, `y`, `width` and `height` are its source's, and the pointer has one monitor for the
# pair. Set with `apply`.
[[object.property]]
name = "mirror_of"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# The factor the output composes above its mode: the compositor draws the output on a surface of `mode * supersample`
# pixels at `output_scale * supersample` and shows it at `mode`, so the logical size (`screen_width`, `screen_height`)
# does not change. 1 is no supersampling. Set with `apply`. An owner-requested addition beyond the display
# specification.
[[object.property]]
name = "supersample"
type = "double"
since = "0.2.0"
default = 1.0
readonly = true

# The bytes the output's renderer and capture hold for it, in bytes, read-only (an owner-requested addition beyond the
# display specification; see tests/gpu-memory-soak/DESIGN.md). They are the sizes of the objects the compositor asked
# the driver for (colour plus depth or stencil storage), so a driver that pads or tiles holds at least this much. A
# client's own buffers are not counted. `gpu_memory_target_bytes` is the output-sized target and, for a supersampled
# output, the copy it is averaged down into. `gpu_memory_scratch_bytes` is the effect scratch targets and the bytes
# kept under the cursor. `gpu_memory_staging_bytes` is the host-visible upload and readback buffers a renderer keeps
# between frames.
# `gpu_memory_views_bytes` is the pictures of the Views drawn on the GPU. `gpu_memory_capture_bytes` is the last
# presented frame capture keeps for the screencopy and screen-cast protocols. `gpu_memory_bytes` is their sum.
#
# The next four are the memory budget's numbers for the whole session (tests/gpu-memory-soak/DESIGN.md, section 6),
# the same on every output's node because the tree has no node for the session. `gpu_memory_clients_bytes` is the
# bytes of every client's live buffers (shared-memory buffers by their size, GPU buffers by an estimate of width times
# height times the pixel size). `gpu_memory_budget_bytes` is the budget the compositor holds the clients, the
# renderers and capture to, zero when it is off. `gpu_memory_refused_total` is the requests refused since the session
# began, and `gpu_memory_evicted_total` is the bytes given back from caches (the capture frame, View pictures, blur
# scratch) to make room for a client's buffer.
[[object.property]]
name = "gpu_memory_target_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_scratch_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_staging_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_views_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_capture_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_clients_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_budget_bytes"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_refused_total"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "gpu_memory_evicted_total"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

# Apply an output configuration through the transactional engine and keep it as the output's profile. The text is one
# `key=value` per line: `mode` (`3440x1440@144` or `preferred`), `scale` (`1.25` or `default`), `supersample` (`2`, a
# number from 1 to 16, or `default`), `transform` (`normal`), `position` (`X,Y` or `auto`), `enabled` (`true` or
# `false`) and `mirror_of` (a connector, or empty for none). A key left out keeps its value. The compositor answers
# under the call's token: an empty error is success; a
# refusal (a mode the backend will not set, a supersample whose virtual surface is not a whole number of pixels or is
# above the limit, a layout with an overlap or a gap, a mirror of a missing output) names the key, and leaves the last
# good arrangement in place, with the mode, scale and supersample the backend had restored.
[[object.method]]
name = "apply"
since = "0.2.0"

[[object.method.param]]
name = "text"
type = "string"
since = "0.2.0"

# Emitted when the screen's mode changes.
[[object.signal]]
name = "mode_changed"
since = "0.2.0"
