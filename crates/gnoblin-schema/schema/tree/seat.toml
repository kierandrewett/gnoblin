namespace = "tree"
version = "0.2.0"

# The `seat` class: an input seat (`wl_seat`, libei). Draws nothing (design/node-core.md, section 2.4).
[[object]]
name = "seat"
since = "0.2.0"
base = "node"

[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
readonly = true

# Keyboard focus.
[[object.property]]
name = "focus"
type = "object:node"
since = "0.2.0"

[[object.property]]
name = "pointer_x"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "pointer_y"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

# Device identity for multi-seat.
[[object.property]]
name = "device"
type = "string"
since = "0.2.0"
default = ""
readonly = true

# Move the pointer.
[[object.method]]
name = "warp"
since = "0.2.0"

# Claim a chord for this seat: the compositor withholds the chord from clients and emits `chord`
# to the owner. `id` is allocated by the shell, per connection, and never reused. `chord` is
# canonicalised by the compositor; an unparsable chord is `invalid-value`. `grab` keeps the
# chord's release on the same claim. Only the owner may claim (design/node-core.md, section 5).
[[object.method]]
name = "claim"
since = "0.2.0"

[[object.method.param]]
name = "id"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "chord"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "grab"
type = "bool"
since = "0.2.0"

# Remove a claim made on this connection. Unknown ids are `unknown-member`.
[[object.method]]
name = "unclaim"
since = "0.2.0"

[[object.method.param]]
name = "id"
type = "int"
since = "0.2.0"

# A claimed chord changed state: `state` is `press`, `release` or `repeat`.
[[object.signal]]
name = "chord"
since = "0.2.0"

[[object.signal.field]]
name = "id"
type = "int"
since = "0.2.0"

[[object.signal.field]]
name = "chord"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "state"
type = "string"
since = "0.2.0"
