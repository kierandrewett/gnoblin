namespace = "tree"
version = "0.2.0"

# The `seat` class: an input seat (`wl_seat`, libei). Draws nothing (design/node-core.md, section 2.4).
[[object]]
name = "seat"
since = "0.2.0"
base = "node"

[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
readonly = true

# Keyboard focus.
[[object.property]]
name = "focus"
type = "object:node"
since = "0.2.0"

# The screen under the pointer, published by the compositor (the first screen when the pointer is
# over none). Read-only: a shell write is refused.
[[object.property]]
name = "screen"
type = "object:node"
since = "0.2.0"
readonly = true

[[object.property]]
name = "pointer_x"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

[[object.property]]
name = "pointer_y"
type = "double"
since = "0.2.0"
default = 0.0
readonly = true

# The input devices this seat has, one `id:name:caps` item each, in the order they arrived: `id` is the
# backend's number for the device (never reused, so a removed device's number is not given to the next one),
# `name` is the name the device reports and `caps` its capabilities joined by commas (`keyboard`, `pointer`,
# `touch`, `gesture`, `tablet-tool`, `tablet-pad`, `switch`). The id is up to the first colon and the
# capabilities after the last, so a name may hold colons. A device that is plugged in or removed changes the
# list. Read-only: the compositor publishes it. The name is what a claim's `device` selector matches.
[[object.property]]
name = "device"
type = "list<string>"
since = "0.2.0"
readonly = true

# The window management options the compositor was configured with (`window_management`). Read-only:
# the shell reads them, the configuration sets them. Appended after `device` so existing field
# numbers stay put.
[[object.property]]
name = "edge_tiling"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# The drag constraint: `work_area` (the default) or `minimum_strip`.
[[object.property]]
name = "drag_constraint"
type = "string"
since = "0.2.0"
default = "work_area"
readonly = true

# Whether a focus follows the pointer: `click`, `hover` or `hover-strict`.
[[object.property]]
name = "focus_mode"
type = "string"
since = "0.2.0"
default = "click"
readonly = true

# Whether a new window takes focus: `allow` or `prevent`.
[[object.property]]
name = "focus_new_windows"
type = "string"
since = "0.2.0"
default = "prevent"
readonly = true

# Whether a click raises the window it lands in.
[[object.property]]
name = "raise_on_click"
type = "bool"
since = "0.2.0"
default = true
readonly = true

# Whether a hovered window is raised after `auto_raise_delay` milliseconds.
[[object.property]]
name = "auto_raise"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# The delay before auto-raise, in milliseconds.
[[object.property]]
name = "auto_raise_delay"
type = "int"
since = "0.2.0"
default = 500
readonly = true

# Whether focus moves to a window the pointer rests on.
[[object.property]]
name = "focus_change_on_pointer_rest"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# The titlebar gestures: `toggle-maximize`, `toggle-maximize-horizontally`,
# `toggle-maximize-vertically`, `minimize`, `lower`, `menu` or `none`.
[[object.property]]
name = "double_click"
type = "string"
since = "0.2.0"
default = "toggle-maximize"
readonly = true

[[object.property]]
name = "middle_click"
type = "string"
since = "0.2.0"
default = "lower"
readonly = true

[[object.property]]
name = "right_click"
type = "string"
since = "0.2.0"
default = "menu"
readonly = true

# The workspaces the configuration declares, one `id:name` item each, in declaration order. An empty list means
# none are declared and the shell chooses its own. Read-only: the configuration sets it.
[[object.property]]
name = "workspaces"
type = "list<string>"
since = "0.2.0"
readonly = true

# Whether the user asked for reduced motion (`appearance.reduced-motion`). Read-only: the configuration sets
# it. The stock shell shortens its durations to zero while it is true, and the compositor lands any timed
# `set` at once as a safety net, so no shell can animate against the preference.
[[object.property]]
name = "reduced_motion"
type = "bool"
since = "0.2.0"
default = false
readonly = true

# The effect kinds the active renderer draws, `blur` and `shadow` among them: GLES draws both, the software and
# Vulkan renderers draw none. Read-only: the renderer sets it once at startup. A shell reads it to adapt before it
# sets a node's `effects`; an effect of a kind not listed stays in the list and is named in the node's `skipped`
# as `<kind>: unsupported-by-renderer`.
[[object.property]]
name = "effect_kinds"
type = "list<string>"
since = "0.2.0"
readonly = true

# Move the pointer.
[[object.method]]
name = "warp"
since = "0.2.0"

# Claim a chord for this seat: the compositor withholds the chord from clients and emits `chord`
# to the owner. `id` is allocated by the shell, per connection, and never reused. `chord` is
# canonicalised by the compositor; an unparsable chord is `invalid-value`. `grab` keeps the
# chord's release on the same claim. Only the owner may claim (design/node-core.md, section 5).
# `device` is a device name from `Seat.device`, or empty for every device: the claim then takes the chord
# only from the devices that report that name (matched exactly), so the same chord can be claimed for a macro
# pad and left to clients on the desk keyboard. A chord is claimed once per `device`; a claim for a named
# device is matched against that device's own modifiers, not the seat's, and takes the chord before a claim
# for every device does. On the call the text is the chord, or, when `device` is not empty, `device`, a line
# feed and the chord.
[[object.method]]
name = "claim"
since = "0.2.0"

[[object.method.param]]
name = "id"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "chord"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "grab"
type = "bool"
since = "0.2.0"

[[object.method.param]]
name = "device"
type = "string"
since = "0.2.0"

# Remove a claim made on this connection. Unknown ids are `unknown-member`.
[[object.method]]
name = "unclaim"
since = "0.2.0"

[[object.method.param]]
name = "id"
type = "int"
since = "0.2.0"

# Claim a touchpad gesture for this seat: the compositor withholds every gesture of `kind` (`swipe` or
# `pinch`) with `fingers` contacts (2 to 5) from the configured bindings and emits `gesture` to the owner,
# from its begin to its end or cancel. `id` is allocated by the shell, per connection, never reused, and
# shares its number space with `claim`: `unclaim` removes either. One holder per kind and finger count:
# a second claim of the same gesture is refused, and a claim of an id already held replaces it. A gesture
# that began while the session was locked, or before the claim, is not delivered. Only the owner may claim.
# `device` is a device name from `Seat.device`, or empty for every device: the claim then takes the gesture only
# from the touchpads that report that name, and is one holder per kind, finger count and `device`. On the call the
# text is `kind`, or, when `device` is not empty, `device`, a line feed and `kind`.
[[object.method]]
name = "claim_gesture"
since = "0.2.0"

[[object.method.param]]
name = "id"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "kind"
type = "string"
since = "0.2.0"

[[object.method.param]]
name = "fingers"
type = "int"
since = "0.2.0"

[[object.method.param]]
name = "device"
type = "string"
since = "0.2.0"

# A claimed chord changed state: `state` is `press`, `release` or `repeat`.
[[object.signal]]
name = "chord"
since = "0.2.0"

[[object.signal.field]]
name = "id"
type = "int"
since = "0.2.0"

[[object.signal.field]]
name = "chord"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "state"
type = "string"
since = "0.2.0"

# A claimed gesture advanced: `phase` is `begin`, `update`, `end` or `cancel`. `dx` and `dy` are the
# centroid's movement since the begin, in touchpad units (x to the right, y downward); `scale` is the
# mean distance of the contacts from their centroid relative to the begin (1 is unchanged, above 1 a
# spread); `rotation` is the contacts' rotation since the begin in radians, clockwise positive. A swipe
# reports a scale of 1 and a rotation of 0. `cancel` follows a lift that libinput cancelled, a lock
# that came up mid-gesture, and ends the gesture without an `end`.
[[object.signal]]
name = "gesture"
since = "0.2.0"

[[object.signal.field]]
name = "id"
type = "int"
since = "0.2.0"

[[object.signal.field]]
name = "kind"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "fingers"
type = "int"
since = "0.2.0"

[[object.signal.field]]
name = "phase"
type = "string"
since = "0.2.0"

[[object.signal.field]]
name = "dx"
type = "double"
since = "0.2.0"

[[object.signal.field]]
name = "dy"
type = "double"
since = "0.2.0"

[[object.signal.field]]
name = "scale"
type = "double"
since = "0.2.0"

[[object.signal.field]]
name = "rotation"
type = "double"
since = "0.2.0"
