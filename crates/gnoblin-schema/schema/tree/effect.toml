namespace = "tree"
version = "0.2.0"

# The `effect` value of a node's `effects` list (design/node-core.md, section 4.4a). The
# schema has no unions, so one object carries every kind's parameters as flat properties.
# A parameter the kind does not use is ignored and documented as such.
#
# This is the node list's only effect path: the legacy `window.add_effect` call and the
# window's `effect` object are gone. What the compositor could not draw is reported on the
# node, in its read-only `skipped` list, not on each element. An effect is switched off by
# setting the list without it, so an element carries no `enabled` flag.
[[object]]
name = "effect"
since = "0.2.0"
record = true

# The kind of effect: `blur`, `shadow` or `border`. Any other kind, `shader` included, is
# refused `bad-value` and the whole list is refused with it: the compositor runs no user
# shaders. A node holds at most 8 `border` and at most 8 `shadow` elements; a list over
# either cap is refused `too-large`.
[[object.property]]
name = "kind"
type = "string"
since = "0.2.0"

# Blur only. The backdrop is sampled at `1 / downscale` of full resolution before
# blurring: 1 is full resolution, 2 is half. Default 2. Ignored by shadow.
[[object.property]]
name = "downscale"
type = "uint"
since = "0.2.0"

# Blur only. The number of blur passes. Default 3. Ignored by shadow.
[[object.property]]
name = "passes"
type = "uint"
since = "0.2.0"

# Blur only. The blur kernel: `gaussian`, `kawase` or `box`. Default `kawase`. Ignored by
# shadow. The renderer has one blur kernel today and reads no value from this property;
# it is accepted so a list written for a renderer with a choice still validates.
[[object.property]]
name = "algorithm"
type = "string"
since = "0.2.0"

# Blur only. Grain added after blurring, from 0.0 (none) to 1.0. Default 0.0. Ignored by
# shadow.
[[object.property]]
name = "noise"
type = "double"
since = "0.2.0"

# Blur only. Brightness multiplier on the blurred backdrop; 1.0 leaves it unchanged.
# Default 1.0. Ignored by shadow.
[[object.property]]
name = "brightness"
type = "double"
since = "0.2.0"

# Blur only. Contrast multiplier on the blurred backdrop; 1.0 leaves it unchanged.
# Default 1.0. Ignored by shadow.
[[object.property]]
name = "contrast"
type = "double"
since = "0.2.0"

# Blur only. Saturation multiplier on the blurred backdrop; 1.0 leaves it unchanged.
# Default 1.0. Ignored by shadow.
[[object.property]]
name = "saturation"
type = "double"
since = "0.2.0"

# Blur only. The tint colour as `#rrggbb` or `#rrggbbaa`; the empty string is no tint.
# Default empty. Ignored by shadow.
[[object.property]]
name = "tint"
type = "string"
since = "0.2.0"

# Shadow only. Horizontal offset of the shadow in logical pixels; positive is right.
# Default 0.0. Ignored by blur.
[[object.property]]
name = "offset_x"
type = "double"
since = "0.2.0"

# Shadow only. Vertical offset of the shadow in logical pixels; positive is down. Default
# 0.0. Ignored by blur.
[[object.property]]
name = "offset_y"
type = "double"
since = "0.2.0"

# Shadow only. Blur radius of the shadow edge in logical pixels; 0.0 is a hard edge.
# Default 12.0. Ignored by blur.
[[object.property]]
name = "blur_radius"
type = "double"
since = "0.2.0"

# Shadow only. How far the shadow grows beyond the node before blurring, in logical
# pixels; negative shrinks it. Default 0.0. Ignored by blur.
[[object.property]]
name = "spread"
type = "double"
since = "0.2.0"

# Shadow only. The shadow colour as `#rrggbb` or `#rrggbbaa`. Default `#00000080`. Ignored
# by blur.
[[object.property]]
name = "colour"
type = "string"
since = "0.2.0"

# Border only. The stroke width in logical pixels, 0 to 100. Default 0.0, which draws nothing.
# Ignored by blur and shadow. A `border` also reads `colour`: `#rrggbb` or `#rrggbbaa`.
[[object.property]]
name = "width"
type = "double"
since = "0.2.0"

# Border only. The distance in logical pixels from the silhouette's edge to the stroke's edge
# nearest it, -100 to 100. Positive moves the stroke away from the silhouette (outwards, or
# inwards when `inset`); negative moves it back across the edge. Default 0.0. Ignored by
# blur and shadow. Borders in list order with different offsets make concentric rings.
[[object.property]]
name = "offset"
type = "double"
since = "0.2.0"

# Border only. Whether the stroke lies inside the node's silhouette (`true`) or outside it
# (`false`, the default). Ignored by blur and shadow.
[[object.property]]
name = "inset"
type = "bool"
since = "0.2.0"

# Shadow only. Whether the shadow follows the node's whole frame (the node's rectangle
# together with the decoration children that lie outside it, such as a window's titlebar)
# rather than the node's own rectangle. Default false. Ignored by blur and border.
[[object.property]]
name = "frame"
type = "bool"
since = "0.2.0"
