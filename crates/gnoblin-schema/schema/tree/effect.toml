namespace = "tree"
version = "0.2.0"

# The `effect` value of a node's `effects` list. The
# schema has no unions, so one object carries every kind's parameters as flat properties.
# A parameter the kind does not use is ignored and documented as such.
#
# This is the node list's only effect path: the legacy `window.add_effect` call and the
# window's `effect` object are gone. What the compositor could not draw is reported on the
# node, in its read-only `skipped` list, not on each element. An effect is switched off by
# setting the list without it, so an element carries no `enabled` flag.
[[object]]
name = "effect"
since = "0.2.0"
record = true

# The kind of effect: `blur`, `shadow`, `border`, `background`, `filter` or `shader`. Any other
# kind is refused `bad-value` and the whole list is refused with it. A `shader` is refused
# `bad-value` too while the compositor's `compositor.user-shaders` setting is switched off (it is
# on by default; the seat's `user_shaders` says which), and when its source does not validate.
# A node holds at most 8 `border`, 8 outer `shadow`, 8 inset `shadow` (a `shadow` with `inset`),
# 4 `shader`, 1 `background` and 1 `filter` elements; a list over any cap is refused `too-large`.
#
# One layer paints in a fixed order, whatever the order of the list: outer shadows, the backdrop
# `blur`, the `background`, inset shadows, the content (a `shader` replaces it) graded by the
# `filter`, then the borders. Within a kind the list order is the paint order, later on top. The
# seat's `effect_kinds` names the kinds the renderer draws, as `blur`, `shadow`, `inset-shadow`,
# `border`, `background`, `filter` and `shader`; a kind it does not draw is named in the node's
# `skipped` as `<kind>: unsupported-by-renderer`, and `inset-shadow` is a `shadow` with `inset`.
[[object.property]]
name = "kind"
type = "string"
since = "0.2.0"

# Blur only. The backdrop is sampled at `1 / downscale` of full resolution before
# blurring: 1 is full resolution, 2 is half. Default 2. Ignored by shadow.
[[object.property]]
name = "downscale"
type = "uint"
since = "0.2.0"

# Blur only. The number of blur passes. Default 3. Ignored by shadow.
[[object.property]]
name = "passes"
type = "uint"
since = "0.2.0"

# Blur only. The blur kernel: `gaussian`, `kawase` or `box`. Default `kawase`. Ignored by
# shadow. The renderer has one blur kernel today and reads no value from this property;
# it is accepted so a list written for a renderer with a choice still validates.
[[object.property]]
name = "algorithm"
type = "string"
since = "0.2.0"

# Blur only. Grain added after blurring, from 0.0 (none) to 1.0. Default 0.0. Ignored by
# shadow.
[[object.property]]
name = "noise"
type = "double"
since = "0.2.0"

# Blur and filter. Brightness multiplier, 0.0 to 2.0: on the blurred backdrop for a `blur`, on
# everything the node paints for a `filter`; 1.0 leaves it unchanged. Default 1.0. Ignored by
# every other kind.
[[object.property]]
name = "brightness"
type = "double"
since = "0.2.0"

# Blur and filter. Contrast multiplier about mid grey, 0.0 to 2.0: on the blurred backdrop for
# a `blur`, on everything the node paints for a `filter`; 1.0 leaves it unchanged. Default 1.0.
# Ignored by every other kind.
[[object.property]]
name = "contrast"
type = "double"
since = "0.2.0"

# Blur and filter. Saturation multiplier, 0.0 (grey) to 2.0: on the blurred backdrop for a
# `blur`, on everything the node paints for a `filter`; 1.0 leaves it unchanged. Default 1.0.
# Ignored by every other kind.
[[object.property]]
name = "saturation"
type = "double"
since = "0.2.0"

# Blur only. The tint colour as `#rrggbb` or `#rrggbbaa`; the empty string is no tint.
# Default empty. Ignored by shadow.
[[object.property]]
name = "tint"
type = "string"
since = "0.2.0"

# Shadow only. Horizontal offset of the shadow in logical pixels; positive is right. For an
# inset shadow it moves the hole the shadow is cast from. Default 0.0. Ignored by every other
# kind.
[[object.property]]
name = "offset_x"
type = "double"
since = "0.2.0"

# Shadow only. Vertical offset of the shadow in logical pixels; positive is down. For an inset
# shadow it moves the hole the shadow is cast from. Default 0.0. Ignored by every other kind.
[[object.property]]
name = "offset_y"
type = "double"
since = "0.2.0"

# Shadow and filter. For a `shadow`, the blur radius of its edge in logical pixels; 0.0 is a
# hard edge, and the default is 12.0. For a `filter`, the blur of everything the node paints, 0.0
# to 100.0, with the sigma half the radius as for a backdrop blur; 0.0 is no blur, the filter then
# only grades, and an SDK's default for a `filter` is 0.0. A filter's blur spills past the node's
# edge. Ignored by every other kind.
[[object.property]]
name = "blur_radius"
type = "double"
since = "0.2.0"

# Shadow only. How far the shadow grows beyond the node before blurring, in logical pixels;
# negative shrinks it. For an inset shadow it shrinks the hole the shadow is cast from on every
# side, so a larger spread moves the shadow inwards. Default 0.0. Ignored by every other kind.
[[object.property]]
name = "spread"
type = "double"
since = "0.2.0"

# Shadow, border and background. The colour as `#rrggbb` or `#rrggbbaa`; for a `background` it
# is the fill, which a translucent value lets a backdrop blur show through. Default `#00000080`.
# Ignored by every other kind.
[[object.property]]
name = "colour"
type = "string"
since = "0.2.0"

# Border only. The stroke width in logical pixels, 0 to 100. Default 0.0, which draws nothing.
# Ignored by every other kind. A `border` also reads `colour`: `#rrggbb` or `#rrggbbaa`.
[[object.property]]
name = "width"
type = "double"
since = "0.2.0"

# Border only. The distance in logical pixels from the silhouette's edge to the stroke's edge
# nearest it, -100 to 100. Positive moves the stroke away from the silhouette (outwards, or
# inwards when `inset`); negative moves it back across the edge. Default 0.0. Ignored by
# every other kind. Borders in list order with different offsets make concentric rings.
[[object.property]]
name = "offset"
type = "double"
since = "0.2.0"

# Border and shadow. For a `border`, whether the stroke lies inside the node's silhouette
# (`true`) or outside it (`false`, the default). For a `shadow`, whether it is an inset shadow:
# cast inwards from the edge of the node's own rounded shape, strongest at the edge and fading
# over `blur_radius`, instead of a drop shadow behind the node. An inset shadow draws below the
# content as CSS does, so an opaque client hides it, and ignores `frame`. Ignored by every other
# kind.
[[object.property]]
name = "inset"
type = "bool"
since = "0.2.0"

# Shadow only. Whether the shadow follows the node's whole frame (the node's rectangle
# together with the decoration children that lie outside it, such as a window's titlebar)
# rather than the node's own rectangle. Default false. Ignored by an inset shadow and by every
# other kind.
[[object.property]]
name = "frame"
type = "bool"
since = "0.2.0"

# Shader only. The WGSL source of the pass, at most 16 KiB. It defines
# `fn effect(c: vec4<f32>, uv: vec2<f32>, p: array<f32, 8>, t: f32) -> vec4<f32>` and may add
# constants, structs and helper functions; it may not declare a variable, an override, a
# texture, a buffer or an entry point. `c` is the node's premultiplied colour at `uv`, which
# runs over the node's rectangle with (0, 0) at the top-left; `p` is `params`; `t` is the time
# in seconds. The source may call `backdrop(uv)`, the premultiplied colour of what is behind
# the node (secure windows and the lock card read as black). Loops are `for` only, with a
# constant bound of at most 64 trips; a source reads a texture at most 16 times. A source the
# validator refuses is refused `bad-value`, the whole list with it, and the compositor's log
# names the line and column. Ignored by every other kind.
[[object.property]]
name = "source"
type = "string"
since = "0.2.0"

# Shader only. The numbers the shader reads as `p[0]` to `p[7]`: at most 8, each finite; the
# ones not written are 0. Ignored by every other kind.
[[object.property]]
name = "params"
type = "list<double>"
since = "0.2.0"
