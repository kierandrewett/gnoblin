namespace = "tree"
version = "0.2.0"

# The `node` class: every node of the scene tree, visual or not (design/node-core.md,
# section 2.4). Every other tree class derives from it with `base = "node"`, so a
# class has these properties, then its own. A node's children are not a property:
# the mirror derives them from the tree.
#
# Animatable properties are marked `animated`: a `set` may carry `seconds`. The
# others refuse a `set` with `seconds` as `not-animated`.
[[object]]
name = "node"
since = "0.2.0"

# The compositor's id for the node (node-core.md, section 3.1). Assigned at creation
# and never reused. Read-only.
[[object.property]]
name = "id"
type = "uint"
since = "0.2.0"
readonly = true

# The node's parent. Nil only for `root`. Changed by `insert`, never by a `set`.
[[object.property]]
name = "parent"
type = "object:node"
since = "0.2.0"
readonly = true

# The `#name` selector key.
[[object.property]]
name = "name"
type = "string"
since = "0.2.0"
default = ""

# Local translation along each axis.
[[object.property]]
name = "x"
type = "double"
since = "0.2.0"
default = 0.0
animated = true

[[object.property]]
name = "y"
type = "double"
since = "0.2.0"
default = 0.0
animated = true

[[object.property]]
name = "z"
type = "double"
since = "0.2.0"
default = 0.0
animated = true

# Three components: rotation about each axis, in radians.
[[object.property]]
name = "rotation"
type = "list<double>"
since = "0.2.0"
default = [0.0, 0.0, 0.0]
animated = true

# Three components: the scale along each axis.
[[object.property]]
name = "scale"
type = "list<double>"
since = "0.2.0"
default = [1.0, 1.0, 1.0]
animated = true

# The local rectangle. Animated, because a resize is a change of the rectangle. On a `window` it is the window geometry
# (see `window`), not the size of the client's buffer.
[[object.property]]
name = "width"
type = "double"
since = "0.2.0"
default = 0.0
animated = true

[[object.property]]
name = "height"
type = "double"
since = "0.2.0"
default = 0.0
animated = true

# Clamped to `[0, 1]` by the compositor.
[[object.property]]
name = "opacity"
type = "double"
since = "0.2.0"
default = 1.0
animated = true

# The radius, in logical pixels, of the rounded corners the node and its subtree are clipped
# to. A negative value is refused `out-of-range`. A radius larger than half the shorter side
# of the shape it rounds is drawn as half that side. The shape is the node's own rectangle,
# or, for a window, the window's frame: the node's rectangle together with the decoration
# children that lie outside it (a titlebar above the content). The window's content, its
# decoration children, its borders and, when the shadow asks for `frame`, its shadow all
# follow that one rounded shape, so a rounded decorated window has four rounded corners and
# not a rounded titlebar over a rounded content. A radius of 0 (the default) is a square
# rectangle. One radius serves every corner; the JS style's per-corner radii are not drawn,
# and its `unapplied` list says so. Animated, so a timed `set` tweens it.
[[object.property]]
name = "corner_radius"
type = "double"
since = "0.2.0"
default = 0.0
animated = true

# A hidden node and its subtree are neither drawn nor hit.
[[object.property]]
name = "visible"
type = "bool"
since = "0.2.0"
default = true

# Children are clipped to the node's rectangle.
[[object.property]]
name = "clip"
type = "bool"
since = "0.2.0"
default = false

# The node is skipped by the pick; its children are still tested.
[[object.property]]
name = "input"
type = "bool"
since = "0.2.0"
default = true

# What a hit on the node does when `input` is set: `forward` (the default) or `capture`. On a `view` with a `source`,
# `forward` takes the pointer into the source: a window's client gets it in surface coordinates and the shell is sent
# nothing for the View, and `capture` lands on the View itself, so the shell is sent its edges and the client none.
# On any other node, and on a View with no source, the two are the same: the shell is sent the edges. A write of any
# other text is refused `bad-value`. `input = false` is the third state, `none`: the pick skips the node.
[[object.property]]
name = "input_mode"
type = "string"
since = "0.2.0"
default = "forward"

# Never captured by a `view`.
[[object.property]]
name = "secure"
type = "bool"
since = "0.2.0"
default = false

# The `.tag` selector keys.
[[object.property]]
name = "tags"
type = "list<string>"
since = "0.2.0"
default = []

# The node's effects in paint order, first to last. Each element is an `effect` object
# (`effect.toml`). This is the only way to give a node a blur or a shadow. The compositor
# draws blur and shadow; any other kind, a shader included, refuses the whole list
# `bad-value`. Setting the list replaces it, and it is echoed in a snapshot. An effect the
# compositor cannot draw stays in the list and is named in `skipped`.
[[object.property]]
name = "effects"
type = "list<object:effect>"
since = "0.2.0"
default = []

# The effects in `effects` that are not drawn, one text each as `<kind>: <reasons>`, in list
# order; empty when every effect is drawn. Two reasons exist. `unsupported-by-renderer`: the
# active renderer draws no effect of that kind (GLES draws blur, shadow and border, the software renderer
# shadow and border, and Vulkan none; `seat.effect_kinds` lists what is drawn). `unsupported-effect-on-3d`:
# a blur, shadow or border on a node whose placement carries depth (a rotation about x or y, a
# `z`, or a perspective `Camera` above it) is not drawn, because the renderer has no depth
# pass for backdrop and shadow passes. An effect with both reasons names both on one text,
# joined by `, `. The compositor writes it when the node's placement, its `effects` or the
# renderer changes; a client can read it and cannot set it.
[[object.property]]
name = "skipped"
type = "list<string>"
since = "0.2.0"
default = []
readonly = true

# The node is gone: its subtree was destroyed with it. A client drops its view of the
# object on this signal.
[[object.signal]]
name = "destroyed"
since = "0.2.0"
