[package]
name = "gnoblin-lua-sandbox"
description = "The sandboxed Lua state shared by the runtime and the layout host: instruction, memory and deadline limits, and the stdlib subset each profile loads."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The Lua VM (D10). The sandbox owns its construction and limits; no other crate
# builds a Lua state.
mlua.workspace = true
# The pattern matcher behind string.find and friends; the sandbox only wires it in.
gnoblin-lua-pattern.workspace = true

[lints]
workspace = true
