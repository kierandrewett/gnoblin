[package]
name = "gnoblin-sdkgen"
description = "The one generator of every language SDK: Rust, Python and TypeScript bindings and their editor files, rendered from the schema catalog and the two ABI crates at build time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Part of the Rust shell SDK on crates.io (the workspace's `publish = false` is for the rest).
publish = true

[dependencies]
# The catalog the object model is described by.
gnoblin-schema.workspace = true
# The two ABIs, read through their own `reflect` declarations (constants, handles, callbacks, `repr(C)` records and the function tables).
gnoblin-core-abi.workspace = true
gnoblin-std-abi.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
