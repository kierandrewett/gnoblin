[package]
name = "gnoblin-std-impl"
description = "libgnoblin-std: the optional desktop object model above the core (clients, collections, workspaces, layouts). Built as a cdylib with SONAME libgnoblin-std.so.1; shells link it through the gnoblin-std SDK, never as a Rust dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "gnoblin_std_impl"
# The cdylib is the library. The rlib exists for this crate's own unit tests; nothing else may depend on it (`impl-sealed`).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The std library acts on the compositor only through the installed core: it is a shell's guest, and holds the same handle on the
# generation that the shell does (`gnoblin_core::private::gnoblin_for`). It names the core SDK and the two ABI crates, never the
# core's implementation or its internals, so the same library runs on any ABI-compatible core.
gnoblin-core = { path = "../gnoblin-core" }
gnoblin-core-abi = { path = "../gnoblin-core-abi" }
gnoblin-std-abi = { path = "../gnoblin-std-abi" }
# The providers std registers with the core as C vtables: the stock window manager and portal dialogs, the vtable adapters they
# go through, the trait they speak, and the configuration and accessibility types the settings observer reads.
gnoblin-provider-wire = { path = "../gnoblin-provider-wire" }
gnoblin-std-wm = { path = "../gnoblin-std-wm" }
gnoblin-std-portal = { path = "../gnoblin-std-portal" }
gnoblin-wm-api = { path = "../gnoblin-wm-api" }
gnoblin-config = { path = "../gnoblin-config" }
gnoblin-a11y = { path = "../gnoblin-a11y" }

[dev-dependencies]
# The parity test drives the TypeScript std over the same fake compositor script as the native one, and compares what each wrote.
gnoblin-js = { path = "../gnoblin-js" }
gnoblin-shell-host = { path = "../gnoblin-shell-host" }
gnoblin-testkit = { path = "../gnoblin-testkit" }
gnoblin-tree-client = { path = "../gnoblin-tree-client" }
tempfile = "3.23.0"

[build-dependencies]
gnoblin-std-abi = { path = "../gnoblin-std-abi" }

# The workspace table forbids unsafe code; a library that exports a C ABI needs it. Only the modules that open with
# `#![allow(unsafe_code)]` and a SAFETY note use it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
