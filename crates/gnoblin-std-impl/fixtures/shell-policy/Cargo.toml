[package]
name = "gnoblin-fixture-shell-policy"
description = "Test fixture: a std shell that binds the stock pointer drags and the probe bindings through the classes of the policy catalog (move, resize, swap, split resize) and the core input matcher, so a test can hold them to the TypeScript library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "shell_policy"
crate-type = ["cdylib"]

[dependencies]
gnoblin-core = { path = "../../../gnoblin-core" }
gnoblin-std = { path = "../../../gnoblin-std" }

[lints]
workspace = true
