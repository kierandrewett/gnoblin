[package]
name = "gnoblin-js"
description = "JavaScript shell runtime: TypeScript stripping, the module loader, and one QuickJS generation with its budgets and error remapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The JavaScript engine (QuickJS-ng). One generation owns one runtime and context.
rquickjs.workspace = true
# TypeScript stripping: the parser, the semantic pass the transformer needs for enums and
# parameter properties, the transformer, and the printer that writes the source map.
oxc_allocator.workspace = true
oxc_codegen.workspace = true
oxc_diagnostics.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_sourcemap.workspace = true
oxc_transformer.workspace = true
# Config-directory watcher for hot reload.
notify.workspace = true
# Error types: each `Display` says what failed and the `source` chain is kept.
thiserror.workspace = true
# The tree protocol's client side: the mirror, the transaction builder and the link trait the shell runs over.
gnoblin-tree-client.workspace = true
# The text of a seat claim travels as a `SecretText`, which is what the call op carries.
gnoblin-secret.workspace = true
# The owner socket's client: the role connects and handshakes as every client does.
gnoblin-client = { path = "../gnoblin-client" }
# The IPC version this build advertises in that handshake.
gnoblin-proto = { path = "../gnoblin-proto" }
# The configuration document's validator: the shell checks the document it commits as the retired host does.
gnoblin-config = { path = "../gnoblin-config" }
# The document crosses the owner socket as JSON; the shell reads the one in force and writes the next.
serde_json.workspace = true
# The console reads its peer's uid from the kernel (`SO_PEERCRED`) and compares it with its own.
rustix = { workspace = true, features = ["net", "process"] }
# The log facade every crate logs through.
gnoblin-log = { path = "../gnoblin-log" }
# The host API (`gnoblin.session`, `gnoblin.on`) reads the object graph's values and the schema's signal names, and
# its options cross the module boundary as JSON; the idle connection reads the `idle` object and calls its methods.
gnoblin-model = { path = "../gnoblin-model" }
gnoblin-js-types = { path = "../gnoblin-js-types" }
serde.workspace = true

[dev-dependencies]
# The loader and budget tests write real module trees and symlinks under a temp root.
tempfile = "3.23.0"
# The stock placement goldens are read from `tests/shell/placement_cases.toml` (tests/stock_layouts.rs).
toml.workspace = true
# The paint list tests compare the toolkit's bytes with the compositor's own encoder and decoder
# (`tests/ui.rs`); the shell itself never links the painter.
gnoblin-paint.workspace = true
# The console tests read what a script logged through `console`, with the level each line was logged at.
gnoblin-log = { path = "../gnoblin-log", features = ["capture"] }
