[package]
name = "gnoblin-xwayland"
description = "Xwayland startup and window management."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The vocabulary this crate and `gnoblin-wayland` share: the start parameters, the
# supervision answers and the X11 window events. Neither engine crate may name the
# other, so the seam is the hub's.
gnoblin-backend = { path = "../gnoblin-backend", default-features = false }
# Rectangles and identities.
gnoblin-types.workspace = true
# The `xwayland` section this crate applies, and its generated enum.
gnoblin-config = { path = "../gnoblin-config" }

[dev-dependencies]
# The crate's own tests run on the backend with its default renderers. The normal dependency leaves them off, so a build that
# switches a renderer feature off (`gnoblin-compositor`, feature `gles`) is not turned back on by this crate.
gnoblin-backend = { path = "../gnoblin-backend" }
# The real test: a headless `gnoblin-wayland` server with Xwayland inside it. A
# development-only edge, so the shipped crate still does not link the Wayland engine.
gnoblin-wayland = { path = "../gnoblin-wayland" }
# The stand-in shell of the window-request tests, shared with `gnoblin-wayland`'s suites.
gnoblin-wayland-testkit = { path = "../protocols/testkit" }
# The stock window manager the test session runs, so an X11 window is placed and focused as on the desktop.
gnoblin-std-wm = { path = "../gnoblin-std-wm" }
# The tree's change and value types, which the node test reads from the batches the session
# publishes.
gnoblin-render = { path = "../gnoblin-render" }
# The X11 client the tests use: a real client on a real display, not a mock peer.
x11rb = "0.14.0"
# A temporary runtime directory for the test socket and the X11 lock files.
tempfile.workspace = true
