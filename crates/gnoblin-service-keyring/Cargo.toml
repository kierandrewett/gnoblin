[package]
name = "gnoblin-service-keyring"
description = "The Secret Service provider on org.freedesktop.secrets: the keyring's bus face, with dh-ietf1024 sessions only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gnoblin-keyring-store = { path = "../gnoblin-keyring-store" }
gnoblin-log = { path = "../gnoblin-log" }
gnoblin-keyring-handoff = { path = "../gnoblin-keyring-handoff" }
gnoblin-model = { path = "../gnoblin-model" }
# The bus face: the Service, Collection, Item, Session and Prompt interfaces are zbus objects.
zbus.workspace = true
# The `dh-ietf1024-sha256-aes128-cbc-pkcs7` session: Diffie-Hellman on the
# RFC 2409 group, with HKDF-SHA256 and AES-128-CBC.
sha2.workspace = true
hkdf.workspace = true
aes.workspace = true
cbc.workspace = true
num-bigint.workspace = true
getrandom.workspace = true
# The session key and the exponent are wiped on drop.
zeroize.workspace = true
# The hand-off listener is `block_on` for the one async call the unlock path makes, and checks
# the peer's uid with `SO_PEERCRED`.
futures-lite.workspace = true
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true
