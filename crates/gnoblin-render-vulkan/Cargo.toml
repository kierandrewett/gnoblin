[package]
name = "gnoblin-render-vulkan"
description = "The Vulkan renderer: an OutputFrame drawn through ash into an offscreen image and read back."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The workspace table forbids `unsafe` outright. This crate is one of the FFI shims that
# restate the level with `deny` and confine the exemption to the modules that call `ash`:
# every call into the loader and a driver is `unsafe` because `ash` is a raw binding. The
# exemption is named per file (`context.rs`, `pipeline.rs`, `frame.rs`), each opening with
# `#[allow(unsafe_code)]` and a `SAFETY:` comment per block. Nothing else may contain `unsafe`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
# The Vulkan bindings. Every call is `unsafe`; the loader is opened with `dlopen`.
ash.workspace = true
# The client-buffer pixels are read through Smithay's `wl_shm` mapping.
smithay.workspace = true
# Outputs, colours and sizes are stated in the shared primitives.
gnoblin-types.workspace = true
# The frame description every renderer draws, and the error vocabulary it reports with.
gnoblin-render-frame = { path = "../gnoblin-render-frame" }
# The scene vocabulary a frame's layers carry (effects and tints).
gnoblin-render = { path = "../gnoblin-render" }
# `[tag]` log lines for a refused frame, a skipped layer and a failed device.
gnoblin-log = { path = "../gnoblin-log" }
# The GLSL-free shader path: the shared WGSL passes are compiled to SPIR-V with naga's writer.
naga = { workspace = true, features = ["spv-out"] }

[dev-dependencies]
# The shared-memory files of the in-process Wayland client (`harness.rs`).
tempfile = "3.23.0"
# The client side of `wl_shm` for the in-process client, and the software renderer whose
# readbacks the parity tests compare with. Its `test-support` feature exposes the composed
# readback the overlay parity test reads.
wayland-client = "0.31.14"
gnoblin-render-software = { path = "../gnoblin-render-software", features = ["test-support"] }
