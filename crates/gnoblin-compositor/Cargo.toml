[package]
name = "gnoblin-compositor"
description = "Composition root: event loop and wiring, the only crate that knows every subsystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Text that must not leak (a seat claim's chord, a password): redacted `Debug`, wiped on drop.
gnoblin-secret.workspace = true
# The Wayland engine this process runs: the protocol handlers, the seat, the window
# manager glue and the frame hook.
gnoblin-wayland = { path = "../gnoblin-wayland" }
# The Lua host that runs the layout modules.
gnoblin-lua = { path = "../gnoblin-lua" }
# The backend trait and the backends this build selects between: headless, nested in
# a parent compositor, and the DRM refusal until the DRM backend lands.
gnoblin-backend = { path = "../gnoblin-backend" }
gnoblin-render = { path = "../gnoblin-render" }
# The Canvas painter: system fonts for text measurement and for drawing `Canvas` nodes.
gnoblin-paint.workspace = true
gnoblin-render-frame = { path = "../gnoblin-render-frame" }
# The colour transform rows each named colour filter draws with.
gnoblin-a11y = { path = "../gnoblin-a11y" }
# The cursor providers and theme lookup the compositor reads its cursor settings from.
gnoblin-cursor = { path = "../gnoblin-cursor" }
# The X11 supervisor and window policy. A session with X11 starts Xwayland under it;
# a session without X11 never touches it.
gnoblin-xwayland = { path = "../gnoblin-xwayland" }
# The live object graph the IPC serves, and the shared primitives its identities
# and values are.
gnoblin-model = { path = "../gnoblin-model" }
gnoblin-types.workspace = true
# The schema the graph's vocabulary comes from, and the source of the IPC version
# this process serves.
gnoblin-schema = { path = "../gnoblin-schema" }
# The wire vocabulary: the envelope, the handshake, the version rule and the
# object-model members. A server speaks the same members a client does, so both
# sides use one description of them.
gnoblin-proto = { path = "../gnoblin-proto" }
gnoblin-client = { path = "../gnoblin-client" }
# The portal's built-in dialog screens (D19). The negotiation core names their models;
# the screens draw them, and nothing else in the compositor depends on the dialog crates.
gnoblin-portal = { path = "../gnoblin-portal" }
gnoblin-portal-core = { path = "../gnoblin-portal-core" }
gnoblin-portal-ui = { path = "../gnoblin-portal-ui" }
gnoblin-portal-consent = { path = "../gnoblin-portal-consent" }
gnoblin-input = { path = "../gnoblin-input" }
# The still-picture seam: the output choice and the PNG encoding for `capture.screen`.
gnoblin-capture = { path = "../gnoblin-capture" }
gnoblin-input-eis = { path = "../gnoblin-input-eis" }
# Who this process is, for the IPC socket directory's ownership check.
rustix = { workspace = true, features = ["net"] }
# Wipes a secret answer the request layer forwards or refuses, so it does not outlive the frame.
zeroize.workspace = true
# The accepted configuration document and its last-good store: the compositor reads the
# settings it applies at start from it before the session starts.
gnoblin-config = { path = "../gnoblin-config" }
# `[tag]` log lines, the same crate the Wayland engine logs through.
gnoblin-log = { path = "../gnoblin-log" }

[build-dependencies]
# The build script validates the checked-in schema once and embeds it, so the
# process reads no source tree at run time.
gnoblin-schema = { path = "../gnoblin-schema" }

[dev-dependencies]
# Reads back what the compositor logs, so a test proves a typed passphrase reaches no log line.
gnoblin-log = { path = "../gnoblin-log", features = ["capture"] }
# A real client for the real Wayland socket: the end-to-end tests drive the
# session the way another process would.
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
# A real X11 client, to prove the session's X server accepts a connection.
x11rb = "0.14.0"
# The real command line client, called through its library entry point, so the
# end-to-end tests exercise the shipped code rather than a copy of it.
gnoblinctl = { path = "../gnoblinctl" }
# A temporary directory for the two sockets, so a test run touches no shared path.
tempfile = "3.23.0"
# The EI client the end-to-end EIS test speaks to the endpoint with, the same crate the
# endpoint itself is written against.
reis = { version = "0.7.1", default-features = false }
# The protobuf codec the tree test decodes replies and events with.
prost.workspace = true
# The portal backend's own library, served on a private session bus against a live session:
# the consent end to end test drives the real D-Bus methods into the real compositor.
xdg-desktop-portal-gnoblin = { path = "../xdg-desktop-portal-gnoblin" }
# The real services role, which serves the Gnoblin keyring on a private bus and offers its unlock prompt to the stock
# shell through the compositor, so the keyring's `prompt.secret` path is tested as the session runs it.
gnoblin-services = { path = "../gnoblin-services" }
# The real ScreenSaver service and the connection it reads the lock through, so the lock end to end test takes the
# lock the way a locker on the user's desktop does: `org.freedesktop.ScreenSaver.Lock` on a private bus.
gnoblin-service-core = { path = "../gnoblin-service-core" }
gnoblin-service-screensaver = { path = "../gnoblin-service-screensaver" }
gnoblin-lock-auth = { path = "../gnoblin-lock-auth" }
zbus.workspace = true
# Decodes the PNG a View capture writes, so a test reads the pixels the compositor composed.
png.workspace = true
# The portal test's request bodies are serialised D-Bus tuples, and its stress test bounds a
# D-Bus call with a timer.
serde.workspace = true
futures-lite.workspace = true
async-io.workspace = true
