[package]
name = "gnoblinctl"
description = "Command line client for the Gnoblin IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
clap_complete.workspace = true
# The client half of the IPC: handshake, subscribe, call, await. gnoblinctl adds
# only the socket under it and the presentation above it.
gnoblin-client = { path = "../gnoblin-client" }
# The log reader, for `gnoblinctl log`: the file names and rotation are the sink's, so the
# reader and the writer cannot disagree about where the records are.
gnoblin-log = { path = "../gnoblin-log" }
gnoblin-cli-style = { path = "../gnoblin-cli-style" }
# The vocabulary a caller sees: identities, values, observations, operations.
gnoblin-model = { path = "../gnoblin-model" }
# The wire, for the handshake version and for `ipc dump`'s frame decoding.
gnoblin-proto = { path = "../gnoblin-proto" }
# `ipc dump` decodes an envelope body, and the envelope is a generated protobuf
# message: decoding it is this trait's job.
prost.workspace = true
# The schema types, so a generated `string`/`uint`/`object:window` argument is
# parsed and checked by the same code that validates the graph.
gnoblin-schema = { path = "../gnoblin-schema" }
# `config validate` parses a file with the runtime's own parser, so a document
# that validates here is one the compositor accepts.
gnoblin-config = { path = "../gnoblin-config" }
# `config validate` on an `init.lua` runs the runtime's own host, so a refused file is
# refused for the reasons the compositor would give.
gnoblin-lua = { path = "../gnoblin-lua" }
serde_json.workspace = true

[build-dependencies]
# The command tree is generated from the schema, so the schema is a build input
# and nothing generated is committed.
gnoblin-schema = { path = "../gnoblin-schema" }

[dev-dependencies]
# The window fixture builds a window's full property set from the schema.
gnoblin-testkit = { path = "../gnoblin-testkit" }

[lints]
workspace = true
