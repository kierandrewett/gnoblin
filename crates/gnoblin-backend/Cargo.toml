[package]
name = "gnoblin-backend"
description = "Backends (nested, headless) and the extension traits the engine crates share. The DRM/KMS backend is `gnoblin-backend-drm`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# This crate has no `unsafe` of its own: the GLES and Vulkan calls live in
# `gnoblin-render-gles` and `gnoblin-render-vulkan`, and the DRM bootstrap lives in
# `gnoblin-backend-drm`. So it inherits the workspace lint levels (`unsafe_code = "forbid"`)
# rather than restating them.
[lints]
workspace = true

[features]
# The Vulkan renderer lives in `gnoblin-render-vulkan`. On by default because the Vulkan
# loader is opened with `dlopen` when a renderer is created, not linked: a machine without
# one builds, starts and runs the Vulkan tests as skips.
default = ["vulkan"]
vulkan = ["dep:gnoblin-render-vulkan"]

[dependencies]
# The event-loop handle the backend contract registers its sources with. Pinned
# workspace-wide (D7) with the `renderer_pixman` feature, which is the software path of the
# Frame card and the reference renderer the headless backend uses. The hardware features
# (`backend_drm`, `backend_gbm`, `backend_udev`, `backend_session_libseat`,
# `backend_libinput`) come with the workspace pin too, because they are choices the whole
# workspace has to make together. This crate links none of them: they belong to
# `gnoblin-backend-drm`, and the nested and headless backends link no DRM code at all.
smithay.workspace = true
# Outputs, events and targets are stated in the shared primitives.
gnoblin-types.workspace = true
# A backend produces output descriptors and their modes; the layout engine owns
# where they sit.
gnoblin-output = { path = "../gnoblin-output" }
# The scene graph the frame is composed from: visual transforms, paint order and
# damage. This crate is the one place the engine's crates may meet, so the scene sits
# on this side of the contract and `gnoblin-wayland` never names it.
gnoblin-render = { path = "../gnoblin-render" }
gnoblin-render-frame = { path = "../gnoblin-render-frame" }
gnoblin-animation = { path = "../gnoblin-animation" }
# The renderer and capture choices the renderer selection reads (`RendererChoice`,
# `CaptureSecureTreatment`). They are the generated document's types, not copies, so a
# value the configuration accepts and the selection does not know cannot exist.
gnoblin-config = { path = "../gnoblin-config" }
# Log lines for a refused frame or a client buffer that went away. The logging facade is
# a path dependency and adds no crate beyond `tracing`, which Smithay already brings in.
gnoblin-log = { path = "../gnoblin-log" }
# The nested backend is a Wayland *client* of the compositor that hosts the session,
# so this crate depends on the client library as well as the server one Smithay
# re-exports. It is the same version `gnoblin-wayland` tests its server with, so the
# two sides of the wire cannot drift apart.
#
# The client side needs no `unsafe`: a shared-memory buffer is filled through
# `File::write_all_at` rather than an `mmap`, one copy per frame more than a real client
# would make, which is why `nested/mod.rs` states the dmabuf path as a follow-up rather
# than a second code path here.
wayland-client = "0.31.14"
# The client side of `xdg_shell` and of the scale protocols. `staging` is the
# feature that carries `wp_fractional_scale_v1`; a parent that does not offer it
# falls back to the integer scale of its `wl_output`.
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# The Xwayland seam ([`x11`]) states the answer to an X11 event as the window
# manager's own effects, so the two engine crates that meet there share one
# vocabulary instead of translating between two. That is why `gnoblin-wm` is here:
# the alternative was a second event enum in this crate and a translation in each
# direction.
gnoblin-wm = { path = "../gnoblin-wm" }
# The GLES renderer (its EGL bootstrap and every GL call are `unsafe` and confined to that
# crate). Normal, not optional: the headless backend and the renderer selection name it.
gnoblin-render-gles = { path = "../gnoblin-render-gles" }
# The software renderer (Pixman): the offscreen target the nested backend and the headless
# backend draw through. Normal, not optional, because the nested compositor needs it.
gnoblin-render-software = { path = "../gnoblin-render-software" }
# The Vulkan renderer (feature `vulkan`), whose calls into the driver are `unsafe` and
# confined to that crate.
gnoblin-render-vulkan = { path = "../gnoblin-render-vulkan", optional = true }

[dev-dependencies]
# The Vulkan tests' in-process client lives in `gnoblin-render-vulkan`; nothing here needs more.
