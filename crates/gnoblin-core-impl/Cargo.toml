[package]
name = "gnoblin-core-impl"
description = "libgnoblin-core: the implementation of the shell ABI (registry, queue, panic guard, loader). Built as a cdylib with SONAME libgnoblin-core.so.1; shells link it through the gnoblin-core SDK, never as a Rust dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "gnoblin_core_impl"
# The cdylib is the library. The rlib exists for this crate's own tests; nothing else may depend on it (`impl-sealed`).
crate-type = ["cdylib", "rlib"]

[features]
# Test only: adds the `gnoblin_test_main` export, the scenario driver the integration tests run through a launcher, and
# turns the log console on. Never in a build that ships; `cargo xtask dist-check` rejects the export.
test-driver = ["dep:gnoblin-testkit"]
# Test only: a core of a hypothetical ABI 1.1 (one function appended to the table). See `gnoblin-core-abi`.
next-minor = ["gnoblin-core-abi/next-minor"]
# Test only: a core that reports ABI major 2 (its file is still `libgnoblin-core.so.1`). See `gnoblin-core-abi`.
next-major = ["gnoblin-core-abi/next-major"]

[dependencies]
gnoblin-core-abi = { path = "../gnoblin-core-abi" }
# The provider ABI's two ends in one place: the core wraps what a library registers (std's window manager, dialogs and
# configuration observer) as the traits the compositor drives.
gnoblin-provider-wire = { path = "../gnoblin-provider-wire" }
# The log of the compositor process: the library installs it (`gnoblin_main`), so it enables the `init` feature that only a
# binary or an implementation library may (`log-features`).
gnoblin-log = { path = "../gnoblin-log", features = ["init"] }
# The compositor, and what the compositor role of the launcher wires into it: the compat adapters, the power backend of the
# services crate, and the shell it runs in process. The launcher reaches all of it only through `gnoblin_main` (M2.10).
gnoblin-compositor = { path = "../gnoblin-compositor" }
gnoblin-compat-host = { path = "../compat/gnoblin-compat-host" }
# The isolated shell role (`--role shell`) is a client of the compositor's socket: the version handshake, the inherited
# descriptor the guardian hands it and the readiness reports.
gnoblin-client = { path = "../gnoblin-client" }
gnoblin-proto = { path = "../gnoblin-proto" }
# The compositor's object model: the values of a verb's arguments, its answers and the signals it raises, as the owner socket carries
# them.
gnoblin-model = { path = "../gnoblin-model" }
gnoblin-services = { path = "../gnoblin-services" }
# The host: generations and their registrations, the dispatch loop, the loader and its retire list, panic containment.
# This crate adds the C handles and the function table over it.
gnoblin-shell-host = { path = "../gnoblin-shell-host" }
# The shell side of the tree protocol, in one place: the link seam, the mirror, the per-tick builder and the gate that keeps one
# transaction in flight. The core holds the one mirror for every language (D4).
gnoblin-tree-client = { path = "../gnoblin-tree-client" }
# The wake descriptor (an epoll set over an eventfd, a timerfd and the link's descriptor) and the verbs thread's wake-up.
rustix = { workspace = true, features = ["event", "time"] }
# Test only (`test-driver`): the fake compositor the scenario driver gives the shells it loads, so one process can load a shell
# `.so` and drive it with windows and keys. It is the same fake the JavaScript runtime's tests use. A shipped core has no use for
# it, and `cargo xtask dist-check` rejects the driver's export.
gnoblin-testkit = { path = "../gnoblin-testkit", optional = true }

[dev-dependencies]
# The unit tests of the table's tree functions run over the fake compositor.
gnoblin-testkit = { path = "../gnoblin-testkit" }
# The provider registration tests register `NullWm` as the window manager.
gnoblin-wm-api = { path = "../gnoblin-wm-api" }

[build-dependencies]
# The ABI crate names the SONAME and the value kinds the generated catalog uses; the schema is the catalog's source.
gnoblin-core-abi = { path = "../gnoblin-core-abi" }
gnoblin-schema = { path = "../gnoblin-schema" }

# Negative control for the dependency test: a shell that links this crate as a Rust library carries its own copy of the
# core and defines `gnoblin_*` itself. The test builds it and checks that `dist-check` would catch it.
[[example]]
name = "rlib_control"
path = "examples/rlib_control.rs"
crate-type = ["cdylib"]

# The workspace table forbids unsafe code; a library that exports a C ABI and loads modules needs it. Only the modules
# that open with `#![allow(unsafe_code)]` and a SAFETY note use it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
