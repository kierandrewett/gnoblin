[package]
name = "gnoblin-fixture-shell-hot"
description = "Test fixture: a shell whose behaviour is chosen at build time by FIXTURE_LABEL, so one source builds the generations of a reload test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "shell_hot"
crate-type = ["cdylib"]

[features]
# Test only: the library exports an entry descriptor built for ABI major 2 instead of the SDK's, which the loader refuses with
# both versions named.
wrong-abi = []
# Test only: the library calls a symbol the core does not export, as a shell built against a newer core would; the dynamic
# loader refuses it and the loader says which symbol is missing.
newer-symbol = []

[dependencies]
gnoblin-core = { path = "../../../gnoblin-core" }

# The workspace's lint table with `unsafe_code` at `deny`: the one export a module needs to say it can be unloaded
# (`gnoshell_unload_safe`) is a `#[no_mangle]` item.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
