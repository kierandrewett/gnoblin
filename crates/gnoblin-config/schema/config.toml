# --- Records ----------------------------------------------------------------
# A record is a table inside a section. Records come first so a field can name
# one; the generator refuses a field that names a record declared later.

[[record]]
name = "AccelCurve"
doc = "A pointer acceleration curve, in device units."
hook = "accel_curve"

[[record.field]]
key = "step"
kind = "float"
min = 0.0
max = 1.7976931348623157e308
accepted = "a number greater than 0"
doc = "Device units per millisecond between points."
since = "0.2.0"

[[record.field]]
key = "points"
kind = "float-list"
min = 0.0
max = 1.7976931348623157e308
accepted = "a list of at least two numbers"
doc = "Output speed at each evenly spaced input speed."
since = "0.2.0"

[[record]]
name = "Workspace"
doc = "One named workspace."
hook = "workspace"

[[record.field]]
key = "id"
kind = "text"
nonempty = true
required = "a workspace id"
accepted = "a nonempty workspace id"
doc = "The stable identifier rules and scripts use."
since = "0.2.0"

[[record.field]]
key = "name"
kind = "text"
required = "a workspace name"
accepted = "a nonempty name of at most 80 characters"
doc = "The name shown to the user."
since = "0.2.0"

[[record]]
name = "LayoutOutput"
doc = "The layout of every workspace on one output."

[[record.field]]
key = "output"
kind = "text"
nonempty = true
required = "an output connector id"
accepted = "a nonempty connector id"
doc = "The connector id, for example DP-1."
since = "0.2.0"

[[record.field]]
key = "layout"
kind = "text"
nonempty = true
required = "a layout name"
accepted = "a nonempty layout name"
doc = "The layout name the output's workspaces use."
since = "0.2.0"

[[record]]
name = "LayoutWorkspace"
doc = "The layout of one workspace."

[[record.field]]
key = "workspace"
kind = "text"
nonempty = true
required = "a workspace id"
accepted = "a nonempty workspace id"
doc = "The workspace id, as declared in workspaces."
since = "0.2.0"

[[record.field]]
key = "layout"
kind = "text"
nonempty = true
