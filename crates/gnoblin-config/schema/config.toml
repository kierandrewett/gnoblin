    { spelling = "vulkan", doc = "The Vulkan renderer. A session that cannot create it is refused." },
    { spelling = "gles", doc = "The OpenGL ES renderer. A session that cannot create it is refused." },
    { spelling = "software", doc = "The CPU renderer, which needs no GPU." },
]

