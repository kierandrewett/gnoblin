default = { bool = true }
doc = "Keep the active application window focused when a layer surface opens."
since = "0.2.0"

[[section]]
key = "prompts"
type = "Prompts"
doc = "Whether Gnoblin serves keyring and GPG passphrase prompts."

[[section.field]]
key = "enabled"
kind = "bool"
accepted = "a boolean"
default = { bool = false }
doc = "Take the prompter role on the session bus."
since = "0.2.0"

[[section]]
key = "auth"
type = "Auth"
doc = "Whether Gnoblin is the session's polkit authentication agent."

[[section.field]]
key = "polkit-agent"
kind = "bool"
accepted = "a boolean"
default = { bool = false }
doc = "Register as the polkit authentication agent."
since = "0.2.0"

[[section]]
key = "location"
type = "Location"
doc = "The policy Gnoblin's GeoClue agent applies."

[[section.field]]
key = "enabled"
kind = "bool"
inherit = true
accepted = "a boolean or \"inherit\""
doc = "Whether location requests may be approved at all."
since = "0.2.0"

[[section.field]]
key = "max-accuracy"
kind = "enum"
enum = "LocationAccuracy"
inherit = true
accepted = "one of country, city, neighborhood, street, exact"
doc = "The greatest precision an approved request may return."
since = "0.2.0"

[[section]]
key = "compat"
type = "Compat"
doc = "Which compatibility adapters Gnoblin serves on the session bus."

[[section.field]]
key = "capture"
kind = "enum"
enum = "CompatCapture"
accepted = "one of off, portal, unmediated"
default = { enum = "portal" }
doc = "How much of the compatibility surface answers: off serves none of it."
since = "0.2.0"

[[section]]
key = "monitors"
type = "Monitors"
doc = "Preferences that apply to whichever monitors are connected."
overridable = true

[[section.field]]
key = "privacy-screen"
kind = "bool"
inherit = true
accepted = "a boolean or \"inherit\""
doc = "Request the privacy-screen state on monitors that have one."
since = "0.2.0"

[[section.field]]
key = "global-scale"
kind = "int"
min = 0
max = 4
inherit = true
accepted = "an integer from 0 through 4"
doc = "Scale every output by this integer step, or follow the system setting."
since = "0.2.0"

[[section]]
key = "xwayland"
type = "Xwayland"
doc = "How the X11 server is started and what it may do."
hook = "xwayland"

[[section.field]]
key = "allow-grabs"
kind = "bool"
accepted = "a boolean"
default = { bool = false }
doc = "Allow X11 clients to take keyboard grabs on override-redirect windows."
since = "0.2.0"

[[section.field]]
key = "allow-byte-swapped-clients"
kind = "bool"
accepted = "a boolean"
default = { bool = false }
doc = "Allow clients whose byte order differs from the server's."
since = "0.2.0"

[[section.field]]
key = "grab-access-rules"
kind = "text-list"
accepted = "a list of strings"
default = { list = [] }
doc = "Resource names or classes permitted to take a grab."
since = "0.2.0"

[[section.field]]
key = "disable-extensions"
kind = "enum-list"
enum = "XwaylandExtension"
accepted = "a list of xwayland extensions"
default = { list = [] }
doc = "Xwayland extensions to disable."
since = "0.2.0"

[[section.field]]
key = "scaling-factor"
kind = "float"
min = 0.0
max = 2147483520.0
accepted = "0, or a finite number from 0.5 through 2147483520"
default = { int = 0 }
doc = "0 for automatic scaling, otherwise the scale Mutter is told."
since = "0.2.0"

[[section]]
key = "layout"
type = "Layout"
doc = "Which layout engine arranges each workspace's windows."

[[section.field]]
key = "default"
kind = "text"
nonempty = true
accepted = "a nonempty layout name"
default = { text = "floating" }
doc = "The layout of a workspace with no override. floating arranges nothing."
since = "0.2.0"

[[section.field]]
key = "outputs"
kind = "record-list"
record = "LayoutOutput"
accepted = "a list of output layout tables"
doc = "Layout overrides by output connector id. A workspace override wins over these."
since = "0.2.0"

[[section.field]]
key = "workspaces"
kind = "record-list"
record = "LayoutWorkspace"
accepted = "a list of workspace layout tables"
doc = "Layout overrides by workspace id. These win over the output and default layouts."
since = "0.2.0"

[[section.field]]
key = "module-dirs"
kind = "text-list"
accepted = "a list of directory paths"
default = { list = [] }
doc = "Extra directories searched for layout modules, before the shipped ones. A module here overrides a shipped layout of the same name: the first directory that holds the name wins."
since = "0.2.0"

[[section]]
key = "workspaces"
type = "Workspaces"
doc = "The declared workspaces, in declaration order."
hook = "workspaces"

[section.spread]
field = "workspaces"
kind = "record-list"
record = "Workspace"
accepted = "a list of workspace tables"
doc = "The declared workspaces."

[[section]]
key = "touchpad-gestures"
type = "TouchpadGestures"
doc = "The touchpad gesture bindings, in declaration order."
hook = "gestures"

[section.spread]
field = "gestures"
kind = "record-list"
record = "Gesture"
accepted = "a list of gesture tables"
doc = "The gesture bindings."

