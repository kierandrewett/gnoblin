# The configuration schema: one declaration per setting, from which the typed
# document, its validators, the accepted-values hints, the reference tables and
# the Lua stubs are generated (`cargo xtask gen-config`).
#
# Why TOML in the crate rather than code: the same reason the object schema is
# TOML (crates/gnoblin-schema/src/parse.rs). A setting's existence, type, range,
# default, accepted-values text, `since`, overridability and deprecated spellings
# are facts about the document, not about how it is read; declaring them as data
# lets one generator produce the Rust, the reference and the stubs from one
# source, and lets CI compare the three. The parsers it emits still report a
# dotted path and an accepted-values hint, so a diagnostic is unchanged by being
# generated.
#
# What stays hand-written is what data cannot express: the cross-field rules
# (gesture conflicts, workspace uniqueness, swipe-path shape, spacer rules,
# "0 or 0.5 and up" scales, renderer argv rules). A section or record names one
# with `hook`, and `crates/gnoblin-config/src/hooks.rs` must define it; a field
# may not name a hook, because a hook is about a whole table.
#
# Layout: enums, then aliases, then records in dependency order (a record is
# declared before the field that uses it), then sections in document-key order.
# Every `since` is a full `x.y.z` release: the document layer ships with the
# rewrite at 0.2.0.
format = 1

# --- Enumerated settings -----------------------------------------------------
# `setting` is the key the alias table looks up, so it is the document key the
# value is ordinarily written under.

[[enum]]
name = "Blur"
setting = "blur"
doc = "Background blur policy."
variants = [
    { spelling = "auto", doc = "Blur when hardware accelerated rendering is available." },
    { spelling = "on", doc = "Always blur." },
    { spelling = "off", doc = "Never blur." },
]

