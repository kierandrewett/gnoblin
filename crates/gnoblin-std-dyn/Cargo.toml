[package]
name = "gnoblin-std-dyn"
description = "The language-neutral call layer over libgnoblin-std's function table: a dynamic value, a dynamic call of every table function by name and the trampolines that let a script's objects stand in for the library's callbacks and vtables. The call functions are generated by `gnoblin-sdkgen` at build time; each script runtime only converts its values to and from `Dyn`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The handles, the string, the error codes.
gnoblin-core-abi = { path = "../gnoblin-core-abi" }
# The table and the records the generated calls fill in.
gnoblin-std-abi = { path = "../gnoblin-std-abi" }

[build-dependencies]
# The call of every table function is generated at build time and never committed.
gnoblin-sdkgen = { path = "../gnoblin-sdkgen" }

# The library is opened with `dlopen` and its table is called through function pointers; a call layer for scripts needs `unsafe`,
# confined to this crate's modules that say so.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
