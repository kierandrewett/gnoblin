[package]
name = "gnoblin-parity"
description = "Parity scenario runner, targets (Mutter reference and Rust candidate), normaliser and reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Scenarios are TOML deserialised into typed structs with `deny_unknown_fields`,
# so a misspelt key fails the run instead of being ignored.
serde.workspace = true
toml.workspace = true
# Recordings are JSON, and an observation keeps its JSON shape rather than being
# flattened to text, so a numeric configure size compares as a number.
serde_json.workspace = true
# The Rust candidate target: the compositor's library entry point runs the session
# on a thread, the gnoblinctl library entry point is the IPC peer, and a real
# Wayland client creates the toplevel. The same arrangement the compositor's own
# end-to-end tests use.
gnoblin-compositor = { path = "../gnoblin-compositor" }
# The candidate compositor is measured with the stock providers std registers in a real session.
gnoblin-std-wm = { path = "../gnoblin-std-wm" }
gnoblin-std-portal = { path = "../gnoblin-std-portal" }
gnoblin-wayland = { path = "../gnoblin-wayland" }
gnoblinctl = { path = "../gnoblinctl" }
wayland-client.workspace = true
wayland-protocols = { version = "0.32.13", features = ["client"] }
# A private temporary directory for the candidate's two sockets.
tempfile.workspace = true
# The Mutter reference runs in a process group of its own and is stopped by signalling the group. `event` is `poll`, which
# the Wayland client waits on without sleeping in steps, `time` the monotonic clock the EI frame stamps carry, and
# `param` the page size and clock tick rate the performance baseline reads `/proc` with.
rustix = { workspace = true, features = ["process", "event", "time", "param"] }
# Input is injected through EIS, the way an input emulator does it. The EI client is `reis`, the library the
# compositor's own EIS server is built on; `Caps` and the consent gate come from the candidate's EIS crate.
reis = { version = "0.7.1", default-features = false }
gnoblin-input-eis = { path = "../gnoblin-input-eis" }
# Stock Mutter hands out its EIS socket through `org.gnome.Mutter.RemoteDesktop` on the session bus. `block_on` waits for
# the calls without a runtime of this crate's own, as the other bus clients of the workspace do.
zbus.workspace = true
futures-lite.workspace = true

[lints]
workspace = true
