[package]
name = "gnoblin-compat-gnome-shell-introspect"
description = "org.gnome.Shell.Introspect adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gnoblin-compat-core = { path = "../gnoblin-compat-core" }
gnoblin-client = { path = "../../gnoblin-client" }
# The environment reads the `compat` gate from the configuration, as the gtk-shell1 adapter does.
gnoblin-config = { path = "../../gnoblin-config" }
gnoblin-proto = { path = "../../gnoblin-proto" }
gnoblin-model = { path = "../../gnoblin-model" }
zbus.workspace = true
gnoblin-log = { path = "../../gnoblin-log" }

[dev-dependencies]
futures-lite.workspace = true
gnoblin-proto = { path = "../../gnoblin-proto" }
gnoblin-schema = { path = "../../gnoblin-schema" }
# The window fixture builds a window's full property set from the schema.
gnoblin-testkit = { path = "../../gnoblin-testkit" }
