[package]
name = "gnoblin-compat-gnome-keyring-prompter"
description = "org.gnome.keyring.SystemPrompter and PrivatePrompter adapter for gcr callers."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The frame every adapter builds on: the support matrix this crate checks in, the
# mode gate each call passes, and the refusal a rejected call returns.
gnoblin-compat-core = { path = "../gnoblin-compat-core" }
# The adapter is an IPC client: a gcr prompt becomes a `prompt.secret` request
# offered to the compositor, and the answer comes back through the same client.
gnoblin-client = { path = "../../gnoblin-client" }
gnoblin-model = { path = "../../gnoblin-model" }
gnoblin-service-core = { path = "../../gnoblin-service-core" }
gnoblin-types = { path = "../../gnoblin-types" }
# The two gcr names are D-Bus services, so this crate speaks the bus and nothing
# else: no libgcr, no GObject.
zbus.workspace = true
gnoblin-log = { path = "../../gnoblin-log" }
# The queue between the interface handlers and the loop that performs their bus work, and
# the `StreamExt` that drains it. `futures-lite` also runs the tests' service loop and
# caller on one thread.
futures-channel.workspace = true
futures-lite.workspace = true

# The gcr secret exchange: DH over the 1536-bit MODP group, HKDF-SHA256 and
# AES-128-CBC, named here because the adapter is the side that receives a secret
# exchange and answers it.
sha2.workspace = true
hkdf.workspace = true
aes.workspace = true
cbc.workspace = true
base64.workspace = true
num-bigint.workspace = true
getrandom.workspace = true

[dev-dependencies]
# The D-Bus tests build the frames they assert on, so they check the answer's
# sensitive flag against the real wire layer rather than a copy of it.
gnoblin-proto = { path = "../../gnoblin-proto" }
gnoblin-schema = { path = "../../gnoblin-schema" }

[lints]
workspace = true
