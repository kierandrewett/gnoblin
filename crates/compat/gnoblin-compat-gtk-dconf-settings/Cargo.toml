[package]
name = "gnoblin-compat-gtk-dconf-settings"
description = "dconf layer for the GSettings keys GTK reads: fonts, icon theme, cursor and button layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The agent this adapter serves in the services role: `LinkedAgent` and the request
# vocabulary it answers with. Services-role library, no engine crate (checked by xtask).
gnoblin-service-core = { path = "../../gnoblin-service-core" }
gnoblin-compat-core = { path = "../gnoblin-compat-core" }
gnoblin-log = { path = "../../gnoblin-log" }

[dev-dependencies]
tempfile = "3.23.0"
