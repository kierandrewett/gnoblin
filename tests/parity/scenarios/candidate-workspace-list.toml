# A fresh session has a workspace list that a client can read over IPC before any client has connected. The reference is
# the Mutter-based Gnoblin on its patched Mutter, which answers `gnoblinctl workspace list` from its own control socket
# (`mutter-gnoblin`: tests/parity/README.md, "Run the Gnoblin reference"). Stock Mutter has no such IPC, so there is no
# `mutter51` row (tests/parity/divergences.toml).
#
# `expect` is what the Mutter-based session answered. The candidate answers in the IPC 0.2.0 object model, which is the
# reviewed divergence below.
name = "candidate-workspace-list"
description = "A fresh session reports its workspace list over IPC before any client connects."
target = { candidate = {} }
references = [{ mutter-gnoblin = {} }]

[[steps]]
id = "workspace.list"
description = "The workspaces `gnoblinctl workspace list` reports at start."
expect = { workspaces = [
    { id = "<id:1>", number = 1, name = "Workspace 1", active = true, persistent = true, windows = 0 },
    { id = "<id:2>", number = 2, name = "Workspace 2", active = false, persistent = true, windows = 0 },
    { id = "<id:3>", number = 3, name = "Workspace 3", active = false, persistent = true, windows = 0 },
    { id = "<id:4>", number = 4, name = "Workspace 4", active = false, persistent = true, windows = 0 },
] }

[steps.divergence.candidate]
expect = { objects = [{ id = "<id:1>", type = "gnoblin.workspace", properties = { id = "<id:2>" } }] }
reason = "the candidate answers in the IPC 0.2.0 object model (typed objects with properties) where the Mutter-based socket answers a `workspaces` array, and a fresh candidate declares one workspace where the Mutter-based session starts with four"
