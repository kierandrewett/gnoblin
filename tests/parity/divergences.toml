# Divergence ledger: where a scenario has no stock-Mutter run, and why.
#
# A scenario with `references = [{ mutter51 = {} }, { mutter-gnoblin = {} }]` is compared with stock Mutter 51 and with the
# Mutter-based Gnoblin on its patched Mutter (tests/parity/README.md, "Run the Mutter reference" and "Run the Gnoblin
# reference"), and a step where the candidate differs records the difference and its reason in the scenario file itself
# (`[steps.divergence.candidate]`), so the report says `divergent` and a divergence that stops being true fails. This
# file lists only the scenarios that have no `mutter51` row, with the reference that does run them where there is one.
#
# A scenario whose only reference is `mutter-gnoblin` compares the candidate with what the Mutter-based session answered, so the
# parity claim is as strong as that reference: Mutter-based Gnoblin, not stock Mutter.

[[entries]]
scenario = "candidate-workspace-list"
reference = "mutter51"
status = "no reference"
note = "The step reads `gnoblinctl workspace list`, which stock Mutter does not have. The reference for this scenario is `mutter-gnoblin`, which runs it; the candidate's difference is recorded in the scenario file."

[[entries]]
scenario = "candidate-window-lifecycle"
reference = "mutter51"
status = "no reference"
note = "The step reads `gnoblinctl window list`, which stock Mutter does not have. The reference for this scenario is `mutter-gnoblin`, which runs it. The core-protocol half, that a mapped toplevel is focused and a closed one hands focus back, is `focus-toplevels`, which runs on all three."

[[entries]]
scenario = "candidate-kill-unknown-window"
reference = "mutter51"
status = "no reference"
note = "The refusal text is gnoblinctl's own; stock Mutter has no equivalent IPC. The reference for this scenario is `mutter-gnoblin`, which runs it; the candidate's different text is recorded in the scenario file."
