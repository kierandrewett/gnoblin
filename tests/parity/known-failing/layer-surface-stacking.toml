# Layer surfaces stack by layer first: background, then bottom, then top, then
# overlay, and a later surface sits above an earlier one inside its layer
# (design/rust-compositor.md lists this under the layer shell contract).
#
# The recording is a candidate run whose overlay surface reported itself below a
# top-layer surface, which is the difference this scenario exists to catch. The
# ids, serials, timestamps and pids in the recording are deliberately unlike the
# expectation's: the normaliser must remove them, so the only reported differences
# are the layer and the record name that moved with it.
#
# It lives in `known-failing/`, not `scenarios/`, because it can never pass: `gnoblin-parity run tests/parity/scenarios` is a
# gate that must exit 0, and this directory is run only by the runner's own tests.
#
# Lane 8C (design/cutover-survey.md 16.1) deleted the layer registry, so no target
# serves `layers.list` or the `gnoblin.surface_layer_shell:*` records any more. This
# scenario is kept as a refused expectation: the recording is a fixed file, the
# expectation can never pass, and the runner tests (`crates/gnoblin-parity/tests/
# scenarios.rs`) still use it to prove that a difference is named in words and that
# volatile values are normalised away. Layer-shell reserved zones are still checked by the
# wayland `layer_shell.rs` tests; layer surfaces as tree nodes are lane 8E.
name = "layer-surface-stacking"
description = "An overlay layer surface stacks above a top layer surface, both reported topmost first."
target = { recorded = "../fixtures/layer-surface-stacking/candidate.json" }

[[steps]]
id = "layers.list"
description = "Layer surfaces topmost first, each with the layer its client asked for."
expect = [
    { id = 1, name = "gnoblin.surface_layer_shell:osd", layer = "overlay" },
    { id = 2, name = "gnoblin.surface_layer_shell:bar", layer = "top" },
]
