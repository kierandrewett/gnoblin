# What wlcs is expected to do against the Rust compositor (design/e2e-wlcs.md).
#
# `core` is the Phase 2 subset: the gtest-name globs scripts/wlcs.sh runs by default. `passing` is every test that
# passes today and is generated (`scripts/wlcs.sh --update`): a test in it that stops passing is a regression, and
# CI runs exactly this list. Everything else in the subset has to match a `known_failure` pattern, each with the
# reason and the Beads issue that owns it; a known failure that starts passing must move to `passing`.

core = [
    "SelfTest.*",
    "FrameSubmission.*",
    "BadBufferTest.*",
    "WlOutputTest.*",
    "XdgOutputV1Test.*",
    "WpViewporter*",
    "XdgSurfaceStableTest.*",
    "XdgToplevelStable*",
