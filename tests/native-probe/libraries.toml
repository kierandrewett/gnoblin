# The native libraries the workspace needs, and the version each one needs at least.
#
# `cargo xtask native-probe` reads this file and checks a root file system against it. Nothing here is written from
# memory: every `crates` and `evidence` entry names the build file, `Cargo.toml` feature or source line that makes
# the library a need, and a floor is filled in only where one of those states it. A library whose crate declares no
# floor has none: its probe result is recorded, never judged. A floor that is a driver capability and not a library
# version (GLES 3) is a `floor-note`, which the probe prints beside the version it found.
#
# `kind`:
#   link    the build links it, so the development package must be installed to build
#   dlopen  opened at run time with dlopen; the build does not need it, a machine that lacks it loses the feature
#   build   needed only while building or testing (bindgen, sqlcipher, the wlcs harness), never by the compositor itself
#   run     a program or file the compositor starts or reads at run time
#
# `mutter-floor` is what the Mutter-based product needs for the same library, where the repository states one. It is a
# comparison, not a requirement of the candidate: the rewrite removes these floors (design/rust-compositor.md, "What
# the rewrite does and does not fix").
#
# `packages` lists, for each package family, the packages that provide the pkg-config file or the shared object. The
# families are the package managers: apt (Debian, Ubuntu), dnf (Fedora, Rocky), zypper (openSUSE), pacman (Arch) and
# apk (Alpine); `nix` lists nixpkgs attributes, which are evaluated and not installed, because a Nix root file system
# holds a store and no .pc files to read. `scripts/native-probe.sh` installs the packages into an image's root file
# system before the check.

[[library]]
id = "libinput"
kind = "link"
crates = ["input-sys"]
evidence = "Cargo.toml: smithay feature backend_libinput enables input 0.10 with features libinput_1_11..libinput_1_19 (cargo tree -e features -i input)"
pkg-config = ["libinput"]
sonames = ["libinput.so.10"]
floor = "1.19"
floor-from = "input 0.10.0 feature libinput_1_19 is the highest enabled; input-sys 1.19.0 binds libinput 1.19"
mutter-floor = "1.30"
mutter-floor-from = "design/rust-compositor.md: patch 99/0059 (libinput 1.30)"
[library.packages]
apt = ["libinput-dev"]
dnf = ["libinput-devel"]
zypper = ["libinput-devel"]
pacman = ["libinput"]
apk = ["libinput-dev"]
nix = ["libinput"]

