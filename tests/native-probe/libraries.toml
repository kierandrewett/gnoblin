# Libraries a reader expects in this list that no crate links or opens. Each names what was checked, so the absence is
# a finding and not an omission.

[[not-linked]]
id = "libei"
evidence = "Cargo.lock has no libei or -sys crate for it; the EIS server is `reis` 0.7.1, pure Rust (crates/gnoblin-input-eis)"

[[not-linked]]
id = "fontconfig and freetype"
evidence = "Cargo.lock has no fontconfig-sys or freetype-sys crate; the shell's fonts are `epaint_default_fonts`, embedded"

[[not-linked]]
id = "systemd, libsystemd and elogind"
evidence = "no crate links libsystemd or libelogind. libseat chooses a logind backend inside the distribution's own libseat build, so the libseat row is where a session manager shows up"

[[not-linked]]
id = "glib, gtk, gobject introspection"
evidence = "Cargo.lock has no glib-sys, gtk-sys or gobject-sys crate; they are a Mutter floor only (GLib 2.86)"
