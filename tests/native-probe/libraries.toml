sonames = ["libEGL.so.1", "libGLESv2.so.2"]
floor-note = "GLES 3.0 context (gnoblin-render-gles/src/egl.rs); GLES 3.1 for the proposed D18 depth pass. A driver capability, so the probe cannot judge it from a version"
