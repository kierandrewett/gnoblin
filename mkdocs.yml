site_name: Gnoblin
site_description: Configure your Gnoblin desktop — Lua, window rules, shortcuts and effects.
site_url: https://kierandrewett.github.io/gnoblin/
repo_url: https://github.com/kierandrewett/gnoblin
repo_name: kierandrewett/gnoblin
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
hooks:
  - scripts/docs-links.py
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
nav:
  - Get started:
      - Welcome: README.md
      - Installation:
          - Choose your system: installation.md
          - Fedora: install-fedora.md
          - NixOS: install-nixos.md
          - Build from source: install-source.md
      - Choose a shell: bring-your-own-shell.md
      - Configure Gnoblin: configuration.md
      - Troubleshooting: troubleshooting.md
  - Configuration:
      - All settings: configuration-reference.md
      - Recipes: configuration-recipes.md
      - Basics:
          - Files and load order: configuration-loading.md
          - Shortcuts: shortcuts.md
          - Autostart: autostart.md
          - Window rules: window-rules.md
      - Appearance:
          - Effects: window-effects.md
          - Titlebars: window-frames.md
          - Animations: animations.md
          - Shaders: shaders.md
          - Cursors: cursors.md
      - Behavior:
          - Session settings: session-settings.md
          - Permissions: permissions.md
          - Window menu: window-menu.md
          - Restore or minimise: window-state-shortcuts.md
          - Snapping: window-snapping.md
      - Command line: gnoblinctl.md
  - Shell development:
      - Integration: shell-integration.md
      - Compositor bridge: compositor-bridge.md
      - Background blur: background-effects.md
      - Blur fades: blur-fades.md
      - Effect rendering: effects-rendering.md
      - Activation: focus-transfer.md
      - Launch feedback: launch-feedback.md
      - Frame architecture: window-frame-renderers.md
      - Write a renderer: frame-renderer-api.md
      - Native and external UI: native-ui-removal.md
      - Console: developer-console.md
  - Contributing:
      - Source development: source-development.md
      - Devkit: devkit.md
      - Testing: testing.md
      - Desktop verification: real-hardware-verification.md
      - Formatting: code-quality.md
      - CLI development: cli-development.md
      - Packaging: distribution.md
      - Documentation: documentation-site.md
      - Archive: archive.md
